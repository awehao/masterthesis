# 時域消融 C0 實驗規格（P4，事前登錄草案）
# 2026-10-04。性質：**未執行**的實驗規格；新趟次等使用者恢復模擬後才跑。
# 依據：單步與多步比較_下一步計畫.md、H1_H5_resolved_config.yaml、replay_input_coverage.yaml
schema: horizon_ablation_c0/1
status: 'draft-3（P-REPLAY 已成立；凍結前尚待：H1 功能確認、使用者確認配對順序）'

問題: >
  同一增廣 W-GMPC、同一 MotM 任務規則下，預測時域 1 步（H1）與 5 步（H5）
  在追蹤、限位餘裕、命令平順、任務完成與計算代價上的差異。成功定義不以 H5 必勝為條件。

# ---------------------------------------------------------------- 前置條件（全部滿足才開跑）
prerequisites:
  - id: P-LOG
    內容: '求解節點逐輪記錄 T_cyc、target_src／age、U_warm（求解前複製）、U_sol、d̂、bias、solver_N；失敗與未發布輪也記'
    狀態: '已實作（wgmpc_cycle_record.py、wgmpc_wg2_node.py）。test_wgmpc_cycle_record.py 9/9：合成 8 輪閉環經 JSON 後逐位元重播（u0、U、停止理由、接受判定相同）'
    界線: 只驗功能一致；紀錄開銷對即時性的影響**未量**，第一趟實跑要量核心與整輪牆鐘
  - id: P-WB
    內容: drawer_wholebody_node 把參數落盤
    狀態: 已實作（wholebody.json args）
  - id: P-N
    內容: 'run_nav_handover.sh 改為明確的 WGMPC_N（預設 5，行為不變）；分析以 align_solver.json args.N 為準'
    狀態: 已實作
  - id: P-CHK
    內容: 'horizon_config_check.py 對每一對 H1／H5 只允許 solver.N 不同；其他差異 = 0 才計入'
  - id: P-REPLAY
    內容: '先在一趟新紀錄的 H5 上通過重播驗收（replay_input_coverage.yaml h5_replay_acceptance_draft），確認紀錄齊全'
    工具: >
      horizon_replay_check.py（離開碼 0 整趟通過／1 不通過／2 無可用求解列／3 部分輪次僅診斷）。
      覆蓋：C1 每列可歸類（求解列或節點既定的等待／閘門理由，後者另列、不算缺紀錄）、
      C2 每個求解列欄位齊全且形狀正確、數值有限、C3 列數與節點統計對帳（求解列數 = n_solve_calls〔節點獨立計的求解器呼叫數，2026-10-05 新增〕、published、no_solution；統計缺項即不通過）、solver_N = args.N。
      門檻：A1 |Δu0|/vmax p95 ≤ 1e-3、max ≤ 1e-2；A2 停止理由一致 ≥ 95%；
      A3 原解接受輪的原解與重播殘差有限且 ≤ r_tol；A4 求解器接受判定（ok）一致 = 100%（使用者 2026-10-05 同意）——比的是求解器 ok，不是是否發布（接受後仍可能因過期／健康閘門不發布）。
      殘差 NaN 只在 qp_failed／no_accepted_candidate 允許（核心在這兩種情形不算殘差）。
    工具測試: >
      test_horizon_replay_check.py 14/14：乾淨合成趟 PASS（含兩個閘門等待列）；
      刪 solve_in、刪整列、刪「接受但未發布」整列（只靠呼叫數抓）、統計缺 n_solve_calls、原拒重收、接受輪殘差 NaN、輸入 inf、未知理由列、偏差錯、solver_N 錯 → 全部 FAIL；
      --max-cycles → PARTIAL（後段缺目標也不會 PASS）；舊格式 → INCOMPLETE。b6_motm1／park1 → INCOMPLETE，列數與統計對帳相符
    熱中止: >
      run_guarded.sh：上限只接受 1–92 整數（NaN、小數、93 皆拒跑）；全程核對取樣器存活、讀值 ≤ 5 s 新鮮、讀值 > 0；
      監看失效 ⇒ 砍模擬器並中止（離開碼 94）。假運行器驗過：正常、模擬器先結束、起跑前超溫、中途超溫、
      取樣器死亡、取樣器停更、讀值無效。取樣器本身的超溫砍程序未在真實 92 °C 觸發過
    資產雜湊: >
      模擬器自 2026-10-05 起在 room_run.json config.drawer_asset_sha256 記錄載入當下雜湊。
      b6 沒有記錄：現檔 ef0396078012fd00 與 20:04 提交 56f249c60 相同；檔案時間 20:13 來自 checkout／merge 重寫；
      b6 跑於 19:29–19:40，此 25 分鐘內無編輯紀錄，但**無法嚴格證明** b6 載入的內容
    口徑: >
      這趟 H5 與 b6 同為 N = 5 ⇒ 核「控制設定一致」（horizon_config_check.py --allow，不允許任何差異；
      wholebody.args 與資產雜湊來源的差異需逐項解釋）。b6 的資產雜湊與展開節點參數未記錄 ⇒
      結論只能寫「已記錄的控制設定一致，另有歷史證據缺項」，不得宣稱完全相同；「只有 N 不同」是正式 H1／H5 配對的要求。
      cycle_wall_ms 含排程等待，只能看週期是否退化，不得直接歸因於紀錄開銷
    狀態: '**已成立**（2026-10-05 h5_logcheck1：PASS，逐位元重現；詳見 h5_logcheck1_acceptance.yaml）'
  - id: P-CHATTER
    決定: '(a) 保留目前配置，把手臂命令反轉當成**待比較的現象**；兩組共用的是設定，不預設兩組有相同抖動'
    現況（b6，H5，修正口徑）: >
      相鄰兩輪都 > 0.05 rad/s 且反號：69／262、94／417、22／248（整窗 2.0／3.0／0.7 次/s）；
      集中在關閉保持（12/s）、開到位保持（16/s）、拉開（5.7/s）、退開（9.6–14.6/s，三趟都有）。
      停車 0／15–21 —— 停車手臂少超過閾值，有效比較次數少一個數量級，不能直接對比。
    候選原因: MotM 相位權重（w_a 0.01、w_p 200）—— 未驗證，不據此改權重
    處理: 抖動另做離線診斷；不在 H1／H5 比較中途改配置

# ---------------------------------------------------------------- 方法與場景
methods:
  H1: {N: 1}
  H5: {N: 5}
  共同: '除 N 外完全相同（見 H1_H5_resolved_config.yaml common；差異 D1–D6 由 N 結構性造成，報告時寫出實際成本式）'
scene:
  場景: drawer_room；抽屜 drawer_unit_bar26（Ø26、開 200 mm）；手指 split；起點 (-2.80, -3.20, 1.5708)
  任務: MotM 全流程（同 b6）
  模擬: Isaac Sim 6.0.1，ROS 佇列每步清空；92 °C 熱中止不變

# ---------------------------------------------------------------- 配對與順序
schedule:
  功能確認: '每方法 1 趟（診斷用，不計入比較）；H1 若無法完成，記錄失敗相位與原因後**仍**進入配對（失敗是結果）'
  配對: '3 對，交錯：H5, H1, H5, H1, H5, H1（或依使用者指定）'
  配對單位: 一對 = 相同任務初始條件下的 H1 與 H5 各一趟；不要求兩者在同一時刻處於同一狀態
  失敗處理: '任務已開始的失敗留在分母，不補跑；啟動前中止（場景未建起、平滑器未啟用等）另計、可重跑'
  程式變更: '批次中途改程式 ⇒ 該批作廢、另建批次，不混算'

# ---------------------------------------------------------------- 判準（沿用 MotM，不為比較而改）
criteria:
  流程完成: 'task.json final_phase = DONE 且無 abort —— **只是流程完成，不單獨等於任務成功**'
  任務成功（全部由物理紀錄獨立核對）:
    - '開／關保持：由 room_run.json 逐物理步開度重算，帶內連續 ≥ 2 s'
    - '夾持：room_run.json contact_held_s 逐物理步 ≥ 2 s（不採任務節點自報）'
    - '漂移：夾持期間 ≤ 10 mm（逐步重算，不只取 task trace 的 0.5 s 抽樣）'
    - '回程：最終底盤位姿到起點 ≤ home_tol 0.20 m（由 room_run 真值）'
    - 非預期接觸：抽屜配對 > 0.01 N 只允許手指；櫃體等未量者填 NA
  夾持: 逐物理步雙指 ≥ 0.5 N 連續 2 s
  開／關: 開帶 195–205 mm、關帶 0–5 mm（限位容差 −10 µm），各保持 2 s
  滑脫: 夾持漂移 ≤ 10 mm
  中止: 沿用 DrawerTaskPolicy 與 margin_guard，不新增、不放寬

# ---------------------------------------------------------------- 指標（horizon_metrics.py）
metrics:
  窗口: '求解節點第一輪 → 求解節點停止（退開完成）；按 ALIGN／ENGAGE_WAIT／OPEN／OPEN_HOLD／CLOSE／CLOSE_HOLD／RELEASE_WAIT／RETREAT 分相位'
  主要:
    - 任務完成與失敗相位
    - 追蹤：err_p／err_r p50／p95／max（分相位）
    - 限制：設定點與實測角到有效限位的最小餘裕與關節
    - '平順：手臂命令反轉分三類報（相鄰輪 adjacent／隔零 gapped／跨相位 boundary），附有效比較次數與每秒速率；相鄰命令變化 p95／max；TCP 速度峰值以**逐物理步（10 ms）**為主、50 ms 區間平均另列'
    - 計算：核心 total 與整輪牆鐘 p50／p95／p99／max、漏時槽、暖啟動丟棄、求解失敗
  次要:
    - 全程時間、停頓（motm_metrics.py）、手臂／底盤分擔、夾持漂移、首次接觸到拉開
    - 非預期接觸（只量抽屜；櫃體與其他物件填 NA）
  不比較: '兩組各自的總預測成本；不同長度的預測誤差（只在共同第一步比）'

# ---------------------------------------------------------------- 分析規則
analysis:
  - 先報共同設定下的 H1／H5；各自最佳調參另列，不混入主表
  - 以配對差（H1 − H5）報每項指標，三對全列，附平均與範圍；n = 3 不做顯著性宣稱
  - 樣本層級是趟次，不把數百個控制週期當成數百個獨立樣本
  - 若兩組相近：結論是「此任務未見可辨識的多步收益」，並報計算代價
  - 若差異只在某些相位：結論限定於該相位
  - 若 H5 較差：先查模型與延遲，保留結果

# ---------------------------------------------------------------- 之後（不在 C0）
later:
  C1: 事前定義的起點／行程範圍內、需要提前調整底盤或臂形的開發案例；不挑 H1 必敗的例子
  C2: 凍結參數後的保留測試（未調參的抽屜位置、行程、幾何、起點）
  不安排: 預測避障（核心沒有環境碰撞列）
