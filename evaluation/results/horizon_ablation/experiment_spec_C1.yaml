# 時域消融 C1 實驗規格（開發案例，事前登錄草案）
# 2026-10-05。性質：**未執行**、尚未凍結；待 Codex 審查後定版。
# 依據：experiment_spec_C0.yaml、c0b1_results.yaml、c1_feasibility.py／c1_feasibility.json
schema: horizon_ablation_c1/1
status: 'draft-1（未凍結；前置 R1–R5 未完成；不開跑）'

問題: >
  換了起始條件或抽屜行程後，C0 觀察到的 H5 優勢（整窗追蹤、命令平順、停頓、夾持穩定）是否仍存在。
  C1 是**開發案例**：用來看優勢在哪些條件下保持或消失，不是刻意找讓 H1 失敗的例子，
  也**不支持泛化主張**（泛化由 C2 保留測試回答）。
不回答:
  - 預測避障（核心沒有環境碰撞列；C1 不加入此主張）
  - 統計顯著性（每案例 2 對）
  - 純前瞻機制（成本隨 N 改變的結構差異 D1–D6 仍在，見 H1_H5_resolved_config.yaml）

# ---------------------------------------------------------------- 案例表
# 原則：**一次只改一類**。第一批不同時改起點與行程。候選事前列出，可行性全部報告、不挑。
case_families:
  T_行程:
    說明: '只改 open_m；起點、停位、夾持姿態、資產全部同 C0'
    候選:
      - {id: T-100, open_m: 0.100, 可行性: 可行, 註: '手臂收回量固定 0.06 m ⇒ 底盤分擔 0.04 m'}
      - {id: T-150, open_m: 0.150, 可行性: 可行, 註: '底盤分擔 0.09 m'}
    不列入: '> 0.200 —— 滑軌上限 0.220 m，開帶上緣需 ≤ upper − 5 mm；加長需改資產（屬幾何變更，禁止）'
    特性: '收回量依「開度／open_m」內插（drawer_task_node motm_coord），全開時固定收回 0.06 m ⇒ 行程縮短時底盤分擔比例改變'
  P_停位（交棒起始條件）:
    說明: >
      改變 W-GMPC 交棒時的底盤位姿（相對抽屜）。夾持的**世界位姿**固定為基準 FK(停位0, 夾持姿態0)，
      新停位下以 IK 由基準夾持姿態起解出新夾持姿態 ⇒ TCP 對把手的夾持幾何不變（不算抓取幾何變更）。
      導航起點不變；導航計畫為起點到新停位的直線
    候選（相對基準停位 -0.136412, 0.560, 1.297349）:
      - {id: P-lat-, d: '-0.05 m（x）', 可行性: 可行, 夾持餘裕_rad: 0.935, 收回餘裕_rad: 0.764}
      - {id: P-lat+, d: '+0.05 m（x）', 可行性: 可行, 夾持餘裕_rad: 0.890, 收回餘裕_rad: 0.723}
      - {id: P-far,  d: '-0.05 m（y，離抽屜較遠）', 可行性: 可行, 夾持餘裕_rad: 0.975, 收回餘裕_rad: 0.876}
      - {id: P-near, d: '+0.05 m（y，靠近抽屜）', 可行性: '**不可行**', 原因: '足跡距保留區 0.322 m < 0.33 m'}
      - {id: P-yaw-, d: '-5°', 可行性: 可行, 夾持餘裕_rad: 0.913, 收回餘裕_rad: 0.743}
      - {id: P-yaw+, d: '+5°', 可行性: 可行, 夾持餘裕_rad: 0.905, 收回餘裕_rad: 0.738}
    基準: '夾持餘裕 0.907、收回餘裕 0.739 rad（j5）；停位距保留區 0.372 m'
  S_導航起點:
    說明: '只改導航起點、停位不變 ⇒ 交棒時仍收斂到同一停位附近，**未必**構成新的 W-GMPC 起始條件'
    候選:
      - {id: S-west,  start: '-3.00,-0.80', 可行性: 可行, 接近方向差: '-29.3°'}
      - {id: S-south, start: '0.00,-4.20', 可行性: 可行, 接近方向差: '+37.0°'}
      - {id: S-east,  start: '2.80,-3.20', 可行性: '**不可行**', 原因: '直線路徑淨空 0.191 m < 0.33 m'}
    入列條件（事前定）: >
      每個可行起點先跑 1 趟 H5 前導（不計入），量交棒狀態；與 C0 交棒狀態相比，下列任一超過才算新案例：
      底盤位置差 > 20 mm、航向差 > 2°、底盤速度方向差 > 15° 或速率差 > 5 mm/s、手臂任一關節差 > 0.05 rad。
      都未超過 ⇒ 記為「未形成新案例」，不進 C1 配對、不刪紀錄
可行性核對（c1_feasibility.py，離線幾何＋運動學；可行 ≠ 控制會成功）:
  場景: '足跡 R_NAV 0.33 m 對場景碰撞體與保留區淨空；交棒區全周；全開時底盤；起點—停位直線全段'
  手臂: 'IK 殘差 ≤ 1e-6；夾持與收回（TCP 沿 −y 0.06 m）姿態到有效限位（硬限位 ± 0.05）≥ 0.10 rad'
  行程: '開帶 open_m ± 5 mm ⊂ [0, upper − 5 mm]；open_m > 收回量 + 0.02 m'
  定版: 'Codex 審後，候選與門檻凍結；之後不因 C1 結果改案例'

建議批次順序:
  C1a: 'T 類（T-100、T-150）—— 只需改 OPEN_M 與判定開帶參數化，前置最少'
  C1b: 'P 類（5 個可行候選）—— 需 R1 參數入口'
  S類: '先跑前導判定是否成案；成案者另批'
  理由: '先分開改，差異才能歸因於單一類別'

# ---------------------------------------------------------------- 固定／變動設定
固定（同 C0 凍結，freeze_c0.sha256 內容不變）:
  - 'W-GMPC 權重、限制（速度／加速度／輪級／關節）、軟啟動、協同項、近目標整形、延遲補償'
  - 'MotM 任務參數：--standoff-m 0.03 --pre-ramp-mps 0.03 --pre-settle-s 0.5 --restow-mode sync --approach-rate 0.02 --motm-w-qn 0.8 --motm-w-vref-pre 0.3；收回量 0.06、蠕行、越過量、拉速等預設'
  - '抓取幾何（TCP 對把手：抓取深度 6.8 mm、夾持朝向）；手指 split；資產 drawer_unit_bar26'
  - '感知（真值）、安全路徑（不新增、不放寬）、時間政策（模擬時鐘時槽、20 Hz）'
  - '已知條件：手臂命令抖動不修正；成本隨 N 改變的結構差異照實報告'
變動: '每個案例只改一類：open_m，或停位（＋IK 解出的夾持姿態），或導航起點'
比較: '每個案例內只比 N（H1 vs H5）'

# ---------------------------------------------------------------- 前置（全部完成才開跑）
prerequisites:
  - id: R1
    內容: >
      運行器參數入口：START_POSE、PARK_POSE、Q_GRASP 一致傳到模擬器（--start-pose）、導航任務節點
      （--start、--park、--park-yaw）、抽屜任務節點（--start、--park、--q-grasp）、全身展開節點
      （--park，並**新增** --q-grasp，取代寫死的 Q_GRASP 常數；預設值不變）。未設定時行為與 C0 相同
    驗證: '單元測試＋未設定時各節點落盤參數與 c0b1 相同（horizon_config_check，新增欄位逐項解釋）'
    批次: 'C1b、S 類需要；C1a 不需要'
  - id: R2
    內容: 'motm_physical_check.py 開帶由 task.json 的 open_band_m 讀取（缺欄時用 195–205 mm，C0 結果不變）'
    驗證: '新增反例測試；C0 六趟重核結果逐項相同'
  - id: R3
    內容: '交棒狀態擷取：切換步的底盤位姿與速度（room_run）、第一個求解輪的手臂構型（align_solver solve_in.q_meas）'
    用途: 'P／S 類必報；S 類入列條件'
  - id: R4
    內容: '每趟記錄 kernel、platform profile、EPP、平均 CPU 頻率、起跑／峰值／平均溫度'
    註: '主機熱況異常（同負載 63 → 約 90 °C）列為工程問題，不當成控制器原因'
  - id: R5
    內容: '新凍結清單 freeze_c1.sha256（含 R1–R4 的變更）；C0 凍結保留不動'

# ---------------------------------------------------------------- 配對與順序
schedule:
  每案例: '2 對：一對 H5 → H1、一對 H1 → H5（事前排定，不再全部固定 H5 先跑）'
  批次內: '案例依事前登錄的順序執行；同一案例的兩對不連在一起排，與其他案例交錯（減少熱狀態與案例綁在一起）'
  功能確認: '每批開跑前，新參數入口用 1 趟不計入的 H5 確認管線'
  失敗處理: >
    任務已開始的失敗與拒絕全部保留在分母，不補跑；主機當機等基礎設施中斷照 c0b1_revision_1 的處置
    （登錄後整對補跑，不依結果挑選）
  程式變更: '批次中途改程式 ⇒ 該批作廢、另建批次'

# ---------------------------------------------------------------- 驗收與成功判準
acceptance:
  每趟: '重播 PASS（horizon_replay_check）、凍結吻合、對內設定只差 solver.N'
  任務成功（motm_physical_check，逐物理步真值）:
    S1: '開度在 **指定 open_m ± 5 mm** 連續 ≥ 2 s'
    S2: '開保持之後，開度在 [−10 µm, 5 mm] 連續 ≥ 2 s'
    S3: '雙指 ≥ 0.5 N 連續 ≥ 2 s'
    S4: '夾持期間 TCP 相對把手漂移 ≤ 10 mm'
    S5: '回程終點距起點 ≤ 0.20 m'
    S6: '抽屜配對無非手指 > 0.01 N；櫃體與其他物件 NA'
    註: '缺口／缺漏 ⇒ 中斷計時或「證據不足」，不當成成立'

# ---------------------------------------------------------------- 分析規則
analysis:
  - '以案例為單位報 H1 − H5 配對差（每案例 2 對全列）；不把不同案例當成同一母體的重複'
  - '主問題：C0 的 H5 優勢指標在每個案例是否維持同方向；逐案例、逐指標列出「兩對同向／不同向」'
  - '整窗與分相位都報；整窗優勢不寫成每個相位都較好'
  - '範圍重疊或方向不一致寫「未呈現一致方向」，不寫成等效'
  - '計算時間逐趟列，附熱與頻率紀錄；不完全歸因於 N'
  - 'P／S 類附交棒狀態表，說明起始條件確實改變了多少'
  - '任務失敗、拒絕、不可行候選與「未形成新案例」全部列出'

# ---------------------------------------------------------------- C2（保留測試）
C2:
  原則: '另一組**未用於選案例或調整**的條件；C1 結果出來前登錄、之後不改；只有 C2 能支持保留條件下的泛化'
  候選方向（待定版）: '例如未在 C1 出現的停位偏移量或方向組合、抽屜擺放位置（drawer_pose）'
  時機: 'C1 完成並封存後'
