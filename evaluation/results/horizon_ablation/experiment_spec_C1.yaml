# 時域消融 C1 實驗規格（開發案例，事前登錄）
# 2026-10-05。draft-2：依 Codex 審查修正五處；**只有 C1a 進入凍結**，C1b／S 類保留為候選、不凍結。
# 依據：experiment_spec_C0.yaml、c0b1_results.yaml、c1_feasibility.py／c1_feasibility.json
schema: horizon_ablation_c1/3
status: '核定版本 c1a-v3（2026-10-05；凍結 freeze_c1a.sha256 v3；v1 = 功能確認趟的版本依據、v2 留底）；C1b／S 類未凍結'

問題: >
  換了抽屜行程（C1a）或交棒起始條件（C1b／S，候選）後，C0 觀察到的 H5 優勢（整窗追蹤、命令平順、
  停頓、夾持穩定）是否仍存在。C1 是**開發案例**：看優勢在哪些條件下保持或消失，不是刻意找讓 H1 失敗的
  例子，也不預設哪個案例更需要前瞻；**不支持泛化主張**（由 C2 保留測試回答）。
不回答:
  - 預測避障（核心沒有環境碰撞列；C1 不加入此主張）
  - 穩定成功率或統計顯著性（每案例 2 對，屬探索性比較；不因結果不好看而臨時補樣本）
  - 純前瞻機制（成本隨 N 改變的結構差異 D1–D6 仍在，見 H1_H5_resolved_config.yaml）

# ================================================================ C1a（定版、進入凍結）
C1a:
  案例:
    - {id: T100, open_m: 0.100, 名目分配: '手臂收回 0.06 m、底盤 0.04 m（名目，不是實測必然位移）'}
    - {id: T150, open_m: 0.150, 名目分配: '手臂收回 0.06 m、底盤 0.09 m（名目）'}
  只改: open_m；起點、停位、夾持姿態、資產全部同 C0
  行程選擇: >
    本批事前選定 100／150 mm，**不探索更長行程**。（依現有篩選規則 open_m + 5 mm ≤ 220 − 5 mm，
    205、210 mm 也符合；不列入是選擇，不是不可行。）
  收回量: '依「實測開度／open_m」內插（drawer_task_node motm_coord），全開時固定收回 0.06 m ⇒ 行程縮短時名目的底盤分擔比例改變'
  篩選: 'c1_feasibility.py：T100、T150 皆「通過目前離線篩選」（開帶在滑軌內、行程 > 收回量 + 0.02 m、場景與接近走廊淨空）'
  排程: 'c1a_schedule.tsv（逐趟、事前排定）'
  逐趟順序: 'T100-H5 → T100-H1 → T150-H1 → T150-H5 → T100-H1 → T100-H5 → T150-H5 → T150-H1'
  配對: 'T100-A（01→02，H5 先）、T150-A（03→04，H1 先）、T100-B（05→06，H1 先）、T150-B（07→08，H5 先）'
  正式比較: '8 趟；功能確認另列（c1a_func_*，不計入）'
  功能確認結果: >
    c1a_func_T100_H5：重播 PASS、S1–S6 PASS（無物理步缺口，判定所需證據通過；前段雙指力在展開前有缺值，
    不寫成全窗所有欄位零缺漏）；S6 只支持已量測的抽屜配對，櫃體與其他物件 NA
  趟次名: 'c1a_b1_<idx>_<case>_<method>'

# ================================================================ C1b／S（候選，未凍結）
candidates_not_frozen:
  C1b_停位:
    說明: >
      改變 W-GMPC 交棒時的底盤位姿（相對抽屜）。夾持的世界位姿固定為基準 FK(停位0, 夾持姿態0)，
      新停位以 IK 由基準夾持姿態起解出新夾持姿態（完整精度保存，由保存值重算 FK 殘差 ≤ 1e-6 m）
    通過目前離線篩選: [P-lat-, P-lat+, P-far, P-yaw-, P-yaw+]
    未通過篩選: 'P-near（足跡距保留區 0.322 m < 0.33 m；依保守足跡規則排除，**不等於**物理上不可達）'
    篩選界線: >
      只核夾持／收回端點與部分幾何取樣，**沒有**證明展開、操作、收臂的連續路徑都合規。
      交棒圓（停位 ± 0.30 m）含保留區的淨空只是參考值：基準北側僅 72 mm < 0.33 m，不能稱整圈可安全交棒；
      篩選改核實際接近走廊（起點—停位直線全段，含保留區）
    需要: R1（參數入口）、R3（交棒狀態）；另建凍結版本 freeze_c1b
  S_導航起點:
    通過目前離線篩選: [S-west, S-south]
    未通過篩選: 'S-east（接近走廊淨空 0.191 m）'
    入列規則（工程上的案例區分規則，不是統計獨立性證明）: >
      每個起點先跑 1 趟 H5 前導（不計入），與 **C0 六趟（c0b1）的中位數與範圍**比較；以下任一超出
      C0 範圍且與中位數差超過門檻才算新案例：控制權切換當步的底盤位置差 > 20 mm、航向差 > 2°、
      速率差 > 5 mm/s、手臂任一關節差 > 0.05 rad；速度方向差 > 15° **只在兩者速率都 ≥ 5 mm/s 時比較**。
      都未超過 ⇒ 記為「未形成新案例」，不進配對、不刪紀錄

# ================================================================ 固定／變動
固定（同 C0 凍結內容）:
  - 'W-GMPC 權重、限制（速度／加速度／輪級／關節）、軟啟動、協同項、近目標整形、延遲補償'
  - 'MotM 任務參數：--standoff-m 0.03 --pre-ramp-mps 0.03 --pre-settle-s 0.5 --restow-mode sync --approach-rate 0.02 --motm-w-qn 0.8 --motm-w-vref-pre 0.3；收回量 0.06、蠕行、越過量、拉速等預設'
  - '抓取幾何（抓取深度 6.8 mm、夾持朝向）；手指 split；資產 drawer_unit_bar26'
  - '感知（真值）、安全路徑（不新增、不放寬）、時間政策（模擬時鐘時槽、20 Hz）'
  - '已知條件：手臂命令抖動不修正；成本隨 N 改變的結構差異照實報告'
比較: '每個案例內只比 N（H1 vs H5）'

# ================================================================ 前置
prerequisites:
  - id: R2
    適用: C1a
    內容: >
      motm_physical_check.py：開帶由 task.json 的 open_band_m 讀取。**新趟次缺開帶 ⇒ 證據不足（拒絕判定）**；
      只有明確列名的 C0 舊趟次可用 --legacy-c0-band 退回 195–205 mm（名單外使用會報錯）。
      --expect-open-m 必須給事前案例的 open_m，本趟開帶不等於 open_m ± 5 mm ⇒ 證據不足
    狀態: '已完成：test_motm_physical_check.py 20/20；C0 時期八趟（c0b1 六趟＋兩趟功能確認）以 --expect-open-m 0.2 重核結果逐項相同'
  - id: R4
    適用: C1a
    內容: '每趟記錄 kernel、platform profile、EPP、governor、boost、AC、起跑頻率與溫度（<rid>.env.json）；每秒平均／最高 CPU 頻率（<rid>.freq.csv）；溫度沿用 thermal.csv'
    狀態: '已完成：run_plan_batch.sh（假運行器驗過：正常、重複拒跑、凍結中途不符即停）'
    註: '主機熱況異常（同負載 63 → 約 90 °C）列為工程問題，不當成控制器原因'
  - id: R5
    適用: C1a
    內容: '凍結清單 freeze_c1a.sha256；C0 清單 freeze_c0.sha256 原樣保留'
  - id: R1
    適用: C1b、S
    內容: >
      運行器參數入口：START_POSE、PARK_POSE、Q_GRASP 一致傳到模擬器、導航任務節點、抽屜任務節點、
      全身展開節點（新增 --q-grasp 取代寫死常數；預設不變）
  - id: R3
    適用: C1b、S
    內容: >
      交棒狀態分**兩個時刻**記，不拼成同一狀態：
      (a) 控制權切換當步（導航 → 展開）：底盤位姿、速度、手臂角（room_run）；
      (b) 首次 W-GMPC 求解：完整實際求解輸入與時間戳（align_solver 第一個求解列的 solve_in）

# ================================================================ 驗收、分類與分析
acceptance:
  每趟: '重播 PASS（horizon_replay_check）、凍結吻合、對內設定只差 solver.N'
  任務成功（motm_physical_check --expect-open-m <case>，逐物理步真值）:
    S1: '開度在**該案例 open_m ± 5 mm** 連續 ≥ 2 s'
    S2: '開保持之後，開度在 [−10 µm, 5 mm] 連續 ≥ 2 s'
    S3: '雙指 ≥ 0.5 N 連續 ≥ 2 s'
    S4: '夾持期間 TCP 相對把手漂移 ≤ 10 mm'
    S5: '回程終點距起點 ≤ 0.20 m'
    S6: '抽屜配對無非手指 > 0.01 N；櫃體與其他物件 NA'
批次執行分類（run_plan_batch.sh 寫入 <rid>.status.json；非 executed 一律停批、保存原因、不自動略過或重跑）:
  executed: '運行器 rc 0、守護 rc 0、必要封存檔齊全 ⇒ 繼續；任務成敗由事後判定'
  guard_abort: '守護層 90–94'
  startup_failure: '運行器 83／84／85／86（場景、模擬器、辨識檔、平滑器）'
  handover_failure: '運行器 1／2（導航交棒節點回報失敗）⇒ 人工依下列分類處置'
  missing_artifacts: 'rc 0 但封存檔不齊'
  unclassified: '其他非零'
  interrupted: '批次程序被中斷 ⇒ 收掉本趟帶標記程序'
  續跑: '只接受前面各趟 status 為 executed'
  清程序: '只清帶本批次標記（C1_RUN_TAG）的程序；domain 上有外來程序 ⇒ 停批（98），不殺'
分析輸入: '預期行程取自凍結排程（c1_summarize.py 讀 c1a_schedule.tsv 傳 --expect-open-m），不取自待驗收趟次；expect 必須是有限正數'
結果分類（事前定）:
  任務失敗_紀錄有效: '重播 PASS、凍結吻合、資料齊全，但 S1–S6 有不成立 ⇒ 是控制結果，**保留在比較中**'
  證據或協定問題: >
    重播失敗、凍結不符、資料不足（S 判定「證據不足」）、設定核對有 N 以外差異 ⇒ 列為證據／協定問題，
    **不悄悄刪除，也不直接算成控制器失敗**；逐趟列出原因
  基礎設施中斷: '主機當機等 ⇒ 依 c0b1_revision_1 的處置（登錄修訂後整對補跑，不依結果挑選）'
  批次中途改程式: '舊資料標為舊版本批次、保留、停止合併；另建批次。不抹掉結果'
analysis:
  - '以案例為單位報 H1 − H5 配對差（每案例 2 對全列，並標順序 H5先／H1先）；不把不同案例當成同一母體的重複'
  - '主問題：C0 的 H5 優勢指標在每個案例是否維持同方向；逐案例、逐指標列出「兩對同向／不同向」'
  - '整窗與分相位都報；整窗優勢不寫成每個相位都較好'
  - '方向不一致寫「未呈現一致方向」，不寫成等效'
  - '計算時間逐趟列，附 env.json／freq.csv／thermal.csv；不完全歸因於 N'
  - '任務失敗、證據／協定問題、未通過篩選的候選全部列出'

# ================================================================ C2（保留測試，具體登錄）
C2:
  原則: >
    下列案例在 C1a 結果出來前登錄、之後不改；**不用於選 C1 案例或任何調整**。只有 C2 能支持保留條件下的泛化。
    開跑前同樣要通過離線篩選、建立自己的凍結版本與排程
  案例:
    - {id: C2-T125, open_m: 0.125, 篩選: 通過目前離線篩選}
    - {id: C2-T180, open_m: 0.180, 篩選: 通過目前離線篩選}
    - {id: C2-P-lat-yaw, 停位偏移: 'x −0.03 m、yaw +3°', 篩選: 通過目前離線篩選, 需要: R1}
    - {id: C2-P-far-lat, 停位偏移: 'x +0.03 m、y −0.03 m', 篩選: 通過目前離線篩選, 需要: R1}
  配對: '每案例 2 對（H5先、H1先各一）'
  時機: 'C1 完成並封存後'
