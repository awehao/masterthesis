/velocity_smoother:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    autostart_node: false
    bond_heartbeat_period: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    enable_stamped_cmd_vel: false
    feedback: OPEN_LOOP
    max_accel:
    - 6.25
    - 6.25
    - 25.51
    max_decel:
    - -6.25
    - -6.25
    - -25.51
    max_velocity:
    - 0.2775
    - 0.2775
    - 1.1327
    min_velocity:
    - -0.2775
    - -0.2775
    - -1.1327
    odom_duration: 0.1
    odom_topic: /odom
    qos_overrides:
      /clock:
        subscription:
          depth: 1
          durability: volatile
          history: keep_last
          reliability: best_effort
    scale_velocities: false
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    start_type_description_service: true
    use_realtime_priority: false
    use_sim_time: true
    velocity_timeout: 1.0


