# gmpc_controller: not_running

# scan_obstacle_tracker: not_running

/scan_safety_shield:
  ros__parameters:
    a_brake: 6.25
    alpha: 2.0
    base_frame: base_footprint
    cmd_in_topic: /cmd_vel_pre_shield
    cmd_out_topic: /cmd_vel_smoothed
    d0: 0.05
    emergency_d: 0.15
    enable: true
    eps_footprint: 0.02
    eps_scan: 0.03
    final_cmd_timeout: 0.25
    final_cmd_topic: /cmd_vel
    max_points: 360
    neighbour_consistency: true
    proj_iters: 6
    range_of_interest: 2.0
    robot_radius: 0.3
    scan_timeout: 0.5
    scan_topic: /scan
    self_return_m: 0.02
    self_return_radius: -1.0
    stale_speed: 0.05
    start_type_description_service: true
    tau: 0.15
    use_sim_time: true
    vx_max: 0.2775
    vy_max: 0.2775
    wheel_a_max: 125.0
    wheel_base_L: 0.245
    wheel_dt: 0.045
    wheel_margin: 0.002
    wheel_radius: 0.05
    wheel_rows: true
    wheel_w_max: 5.55
    wz_max: 1.1327


/velocity_smoother:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    autostart_node: false
    bond_heartbeat_period: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    enable_stamped_cmd_vel: false
    feedback: OPEN_LOOP
    max_accel:
    - 6.25
    - 6.25
    - 25.51
    max_decel:
    - -6.25
    - -6.25
    - -25.51
    max_velocity:
    - 0.26
    - 0.26
    - 1.1327
    min_velocity:
    - -0.26
    - -0.26
    - -1.1327
    odom_duration: 0.1
    odom_topic: /odom
    qos_overrides:
      /clock:
        subscription:
          depth: 1
          durability: volatile
          history: keep_last
          reliability: best_effort
    scale_velocities: false
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    start_type_description_service: true
    use_realtime_priority: false
    use_sim_time: true
    velocity_timeout: 1.0


/controller_server:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    FollowPath:
      ConstraintCritic:
        cost_power: 1
        cost_weight: 4.0
        enabled: true
      GoalAngleCritic:
        cost_power: 1
        cost_weight: 3.0
        enabled: true
        symmetric_yaw_tolerance: false
        threshold_to_consider: 0.4
      GoalCritic:
        cost_power: 1
        cost_weight: 5.0
        enabled: true
        threshold_to_consider: 1.4
      ObstaclesCritic:
        collision_cost: 10000.0
        collision_margin_distance: 0.15
        consider_footprint: false
        cost_power: 1
        critical_weight: 20.0
        enabled: true
        inflation_layer_name: ''
        near_goal_distance: 0.5
        repulsion_weight: 1.5
      PathAlignCritic:
        cost_power: 1
        cost_weight: 14.0
        enabled: true
        max_path_occupancy_ratio: 0.05
        offset_from_furthest: 20
        threshold_to_consider: 0.4
        trajectory_point_step: 3
        use_path_orientations: false
      PathAngleCritic:
        cost_power: 1
        cost_weight: 2.0
        enabled: true
        max_angle_to_furthest: 1.0
        mode: 0
        offset_from_furthest: 4
        threshold_to_consider: 0.4
      PathFollowCritic:
        cost_power: 1
        cost_weight: 5.0
        enabled: true
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      TrajectoryVisualizer:
        time_step: 3
        trajectory_step: 5
      ax_max: 6.25
      ax_min: -1.5
      ay_max: 6.25
      ay_min: -3.0
      az_max: 25.51
      batch_size: 2000
      critics:
      - ConstraintCritic
      - ObstaclesCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      enforce_path_inversion: false
      gamma: 0.015
      iteration_count: 1
      max_robot_pose_search_dist: 2.0
      model_dt: 0.05
      motion_model: Omni
      plugin: nav2_mppi_controller::MPPIController
      prune_distance: 1.7
      regenerate_noises: false
      retry_attempt_limit: 1
      temperature: 0.3
      time_steps: 56
      transform_tolerance: 2.0
      visualize: true
      vx_max: 0.26
      vx_min: -0.26
      vx_std: 0.2
      vy_max: 0.26
      vy_std: 0.2
      wz_max: 1.1327
      wz_std: 0.4
    action_server_result_timeout: 10.0
    autostart_node: false
    bond_heartbeat_period: 0.1
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    controller_server:
      verbose: false
    costmap_update_timeout: 0.3
    enable_stamped_cmd_vel: false
    failure_tolerance: 0.3
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      symmetric_yaw_tolerance: false
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.25
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    odom_topic: odom
    progress_checker:
      movement_time_allowance: 10.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
    progress_checker_plugins:
    - progress_checker
    publish_zero_velocity: true
    qos_overrides:
      /clock:
        subscription:
          depth: 1
          durability: volatile
          history: keep_last
          reliability: best_effort
    speed_limit_topic: speed_limit
    start_type_description_service: true
    use_realtime_priority: false
    use_sim_time: true


# obstacle_aggregator: not_running

