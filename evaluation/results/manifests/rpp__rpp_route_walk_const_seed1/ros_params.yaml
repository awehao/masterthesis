# gmpc_controller: not_running

# scan_obstacle_tracker: not_running

# scan_safety_shield: not_running

/velocity_smoother:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    autostart_node: false
    bond_heartbeat_period: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    enable_stamped_cmd_vel: false
    feedback: OPEN_LOOP
    max_accel:
    - 6.25
    - 0.0
    - 25.51
    max_decel:
    - -6.25
    - 0.0
    - -25.51
    max_velocity:
    - 0.2775
    - 0.0
    - 1.1327
    min_velocity:
    - -0.2775
    - 0.0
    - -1.1327
    odom_duration: 0.1
    odom_topic: /odom
    qos_overrides:
      /clock:
        subscription:
          depth: 1
          durability: volatile
          history: keep_last
          reliability: best_effort
    scale_velocities: false
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    start_type_description_service: true
    use_realtime_priority: false
    use_sim_time: true
    velocity_timeout: 1.0


/controller_server:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    FollowPath:
      allow_reversing: false
      approach_velocity_scaling_dist: 0.6
      cancel_deceleration: 3.2
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      curvature_lookahead_dist: 0.6
      desired_linear_vel: 0.3
      inflation_cost_scaling_factor: 3.0
      interpolate_curvature_after_goal: false
      lookahead_dist: 0.6
      lookahead_time: 1.5
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_angular_accel: 3.2
      max_lookahead_dist: 0.9
      max_robot_pose_search_dist: 10.0
      min_approach_linear_velocity: 0.05
      min_lookahead_dist: 0.3
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      rotate_to_heading_angular_vel: 1.1327
      rotate_to_heading_min_angle: 0.785
      stateful: true
      transform_tolerance: 2.0
      use_cancel_deceleration: false
      use_collision_detection: true
      use_cost_regulated_linear_velocity_scaling: false
      use_fixed_curvature_lookahead: false
      use_regulated_linear_velocity_scaling: true
      use_rotate_to_heading: true
      use_velocity_scaled_lookahead_dist: false
    action_server_result_timeout: 10.0
    autostart_node: false
    bond_heartbeat_period: 0.1
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    costmap_update_timeout: 0.3
    enable_stamped_cmd_vel: false
    failure_tolerance: 0.3
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      symmetric_yaw_tolerance: false
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.25
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    odom_topic: odom
    progress_checker:
      movement_time_allowance: 10.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
    progress_checker_plugins:
    - progress_checker
    publish_zero_velocity: true
    qos_overrides:
      /clock:
        subscription:
          depth: 1
          durability: volatile
          history: keep_last
          reliability: best_effort
    speed_limit_topic: speed_limit
    start_type_description_service: true
    use_realtime_priority: false
    use_sim_time: true


# obstacle_aggregator: not_running

