# MotM 整體流程時間改善：計畫（v2，依 Codex reviews/20261005_043653、044636、045104_reply.md 更新；正式比較前凍結）
# 2026-10-05。起因：Howard 指示「要解決 MotM 整體流程執行時間應該要比較短的問題」
schema: motm_speed_plan/1
現況（b6 公平對照，各 3 趟，全程＝開始移動 → DONE）: '停車 77.7 ± 1.2 s；MotM 80.2 ± 1.7 s（MotM 慢 2.5 s）'
時間拆解（b6 各 3 趟平均；共同終點，從開始移動起算）:
  到ALIGN: '停車 24.24、MotM 21.96 s（−2.28 s；但兩者進 ALIGN 的起點不同：MotM 離停位約 96 mm、停車約 9 mm）'
  到ENGAGE_WAIT: '停車 27.81、MotM 28.72 s（+0.91 s）'
  到OPEN: '停車 31.62、MotM 32.50 s（+0.89 s）——主要比較用的共同終點'
  RETREAT: '停車 0.53、MotM 1.89 s（+1.36 s）'
  RESTOW: '停車 6.23、MotM 6.98 s（+0.76 s）'
  NAVIGATE_HOME: 'MotM 少 0.45 s'
目標: '在不放寬任何限制與判準下，MotM 全程短於停車（事前定：配對差 MotM − 停車 < 0，三對同向）'

實際改動（每項分開功能確認）:
  T2: '只在 RETREAT（釋放確認後）的 TCP 退開量斜坡：--motm-retreat-rate 0.05 m/s（原沿用 approach_rate 0.02）；motm_v_back、加速度斜坡、命令鏈不動。功能確認 t2_func_rr050：RETREAT 1.02 s（b6 1.81–1.99）'
  T3: '展開節點與任務節點共同 motm_a_ref = 0.004（原 0.002）。這是接近參考速度剖面的參數，不是執行端加速度限制；approach_vref 的 a_stop 預設等於 a_ref ⇒ 越過停位後的減速形狀也一起變（功能確認 t3_func_aref004：最大越位 17.2 mm < 30 mm 上限；b6 4.3–7.5）'
  T1: '收臂與回程重疊——暫不做（會改控制權契約；導航假設手臂已收攏）'
  未動: '蠕行、軟啟動、前置穩定 0.5 s、權重'
固定（不改）: 'W-GMPC 權重、速度／加速度／輪級／關節限制、抓取幾何、夾持與開關判準（S1–S6）、熱中止 92 °C'
正式比較:
  批次: 'mt_b1；排程 mt_schedule.tsv；順序固定 M、P、P、M、M、P（三對 A=01/02 M先、B=03/04 P先、C=05/06 M先）'
  MotM組: 'MOTM=1、MOTM_A_REF=0.004、任務參數 = 共用參數＋--motm-w-qn 0.8 --motm-w-vref-pre 0.3 --motm-retreat-rate 0.05'
  停車組: 'MOTM=0、任務參數 = 共用參數（--standoff-m 0.03 --pre-ramp-mps 0.03 --pre-settle-s 0.5 --restow-mode sync --approach-rate 0.02），同 b6 停車'
  固定: 'H5（N=5）、同一程式版本與環境、原限制；熱中止 92 °C'
  事前目標: '三對全程差值「MotM − 停車」皆 < 0 且 S1–S6 成立（本批工程目標，不是顯著性）'
  同時報: '共同終點 OPEN 的時間差、各段時間、不允許停頓、追蹤、夾持品質、越位、啟動擺盪；失敗、中止、變慢全部保留；S6 只涵蓋已量測的抽屜配對'
  結果去處: '不論是否達到更快，都整理進第六次進度報告素材'
與先前排程的關係: 'Howard 指示 MotM 時間優先；Codex 同意 WG4-B 規格順延'
