# 協同抽屜案例：**接觸與避碰的最小配對表**（草案 v0，未定版）
#
# 原則：例外**只給必要配對**，按「哪個機器人連桿 × 哪個物件表面 × 哪個相位」列出。
# 資產註解寫的是**手指—橫桿**，不擴大解讀為手指—面板或手臂—側板。
# 剛性連接只固定抓取關係，**不會**讓整個抽屜對整台機器人變成可碰撞物件。
schema: coman_contact_avoid_pairs/0
version: v0-draft
status: draft_not_frozen
created: 2026-09-29
basis: evaluation/results/coman_handover_geometry_check_20260929.md §18

general_rule:
  source: 安全濾波屏障 n^T J v <= alpha (d_eff - d_stop)
  # **更正（2026-09-29）**：本欄原寫 `d0 + v*tau + v^2/(2a)`，**漏了 eps**。
  # 實作是 wholebody_safety_filter._rows_from_points，含 eps 且從 d 扣除 rho：
  d_stop: d0 + v*tau + v^2/(2a) + eps
  d_eff: d - rho                    # rho = 該連桿經認證的取樣覆蓋半徑
  d0_m: 0.05
  eps_m: 0.03                       # 幾何＋量測餘裕；**零速下的總靜態間距是 80 mm**
  tau_s: 0.15
  alpha: 2.0
  applies_to: 所有未列入例外的配對
  freespace_confirmed: false        # 場景有抽屜與櫃體，不得沿用自由空間豁免

contact_exceptions:
  - pair: [uflite_finger1, drawer/handle/bar]
    phases: [engage, postengage, pull, hold, release]
    rule: 設計接觸；改由 M1 合併餘裕 >= 1.0 mm、H6 插入偏差 <= 2.0 mm、
          手腕力 <= 30 N（持續 0.05 s 即中止）把關
    basis: drawer_unit.yaml「手指與橫桿是設計接觸對，不套用一般環境的 5 mm 門檻」
  - pair: [uflite_finger2, drawer/handle/bar]
    phases: [engage, postengage, pull, hold, release]
    rule: 同上（兩指對稱）
    basis: 同上

near_approach_pairs:      # 量測後**收窄為兩組**（見下方 measured_reference）
  - pair: [uflite_finger1, drawer/front_panel]
    issue: 實測最小 27.92 mm < 一般規則 d0 = 50 mm ⇒ 確實衝突
    min_clearance_m: null        # **待定**：需交代幾何近似、量測誤差與所需餘裕後事前審定
    phases: [approach, engage, postengage, pull, hold, release, retreat]
    must_state: 若採用不同間距，**明白標示為新配置並事前審定**，
                不得包裝成「門檻完全沒變」
  - pair: [uflite_finger2, drawer/front_panel]
    issue: 實測最小 27.99 mm < 50 mm
    min_clearance_m: null        # 待定

no_conflict_after_measurement:
  status: "**結論已撤回（2026-09-29）**"
  why: |
    這三組的「無衝突」是拿量測最小間距與 d0 = 50 mm 相比得出的，
    但一般規則零速下的總靜態間距是 d0 + eps = **80 mm**，且還要從 d 扣除 rho。
    以完整屏障重算（evaluation/coman_zero_cmd_feasible.py，既有趟次 hold 相位），
    支柱兩組在設計保持位姿下**不允許零命令**。
  recheck_full_barrier:            # 餘量為距離當量 = rhs / alpha
    - {pair: [uflite_finger1, drawer/handle/post_r], d_mm: 66.95, rho_mm: 12.73,
       margin_mm: -25.78}
    - {pair: [uflite_finger1, drawer/handle/post_l], d_mm: 67.27, rho_mm: 12.73,
       margin_mm: -25.46}
    - {pair: [uflite_finger2, drawer/handle/post_l], d_mm: 67.46, rho_mm: 12.28,
       margin_mm: -24.82}
    - {pair: [uflite_finger2, drawer/handle/post_r], d_mm: 69.91, rho_mm: 12.28,
       margin_mm: -22.37}
    - {pair: [uflite_gripper_link, drawer/front_panel], d_mm: null,
       note: 該配對未落入最緊十名；未單獨重算，**不再宣稱無衝突**}
  missing_from_this_table:
    - pair: [uflite_gripper_link, drawer/handle/bar]
      why: 本表只列了殼—面板，**沒有列殼—橫桿**
      full_barrier_margin_mm: -84.65
      true_min_distance_mm: 7.42     # 局部加密判定（coman_shell_bar_bound.py）
      verdict: '**有間隙、非接觸配對**；d − rho < 0 只是下界過保守'
  not_resolved_here: 近接操作配置待**一次決定**；不逐組降門檻、不全域移除 eps

measured_reference:
  source: evaluation/coman_near_pair_clearance.py，趟次 drawer_220102_offset20
  status: "**可行性參考，不是門檻的推導依據**"
  approximations:
    - 抽屜部件以軸對齊方塊近似（面板、支柱），未含倒角與細節
    - 機器人側以視覺網格取樣，格距 ≤ 2.0 mm ⇒ 距離可能高估至多約 2.0 mm
    - 相對位姿為 FK 重建（底盤固定假設），非同一物理步實測
    - 每 10 筆取樣一次；瞬態最小值可能落在未取樣處

ground_contact:                  # 支撐接觸與碰撞要分清
  - pair: [底盤支撐球, ground]
    kind: designed_support_contact
    rule: 設計支撐接觸，**不列為避碰對象**
  - pair: [任何手臂連桿, ground]
    kind: avoidance
    rule: 一般規則照舊 —— 不得因支撐接觸而豁免手臂碰地

avoidance_unchanged:      # 一般規則照舊
  - [任何手臂連桿, drawer/front_panel（除上列近接配對外）]
  - [任何手臂連桿, drawer/side_l, drawer/side_r, drawer/bottom, drawer/back]
  - [底盤, 抽屜任何部件]
  - [任何機器人連桿, cabinet 櫃體]
  - [任何機器人連桿, 地面與其他環境]

not_claimed:
  - 30 N 手腕力上限與 M1／H6 **不能替代**其他連桿的碰撞檢查
  - 例外只在列出的相位成立；相位之外一律適用一般規則
  - 本表**尚未**在距離節點實作；該節點目前沒有配對識別能力（見 pending）

pending:
  - key: 距離節點的配對識別
    需要: 最小必要的 (連桿, 物件表面) 識別；**不得**以「整個抽屜排除」代替
  - key: near_approach_pairs 的 min_clearance_m
    需要: 先量既有固定底座趟次中該配對的實際最小間距，再據此訂定並事前審定
