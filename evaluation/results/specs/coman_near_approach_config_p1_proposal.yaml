# ---------------------------------------------------------------- 四、幾何怎麼算
geometry_methods:
  G1:
    name: 現行取樣＋認證覆蓋半徑
    formula: d_eff = d_sample - rho_link
    cost_ms: 已在線上（現行實作）
    conservatism: 'rho 是**整條連桿的最壞情況**；保持位姿夾爪殼—橫桿的實際取樣
      誤差只有 1.25 mm，rho 卻是 13.35 mm'
    keep_for: 所有 fail_mode = rho_only 與間距餘裕充足的配對
  G2:
    name: 線上逐配對分支與界限（只給指定配對）
    formula: 'd_eff = LB(當前位姿)，LB = min over 三角形 (d(形心) - r_c)；
      距離函數 1-Lipschitz'
    validity: '**每個週期以當前位姿重算**。離線算出的 7.416 mm 是**該位姿**的值，
      不得當成整段運動的固定下界。'
    measured_cost:
      offline_python_loops_ms: {tol_0.05mm: 1101, tol_0.5mm: 243, tol_2mm: 174}
      note: '上列是**純 Python 逐三角形迴圈**的成本，不是本質成本'
      vectorised_per_round_ms: {tri_500: 0.23, tri_2000: 0.65, tri_5000: 1.65}
      distance_eval_ms: {pts_2000: 0.30, pts_8812: 1.21, pts_40816: 6.73}
      budget_ms: 50            # 20 Hz
      verdict: '上列是**局部片段**的耗時（一輪細分、一次距離求值），
        **不能證明完整週期在 50 ms 內** —— 未含每週期的 TF／FK、三角形變換、
        活躍集合的擴張與維護、多配對並行、以及與現有 320 列屏障組裝的競用。
        **尚未實作、未量測完整週期。**'
    required_before_use:
    - 活躍集合的熱啟動必須依兩週期間的最大位移**擴張**，否則下界不再有效
    - 活躍集合上限與逾時退回 G1（fail closed，較保守）
    - 逐週期發布 LB、上界、活躍集合大小與是否逾時；不得只發布結果
  G3:
    name: 離線認證的局部基元代理（未提案採用）
    idea: 對殼的近橫桿區域擬合保守基元（球／膠囊），閉式距離、線上近乎零成本
    blocker: '認證必須覆蓋**整段操作的相對位姿集合**，不是單一位姿；
      本次未做，且依裁定不新增同類幾何掃描'

# ---------------------------------------------------------------- 五、間距怎麼選
gap_selection:
  units: 'pair_table 的 proposed_gap_m 以**公尺**計（0.045 = 45 mm）；
    d_mm／rho_mm／margin_now_mm 以 mm 計。先前欄名寫 proposed_gap_mm 卻填公尺，已更正。'
  principle: '間距要覆蓋「線上距離估計的殘餘保守量」與「執行偏差沿 n 的分量」，
    但**不得與屏障已有的項重複計算**。'
  components:
    model_geometry: 抽屜部件以軸對齊方塊近似（無倒角）；橫桿以圓柱基元近似
    distance_estimate: G1 為 rho（12.3–13.5 mm）；G2 為當前週期的上下界差
    execution_deviation: 見 execution_deviation
  proposed_45mm_basis: '45 mm 用於四組支柱配對與 link6：取 d - rho 的最小值
    50.83 mm 再留約 6 mm。**這是工程選值，不是證明足夠**。'
  proposed_70_75mm_basis: 'link5／link4 只因 rho 扣除不可行，取 d - rho 之下
    的整數值，仍低於一般規則的 80 mm ⇒ 屬**局部放寬**，須明載。'
  not_claimed: 以上任一數值都**不是已證明足夠的安全距離**

execution_deviation:
  status: '**不成立為間距預算**（2026-09-30 更正）。保留為「命令追蹤的量級參考」，
    不得作為殼—橫桿的相對間距誤差。'
  source: 既有趟次 drawer_220102_offset20 的 track_err（**關節**追蹤誤差，rad）
  correction: '先前把 track_err 的 1000 倍讀成 mm 是錯的 —— 那是 mrad。'
  why_not_a_gap_budget:
  - 'J·(q_實測 − q_命令) 描述的是**機器人相對命令**的位置偏差，
    要保護的卻是**殼與橫桿之間的相對距離**。'
  - '連接後殼與橫桿可能一起移動：兩者都落後命令 10 mm，間距不必縮小 10 mm。
    理想固定連接不代表無相對變形，但必須**量測相對量**。'
  - '當前 d 已由**實測位姿**算出 ⇒ 當下落後造成的位置差**已反映在幾何裡**，
    不得不加區分再扣一次。需額外處理的是未量得的誤差、資料延遲、
    以及下一次更新前的相對運動。'
  retracted_claims:
  - '「7.42 − 5.83 ≈ 1.6 mm 為剩餘間距下界」—— **撤回**，不成立。'
  - '「任何正的間距要求都不成立」—— **撤回**；該結論建立在上述錯誤換算上。'
  - '「38–49 mm 以命令落後為主、已由 v·tau 涵蓋」—— **撤回**；未經核對。'
  p95_rad: {engage: 0.00300, pull: 0.01559, hold: 0.00239, release: 0.00195}
  cartesian_bound: '沿 n 的偏差 <= |n^T J_lin|_2 * ||dq||_2，
    且 ||dq||_2 <= sqrt(6) * max_i|dq_i|（**只有 max 有記錄**）'
  directional_gain_m_per_rad: 0.995–1.284（十組配對，保持位姿）
  estimate_mm:            # **估計，不是最壞情況界**
    hold: 5.83–7.52
    pull: 38.00–49.04
  why_not_a_bound: '用的是 p95_rad，不是誤差最大值或認證上界；
    Jacobian 增益取自**保持位姿**，用於其他位姿只是局部估算。
    正確稱法：「以保持位姿增益與 p95 關節誤差換算的估計」。'
  double_counting_question: '`pull` 的 15.59 mrad 有多少是命令落後、
    有多少會由屏障的 v_app * tau 涵蓋，**目前未核對**，
    **不先歸給 v·tau**。逐關節誤差向量未記錄 ⇒ 需先補記（已獲允許）。'

# ---------------------------------------------------------------- 六、還沒解決的決定
unresolved_decision:
  id: D1
  status: '**暫緩，不在 D1a–D1d 中選**（2026-09-30）。
    先解的是「屏障與偏差預算是否使用正確的相對運動量」，
    不是再選一個更小的安全距離。'
  title: 夾爪殼—橫桿的間距要求尚無成立的推導依據
  facts:
  - 保持位姿真實最小距離落在 7.4160–7.4415 mm（**單一位姿，不外推**）
  - '先前據 5.83 mm 推出「殘餘 1.6 mm」「任何正間距都不成立」，
    已撤回 —— 那組換算用的是機器人相對命令的偏差，不是殼—橫桿的相對間距誤差'
  - 45／70／75 mm 暫留**候選值**，不批准套用
  - 不因目前這組偏差估算宣告既有抓取幾何無法使用
  options_for_ruling:
  - id: D1a
    action: 明訂偏差的**統計處理**（例如以 p95 搭配明載的超出率），而非最壞情況
    requires: 決定超出率如何被接受、以及超出時由什麼機制承接
    changes: 方法論定義，不改門檻
  - id: D1b
    action: 把落後成分歸給既有的 v_app * tau，只對**非落後**成分留餘裕
    requires: 逐關節誤差向量的記錄（現行只記 max）⇒ 需改記錄欄位，非新掃描
    changes: 記錄欄位
  - id: D1c
    action: 收緊關節追蹤（降低 pull 相位的 15.59 mrad）
    changes: 控制側，不改門檻
  - id: D1d
    action: 接受低於偏差界的間距要求，並明載力中止為後備
    must_state: '這是**工程決定**，不得寫成已證明的餘裕；力中止不是幾何不變式'
  not_proposed: 改變抓取幾何（依裁定保留）

# --------------------------------------------- 六之二、相對運動的程式核對（D2，當前焦點）
relative_motion_review:
  id: D2
  method: 讀程式釐清（**未重跑、未新增幾何掃描、未開模擬器**）
  files_read:
  - src/ammr_wholebody_mpc/ammr_wholebody_mpc/wholebody_safety_filter.py（_rows_from_points）
  - src/ammr_wholebody_mpc/ammr_wholebody_mpc/arm_link_distance.py（列的產生與位姿回呼）
  finding: '**屏障把障礙物當作該週期內靜止。** 列的左式是 `n^T J(q) u`，
    只含機器人側的 Jacobian 速度；濾波器與距離節點**都沒有**估計障礙物速度。
    亦即實作隱含 v_obs = 0，而真正的距離變化是 d_dot = n^T (v_obs − v_link)。'
  what_stale_speed_is_not: '`stale_obstacle_speed = 0.30 m/s` **不是**量測的障礙物速度：
    它只在該列為 STATUS_STALE 時，用 `d − age x 0.30` 收縮距離，
    是對**未看見**期間的最壞接近假設，且一律往收緊方向套。'
  d_is_recomputed_each_cycle: '障礙物運動的**位置**效應會進入下一週期的 d
    （d 由實測位姿重算）。缺的是**週期內**的相對運動與屏障的速率項。'
  consequences:
    over_restrictive_case: '橫桿隨夾爪移動時（連接後的 pull），真實 d_dot 接近 0，
      但屏障仍看到 n^T J u > 0 並加以限制 ⇒ **過度限制**（偏安全，但擋任務）。'
    not_conservative_case: '若障礙物**朝機器人**移動，屏障會**低估**接近速率 ⇒
      該省略在一般情況下**不是**保守的。本案抽屜為被動件，但此性質必須明載。'
  magnitude_from_existing_data:     # 既有趟次 drawer_220102_offset20
    drawer_speed_mm_s: {pull_p50: 9.69, pull_p95: 17.77, pull_max: 18.91,
                        hold_p95: 1.00, hold_max: 2.24}
    unmodelled_displacement_per_cycle_mm: 0.95   # |v_obs| max x 0.05 s
    d_stop_attributable_to_shared_motion_mm: 3.0 # v x tau + v^2/2a 於 v = 18.9 mm/s
  does_not_explain_zero_command_infeasibility: '**必須分清**：u = 0 時左式為 0，
    不可行純粹來自 d_eff < d_stop（靜態要求）。修正相對運動模型**不會**
    使保持位姿變成可行；它影響的是**運動中的速率約束**是否正確，
    以及偏差預算該用什麼相對量。'
  next_steps_not_yet_done:
  - 依 d_dot = n^T (v_obs − v_link) 決定屏障是否納入 v_obs，以及資料從哪裡來
  - 補記逐關節命令／實測誤差向量（**已獲允許**）；**不先歸給 v·tau、不先調增益**
  - 決定「連接後殼與橫桿的相對量」如何量測（不以世界座標偏差代替）

# ---------------------------------------------------------------- 七、仍未涵蓋的不確定性
uncertainties_not_covered:
- id: U1
  item: 只核了**單一位姿**（hold、開度 19.99 mm）
  impact: 整段操作（approach→retreat）的最小間距未知；G2 的線上下界正是為此
- id: U2
  item: 位姿來源是**固定底座**趟次的 FK 重建，base_drift 記錄全為 0
  impact: 開放底盤趟次的底盤位移與偏擺完全未涵蓋
- id: U3
  item: 執行偏差取自**理想固定連接**、固定底座、軌跡重演趟次
  impact: 全身 QP＋開放底盤的偏差分布可能不同
- id: U4
  item: 逐關節誤差向量未記錄，只有 max|dq|
  impact: sqrt(6) 放大是最壞情況；無法分離落後與非落後成分
- id: U5
  item: 抽屜部件以軸對齊方塊近似、橫桿以圓柱近似，無倒角與細節
  impact: 模型與模擬器碰撞幾何的差異未量化
- id: U6
  item: 抽屜位姿由執行端發布，屏障端有齡期
  impact: STATUS_STALE 收縮已在線上，但齡期分布未在此核對
- id: U7
  item: G2 尚未實作，熱啟動下界的有效性未驗證
- id: U8
  item: 另外七組是否也像殼—橫桿一樣「rho 遠大於實際誤差」，**本次未核**
  reason: 依裁定不擴大幾何掃描範圍
- id: U9
  item: 屏障未納入障礙物速度（見 relative_motion_review）
  impact: 連接後的相對接近速率被以機器人側速度代替；一般情況下不保守
- id: U10
  item: 「連接後殼與橫桿的相對變形」沒有任何量測
  impact: 理想固定連接不等於無相對運動；目前無資料可據

