# **近接操作配置 P1（提案，待審定）**
#
# 目的：把「近接操作需求」與「線上避碰規則」定義成一致、可執行的一套，
# 取代逐列遇到阻擋才修改的做法。**保留目前抓取幾何。**
#
# 本檔是提案，不是已核准的配置。起動前檢查會因 status 非 approved 而擋住。
schema: coman_near_approach_config/1
version: P1
status: proposal_pending_approval
created: 2026-09-30
supersedes_conclusions_in:
  file: coman_contact_avoid_pairs_v0_draft.yaml
  what: no_conflict_after_measurement（已撤回）與缺少 eps 的 general_rule（已更正）
basis:
  full_barrier_check: evaluation/coman_zero_cmd_feasible.py
  local_bound: evaluation/coman_shell_bar_bound.py
  execution_deviation: 既有趟次 drawer_220102_offset20 的 track_err（**未重跑、未新掃描**）
  pose: 既有趟次 hold 相位、開度 19.99 mm —— **單一位姿**，不外推到整段操作

# ---------------------------------------------------------------- 一、不可動的部分
invariants:
  barrier_form: 'n^T J v <= alpha (d_eff - d_stop)'
  kept_unconditionally:
  - v_app * tau 與 v_app^2/(2a)（速度相關停止距離）
  - rho 扣除（或其替代的**已認證**下界）
  - omega * rho 與 velocity_error_margin（速度誤差修正）
  - STATUS_STALE 的距離收縮與 stale_speed_cap
  - 遮蔽方向的 blind_approach_cap
  - 關節限位列、速度框、加速度框、jerk 框、執行端最終檢查
  note: '距離估計改善**不得**順手刪掉上述任何一項；改善的是 d 的下界，不是這些項的用途。'

# ---------------------------------------------------------------- 二、三類配對
classification:
  contact_exception:
    pairs: [uflite_finger1|handle_bar, uflite_finger2|handle_bar]
    phases: [engage, pull, hold, release]
    rule: 維持指定相位的設計接觸例外（不產生屏障列）
    unchanged_from: S1
  near_approach:
    rule: '**保留避碰**，另訂局部間距與適用相位；間距是 g_pair（總靜態間距，
      取代該配對的 d0 + eps），速度相關項照常計入。'
    pairs: 見 pair_table
  general:
    rule: 其餘所有配對維持既有一般規則（d0 50 + eps 30 = 80 mm 零速總靜態間距）

# ---------------------------------------------------------------- 三、十組配對一次列完
# margin_mm 為距離當量（rhs / alpha）。d 與 rho 是距離節點在保持位姿的實際輸出。
# fail_mode：
#   rho_only  —— **取樣**距離 d 本身已 >= 80 mm，目前不可行來自 rho 扣除。
#                這**不能證明**改善幾何表示後就一定滿足 80 mm：d 是取樣值，
#                真實最小距離可能更小（殼—橫桿即為例：取樣 8.69、真實 7.44）。
#                只表示「值得先確認幾何表示」，不是「改了就會通過」。
#   distance  —— 取樣距離本身 < 80 mm ⇒ 需要局部間距決定
pair_table:
