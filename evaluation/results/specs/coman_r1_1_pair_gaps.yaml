reference_pose:
  name: '**參考終點位姿**'
  run: drawer_220102_offset20（既有趟次，未重跑）
  phase: hold
  opening_m: 0.019987
  note: '開度最大**不保證**各連桿間距最小；行程中間構形未核對。'

mechanism:
  g_pair: 該配對的**總靜態間距**，取代 d0 + eps（80 mm），單位**公尺**
  d_stop: 'g_pair + v_app·tau + v_app²/(2a)，**v_app = max(0, v_rel)**、
    v_rel = n^T (J u − v_obs)；取 max(0, ·) 以不把遠離速度代入延遲項。'
  kept: v_rel 相關項、omega x rho、velocity_error_margin、stale 收縮、遮蔽上限

limits:
- 單一**參考終點位姿**；行程中間構形未核對
- 零相對速度；運動中的相對煞停能力**未驗證**
- 抽屜部件以方塊、橫桿以圓柱近似；與模擬器碰撞幾何的差異未量化
- 固定底座 FK 重建；開放底盤的位移與偏擺未涵蓋
- 夾爪殼—橫桿的下界是**該位姿**的值；7.24 mm 不是整段操作都有的間距
- Isaac 執行期與端到端命令年齡尚未驗收
