nearest_is_not_most_restrictive:
  statement: |
    **不同配對使用不同間距後，最近障礙物不一定是限制最嚴的障礙物。**
    這不只發生在刪除接觸列的時候 —— 只要同一連桿的各配對規則不一致，
    「以最近距離代表全部限制」就不成立。
  consequence: 後續一律按**完整配對規則**處理；不得用最近距離代表全部限制。
  correction_2026_09_30: |
    先前寫「僅當該連桿對所有障礙物套用同一條規則時，最近者才必然最嚴」——
    **這句不成立，已撤回。** 即使間距相同，不同的法向、Jacobian 與
    障礙物速度也會形成不同的約束：
      * 法向不同 ⇒ n^T J 不同 ⇒ 同一命令的接近速度不同。
      * 障礙物速度不同 ⇒ 相對接近速度與 d_stop 的速度項不同。
      * 速度不可用者另有退化上限。
    只能說：**在同樣的靜態餘裕下，最近者的距離餘量較小**；
    **不能**據此證明其他屏障是冗餘的。
  what_can_be_said: |
    最近距離只決定**距離項**的大小關係，不決定整列 rhs 的大小關係，
    也不決定哪一列會在某個命令方向上先生效。
    因此一律按**完整配對規則**產生列，不以最近距離代表全部限制。
  links_needing_pair_rows: |
    本配置中 link4／link5／link6／兩指／夾爪殼的各配對規則不一致，
    最近者被放寬時其他物件會完全沒有列 ⇒ **必須**產生必要配對列。
    其餘連桿目前全部套用一般規則，但那只是**現況**，
    不是「最近者足以代表」的證明。
  enforced_by: 起動前檢查（R1.1 具名連桿都要有 pair_rows）＋ 離線反例
  history: 這一點在 R1 審閱時被漏掉，導致「整組 320 列可行」的錯誤結論（見 O3）

