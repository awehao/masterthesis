# **R1：十組近接配對的一次性定版提案**（待核准或退回）
#
# 這是一份**提案**。填了具體數值**不代表自動核准**，也不代表已證明安全。
# 定位：完成**受限模擬條件下**的 20 mm 協同操作實驗；
# 本輪**不**追求通用的接觸避碰安全證明。
schema: coman_r1_pair_gaps/1
version: R1
status: proposal_pending_approval
created: 2026-09-30
generated_by: evaluation/coman_r1_table.py（數值由程式產生，非手抄）
parent: coman_near_approach_config_p1_proposal.yaml

naming:
  is: '本次受限模擬採用的**工程設定**'
  is_not: '**已證明在所有誤差與動態下都安全**'
  note: '兩者不可互換敘述。v1 的操作驗收門檻未變；安全濾波配置有變。'

mechanism:
  g_pair: 該配對的**總靜態間距**，取代 d0 + eps（80 mm），單位**公尺**
  d_stop: g_pair + v_rel·tau + v_rel²/(2a)；v_rel = n^T (J u − v_obs)
  kept: v_rel 相關項、omega x rho、velocity_error_margin、stale 收縮、遮蔽上限

selection_rule:
  principle: '**盡量保留一般規則的 80 mm** —— 每組取其幾何允許的最大值，
    不是取一個剛好能過的小值。'
  general: 小於等於「有效距離項 − 5 mm」的最大 5 mm 整數倍
  shell_bar: 1 mm 粒度、留 4 mm 以上（有效距離項只有約 7.2 mm）
  fingers_panel: 沿用已裁定的 10 mm
  reserve_is: '5 mm／4 mm 是留給**未核對的位姿**與**模型差異**的工程預留，
    **不是**誤差上界，也不是證明。'

phases_rationale: |
  十組一律套用全部六個相位（approach、engage、pull、hold、release、retreat）。
  理由：設計抓取位姿是在 approach 末段抵達、在 retreat 初段離開，
  若把局部間距限定在 engage–release，機器人就**無法抵達或離開該位姿** ——
  一般規則的 80 mm 會在抵達前擋住。相位限定在這個幾何下不可行，故不採用。

reference_pose:
  run: drawer_220102_offset20（既有趟次，**未重跑**）
  phase: hold
  opening_m: 0.019987
  why_this_pose: '開度 19.99 mm 是**行程終點**，抽屜離機器人最近 ⇒
    就抽屜位置而言是行程中的最壞情況。但**手臂在行程中間的構形未核對**。'
  base: 固定底座趟次的 FK 重建；**開放底盤的位移與偏擺未涵蓋**

