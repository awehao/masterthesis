open_issues:
- id: O1
  severity: resolved
  title: 10 mm 的配對 d0 **沒有**打通手指—面板；eps 單獨就大於設計間距
  facts:
    design_clearance_mm: 27.9
    filter_eps_mm: 30.0
    pair_d0_mm: 10.0
    d_stop_at_zero_speed_mm: 40.0
    d0_needed_for_pass_mm: -2.1
  detail: 'd_stop = d0 + v·τ + v²/2a + eps。零接近速度下 d_stop = 10 + 30 = 40 mm
    > 27.9 mm ⇒ 面板那一列**仍在限制方向**。eps（幾何＋量測餘裕，預設 30 mm）
    本身就大於 27.9 mm，所以**任何 d0 ≥ 0 都放行不了**這一對。
    離線反例已固定此行為（test_pipeline_pairs.py：d0 = 10 mm 與 d0 = 0 皆 rhs < 0）。'
  note_on_double_counting: 'eps 的用途（幾何＋量測餘裕）與 S1 選值依據
    （網格取樣 2.0 + 追蹤誤差 1.5 + 工程預留 3.0 = 6.5 mm）**重疊**；
    但如何處置屬門檻決定，**不在此版自行更動**。'
  status: '已裁定（2026-09-29）：兩組「手指—面板」另立為**總靜態間距 10 mm 的
    受限模擬配置**，g_pair **取代**該配對的 d0 + eps，不是在 30 mm 上再加 10 mm。
    其餘配對維持原設定；速度相關項、rho 扣除與速度誤差修正全部保留。
    **不使用負的 d0 抵銷 eps。**'
  resolution:
    mechanism: SafetyConfig.g_by_pair（節點參數 pair_gap、求解端 --pair-gap）
    formula: d_stop_pair = g_pair + v_app·tau + v_app²/(2a)
    g_pair_m: 0.010
    replaces: 該配對的 d0 + eps（80 mm）
    exclusive: 同一配對不得同時設 d0_by_pair 與 g_by_pair（validate_pair_config 擋掉）
    verified: 'coman_zero_cmd_feasible.py：兩組面板配對在完整屏障下餘量
      +5.34／+6.60 mm（距離當量）⇒ **此配置對其目標配對成立**'
  naming: '這是**局部安全參數配置的變更**。凍結的 v1 操作驗收門檻不變，
    與安全濾波配置有變，是兩件事；不得寫成「安全門檻完全沒變」。'
  ten_mm_status: '首測的**工程選值**，不是已證明足夠的安全距離。
    只能說 eps 與選值理由涵蓋的誤差類別**可能重疊**，
    不能據此認定原本 30 mm 全部是重複計算。'
  blocks: 已解除（改由 O2 阻擋）
- id: O2
  severity: blocking
  title: 完整屏障下設計保持位姿**不允許零命令**；造成者是**其餘八組一般規則配對**
  check: evaluation/coman_zero_cmd_feasible.py（既有趟次 drawer_220102_offset20 的
    hold 相位，開度 19.99 mm；用距離節點實際的取樣、d 與 rho，未重跑任何趟次）
  result: 屏障 320 列中有 8 組配對餘量為負；關節限位與速度框可行
  target_pairs_ok:
    uflite_finger1|drawer_front_panel: {d_mm: 28.07, rho_mm: 12.73, margin_mm: 5.34}
    uflite_finger2|drawer_front_panel: {d_mm: 28.88, rho_mm: 12.28, margin_mm: 6.60}
  blocking_pairs:
  - {pair: uflite_gripper_link|handle_bar, d_mm: 8.69, rho_mm: 13.35,
     margin_mm: -84.65, feasible_gap_limit_mm: -4.65,
     note: '上限為負**只表示這組取樣證不出正間距**，不是實際相交。
       已用局部加密判定（見 geometry_resolved）。'}
  - {pair: link6|handle_bar, d_mm: 64.12, rho_mm: 13.30, margin_mm: -29.17,
     feasible_gap_limit_mm: 50.83}
  - {pair: uflite_finger1|handle_post_r, d_mm: 66.95, rho_mm: 12.73,
     margin_mm: -25.78, feasible_gap_limit_mm: 54.22}
  - {pair: uflite_finger1|handle_post_l, d_mm: 67.27, rho_mm: 12.73,
     margin_mm: -25.46, feasible_gap_limit_mm: 54.54}
  - {pair: uflite_finger2|handle_post_l, d_mm: 67.46, rho_mm: 12.28,
     margin_mm: -24.82, feasible_gap_limit_mm: 55.18}
  - {pair: uflite_finger2|handle_post_r, d_mm: 69.91, rho_mm: 12.28,
     margin_mm: -22.37, feasible_gap_limit_mm: 57.63}
  - {pair: link5|handle_bar, d_mm: 84.80, rho_mm: 12.62, margin_mm: -7.82,
     feasible_gap_limit_mm: 72.18}
  - {pair: link4|handle_bar, d_mm: 91.20, rho_mm: 13.54, margin_mm: -2.34,
     feasible_gap_limit_mm: 77.66}
  root_cause_of_pattern: '參照表 coman_contact_avoid_pairs_v0_draft.yaml 的
    general_rule 寫 `d_stop = d0 + v·tau + v²/(2a)`，**漏了 eps**。
    因此該表 no_conflict_after_measurement 的判定是拿 50 mm 比，不是 80 mm；
    七組「可行上限 50.8–77.7 mm」的配對正落在 50 與 80 之間。
    夾爪殼—橫桿該表**完全沒有列**（只列了殼—面板）。'
  representation_note: '手指／夾爪的 rho 為 12.3–13.4 mm，與此處的間距
    （8.7–28.9 mm）同一數量級 ⇒ 這些配對的餘量主要由**取樣表示的覆蓋半徑**決定，
    不是量測誤差。'
  geometry_resolved:
    pair: uflite_gripper_link|handle_bar
    method: 'evaluation/coman_shell_bar_bound.py —— 只對這一對做分支與界限：
      夾爪殼碰撞三角形局部加密（8812 → 40816），每個三角形取形心到橫桿的
      **精確**帶號距離配上外接半徑（距離函數 1-Lipschitz）。
      **未全場重掃、未改動 rho。**'
    true_min_distance_mm: {lower: 7.416, upper: 7.4415, gap: 0.0255}
    verdict: '**確認有間隙**（≥ 7.416 mm）⇒ 仍為**非接觸配對**，不新增接觸例外。'
    retraction: '我先前寫「夾爪殼包住橫桿、屬抓取幾何」**不成立**。
      d − rho < 0 只代表下界過保守，不能區分相交與證不出間距。'
    actual_sampling_error_mm: 1.25
    note: 'rho 13.35 mm 是**整條連桿的最壞情況**覆蓋半徑；此位姿此配對的實際取樣
      誤差只有 1.25 mm。屏障在此位姿無法給零命令，是因為 rho 大於實際間距
      7.44 mm，不是因為幾何相交。'
    other_seven_pairs: 同一個保守性問題是否也適用於另外七組，**本次未核**（依裁定不擴大範圍）
  eps_correction_required:
    file: evaluation/results/specs/coman_contact_avoid_pairs_v0_draft.yaml
    action: 'general_rule 的 d_stop 補上 eps；撤回 no_conflict_after_measurement
      的三組「無衝突」結論（該判定是拿 50 mm 比，不是 80 mm）'
  decision_pending: '**完整的近接操作配置一次決定**（不逐組把門檻降到剛好通過、
    不全域移除 eps、不繼續逐列補例外）。'
  proposal: coman_near_approach_config_p1_proposal.yaml（P1，proposal_pending_approval）
  proposal_summary: '十組配對一次列完。面板 10 mm 沿用 S1；45／70／75 mm 為
    **候選值，未批准套用**；夾爪殼—橫桿尚無成立的推導依據。
    離線的 7.4160–7.4415 mm 是**單一位姿**，不得當成整段運動的固定下界。'
  current_focus: '**D2：屏障與偏差預算是否使用正確的相對運動量**（不是再選更小的安全距離）。
    程式核對結論：屏障把障礙物當作該週期內靜止（左式只含 n^T J u），
    濾波器與距離節點都未估計 v_obs；stale_obstacle_speed 只是未看見期間的假設。'
  retracted_2026_09_30:
  - '「7.42 − 5.83 ≈ 1.6 mm 為剩餘間距下界」—— 撤回。J·(q_實測−q_命令) 是
    機器人相對命令的偏差，不是殼—橫桿的相對間距誤差；且當前 d 已由實測位姿算出，
    落後造成的位置差已在幾何裡，不得再扣一次。'
  - '「任何正的間距要求都不成立」—— 撤回（建立在上述換算之上）。'
  - '「38–49 mm 為最壞情況界」—— 撤回；那是以**保持位姿增益**與 **p95** 關節誤差
    換算的**估計**，非最大值或認證上界。'
  - '「該值以命令落後為主、已由 v·tau 涵蓋」—— 撤回；未經核對，不先歸給 v·tau。'
  - '「d ≥ 80 mm ⇒ 改善幾何表示後必然滿足 80 mm」—— 撤回；d 是取樣值，
    真實最小距離可能更小（殼—橫桿：取樣 8.69、真實 7.44）。'
  - '「G2 可在 50 ms 預算內」—— 撤回；量到的是局部片段耗時，
    未含 TF／FK、三角形變換、活躍集合維護、多配對與屏障組裝的競用。'
  allowed_and_done: '補記逐關節命令／實測誤差向量（isaac_coman_drawer_sim.py
    新增 coman_joint_err_log，僅記錄；**未歸給 v·tau、未調任何增益或門檻**）。'
  precision_note: '最小距離落在 **7.4160–7.4415 mm**，不是已知恰等於 7.416 mm，
    且**不能外推到整段操作**。'
  not_done: 未刪除任何餘裕、未調整任何門檻、未改動一般規則；僅回報造成不相容的項目
  status: 待指導意見裁定近接操作配置（幾何性質已釐清）
  blocks: S1 核准與 20 mm 主成果首測
questions:
  q1_completion: 20 mm 完整操作是否完成（接近→連接→拉開→保持→釋放→退出）
  q2_coordination: '操作期間是否真有底盤與手臂的協調運動，而不是只有底盤漂移。 判定用**實測運動**：底盤線速度 > 0.005 m/s 且任一關節速率 > 0.005 rad/s
    的時間比例， 區間為首個非零命令到退出完成；**底盤位移本身不足以證明協調**。

    '
  not_allowed: 不得為了讓同動數字好看而調權重或硬塞底盤速度
