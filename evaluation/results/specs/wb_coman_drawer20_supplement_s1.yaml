wiring_fixes_20260929:
- issue: 求解端發布的相位名稱（大寫任務相位）與設定鍵不符 ⇒ 接觸例外**從未生效**
  fix: coman_pull_solver_node.PHASE_MAP 逐項明列；未列出者 unknown
  counterexample: test_pipeline_pairs.py —— 直接送 'PULL' 時例外不生效（fail closed）
- issue: 一般列只留**最近**障礙物；橫桿被例外刪掉後手指—面板**完全沒有屏障列**
  fix: arm_link_distance.forced_pair_rows + pair_rows 參數
  counterexample: test_pipeline_pairs.py —— 以橫桿為最近者時仍產生面板列並重現漏洞
- issue: 相位齡以**接收時間**計，不是來源時間
  fix: 相位訊息改為 JSON 攜帶 sim_t，安全層以來源時間計齡；解析失敗 ⇒ 相位未知
open_issues:
- id: O1
  severity: blocking
  title: 10 mm 的配對 d0 **沒有**打通手指—面板；eps 單獨就大於設計間距
  facts:
    design_clearance_mm: 27.9
    filter_eps_mm: 30.0
    pair_d0_mm: 10.0
    d_stop_at_zero_speed_mm: 40.0
    d0_needed_for_pass_mm: -2.1
  detail: 'd_stop = d0 + v·τ + v²/2a + eps。零接近速度下 d_stop = 10 + 30 = 40 mm
    > 27.9 mm ⇒ 面板那一列**仍在限制方向**。eps（幾何＋量測餘裕，預設 30 mm）
    本身就大於 27.9 mm，所以**任何 d0 ≥ 0 都放行不了**這一對。
    離線反例已固定此行為（test_pipeline_pairs.py：d0 = 10 mm 與 d0 = 0 皆 rhs < 0）。'
  note_on_double_counting: 'eps 的用途（幾何＋量測餘裕）與 S1 選值依據
    （網格取樣 2.0 + 追蹤誤差 1.5 + 工程預留 3.0 = 6.5 mm）**重疊**；
    但如何處置屬門檻決定，**不在此版自行更動**。'
  status: 待指導意見裁定；**未調整任何門檻**（eps 仍為 30 mm，d0 仍為 10 mm）
  blocks: S1 核准與 20 mm 主成果首測
questions:
  q1_completion: 20 mm 完整操作是否完成（接近→連接→拉開→保持→釋放→退出）
  q2_coordination: '操作期間是否真有底盤與手臂的協調運動，而不是只有底盤漂移。 判定用**實測運動**：底盤線速度 > 0.005 m/s 且任一關節速率 > 0.005 rad/s
    的時間比例， 區間為首個非零命令到退出完成；**底盤位移本身不足以證明協調**。

    '
  not_allowed: 不得為了讓同動數字好看而調權重或硬塞底盤速度
