open_gap_G8_odom_RESOLVED:
  id: G8
  issue: 協同執行端未發布 /odom 與 odom→base_link TF
  impact: 求解節點 base=False；距離節點 report_frame=odom 查不到 TF ⇒ 距離列全 NODATA
  reference_impl: isaac_wholebody_sim_e2.py:193-229
  cautions: ['/odom.twist 以 child_frame_id 的本體座標表達',
             'odom→base_link 不得重複發，否則 base_link 有兩個父節點']
  status: '**已實作**（2026-10-01）'
  implemented:
    g8a: '執行端 DrawerNode 加 /odom 發布器 ＋ TransformBroadcaster；
      每週期與 /joint_states 同一模擬時間戳發布 publish_base_feedback()'
    g8b: 'runner 加 robot_state_publisher（**manip** URDF），提供
      base_footprint → base_link → … → link6；距離／安全節點仍用 wholebody URDF 當 FK 參數'
    conventions_locked:
    - TF 只發 odom → base_footprint（base_link 不得有兩個父節點）
    - /odom.twist 以 child_frame 表達；yaw=0 時碰巧相同不代表定義正確
    - /odom 與 TF 同一時間戳，且由**模擬時間**組出
    - 位姿取 prim 完整變換（含 roll/pitch），非 yaw 重建；USD 列向量慣例已轉置
    - 找不到 base_footprint prim 即中止 return 12
    offline_test: evaluation/test_base_feedback.py（20 項全部通過）
fixes_after_first_attempt:
- id: F1
  issue: '固定關節守衛寫死「恰好 1 個」，與 --free-base 相斥 ⇒
    開放底盤模式每次都在啟動就中止；**29 趟歷史全是 importer_fix_base，
    開放底盤路徑從未真正執行過**'
  fix: 期望值改為**模式相依**（free_base 期望 0、固定底座期望 1），不符一律中止
  not: 不是移除保護 —— 兩種模式各有明確期望，相反配置都會被拒
  offline_test: evaluation/test_base_mode_guard.py（11 項，含四種組合與舊守衛的反例）
- id: F2
  issue: 'runner 只把 --stroke-m 傳給求解端；執行端沿用案例
    target_opening_m = 0.200，且其自身到位判定用案例容差 ±10 mm'
  fix_a: runner 傳 --pull-target-m "$STROKE" 給執行端（兩端目標一致）
  fix_b: '舊判定欄位改名 legacy_case_tol_*，並新增 formal_acceptance_source
    與 legacy_vs_formal_note；列印也標明「**非 v1 正式資格**」'
  formal_path: '正式到位／保持／釋放資格由 **v1 狀態機**判定
    （HandoverMachine 讀 v1：target_stroke_m 20 mm、P1 ±0.5 mm、hold 2.0 s）'
  v1_unchanged: true
  offline_test: evaluation/test_opening_acceptance.py（19 項）
- id: F3
  issue: "NameError: MACHINE_WIRED 未定義（變數名為 machine_wired），
    在進入物理主迴圈後立刻中止整趟"
  fix: 改用正確的變數名
  scope_note: '第三個只存在於 --free-base ＋ --machine 路徑的缺陷；
    該路徑從未真正執行過'
  swept: pyflakes 掃過協同鏈七個檔案的未定義名稱／使用前參照 —— 全部無
- id: F4
  issue: '執行端未宣告 `joints` 參數 ⇒ arm_vel_adapter 的關節順序核對失敗、
    拒絕轉發命令（守衛正常運作，缺的是本端沒提供資訊）'
  fix: "DrawerNode.__init__ 加 declare_parameter('joints', list(ARM))"
  same_as: isaac_wholebody_sim_e2.py:185 早有同樣宣告
  not: 不是放寬守衛 —— 順序若錯，核對仍會擋下
- id: F5
  issue: 'run_coman_drawer20.sh 不自己 source 工作區，依賴呼叫端環境。
    未 source 時 ros2 run 靜默失敗（Package not found），距離與安全節點
    根本不啟動，而腳本一路跑到 sim_limit 才停 —— 整趟浪費且無任何一處擋下'
  fix: 起動前守衛：ammr_wholebody_mpc 與 my_omnibot_description 必須可解析，否則具名失敗 exit 65
  verified: 未 source 時實測擋下並印出 source 指令
- id: F6
  issue: obstacles 參數格式錯（每條規格含逗號）⇒ 距離節點啟動即死
  fix: 逐項加引號組成陣列
- id: F7
  issue: "安全節點 _on_src_meta／_pair_src 從未加入類別（替換字串未對上，靜默失敗）"
  fix: 補上方法，並以 AST 核對確實在 WholeBodySafetyNode 內
- id: F8
  issue: '離線套件與入口核對抓不到「節點啟動即死」'
  fix: 'evaluation/coman_node_smoke.py —— 用 runner 實際參數啟動四個節點，
    提早退出即失敗；已接入起動前檢查（未通過 exit 66）'
- id: F9
  issue: '啟動競態：父類別的等待只看「有沒有雲」，不看有沒有 STATUS_OK 列。
    距離節點剛起來時 TF 未暖、抽屜位姿未到 ⇒ 第一批雲整片 NODATA ⇒
    _constraints 立刻 fail closed 中止整趟（實測 main2）'
  fix: '協同求解端在解之前檢查 OK 列數。**啟動期**（尚未成功解過）等待至多
    rows_wait_s=15 s 且不下命令；**任務中**列消失仍交由 _constraints 中止。
    不放寬 fail closed。'
- id: F10
  issue: '執行端以 TRANSIENT_LOCAL 訂閱 diag／cmd_meta，而發布端是 VOLATILE
    ⇒ QoS 不相容，一則都收不到（O4 要求的節點耗時因此全部缺）'
  fix: 改用相容的 RELIABLE/VOLATILE QoS
- id: F11
  issue: '冒煙測試只對 `ros2 run` 外殼送 SIGTERM ⇒ 真正的節點是其子程序，
    活了下來；跑三次漏了九個程序'
  fix: 'killpg 整個行程群組（start_new_session=True 使該群組只含本函式起的程序，
    不會波及他人）；已實測測試後零殘留'
retry_precondition:
  gpu_required: true
  why: 'Isaac 無 CUDA 時退為 CPU-only（PhysX GPU 功能跳過），
    而三題中的動態同動與執行期時效直接取決於物理與 RTF'
  check_before_rerun: ['nvidia-smi 正常', '/dev/nvidia0 存在', 'dkms status 有已編出的模組']
entry_check_scope_correction: '先前稱「入口核對全部通過」只涵蓋 A–E
  （版本、參數宣告、部分接線、欄位索引、規格鏈），**沒有涵蓋模式條件與任務數值** ——
  首趟啟動失敗證明了這點。已新增 F（模式條件）與 G（任務數值）兩段。
  **A–E 不得再稱為完整驗證。**'

references:
  v1_corrigenda:
  - file: wb_coman_drawer20_v1_corrigendum_c1.yaml
    item: P6 退出方向
    summary: '「起始夾爪 +z」更正為「向外 −z」；**23.3 mm 門檻不變**。
      這是判定方向修正，不是文字修飾 —— 求解目標、狀態機與趟後判定都須一致。'
    status: approved
  criteria_v1: wb_coman_drawer20_criteria_v1.yaml
  criteria_v1_sha256_16: c9f303a8630d4d0e
  pairs_table: coman_contact_avoid_pairs_v0_draft.yaml
v1_thresholds_changed: false        # 凍結的**操作驗收**門檻未變
safety_filter_config_changed: true  # 安全濾波**配置**有變（局部、逐配對）——
#   兩者是兩件事，不得寫成「安全門檻完全沒變」
pair_avoidance:
  mechanism: 'SafetyConfig.g_by_pair／d0_by_pair 與 contact_pairs，鍵為 ''<link>|<obstacle>''。

    g_by_pair 是該配對的**總靜態間距**，**取代** d0 + eps（不是再加上去）；

    d0_by_pair 只改基礎 d0、eps 仍另加。同一配對不得同時設兩者。

    預設全空 ⇒ 既有行為完全不變。相位由**求解端擁有並發布**

    （/coman/contact_phase），安全層訂閱同一份；**過期或未收到 ⇒ 無任何例外**。

    '
  d0_by_pair: {}                     # 本趟不使用（與 g_by_pair 互斥）
  g_by_pair:                         # **R1.1 定版十五組**（取代該配對的 d0 + eps）
    uflite_gripper_link|handle_bar: 0.003
    uflite_finger1|drawer_front_panel: 0.010
    uflite_finger2|drawer_front_panel: 0.010
    link6|handle_bar: 0.045
    uflite_finger1|handle_post_l: 0.045
    uflite_finger1|handle_post_r: 0.045
    uflite_finger2|handle_post_l: 0.045
    uflite_finger2|handle_post_r: 0.045
    link5|handle_bar: 0.065
    link4|handle_bar: 0.070
    uflite_gripper_link|drawer_front_panel: 0.030
    uflite_gripper_link|handle_post_l: 0.035
    uflite_gripper_link|handle_post_r: 0.035
    link6|handle_post_l: 0.060
    link6|handle_post_r: 0.060
  g_by_pair_source: 'coman_r1_1_pair_gaps.yaml（R1.1，status: approved；R1 十組保存於 coman_r1_pair_gaps_proposal.yaml，未覆寫）'
  velocity_terms_kept: true
  rho_deduction_kept: true
  velocity_error_correction_kept: true
  contact_pairs:
    uflite_finger1|handle_bar:
    - engage
    - pull
    - hold
    - release
    uflite_finger2|handle_bar:
    - engage
    - pull
    - hold
    - release
  bar_stays_in_avoidance: true
  phase_map:
    note: '任務相位名稱與設定鍵**逐項明列**，不是大小寫轉換；未列出者一律 unknown ⇒ 無例外。'
    APPROACH: approach
    ENGAGE_WAIT: engage
    PULL: pull
    HOLD: hold
    RELEASE_WAIT: release
    RETREAT: retreat
    DONE: done
    contact_phases_produced: [engage, pull, hold, release]
    dropped_from_pairs_table: 'postengage —— 該相位屬**舊的軌跡重演管線**
      （gen_drawer_traj.py），本趟的產生端是狀態機政策，不產生此名稱。
      留在設定裡等於一條永不生效的規則，故移除；參照表 v0 草稿不動。'
  required_pair_rows:
    note: '一般列只保留每個取樣點的**最近**障礙物，這會在兩種情況下遮掉必要的列：
      (a) 最近者是**接觸例外**對象（兩指—橫桿），該列被刪後其他物件就沒有列；
      (b) 最近者的間距被**放寬**（R1 的十組），其他仍受一般 80 mm 規則的物件
          因此沒有列。參考位姿實測：夾爪殼對面板 39.0 mm、支柱 44.0／44.6 mm，
          link6 對支柱 66.7／68.5 mm —— 全部低於 80 mm 卻**沒有任何列**。
      因此對**所有具有放寬間距或接觸例外的連桿**，逐一補齊其餘配對。
      未列名的連桿距離算法不變。'
    pairs:
    - link4:*
    - link5:*
    - link6:*
    - uflite_finger1:*
    - uflite_finger2:*
    - uflite_gripper_link:*
    exempt:
    - uflite_finger1:handle_bar
    - uflite_finger2:handle_bar
    exempt_note: 免列＝接觸例外對象本身；它仍有一般的最近列，只在允許相位被濾掉
    wired_via: arm_link_distance.py 參數 pair_rows／pair_rows_exempt（由 run_coman_drawer20.sh 傳入，起動前檢查比對 S1
      並要求免列清單與 contact_pairs 完全一致）
  rationale:
    task_need: '設計抓取位姿下指尖距面板 27.9 mm（實測）；一般規則的總靜態間距是
      d0 + eps = 80 mm，扣除 rho 後仍擋死任務'
    selection_basis_m:
      robot_mesh_sampling: 0.002
      tracking_error: 0.0015
      engineering_reserve: 0.003   # 參考位姿的可行性預留，非誤差上界
      sum: 0.0065
    chosen: 0.01
    nominal_margin_note: '27.9 − 10 = 17.9 mm 只是**名目**幾何餘裕，非安全裕度證明；
      完整屏障下的實際餘量為 +5.34／+6.60 mm（距離當量，見 O2）——
      差異來自 rho 扣除，**不能只做名目減法**'
    not_derived_from: 歷史最小間距只用於確認可行性，**不是門檻的推導依據**
  scope_guarantee:
    verified_offline: evaluation/test_pair_exceptions.py（15 項全部通過）
    checks:
    - 手指—面板仍產生屏障列，只是總靜態間距由 d0+eps = 80 → 10 mm
    - 有接近速度時 rhs 變小 ⇒ 速度相關停止距離未取消
    - 手指—櫃體、link4—面板、link4—橫桿、底盤—橫桿：規則完全未變
    - 手指—橫桿只在允許相位免列；非允許相位與相位未知一律照一般規則
    - 接觸例外不外溢到同連桿的其他物件
    - 預設設定下所有配對一律一般規則
  consistency_required:
  - 求解器與安全層使用**同一份** d0_by_pair／contact_pairs／相位
  - '相位由求解端發布、安全層訂閱：**只保證來源一致**，
    不保證兩個節點在同一週期收到同一相位。'
  - '相位訊息攜帶**來源模擬時間**（sim_t），安全層以來源時間計齡；
    逾 contact_phase_max_age 或解析失敗 ⇒ 相位未知 ⇒ 無例外。'
  - 趟後核對兩節點的設定讀回與相位序列
time_semantics:
  task_timing: 模擬時間（拉動時長、保持時長、狀態新鮮度）
  process_watchdog: 牆鐘（僅用於程序逾時與熱監看）
