pair_avoidance:
  mechanism: 'SafetyConfig.d0_by_pair 與 contact_pairs，鍵為 ''<link>|<obstacle>''。

    預設全空 ⇒ 既有行為完全不變。相位由**求解端擁有並發布**

    （/coman/contact_phase），安全層訂閱同一份；**過期或未收到 ⇒ 無任何例外**。

    '
  d0_by_pair:
    uflite_finger1|drawer_front_panel: 0.01
    uflite_finger2|drawer_front_panel: 0.01
  velocity_terms_kept: true
  contact_pairs:
    uflite_finger1|handle_bar:
    - engage
    - pull
    - hold
    - release
    uflite_finger2|handle_bar:
    - engage
    - pull
    - hold
    - release
  bar_stays_in_avoidance: true
  phase_map:
    note: '任務相位名稱與設定鍵**逐項明列**，不是大小寫轉換；未列出者一律 unknown ⇒ 無例外。'
    APPROACH: approach
    ENGAGE_WAIT: engage
    PULL: pull
    HOLD: hold
    RELEASE_WAIT: release
    RETREAT: retreat
    DONE: done
    contact_phases_produced: [engage, pull, hold, release]
    dropped_from_pairs_table: 'postengage —— 該相位屬**舊的軌跡重演管線**
      （gen_drawer_traj.py），本趟的產生端是狀態機政策，不產生此名稱。
      留在設定裡等於一條永不生效的規則，故移除；參照表 v0 草稿不動。'
  required_pair_rows:
    note: '一般列只保留每個取樣點的**最近**障礙物。手指接近時最近者是橫桿；
      橫桿的列被接觸例外刪掉後，**任何**其他物件都可能完全沒有列 ——
      不只面板（面板 28 mm 合格，支柱 40 mm 違規卻無列可約束）。
      因此對**有接觸例外的兩根手指**，逐一補齊其餘所有非例外配對。
      其他連桿的距離算法不變。'
    pairs:
    - uflite_finger1:*
    - uflite_finger2:*
    exempt:
    - uflite_finger1:handle_bar
    - uflite_finger2:handle_bar
    exempt_note: 免列＝接觸例外對象本身；它仍有一般的最近列，只在允許相位被濾掉
    wired_via: arm_link_distance.py 參數 pair_rows／pair_rows_exempt（由 run_coman_drawer20.sh 傳入，起動前檢查比對 S1
      並要求免列清單與 contact_pairs 完全一致）
  rationale:
    task_need: 設計抓取位姿下指尖距面板 27.9 mm（實測），一般規則 d0 = 50 mm 會擋死任務
    selection_basis_m:
      robot_mesh_sampling: 0.002
      tracking_error: 0.0015
      engineering_reserve: 0.003
      sum: 0.0065
    chosen: 0.01
    nominal_margin_note: 27.9 − 10 = 17.9 mm 為**名目幾何餘裕**，非安全裕度證明
    not_derived_from: 歷史最小間距只用於確認可行性，**不是門檻的推導依據**
  scope_guarantee:
    verified_offline: evaluation/test_pair_exceptions.py（15 項全部通過）
    checks:
    - 手指—面板仍產生屏障列，只是 d0 由 50 → 10 mm
    - 有接近速度時 rhs 變小 ⇒ 速度相關停止距離未取消
    - 手指—櫃體、link4—面板、link4—橫桿、底盤—橫桿：規則完全未變
    - 手指—橫桿只在允許相位免列；非允許相位與相位未知一律照一般規則
    - 接觸例外不外溢到同連桿的其他物件
    - 預設設定下所有配對一律一般規則
  consistency_required:
  - 求解器與安全層使用**同一份** d0_by_pair／contact_pairs／相位
  - '相位由求解端發布、安全層訂閱：**只保證來源一致**，
    不保證兩個節點在同一週期收到同一相位。'
  - '相位訊息攜帶**來源模擬時間**（sim_t），安全層以來源時間計齡；
    逾 contact_phase_max_age 或解析失敗 ⇒ 相位未知 ⇒ 無例外。'
  - 趟後核對兩節點的設定讀回與相位序列
time_semantics:
  task_timing: 模擬時間（拉動時長、保持時長、狀態新鮮度）
  process_watchdog: 牆鐘（僅用於程序逾時與熱監看）
  rule: 兩者**不得混用**；求解節點須以 use_sim_time 取得模擬時間
