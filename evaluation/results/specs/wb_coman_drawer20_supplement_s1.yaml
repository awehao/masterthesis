# ---- 配對避碰：唯一的新配置 ----
pair_avoidance:
  mechanism: SafetyConfig.d0_by_link（逐**連桿**的 d0 覆寫；預設空 ⇒ 行為不變）
  override:
    uflite_finger1: 0.010
    uflite_finger2: 0.010
  rationale:
    task_need: 設計抓取位姿下指尖距面板 27.9 mm（實測），一般規則 d0 = 50 mm 會擋死任務
    error_budget_m:
      robot_mesh_sampling: 0.002        # 網格取樣格距，可能高估距離
      tracking_error: 0.0015            # 固定底座趟次 e_perp 上限
      base_motion_allowance: 0.003      # 協同案例首測，底盤運動的未知量
      sum: 0.0065
    chosen: 0.010                       # 取整並留餘裕；名目 27.9 mm 尚餘 17.9 mm
    not_derived_from: 歷史最小間距**不是**門檻的推導依據，只用來確認可行性
  limitation:
    level: 連桿層級，**不是嚴格的配對層級**
    evidence: |
      本場景中手指對櫃體的最小距離為 113.8 mm（實測），遠大於覆寫值，
      故覆寫不會波及櫃體；但換場景必須重新確認。
  consistency_required:
    - 求解器與安全層**必須使用同一份 d0_by_link**
    - 趟後由兩端的設定讀回核對，不一致即判該趟無效

# ---- 時間口徑 ----
time_semantics:
  task_timing: 模擬時間（拉動時長、保持時長、狀態新鮮度）
  process_watchdog: 牆鐘（僅用於程序逾時與熱監看）
  rule: 兩者**不得混用**；求解節點須以 use_sim_time 取得模擬時間

