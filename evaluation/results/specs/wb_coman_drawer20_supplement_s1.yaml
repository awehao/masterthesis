# ---- 本趟要分開回答的兩個問題 ----
questions:
  q1_completion: 20 mm 完整操作是否完成（接近→連接→拉開→保持→釋放→退出）
  q2_coordination: >
    操作期間是否真有底盤與手臂的協調運動，而不是只有底盤漂移。
    判定用**實測運動**：底盤線速度 > 0.005 m/s 且任一關節速率 > 0.005 rad/s 的時間比例，
    區間為首個非零命令到退出完成；**底盤位移本身不足以證明協調**。
  not_allowed: 不得為了讓同動數字好看而調權重或硬塞底盤速度
