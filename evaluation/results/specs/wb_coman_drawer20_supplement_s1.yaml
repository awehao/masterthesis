  criteria_v1_sha256_16: c9f303a8630d4d0e
  pairs_table: coman_contact_avoid_pairs_v0_draft.yaml
v1_thresholds_changed: false
pair_avoidance:
  mechanism: 'SafetyConfig.d0_by_pair 與 contact_pairs，鍵為 ''<link>|<obstacle>''。

    預設全空 ⇒ 既有行為完全不變。相位由**求解端擁有並發布**

    （/coman/contact_phase），安全層訂閱同一份；**過期或未收到 ⇒ 無任何例外**。

    '
  d0_by_pair:
    uflite_finger1|drawer_front_panel: 0.01
    uflite_finger2|drawer_front_panel: 0.01
  velocity_terms_kept: true
  contact_pairs:
    uflite_finger1|handle_bar:
    - engage
    - postengage
    - pull
    - hold
    - release
    uflite_finger2|handle_bar:
    - engage
    - postengage
    - pull
    - hold
    - release
  bar_stays_in_avoidance: true
  rationale:
    task_need: 設計抓取位姿下指尖距面板 27.9 mm（實測），一般規則 d0 = 50 mm 會擋死任務
    selection_basis_m:
      robot_mesh_sampling: 0.002
      tracking_error: 0.0015
      engineering_reserve: 0.003
      sum: 0.0065
    chosen: 0.01
    nominal_margin_note: 27.9 − 10 = 17.9 mm 為**名目幾何餘裕**，非安全裕度證明
    not_derived_from: 歷史最小間距只用於確認可行性，**不是門檻的推導依據**
  scope_guarantee:
    verified_offline: evaluation/test_pair_exceptions.py（15 項全部通過）
    checks:
    - 手指—面板仍產生屏障列，只是 d0 由 50 → 10 mm
    - 有接近速度時 rhs 變小 ⇒ 速度相關停止距離未取消
    - 手指—櫃體、link4—面板、link4—橫桿、底盤—橫桿：規則完全未變
    - 手指—橫桿只在允許相位免列；非允許相位與相位未知一律照一般規則
    - 接觸例外不外溢到同連桿的其他物件
    - 預設設定下所有配對一律一般規則
  consistency_required:
  - 求解器與安全層使用**同一份** d0_by_pair／contact_pairs／相位
  - 相位由求解端發布、安全層訂閱 ⇒ 結構上一致；仍於趟後核對設定讀回
time_semantics:
  task_timing: 模擬時間（拉動時長、保持時長、狀態新鮮度）
  process_watchdog: 牆鐘（僅用於程序逾時與熱監看）
  rule: 兩者**不得混用**；求解節點須以 use_sim_time 取得模擬時間
