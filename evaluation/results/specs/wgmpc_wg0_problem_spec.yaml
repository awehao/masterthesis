title: 全身多步控制問題定義（W-GMPC 第一層）

corrections_from_r1:
- id: C1
  what: 'r1 寫 Jacobian 的「前兩**列**」'
  fix: 應為「前兩**欄**（columns）」—— 欄對應自由度，列對應 twist 分量
- id: C2
  what: 'r1 的誤差遞推 `e_{k+1} = e_k − dt·J_B(q^nom_k) u_k`'
  fix: '**整條移除。** 改走「狀態預測 ＋ 任務誤差線性化」，
    不另外積分一套與狀態預測不一致的誤差模型。'
  why_r1_was_wrong:
  - '位置部分：固定目標下瞬時導數確實是 ė_p = −J_p B u，
    但**有限步長更新仍是一階近似** ⇒ r1 稱「位置傳播精確」是錯的。'
  - '姿態部分：**log 姿態誤差的導數一般不等於 −ω。** 還需要 log 映射自身的
    微分（右／左 Jacobian 的逆）。**只在各步重算幾何 Jacobian 補不掉這一項。**'
  reference: '幾何 Jacobian 與「經 log 微分修正的誤差 Jacobian」是兩件事
    （Pinocchio 的 inverse-kinematics 範例亦明確區分）。
    **該範例的座標慣例與本專案不同，公式不可直接照抄。**'
- id: C3
  what: r1 稱誤差為「SE(3) 誤差」
  fix: '正名為**「位置差 ＋ SO(3) log 姿態誤差」**。
    它**不是**完整的 log(T^{-1} T_des) 六維 SE(3) 誤差
    （位置與姿態分屬不同座標、未經 SE(3) 的耦合 log）。'
- id: C4
  what: r1 的 SQP 只說「換 Jacobian」
  fix: 補上**完整仿射線性化** A_k／B_k／c_k、nominal 更新規則、
    信賴區域／步長接受規則、最終非線性 rollout、QP 與 SQP 狀態分開記錄
- id: C5
  what: r1 的三個測試預期有誤
  fix: 見 tests.corrected_expectations（不可行測試、Euler 階數、符號測試）
- id: C6
  what: r1 把 gmpc._build_prediction 列為可直接重用
  fix: '**實測不符**：它寫死 `Gamma = dt·np.eye(n)` 且 `m = n`
    （狀態與輸入同維、無仿射項）⇒ **不能重用**，只能參考組裝結構。'
- id: C7
  what: r1 把 rot_error 列為可重用而未核數值行為
  fix: '**實測**：1°–179.999° 皆準，但**正好 180° 壞掉**
    （回報 182.44°、方向餘弦 0.9499；`th/(2 sin th)` 退化）。
    ⇒ 需要近 π 安全的 log 實作；**不得因無 ROS import 就視為所有角度可靠。**'
- id: C9
  what: 'r1（與本版初稿）把 `J_l^{-1}` 的近 π 問題歸為「需要近 π 安全的 log」'
  fix: '**實測後更正**：`J_l^{-1}` 用穩定形式後本身**良置**
    （179.99° 時 ‖·‖₂ = 1.5707 ≈ π/2、cond 1.5707），
    `e_r` 在 170°–180° 對垂直微擾也**連續**。
    真正的限制在**有限差分參考值**的精度與步長選擇
    —— 我一度把假警報當成公式錯誤。'
- id: C8
  what: 'r1 寫「u_prev = 0 會讓第一步不受增量懲罰」'
  fix: '**不對。** u_prev = 0 仍會懲罰第一步的增量，只是可能用了錯的歷史基準。
    首版理想模擬**明定**「初始靜止、上一命令為零」；後續用實際執行歷史。
    **不模糊排除第一步。**'

scope:
  question: '給定底盤與手臂的當前狀態，能否**一次聯合規劃未來 N>1 步的九維速度**，
    並在每次執行首步後重新規劃，使末端到達目標？'
  v1_assumptions: [已知目標, 自由空間, 理想運動學積分]
  explicitly_out_of_v1: [視覺, 摩擦抓取, 抽屜被動關節, 接觸模式, 障礙物, 避碰]
  labelling: '**首版必須標為自由空間原型。** 未加入障礙物與接觸模型之前，
    **不得宣稱已有全身避碰能力**，也不得稱為 MotM 成果。'

# ---------------------------------------------------------------- 狀態與座標
state:
  q: 'q = (x, y, θ, q1..q6) ∈ R^9'
  base: '(x, y, θ) 為 base_footprint 在 odom 的平面位姿（SE(2)）'
  arm: q1..q6 為 Lite 6 關節角（6-DOF，**不是 7**）
  dof_order: "wholebody_kinematics.DOF_NAMES =
    ['base_x','base_y','base_theta','joint1'..'joint6']"

object_axis_declaration:
  requirement: §5.9 的 WG0 門檻要求明列「接觸時物體軸 R」
  dimension: 'σ ∈ R —— 抽屜滑軌開度（單一移動自由度）'
  status_in_v1: '**不含**。v1 狀態維持 R^9。'
  nature_when_added: '**被動狀態或由抓取約束耦合的輔助決策，不是可任意命令的
    致動器**（§5.9 要點 4）。加入後狀態為 (q, σ) ∈ R^10，
    但控制向量**不得**多一個 σ̇。'
  closure_relation_deferred: 閉合／耦合關係屬 WG3；未定義前不得稱接觸模型就緒

control:
  u: 'u = (v_x^B, v_y^B, ω, q̇1..q̇6) ∈ R^9'
  base_frame: '**本體座標**（與 adapter 的 world_to_body9、E2 的 step() 一致）'

frame_coupling_CRITICAL:
  fact: '展開 URDF 裡 `base_x`／`base_y` 是**世界軸**平移關節
    （axis 1 0 0、0 1 0），且在鏈上位於 `base_theta` **之前**。
    因此 `jacobian()` 的**前兩欄**對應世界平移速度，不是本體平移速度。
    **實測**：J[:3, 0] = [1,0,0]、J[:3, 1] = [0,1,0]。'
  mapping: 'q̇ = B(θ) u，  B(θ) = blkdiag(Rz(θ)_{2×2}, 1, I_6)
    ⇒ TCP twist V^w = J(q) B(θ) u ≜ J_B(q) u'
  must_not: '**直接用 J(q) 乘本體 u 就是 frame 錯誤**（第一次 MPC 嘗試的已記錄教訓）。
    WG1 必須有專門反例測試：故意省略 B(θ) 時測試要失敗。'

# ------------------------------------------------- 離散預測模型（理想運動學）
discrete_model:
  nonlinear: 'q_{k+1} = f(q_k, u_k) = q_k + dt · B(θ_k) u_k   （顯式 Euler）'
  expanded:
  - 'x_{k+1} = x_k + dt (cosθ_k v_x^B − sinθ_k v_y^B)'
  - 'y_{k+1} = y_k + dt (sinθ_k v_x^B + cosθ_k v_y^B)'
  - 'θ_{k+1} = θ_k + dt ω'
  - 'q_{arm,k+1} = q_{arm,k} + dt q̇'
  nonlinearity_source: 唯一非線性來自 B(θ_k) 的 θ_k；手臂部分**嚴格線性**
  integrator_error:
    local: '**O(dt²)**（光滑情況下的單步局部誤差）'
    global_fixed_horizon: '固定總時間下的全域誤差為 **O(dt)**'
    r1_was_wrong: r1 把局部誤差寫成 O(dt)，錯了
  excluded: [動力學, 輪滑移, 接觸, 抽屜被動關節, 執行端命令年齡與延遲]

affine_linearisation:
  form: 'q_{k+1} ≈ A_k q_k + B_k u_k + c_k，於 (q^nom_k, u^nom_k) 展開'
  A_k: 'A_k = ∂f/∂q = I_9 + dt · M_k，M_k 只有第 3 欄（θ）非零：
    M_k[0, 2] = −sinθ^nom_k · v_x^nom − cosθ^nom_k · v_y^nom
    M_k[1, 2] =  cosθ^nom_k · v_x^nom − sinθ^nom_k · v_y^nom
    其餘為 0。'
  A_k_meaning: '**這一項就是「朝向改變會影響未來平移方向」。
    不得直接忽略。**（r1 沒有寫出它）'
  B_k: 'B_k = ∂f/∂u = dt · B(θ^nom_k)'
  c_k: 'c_k = f(q^nom_k, u^nom_k) − A_k q^nom_k − B_k u^nom_k   （仿射補償項）'
  note: 因決策是**絕對控制**，c_k 必須明確帶上；否則線性化在 nominal 附近不自洽

# ------------------------------------------- 任務誤差（位置差 ＋ SO(3) log）
task_error:
  name: '**位置差 ＋ SO(3) log 姿態誤差**（**不是**完整 SE(3) log）'
  tcp_pose: 'T(q) = FK(q, tcp) ∈ SE(3)；p(q)、R(q) 為其位置與旋轉'
  definition: 'e(q) = [ e_p ; e_r ] ∈ R^6
    e_p = p_des − p(q)                （**世界**座標）
    e_r = log( R(q)^T R_des )^∨       （**本體**座標）'
  frame_change_from_r1: 'r1 把姿態誤差再左乘 R(q) 轉到世界軸。
    **本版改為留在本體座標**，因為這樣 ∂e_r/∂q 只有一項
    （世界版會多一個 ∂R/∂q 的項）。
    Q 為**區塊對角** ⇒ 兩個區塊各自加權，不混座標。'
  H_k:
    definition: 'H_k = ∂e/∂q |_{q^nom_k} ∈ R^{6×9}'
    position_block: '∂e_p/∂q = −J_p(q)   （世界位置 Jacobian；**導數精確**，
      但有限步長的 e 更新仍是一階近似）'
    orientation_block: '∂e_r/∂q = −J_l(e_r)^{-1} · R(q)^T · J_ω(q)
      其中 J_l 為 SO(3) 在 e_r 的**左 Jacobian**，
      J_ω 為幾何 Jacobian 的角速度列（世界軸），R^T 把它轉到本體。'
    this_is_the_r1_gap: '`J_l(e_r)^{-1}` **就是 r1 漏掉的 log 微分修正**。
      少了它，大姿態誤差下的線性化會偏。'
    v1_options:
    - '解析式（如上）'
    - '**純有限差分**（9 欄 × 每欄一次 FK）—— 首版允許，作為備案；
      其成本必須量測並記錄（見 tests.t4）'
    mandatory_cross_check: '**H_k 一律要與有限差分交叉驗證，且必須包含大姿態誤差
      （至少 150°、170°），不只測接近零的情況。**'
    Jl_inv_stable_form: '**必須用 a = 1/θ² − cot(θ/2)/(2θ)**
      （即 cos(θ/2)/(2θ sin(θ/2))），**不可用** (1+cosθ)/(2θ sinθ) ——
      後者在 θ→π 是兩個趨零量相除，會抵銷掉有效位數。
      **實測**：穩定形式下 ‖J_l^{-1}‖₂ 隨 θ→π 平滑趨近 π/2
      （179.99° 時 1.5707、cond 1.5707）⇒ **J_l^{-1} 本身良置，不是奇異點。**'
    near_pi_measured_NARROWED: '實測 e_r 在 170°–180° 對**垂直於轉軸**的微擾連續
      （方向變化 0.0003°）。**此結論僅限該擾動方向**，
      **不可推論「π 附近對所有擾動都連續」** —— 見 branch_crossing_measured。'
    branch_crossing_measured: '**沿同一軸跨 π 會換向**（實測）：
      180.00° → 180.01° 的主值 log 向量相差 **359.99°**；
      正好 π 時 exp(+π·ax) 與 exp(−π·ax) 是**同一旋轉**
      （‖Δ‖_F = 3.5e-16），log 只能回其中一個表示；
      沿軸中央差分在正好 π 給出範數 **314157**（≈ π/h）而非 1。
      ⇒ `J_l^{-1}` 良置**不等於**主值 log 沒有分支問題。'
    branch_policy_v1:
      small_angle: '小角度用**穩定級數**（I − ½Φ + Φ²/12），避免 1/θ² 的抵銷'
      near_pi_eval: '近 π 用**穩定 log 求值**（主值；軸由 (R+I)/2 的主特徵向量定，
        符號由 skew 部分挑）'
      at_pi_and_crossing: '**正好 π 與跨分支不要求一般中央差分一致。**
        測試在該處只核**單點求值**與分支處置，不核差分。'
      applicable_range: '解析 H_r 的差分驗證適用範圍：**θ ≤ 179.9°**
        （實測相對偏差 4.5e-6，h = 1e-5）。179.99° 受參考值精度限制（7.5e-4）。
        θ ≥ 180° 不在差分驗證範圍內。'
      no_further_sweep_required: 本項為規格補充，**不要求再開一輪大角度掃描**
    fd_step_must_match_angle: '**有限差分步長必須配合角度。** 實測：
      179.9° 用 h = 1e-7 得相對偏差 4.3e-4（**假警報**），
      改 h = 1e-5 則為 4.5e-6。原因是 θ/(2 sin θ) 在近 π 放大抵銷誤差。
      **測試若不指定步長，會把正確的公式判成錯的** —— 本次就發生過。'
    eigenvector_branch_not_a_reference: '以 (R+I)/2 的主特徵向量定軸的近 π 分支
      **不可作為有限差分的參考值**：軸的符號選擇在 q±h 之間不保證一致，
      實測相對偏差 4.1e-1。它可用於單點求值，不可用於差分。'
    verification_limit: 'θ ≥ 179.99° 的交叉驗證**受參考值精度限制**
      （最佳 7.5e-4），**不是公式的問題**。測試門檻要按角度分段並註明原因。'
    rot_error_not_usable_large: '**實測既有 `arm_pregrasp.rot_error` 在正好 180°
      壞掉**（回報 182.44°、方向餘弦 0.9499）⇒ 不得用於大角度；
      可作 ≤ 179° 的交叉核對基準。'
  linearised_error: 'e_k ≈ e(q^nom_k) + H_k (q_k − q^nom_k)
    ⇒ 成本中的 e_k 是 z 的**仿射函數**（經 A_k／B_k／c_k 的狀態預測串接）'
  no_separate_error_recursion: '**不再維護獨立的誤差遞推。**
    誤差一律由「狀態預測 → 在 nominal 線性化」得到，
    與 discrete_model 同一套模型，不會不一致。'
  sign_convention: 'e 定義為**要被驅動到零的誤差**。符號慣例由測試固定
    （見 tests.corrected_expectations.sign）。'

implementation_contract:
  note: '**四項實作契約**，與開發配置一併定版。
    沒有它們，可能出現「測試通過、接受邏輯卻錯了」。'
  c_pi_branch: '近 π 數值穩定 **≠** 跨 π 沒有分支問題。
    見 task_error.H_k.branch_crossing_measured 與 branch_policy_v1。
    正好 π／跨分支**不要求**一般中央差分一致；另記分支處置與適用範圍。'
  c_sqp_acceptance: '**不把「沒有下降」或「步長很小」直接判成失敗／收斂。**
    見 solve_flow.trust_region.measure_before_overwrite、
    solve_flow.sqp_status（五種結果分開）、
    solve_flow.output_policy_fixed（固定政策）、
    solve_flow.final_check_target（檢查實際回傳序列）。'
  c_tests_narrowed: '預測一致性拆成 t3a（要求相等）與 t3b（量線性化誤差，不要求相等）；
    符號測試只用**限制不活躍**的小測例，且 e 與 H 同時取負是**不變**的。'
  c_u_prev: '**u_prev 每輪更新**（見 cost.u_prev_update_every_cycle），
    理想閉迴路也一樣。'

formula_verification_20261001:
  tool: evaluation/wg0_math_check.py（**不開模擬器、不用 GPU、不接 ROS**）
  status: 全部成立
  B_theta: 'θ ∈ {0, π/2, −1.234}：本體 +x 得世界 (cosθ, sinθ) —— 相符'
  A_k_B_k_c_k:
    A_k_vs_fd: 三組隨機 (q,u)，max|Δ| ≤ 7.0e-10
    B_k_vs_fd: max|Δ| ≤ 3.1e-10
    affine_self_consistency: 'f(q,u) = A q + B u + c，max|Δ| < 1e-12'
    theta_column_magnitude: '|A[0:2, 2]| 實測 0.0090／0.0218／0.0235
      ⇒ **非零，忽略它會偏**（反例成立）'
  H_k_orientation_block:
    formula: '−J_l(e_r)^{-1} · R^T · J_ω'
    verified_angles_rel_err: {0.5deg: 1.0e-9, 30deg: 1.7e-9, 90deg: 1.3e-9,
                              150deg: 9.3e-9, 170deg: 9.1e-8, 179deg: 6.1e-6,
                              179.9deg: 4.5e-6, 179.99deg: 7.5e-4}
    omitting_Jl_inv_rel_dev: '**省略 log 微分修正的偏差**（實測）：
      0.5° → 0.37 %、30° → **20.5 %**、90° → 59.8 %、
      150° → 114 %、170° → 122 %、179° → 134 %。
      ⇒ **30° 就已經兩成偏差**，這一項不是小修正。'
  H_k_position_block: '−J_p vs 有限差分 max|Δ| 3.0e-10'
  euler_local_order: 'dt = 0.08 → 0.01 的單步局部誤差比值**連續三次都是 4.00**
    ⇒ **O(dt²) 確認**（對照常數本體速度下 SE(2) 的精確積分）'
  infeasible_cases:
    a_velocity_vs_acceleration: '|u_prev| − a_max·dt = 0.175000 > u_max = 0.035255
      ⇒ 兩框無交集'
    b_joint_position: '超界量 0.074993 > dt·V_a = 0.049995
      ⇒ k = 1 的位置列單步修正不足 ⇒ 無解。
      **r1 原本的案例（超界 0.01）是可行的**，已更正。'

# -------------------------------------------------------------- 決策與維度
decision:
  variable: 'z = [u_0; …; u_{N-1}] ∈ R^{9N}（**絕對控制**）'
  coupling: 預測步之間由 affine_linearisation 耦合
  executed: '**只執行 u_0**；完整序列保留作下輪暖啟動'
  N_gt_1_required: 'N > 1 是本層驗證對象；N = 1 作為消融保留'

# ------------------------------------------------------- 成本與單位尺度
cost:
  form: 'J = Σ_{k=1}^{N} e_k^T Q_k e_k + Σ_{k=0}^{N-1} u_k^T R u_k
         + Σ_{k=0}^{N-1} Δu_k^T S Δu_k'
  terminal: 'Q_k = Q（k < N）、Q_N = Q_f'
  increment: 'Δu_k = u_k − u_{k−1}，u_{−1} := u_prev'
  u_prev_v1: '**u_prev = 0 只適用於第一次求解。** 首版理想模擬明定
    「初始靜止、上一命令為零」⇒ 第一輪 u_prev = 0。
    這**仍然會懲罰第一步的增量**（基準是真實的靜止狀態，不是錯的歷史）。'
  u_prev_update_every_cycle: '**首版理想閉迴路也必須在每輪執行首步後更新
    u_prev ← 該輪實際執行的 u_0。**
    **不能等接 Isaac 才用歷史命令** —— 否則 WG1 的加速度限制與平滑成本
    每輪都會錯把機器人當成從靜止開始，等於這兩項在閉迴路裡形同失效。'
  u_prev_later_stages: 接實際執行後改用**實際已套用**的首步（可能經下游修改），不是請求值
  scaling_RULE: 'e 與 u 都是混合單位 ⇒ 權重一律寫成「無量綱權重 ÷ 參考尺度平方」'
  Q_scaling: 'Q = blkdiag( w_p / L_p² · I_3 , w_r / L_r² · I_3 )，L_p = 1 m、L_r = 1 rad'
  R_scaling: 'R = blkdiag( w_bt / V_bt² · I_2 , w_br / V_br² , w_a / V_a² · I_6 )
    V_bt = 0.035255 m/s、V_br = 0.199900 rad/s、V_a = 0.999900 rad/s
    ⇒ 各分量以**自己的限制**正規化；權重 1 = 飽和代價相同。
    三個數取自已核准的 L1（coman_low_speed_box_l1.yaml）。'
  S_scaling: S 與 R 同一套正規化，另乘無量綱 w_s
  pending_config: [w_p, w_r, w_bt, w_br, w_a, w_s, Qf 倍率]

# ------------------------------------------------------------------ 限制
constraints:
  velocity_box:
    form: '|u_k| ≤ u_max，逐軸，k = 0..N-1'
    v1_values: 底盤平移逐軸 0.035255 m/s、角速度 0.199900 rad/s、各關節 0.999900 rad/s
    inscribed_box: '√2 × 0.035255 = 0.049858 < 0.05 ⇒ 滿足 E2 的平面**範數**門檻。
      範數本身是二階錐，QP 用內接方框作**保守**的線性替代。'
  acceleration: '|u_k − u_{k−1}| ≤ a_max · dt，u_{−1} = u_prev'
  joint_position:
    form: 'lo + m_j ≤ q_{arm,0} + dt Σ_{j<k} q̇_j ≤ hi − m_j，k = 1..N'
    exactness: '**嚴格線性**（手臂積分無非線性）⇒ 逐步皆為精確列，不需線性化'
  wheel_level:
    form: '|W u_{base,k}| ≤ r·ω_max 與 |W (u_{base,k} − u_{base,k−1})| ≤ r·α_max·dt'
    W: 'gmpc.wheel_matrix（已核：4×3 = [[0,1,L],[-1,0,L],[0,-1,L],[1,0,L]]）'
    v1_values: r = 0.05 m、L = 0.245 m、ω_max = 5.55 rad/s、α_max = 125 rad/s²
    in_qp_not_after: '**輪級列必須在 QP 之內。** 見 reuse.post_solve_projection_ban。'
  NOT_imposed:
    base_position: '**不施加** URDF 的 base_x／base_y ±2.5 m —— 虛擬關節建模產物'
    barrier_rows: 'v1 **完全沒有**避碰列（自由空間原型的定義，不是避碰通過）'

# ------------------------------------------------- 線性化與 SQP 求解流程
solve_flow:
  per_cycle:
  - '1. 取狀態快照 (q_0, u_prev)。**單一快照，整輪不更新**；核心不訂閱任何東西。'
  - '2. nominal 初始化：u^nom = shift(上一輪最終解)，末步複製；首輪 u^nom = 0。'
  - '3. 以 discrete_model（**非線性**）依 u^nom 從 q_0 rollout 得 q^nom_0..N。'
  - '4. 在每個 (q^nom_k, u^nom_k) 算 A_k、B_k、c_k；在每個 q^nom_k 算 e(q^nom_k) 與 H_k。'
  - '5. 組 QP 並求解，得候選 z*。'
  - '6. **步長接受**（見 trust_region）。接受則 u^nom ← 接受後的控制序列。'
  - '7. 重複 3–6 至多 n_sqp 次，或達到 sqp_stop 條件。'
  - '8. **最終非線性 rollout**：用最終控制序列重跑 discrete_model，
      得回傳的預測狀態（見 returned_prediction）。'
  - '9. 接受判定（見 accept）。只取 u_0 回傳。'
  relinearisation_rule: '每個預測步都重算 A_k／B_k／c_k 與 H_k，**不是只在 q_0 算一次**'
  trust_region:
    v1_rule: '**明訂信賴區域**：對每步加線性列 |u_k − u^nom_k| ≤ Δ（逐軸、∞ 範數）'
    measure_before_overwrite: '**更新大小 ‖u_cand − u^nom‖_∞ 與成本差
      ΔJ = J_nl(cand) − J_nl(nom) 都在**覆寫 nominal 之前**計算。**
      覆寫後再量會把基準換掉，量到的不是這一步的進展。'
    acceptance_rule: '以**非線性** rollout 算真實成本 J_nl
      （同一成本式，但用非線性模型與真實 e(q_k)，不用線性化近似）。
      **接受條件：ΔJ ≤ tol_accept**（注意是 ≤，含等號與 tol_accept 的容許量）
      ⇒ **已在最佳點的零更新會被接受，不會被誤判為失敗。**
      接受後放大 Δ（×γ_up，上限 Δ_max）；
      ΔJ > tol_accept ⇒ 拒絕該候選、縮小 Δ（×γ_dn）後重試，計入 n_sqp。'
    why_not_strict_decrease: '若寫「成本不下降就拒絕」，
      **已在最佳點的零更新也會被拒絕** —— 那不是失敗。'
  sqp_status:
    must_distinguish: '**五種結果必須分開，不可混為「成功／失敗」：**'
    converged_step: '‖Δu‖_∞ ≤ tol_step **且 Δ ≥ Δ_min_conv**
      ⇒ 步長小是因為已近最佳，不是因為信賴區域被縮死'
    converged_cost: '接受的步其 |ΔJ| / max(1, |J_nl|) ≤ tol_cost
      **且 Δ ≥ Δ_min_conv**'
    no_progress: 候選連續被拒但 Δ 仍 > Δ_min_conv（**不是收斂**）
    trust_region_exhausted: 'Δ 縮到 < Δ_min_conv（**不是收斂**）'
    iter_limit: 用盡 n_sqp（**不是收斂**）
    qp_failed: 任一次 OSQP status 非 solved 或殘差核對未過
    small_step_rule: '**信賴區域造成的小步長，不單獨作為收斂證據。**
      converged_step／converged_cost 都附帶 Δ ≥ Δ_min_conv 的條件。'
  output_policy_fixed:
    rule: '**政策固定，不留給實作者臨場決定：**'
    on_iter_limit_or_no_progress_or_tr_exhausted:
      '若**有至少一個被接受的候選**且其最終接受檢查通過
       ⇒ **輸出該序列**，並回報 `sqp_converged = false` 與對應的 sqp_stop_reason。'
    on_no_accepted_candidate:
      '若**從未接受任何候選** ⇒ 回 `no_valid_solution`
       （reason = `no_accepted_candidate`）。
       **不得把暖啟動序列冒稱為新求解成功。**'
    on_qp_failed: 回 no_valid_solution（reason = qp_failed）
  final_check_target: '**最終接受檢查針對實際要返回的完整控制序列
    及其非線性 rollout**，不是只檢查最後一個 QP 候選。
    被拒絕的候選不得進入最終檢查。'
  sqp_pending_config: [Δ_0, Δ_max, Δ_min_conv, γ_up, γ_dn,
                       tol_accept, tol_step, tol_cost]
  returned_prediction:
    requirement: '回傳的預測狀態**必須是最終控制序列的非線性 rollout 結果**，
      **不得**只回傳最後一次求解前的 nominal。'
    why: 兩者不同；回傳 nominal 會讓診斷與實際執行的比較失去意義
  status_recording:
    separate: '**QP 成功**與 **SQP 是否達到停止條件**要分開記錄。'
    not_convergence: '**固定跑完 n_sqp 不代表非線性問題已收斂。**'
    fields: [osqp_status（逐次迭代）, n_sqp_used, sqp_stop_reason,
             J_nl 逐次值, Δ 逐次值, 接受／拒絕次數]
  accept:
    required:
    - 'OSQP status = `solved`（**首版只接受 solved**）'
    - '逐列約束殘差 ≤ r_tol（**自己核**，不只信 status）'
    - 'u_0 逐項在速度框、加速度框與輪級列內'
    not_auto_accepted: "'solved inaccurate' 由**狀態閘**拒絕（首版策略）。
      注意：它**不一定**違反殘差門檻 ⇒ 殘差核對**不能**代替狀態閘，
      兩道檢查各自獨立（見 tests.t2）。"
    recorded_not_enforced: 預測 |e_N| 與 |e_0| 的比較只記錄，不作接受條件
  pending_config: [N, dt, n_sqp, r_tol, m_j, 底盤 a_max, QP 形式, 積分器階數]

# ------------------------------------------------------------- 失敗處置
failure_handling:
  on_failure: '**不輸出命令**，回傳 `no_valid_solution`'
  payload: [osqp_status 逐次, 逐列最大殘差, 違反的約束類別, 分段耗時,
            N, n_sqp_used, sqp_stop_reason, J_nl 軌跡, Δ 軌跡]
  must_not:
  - '**不退回無約束解**（已記錄：`_constraints` 回 None 曾讓無約束答案通過並報成功）'
  - 不放寬任何限制
  - 不沿用上一筆命令假裝有解
  - 不自動降低 N／dt 來湊出可行解（v1 不做降級）
  caller_contract: 核心只回報「無有效解」；**停止處置屬呼叫端**

# ------------------------------------------------------------- 測試設計
tests:
  t1_model_and_derivatives:
  - 'A_k／B_k／c_k 對有限差分一致：隨機 (q, u)，逐欄比對 ∂f/∂q、∂f/∂u，
    並驗 f(q^nom, u^nom) = A q^nom + B u^nom + c（仿射項自洽）'
  - '**A_k 的 θ 欄反例**：把 M_k 置零（忽略「朝向改變影響未來平移方向」）
    ⇒ 多步預測對比非線性 rollout 必須出現可量測偏差，測試要抓到'
  - '**H_k 對有限差分一致，且必須含大姿態誤差**：至少 0.5°／30°／90°／150°／170°／
    179°／179.9°／179.99°。
    **有限差分步長必須按角度指定**（實測 179.9° 需 h = 1e-5；h = 1e-7 會假警報），
    且門檻按角度分段（≥179.99° 受參考值精度限制，門檻放寬並註明原因）。'
  - '**省略 J_l^{-1} 的反例**：實測 30° 就有 20.5 % 偏差、150° 達 114 %
    ⇒ 測試要能在中等角度就抓出這個缺項，不只在極大角度。'
  - '**B(θ) 反例**：故意省略 B(θ)（直接用 J 乘本體 u）⇒ 測試必須失敗'
  - 'log／J_l^{-1} 的近 π 安全性：既有 rot_error 在 180.0° 實測回報 182.44°、
    方向餘弦 0.9499 ⇒ **該實作不得直接用於本測試**，需近 π 安全版本'
  t2_constraints_and_failure:
  - 逐步逐列核對 u_k、Δu_k、q_arm,k、輪級列全部在界內
  - '**不可行測試（已更正）**：見 corrected_expectations.infeasible'
  - "**狀態閘測試**：注入 `solved inaccurate` ⇒ 必須被**狀態閘**拒絕
    （**不假設**它違反殘差門檻）"
  - "**殘差核測試**：注入「回報 `solved` 但解違反約束」⇒ 必須被**殘差核對**擋下。
    與上一項**分開測**，兩道檢查互不替代。"
  t3_prediction_consistency_and_reaching:
  - '**t3a 回傳 rollout 的可重播性**：回傳的非線性 rollout
    與「同初值 q_0、同完整控制序列 u_0..u_{N-1}」的**獨立重播**應一致
    （到積分容差）。**這是要求逐值相等的那一項。**'
  - '**t3b 線性化誤差（量，不要求相等）**：QP 的仿射預測
    （A_k, B_k, c_k 串接）與非線性 rollout **本來就可能不同**。
    本項**量這個差距的大小**（逐步、逐分量），
    **不要求逐值相等** —— 它是線性化誤差的指標，不是錯誤。'
  - '**滾動閉迴路下一輪改了控制後，後續軌跡不必等於上一輪預測
    —— 那不是積分錯誤**，不得作為一致性判準。'
  - 自由空間已知目標、理想積分閉迴路：到達容差與步數
  - 多組起始位姿與目標，含需大幅轉身者（檢驗逐步線性化與 A_k 的 θ 欄）
  t4_cost_vs_horizon:
  - 'N ∈ {1, 5, 10, 20}（具體集合待定）下的分段耗時與 OSQP 迭代數'
  - '分段：H_k 組裝（含是否用有限差分）／A_k,B_k,c_k 組裝／QP 組裝／QP 求解／
    非線性 rollout —— **逐項分開**'
  - '**N = 1 消融**：與現有單步 RMRC 的到達步數與路徑比較'
  - 'O6 的教訓：**從第一天就量**。main6 實測 qp_ms 佔 solve_ms 約 85 %
    ⇒ 預期 QP 本身是主成本。'
  - '**不預設能達到 20 Hz**；先量測再決定實作，不先放寬控制週期。'
  corrected_expectations:
    infeasible:
      r1_wrong: 'r1 寫「遠目標 ＋ 緊限制必須不可行」。
        **目標只在軟成本裡，遠目標通常仍有可行解。**'
      correct: '要建立**互相衝突的硬約束**，並交代矛盾的算術原因。指定兩個案例：
        (a) 速度框與加速度框衝突：令 |u_prev| − a_max·dt > u_max
            ⇒ |u_0| ≤ u_max 與 |u_0 − u_prev| ≤ a_max·dt 無交集；
        (b) 關節位置框衝突：令 q_arm,0 本身落在 [lo+m_j, hi−m_j] 之外
            ⇒ k = 1 的位置列在 dt·q̇ 的可達範圍內無法滿足。
        兩案都要回 no_valid_solution 且**沒有任何命令輸出**，
        並在 payload 指出違反的約束類別。'
    euler_order:
      r1_wrong: 'r1 寫「dt 減半，單步誤差減半」'
      correct: '光滑情況下**單步局部誤差為 O(dt²)** ⇒ dt 減半約變**四分之一**。
        **固定總時間的全域誤差才是 O(dt)**（減半約變一半）。
        兩者分開測，並明示所測的是哪一個。'
    sign:
      r1_wrong: 'r1 寫「反號必須收斂到對極點」。**對極點不是普遍結果。**'
      r2_still_too_broad: '把 e^T H B u_0 < 0 套到**每個**受限最優解也不對 ——
        受限或平滑成本（R、S、信賴區域）影響下，
        **首步不保證讓即時追蹤誤差下降**。'
      correct: '用**刻意設計的小測例**驗下降方向，條件明列：
        (a) 誤差梯度非零；(b) **所有限制不活躍**（速度框、加速度框、
        關節位置、輪級、信賴區域都有餘裕）；(c) R、S 權重設到足夠小。
        在該測例下檢查 e^T H_0 B_0 u_0 < 0。
        **不套用到一般受限最優解。**'
      double_negation_is_invariant: '**把 e 與 H 同時取負，平方成本不變
        ⇒ 控制結果應相同。** 這本身不是錯誤。
        測試真正要抓的是**「誤差與其導數符號不一致」**
        （只負其中一個），不是單純的負號。'

# -------------------------------------------- 可重用（已收窄）
reuse:
  verified_pure_no_ros: [wholebody_kinematics.py, arm_limits.py, arm_pregrasp.py,
                         gmpc.py, arm_link_geometry.py, wb_wheel_limit.py,
                         coman_low_speed_box.py, arm_poses.py]
  reusable_item_by_item:
    wholebody_kinematics.py: 'WholeBodyKinematics、fk、jacobian、joint_limits、
      velocity_limits（已核：9 自由度、J 為 6×9、前兩欄為世界平移單位向量）'
    arm_limits.py: 'LITE6_SAFE（已核：6 維、速度 π、加速度 19.984）'
    gmpc.wheel_matrix: 已核 4×3 與數值；可直接重用
    gmpc_weight_assembly: '`_build_Q_bar`／`_build_R_bar`／`_build_smoothness_terms`
      為通用權重組裝，可逐項重用（與狀態／輸入維度無關的部分）'
    coman_low_speed_box.py: tighten_vmax、e2_compat_violations（L1 單一來源）
  NOT_reusable:
    gmpc._build_prediction: '**不能重用。** 實測它寫死
      `Gamma[i,i] = dt·np.eye(n)` 且 `m = n`（狀態與輸入同維、無仿射項 c_k）。
      本次模型 B_k = dt·B(θ^nom_k)、且有 c_k ⇒ WG1 必須自己寫支援
      **逐步 A_k, B_k, c_k** 的預測組裝。可參考其前綴乘積結構。'
    arm_pregrasp.rot_error: '**不得直接用於大角度。** 實測 180.0° 失效
      （182.44°、方向餘弦 0.9499）。WG1 需近 π 安全的 log；
      rot_error 可作 ≤ 179° 的交叉核對基準。'
  post_solve_projection_ban:
    rule: '**`fit_to_wheels`／`limit9` 不得在求解後偷偷修改首步，
      再把修改結果當成原最佳解。**'
    how_v1_does_it: '輪級限制以線性列放進 QP 之內。
      求解後**可以**用 fit_to_wheels／limit9 作**診斷核對**，
      但若它們會改動 u_0，該輪即判**失敗**（回 no_valid_solution），
      **不是**悄悄修好後送出。'
  must_not_enter_core:
    any_node: 所有 `*_node.py`
    wholebody_pregrasp.py: Node ＋ 兩個 executor 同轉一節點 ＋ `_on_pts` 競爭（F18）
    coman_pull_solver_node.py: 同上；含 `_pump` 排程
    execution_framework: '**整套執行框架不沿用**：rclpy Node、
      MultiThreadedExecutor、ReentrantCallbackGroup、
      TransformListener(spin_thread=True)、`_pump`、跨執行緒共享可變狀態'
    wb_cmd_chain_e2.py: 屬**執行介面**（整筆拒收、_fail 閂鎖），不屬規劃核心
  partial_only:
    wholebody_safety_filter.py: '純數值但與 SafetyConfig／pair_gap／contact_pairs／
      屏障語意綁在一起。**WG1 自己寫限制列**；測試中可 import 作交叉核對，
      核心不依賴 —— 避免把接觸語意提前帶進自由空間原型。'

# -------------------------------------------- §5.9 對應
plan_5_9_compliance:
  must_be_one_joint_solve: '**不把底盤 horizon 與手臂單步分開求完再拼接；
    不把同一個單步 QP 重複呼叫 N 次當成全身時域最佳化。**（要點 1）
    單一 z ∈ R^{9N}、單一 QP。採凝縮**仍須能還原**九維序列與預測狀態
    ⇒ 回傳值必含完整 u_0..u_{N-1} 與最終非線性 rollout 的 q_0..N。'
  not_globally_convex: '非線性 FK、旋轉誤差使原問題**不必然凸**。
    採局部線性化／序列 QP，每個 QP 符合 OSQP 要求，
    **不得據此聲稱整個問題已成全域凸問題。**（要點 2）'
  consistent_frames_and_relinearisation: '幾何誤差與擾動用一致的 frame／排列／log
    微分；模型與 Jacobian **在預測構形上重算**（要點 3）。
    本版並明確區分**幾何 Jacobian** 與**經 log 微分修正的誤差 Jacobian H_k**。'
  no_copying_current_rows_forward: v1 無避碰列；加入時不得把當前距離列複製到全部未來步
  execution_boundary: '記錄請求／修改後／實際套用命令、下輪由**量測狀態**初始化、
    不預設濾波修改後仍符合原預測 —— 屬 **WG2**。WG1 不接執行鏈。'
  low_load_offline_first: v1 不開模擬器；物理驗證須環境正常且使用者在機旁確認

naming_limits_from_5_9:
  wg1_alone: WG1 通過**只**代表「全身多步求解器的數值行為成立」
  wg2_phrase: '**只有 WG2 完成**才可稱「W-GMPC 自由空間核心已驗證」'
  wg3_wg4: '**WG3／WG4 未完成，不得宣稱已具備接觸 MotM 的核心證據**'
  threshold_not_auto: 具體數值門檻須在看該輪結果**之前**另訂
  what_passing_means: 只指**限定模型／任務範圍的核心版本**

concurrency_position:
  statement: '**WG1 為單執行緒純數值核心**：不訂閱、不發布、無背景執行緒、
    無跨執行緒共享可變狀態。輸入固定狀態快照，輸出資料結構。'
  f18_not_resolved: '**F18 不能只因局部變數能消掉那次例外，就算整個並行問題解決。**
    同一節點被兩個 executor 轉、其餘共享可變狀態是否還有競爭，**未核**。
    WG1 以「不沿用該框架」**迴避**，不是解決。'

development_config:
  requirement: '**開始測 WG1 之前**必須先落定一份明確的開發配置，
    填入時域、步長、權重、容差、加速度界限與 SQP 更新策略。
    **標成開發值即可，不冒稱已驗收。**'
  must_be_filled_before_t1: true
  items: [N, dt, n_sqp, w_p, w_r, w_bt, w_br, w_a, w_s, Qf 倍率, r_tol,
          m_j, 底盤 a_max, QP 形式, 積分器階數,
          Δ_0, Δ_max, γ_up, γ_dn, tol_step, tol_cost, 測試容差]
  not_now: 本輪不掃參數；只要求在第一輪測試前有一份落定的開發值

wg1_deliverables:
- 完整九維控制序列與**最終非線性 rollout** 的預測狀態
- 'QP 狀態（逐次迭代）、SQP 停止原因、逐列約束殘差、分段耗時（逐項）'
- 首步控制；失敗時明確的 no_valid_solution 結果
- t1–t4 的實測輸出

explicitly_not_in_wg1: [視覺, 接觸, 障礙物, 避碰, ROS 接線, Isaac, 錄影,
                        抽屜任務, 摩擦抓取]
