  t3a_rollout_replay: 0.0（要求相等 ⇒ 通過）
  t3b_linearisation_error_recorded_only:
    max_abs_state: 2.220e-16
    max_abs_base_xy: 3.469e-18
    max_abs_theta: 0.0
    note: '**只記錄不設門檻。** 此處極小是因為線性化點就是回傳序列本身
      （最終 rollout 與對該序列的仿射展開一致）；
      **這不代表 SQP 迭代中的線性化誤差也這麼小**。'
  closed_loop:
  - {case: 小位移 ＋ 20°, cycles: 13, pos_mm: 1.93, rot_deg: 0.036, reached: true}
