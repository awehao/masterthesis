三、增廣狀態模型:
  檔案: src/ammr_wholebody_mpc/ammr_wholebody_mpc/wgmpc_core_sp.py（新檔）
  狀態: 'z = [q (9) ; s (6)] ∈ R^15，s = 手臂位置設定點'
  控制: 'u ∈ R^9 **維度不變**；s 只能由 u 的手臂分量驅動，**不是新增六個致動自由度**'
  控制步映射: >-
    把每物理步的關係式連乘 kp = dt_c/dt_p = 5 次，得閉式且**嚴格線性**的
    x_next = P⊙x + Q⊙s + G⊙u_a + h、s_next = s + u_a·dt_c，其中
    β = 1−α、P = β^kp、Q = 1−β^kp、G = α·dt_p·Σ_{j<kp} j·β^{kp−1−j}、h = b(1−β^kp)/α
  關鍵數值: {P: 0.607042, Q: 0.392958, G: 0.008640, dt_c: 0.05, G對dt_c比值: 5.79}
  G 取決於取樣時刻契約: >-
    **G 的值由「初始設定點指哪一筆」決定，不是模型自由選的。**
    本步**已寫入**（s_0 = sp_i 先作用於下一物理段）⇒ G = 0.008640；
    本步**寫入前**（s_0 = sp_{i−1}，先依新命令更新再作用）⇒ G = 0.012570。
    實錄決定性核對（free4 任務窗）：
    (act_i, sp_i) 配對擬合 α = 0.09501、R² = 1.00000、殘差 0.0039 mrad；
    (act_i, sp_{i−1}) 配對 α = 0.10461、R² = 0.99266、殘差 0.545 mrad。
    50 ms 預測：G = 0.008640 給 0.379–0.555 mrad、G = 0.012570 給 0.719–0.991 mrad。
    **⇒ 契約定為「本步寫入後」，G = 0.008640。**
    T1（閉式 vs 逐步連乘）只證明內部一致，**不能單獨證明對上執行端**；
    上述配對核對才是對上執行端的證據。
  為何不能把 α 當 50 ms 係數: >-
    **G ≈ 0.00864 ≠ dt_c = 0.05**（差 5.79 倍）。50 ms 內的位移主要來自
    Q⊙(s − x) 這一項，而不是 G⊙u —— 這正是設定點必須進狀態的原因。
  compose_的防護: dt_ctrl 非 phys_dt 整數倍時**拋錯拒絕近似**
  仿射模型: >-
    手臂與設定點區塊嚴格線性 ⇒ **無線性化誤差**（實測 ≤ 6.7e-16）；
    只有底盤三維仍是在 nominal 處的線性化，與原核心同源（實測 6.4e-6）。
  增廣狀態初始化: >-
    `make_z(q, s)` 在 s 含非有限值時**拋錯**，不以實測關節角代替。
    free4 實測設定點與實測關節角的落後與命令速率相關約 0.8，兩者不可互代。
  關節限位: >-
    拆成 setpoint_position 與 measured_position 兩組，**兩組都保留**。
    執行端的硬失效（_apply 的 _fail）檢查的是**設定點**，
    故前者才是對應執行端的那一道；兩者都保留 joint_margin = 0.05
    （執行端不留餘量 ⇒ 保守方向）。
  蘊含論證的撤回: >-
    **初版主張 measured_position 被 setpoint_position 蘊含（「偏置累積 <
    餘量」），該論證錯誤，已撤回。** 含非零偏置時
    x⁺ = (1−α)x + αs + b 不再只是 x 與 s 的凸組合；穩態偏移是 **b/α**，
    不是 b。joint2 的反例（α = 0.09504、b = 2.715e-4 ⇒ b/α = 2.856e-3）：
    取 x = s = U − 0.5 mrad（U 為收緊後上限）、u = 0，五個物理步後
    x = **U + 0.623 mrad** —— 設定點界成立、實測界不成立。
    閉式複合映射重現同一值（差 2.2e-19）。測試已改為此反例。
  SQP 政策: 逐字沿用原核心（暖啟動末步減速、nominal 可行性預檢、逐候選閘門、可行性恢復步、五種停止狀態、任一次 QP 失敗即 no_valid_solution、對實際回傳序列的最終殘差核對）

四、離線核對結果:
  腳本: evaluation/test_wgmpc_core_sp.py（T1–T7，全部通過）
  items:
    - T1 閉式連乘 == 顯式逐物理步連乘（200 組隨機輸入，最大差 3.25e-14）
    - T2 退化核對：α→1、b=0 時 G → (kp−1)·dt_p = 0.04，即「落後一個物理步的理想模型」
    - T3 手臂與設定點區塊仿射 == 非線性（≤ 6.7e-16）；底盤仍有線性化誤差（6.4e-6）
    - T4 輸入防護：非有限設定點、非整數倍 dt、α 不在 (0,1) 皆拒絕
    - T5 由 free4 實際狀態求解成功（converged_cost，殘差 1.39e-17）；控制仍 9 維
    - T6a 設定點限位列形式正確（hi == 剩餘餘量、係數 == 前 k 步各 dt）；六個餘量的解一律遵守
    - T6b **反例**：設定點界成立而實測界不成立（U + 0.623 mrad）⇒ 兩組限位都保留
    - T6c 列縮放前後的六個限位案例；殘差以未縮放原單位檢查、r_tol 與 accepted_status 未放寬
    - T7 一控制步預測誤差：位置 p50 0.01338 → 0.00076 m（17.5×）、姿態 p50 0.07375 → 0.00229 rad（32.3×）
  握手核對: >-
    evaluation/test_wgmpc_sp_handshake.py（H1–H10，全部通過）：
    未收 meta／meta 契約不吻合／ready = 0／非有限設定點／負年齡 皆拒絕進入求解；
    曾就緒後過期回 HOLD 且**不沿用舊設定點**；欄數不符拋錯；
    執行端 meta 的字面值與閘門期望逐項一致。

五、數值處理：等價正值列縮放（Howard 核准的唯一數值改善）:
  等價性: >-
    對第 i 列同乘有限正數 d_i：l_i ≤ A_i U ≤ h_i ⟺ d_i l_i ≤ d_i A_i U ≤ d_i h_i。
    **精確算術下不改可行集合**，不等同刪除限制或放寬門檻。
  實作: >-
    d_i = 1 / ‖A_i‖_∞，作用在**已做欄正規化**（×Σ）的矩陣上；
    全零列給 d_i = 1；係數須為有限正值否則拋錯。可用 cfg.row_scaling = False 關閉。
  遵守的四項條件:
    - 成本與限制內容不變（只對列做正值縮放）
    - 候選解與最終解的殘差一律以**未縮放的原始限制、原單位**檢查
    - 不接受超迭代解（accepted_status 仍為 ('solved',)）
    - r_tol 不動（1e-6）
  實測 d 範圍: '[1.000, 115.768]（皆有限正值）'
  成因與界線: >-
    measured_position 的複合增益 G ≈ 0.00864 遠小於其他區塊係數，
    欄正規化後整體 |係數| 跨度由 **28.4× 擴到 115.8×**。
    「係數跨度擴大」與「移除該區塊後恢復可解」支持數值問題的懷疑，
    但**尚不足以證明它是唯一成因**。

