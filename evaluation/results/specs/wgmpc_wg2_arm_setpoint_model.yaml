九、界線:
  - α 與 b 由**單趟**（free4，n=1）辨識，是候選參數；前半估／後半驗證只排除「同時擬合與驗證」，**不等於跨趟泛化**
  - 其他負載、姿態與接觸情境未涵蓋
  - 離線核對從**執行端設定點**起算，故與安全層、E2 分離；**但這不表示安全層未影響 free4 的閉迴路行為**
  - 「列縮放修復了可解性」是實測，但係數跨度**不足以證明**它是唯一成因
  - 取樣時刻契約由 free4 實錄決定（R² 1.00000 vs 0.99266）；換執行端版本要重核
  - 預測改善**不等於**閉迴路會到達並保持 —— 需另行安排同目標的物理對照
