七、設定點回報與初始化握手:
  執行端新增（純回報，不改既有命令訊息與控制行為）:
    - /coman/arm_setpoint（Float64MultiArray，11 欄）
    - /coman/arm_setpoint_meta（String，latched，TRANSIENT_LOCAL）
  欄位: [physics_step_id, sim_t, ready, sp_joint1..6, exec_mode_code, api_applied]
  meta 內容: 關節順序、單位、取樣時刻、配對規則、遞推式、合成 G、ready=0 的意義、積分頻率
  取樣時刻: '**本步寫入後**（apply_action 之後），與同一輪 /joint_states 的量測構成匹配對（同 sim_t、同 physics_step_id）'
  未就緒的回報: 'ready = 0 且 sp 為 NaN（設定點尚未建立時仍發，不讓求解器以 s = q 自行補）'
  改動性質核對: >-
    git diff 僅一行刪除（feedback_published 清單），新增行不含任何
    apply_action／set_*_velocity／chain／robot／world 呼叫；
    AST 核對 publisher 與旗標全部在 __init__ 建立，其他方法未建立資源。
  握手閘門: evaluation/wgmpc_sp_handshake.py（與 ROS 無關，可離線單元測試）
  狀態機:
    - INIT：未收回報／meta 契約不吻合／ready = 0 ⇒ 只送**全零初始化命令**，不求解
    - ARMED：ready = 1、樣本新鮮、meta 契約吻合 ⇒ 以**執行端回報的** s 求解
    - HOLD：曾就緒但樣本過期或 ready 轉回 0 ⇒ 不求解，**不沿用舊設定點**
  明訂事項: >-
    初始零命令是**握手步驟**（計入 n_init_cmd），不是求解結果；
    求解器**不得**假設 s = q。閘門會核對 meta 的 sampling_instant 與
    composed_G，與模型假設不符就拒絕進入求解。

