  切分: 前半估參數 n=2980（39.70–69.50 s）、後半驗證 n=2980（69.50–99.30 s）
  逐軸係數:
    alpha: [0.09501, 0.09504, 0.09501, 0.09499, 0.09501, 0.09502]
    bias_rad: [1.19e-06, 2.715e-04, -2.056e-05, 3.299e-06, 1.607e-07, 1.957e-08]
    R2: [1.0000, 0.9999, 1.0000, 1.0000, 1.0000, 1.0000]
    tau_s: 0.10017      # α = 1 − exp(−Δt/τ) 換算，六軸 p50
  時間常數的更正: >-
    **先前報告的 0.0636 s 不採用。** 那是「設定點落後對命令速率」的迴歸斜率，
    混了時序與動態響應。以一步關係式直接辨識得 τ ≈ **0.100 s**。
  命令區間的更正: >-
    **初版的理想模型基準偏了一個物理步，已修正。** 設定點遞推是
    sp_i = sp_{i−1} + u_i·dt_p，而 i→i+1 的物理由 **sp_i** 支配，
    故 i→i+kp 作用的設定點是 sp_i … sp_{i+kp−1}、命令積分為
    **sp_{i+kp−1} − sp_{i−1}**。初版寫成 sp_{i+kp} − sp_i。
    用同一批起點重算：27.519–27.926 → **24.908–25.285 mrad**
    （Howard 報 24.905–25.282；差異僅來自起點集合少一個索引）。
  命令來源要分開標示: >-
    「設定點取實錄」是模型品質上界；「單一保持命令」才是 MPC 實際採用的形式
    （初版只報前者與一個平均命令變體，未標明差別）。
    另外「逐筆重播實際命令」與「設定點取實錄」**在數值上恆等**
    —— 因為設定點就是命令的積分；實測最大差 2.8e-17 mrad。
    初版該項報 0.825–1.035 mrad 是索引錯誤（在 s_0 = sp_i 之後又加了 u_i）。
