七、設定點回報與初始化握手:
  執行端新增（純回報，不改既有命令訊息與控制行為）:
    - /coman/arm_setpoint（Float64MultiArray，11 欄）
    - /coman/arm_setpoint_meta（String，latched，TRANSIENT_LOCAL）
  欄位: [physics_step_id, sim_t, ready, sp_joint1..6, exec_mode_code, api_applied]
  meta 內容: 關節順序、單位、取樣時刻、配對規則、遞推式、合成 G、ready=0 的意義、積分頻率
  取樣時刻: '**本步寫入後**（apply_action 之後），與同一輪 /joint_states 的量測構成匹配對（同 sim_t、同 physics_step_id）'
  未就緒的回報: 'ready = 0 且 sp 為 NaN（設定點尚未建立時仍發，不讓求解器以 s = q 自行補）'
  改動性質核對: >-
    git diff 僅一行刪除（feedback_published 清單），新增行不含任何
    apply_action／set_*_velocity／chain／robot／world 呼叫；
    AST 核對 publisher 與旗標全部在 __init__ 建立，其他方法未建立資源。
  握手閘門: evaluation/wgmpc_sp_handshake.py（與 ROS 無關，可離線單元測試）
  狀態機:
    - INIT：未收回報／meta 契約不吻合／ready = 0 ⇒ 只送**全零初始化命令**，不求解
    - ARMED：ready = 1、樣本新鮮、meta 契約吻合 ⇒ 以**執行端回報的** s 求解
    - HOLD：曾就緒但樣本過期或 ready 轉回 0 ⇒ 不求解，**不沿用舊設定點**
  明訂事項: >-
    初始零命令是**握手步驟**（計入 n_init_cmd），不是求解結果；
    求解器**不得**假設 s = q。閘門會核對 meta 的 sampling_instant 與
    composed_G，與模型假設不符就拒絕進入求解。

八、節點接線（WG2 節點，--arm-model setpoint）:
  預設不變: >-
    `--arm-model` 預設 `ideal`（原核心、free4 基準）。
    設定點路徑要明確指定 `setpoint` 才啟用，既有配置不受影響。
  握手反例的修正（Howard 實測指出四項）:
    - key: exec_mode = 3（失效閂鎖）
      原: ARMED
      改: '**FAILED**，優先於一切（含契約問題），交既定失效收尾；不求解也不握手'
    - key: api_applied = False
      原: ARMED
      改: 不得放行；首次出現 ⇒ INIT、曾就緒 ⇒ HOLD
    - key: 曾 ARMED 之後 ready = 0
      原: INIT（會把運行中資料失效誤當首次啟動而重送初始化命令）
      改: '**HOLD**；`init_command()` 在曾就緒後**拋錯**。H6 的測試預期已一併更正。'
    - key: meta 的數值欄位為 NaN
      原: ARMED（`abs(nan − G) > tol` 為 False 而漏過）
      改: 任一數值契約欄位非有限值即拒絕
  契約核對的對象改了: >-
    **不再核對 G。** G 是由辨識參數 α 與控制步長算出的模型係數，
    兩端硬編碼同一個常數只能證明字串一致。
    改核對**執行端能回報的事實**：`sampling_instant`、`physics_dt_s`、
    `cols`、`joint_order`。模型端以 `ArmSetpointModel.compose(dt)` 自行算 G；
    取樣時刻決定用哪一種合成，所以核對取樣時刻就夠。
    執行端 meta 因此改報 `physics_dt_s`（量測事實），移除 `composed_G_for_dt_0p05`。
  同時刻快照: >-
    原先 `_compose` 用 `min(t_arm, t_base)` 合成 —— 那會把錯配藏起來
    （兩來源各自新鮮但不是同一物理步，取最舊時間後看起來仍新鮮）。
    現在各來源寫入以 `round(sim_t, 6)`（µs）為鍵的環形緩衝，
    **只在同一鍵上三方齊備時**才建不可變快照，
    並把各來源自己的時間（t_arm／t_base／t_sp）與 `max_spread_s` 記進紀錄。
    實測：發布輪的 `max_spread_s = 0.0`、`sources = [arm, base, sp]`。
    注意 `n_compose_incomplete` 的語意是「先到的來源還湊不齊」的次數，
    每物理步本來就有一次 ⇒ 它接近步數是正常的，**不是錯誤計數**；
    真正的錯配由 `n_step_mismatch` 與 `snapshot_not_paired` 反映。
  步序關聯（共同時間戳不夠）: >-
    **共同時間戳配對無法察覺一個標錯時間的設定點** —— 把它標成下一步，
    下一步的 arm／base 就會與它配上（實測確認）。
    `JointState` 沒有 `physics_step_id` 欄位，所以另加交叉核對：
    `/coman/applied_cmd` 與 `/coman/arm_setpoint` 由執行端**同一輪**發出、
    帶同一個 (physics_step_id, sim_t)，故以同一個 step_id 在兩話題上的
    sim_t 互相核對。偏移一個物理步的注入測試：抓到 1301 次不符，
    節點**拒絕啟動**（exit 3）而不是帶著錯配求解。
  啟動死鎖的修正: >-
    **這是本輪最重要的缺陷。** 原啟動路徑是 `while nd._snap is None`，
    而設定點模式的快照需要 `/coman/arm_setpoint`；
    真實執行端**只在收到第一筆有效命令時**才建立設定點（`setpoint_init`）
    ⇒ 「等設定點 ← 等命令 ← 等 run()」互相卡住，會等滿逾時後回 3。
    替身用計時器自行建立設定點，把它遮掉了 —— 所以這個缺陷是
    靠「替身不等於真實執行端」的意識才找到的。
    修法：握手移到**啟動路徑**，按控制週期送全零命令直到 ARMED 且
    同時刻快照含設定點。實測啟動送出 38 筆後於 sim 2.0 s 進入 ARMED。
  求解前後都查: >-
    求解前裁示閘門（FAILED 停止／INIT 握手／HOLD 不求解），
    求解後**再查一次**執行健康（求解 p50 ~25 ms 期間可能收到閂鎖或
    api_applied = False），理由分別記為 `sp_gate_{state}_after_solve`。
    過期解不發布、不重新蓋時間；既有的時間依據確認（clock/state moved）保留。
  單一 executor: >-
    維持單一 `SingleThreadedExecutor`、節點只 add 一次；
    未引入第二個 spin 執行緒（`spin_thread=True` 僅出現在「不使用」的註解）。
  拒絕啟動也落盤: >-
    原本只印在終端。現在 exit 2／3／4／5 都寫出 `started: false`、
    `refuse_reason`、握手歷程、步序不符統計 —— 事後才對得上帳。
  介面測試（無 Isaac）:
    替身: evaluation/wgmpc_sp_stub_endpoint.py（**沒有物理**，不可用來判到達與保持）
    測試: evaluation/test_wgmpc_sp_interface.py（I1–I5，全部通過）
    items:
      - I1 啟動握手送出 38 筆全零命令後進入 ARMED；發布輪 spread = 0、來源含 sp
      - I2 設定點時間標錯一步 ⇒ 交叉核對抓到、節點拒絕啟動、零發布
      - I3 exec_mode = 3 ⇒ 記 `sp_gate_failed_after_solve`、停止旗標已設、之後零發布
      - I4 設定點停發 ⇒ HOLD、之後零發布、**不重送初始化命令**
      - I5 api_applied = False ⇒ 記下不合格、之後零發布
  握手閘門單元測試: evaluation/test_wgmpc_sp_handshake.py（H1–H12，全部通過）

