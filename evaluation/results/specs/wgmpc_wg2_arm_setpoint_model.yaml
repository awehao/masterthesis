一、時間對齊（依原始碼，非推測）:
  執行端主迴圈順序: >-
    world.step() → 讀 qa（log 的 joint*_act）→ chain.step(t, dt, qa) 產生 sp
    → apply_action(sp)（log 的 joint*_sp）→ log.append
  推論: >-
    log 第 i 列的 act_i 是**寫入前**的量測，sp_i 是**該步寫入**並支配
    i→i+1 物理段的位置目標 ⇒ 待辨識關係式為
    act_{i+1} = act_i + α·(sp_i − act_i) + b
  設定點積分頻率的更正: >-
    **先前報告寫「設定點以 20 Hz 更新」，錯。** 20 Hz 是上游控制頻率；
    `wb_cmd_chain_e2.py::_apply` 的 `nxt = [p + r*dt ...]` 中 dt 是**物理步長**，
    且 `chain.step` 每物理步呼叫一次 ⇒ 設定點積分是 **100 Hz**。
    free4 實測：任務窗內 **99.8%** 的 10 ms 區間設定點都在變（n=5960）。

