id: WG2-TRACK-2
title: WG2 命令追蹤：新舊入口互斥、嚴格解析、全鏈落盤
date: 2026-10-02
status: >-
  **封裝格式與全鏈追蹤測試完成**（含 adapter → 真實 CmdChainE2 → 首次 API 套用）。
  未開 Isaac、未重辨識、未調模型／權重／限制。
前版: WG2-TRACK-1（當時只驗到安全層輸出，定位為「封裝格式與安全層追蹤測試完成」）

一_三組缺口（Howard 指出，已逐一核對屬實並修正）:
  - id: 新舊命令路徑未互斥
    問題: >-
      安全層啟用封裝後舊 `_on_cmd()` 仍能覆寫 `self.cmd` 卻不清 `_env_src`
      ⇒ 「先收封裝 A、再收舊話題 B，實際處理 B 卻標成 A 的來源」。
      adapter 當時**沒有封裝開關**，兩種入口都訂閱，`on_env()` 還另發舊九維話題。
    修法: >-
      **明確選定唯一控制入口**。安全層：封裝模式下 `_on_cmd` 直接 return
      並計數（`_n_env_ignored_legacy`）。adapter：新增 `--cmd-env`，
      兩種入口**擇一訂閱**、輸出也擇一（封裝模式 `self.pub = None`）。
      執行端：封裝模式**根本不建立** `/wb_vel_cmd` 訂閱（不是收了再丟）。
      既有九維模式完整保留。
  - id: 封裝解析接受無效身分與時間
    實測原況: ['schema = NaN 接受', 'source_seq = 101.9 被截成 101',
               'stamp_sim_t = NaN 接受', '命令分量含 NaN 接受',
               'stage_id = 99 接受', 'derived=0 但 source_seq=101 接受']
    修法: >-
      解析器先擋**所有非有限值**（NaN 比較永遠為 False，必須先擋再比 schema），
      序號要求**整數語意、不靜默截斷**，段別與 kind 必須合法，
      `derived` 只接受 0/1，且 `derived = 0 ⇒ source_seq = −1`。
      六項現在**全部拒絕**，並在 encode 端同樣把關。
  - id: 後半段與落盤未驗
    修法: >-
      新增錄製器（四段 JSONL）、用**真實 CmdChainE2** 的替身、
      runner 啟用參數與配置紀錄、執行端把四段事件寫進 wb_run.json。
      關聯一律**由保存的檔案重建**。

二_格式（schema 2.0）:
  權威定義: src/ammr_wholebody_mpc/ammr_wholebody_mpc/cmd_envelope.py
  欄位: '[schema, run_id, source_seq, stage_id, output_seq, src_seq, derived, kind, stamp_sim_t, u0..u8] 共 18 欄'
  derived 與 src_seq 是兩件事: >-
    `derived` 問「可不可歸屬到某筆**求解命令**」；`src_seq` 記「由上游**哪一筆訊息**導出」。
    轉送一筆安全層自行產生的停止時，`derived = 0`（不可歸屬）但 `src_seq`
    仍保留上游 output_seq。**先前把兩者綁在一起，導致 adapter 收到停止封裝就崩**，已修。
  kind: {0: normal, 1: modified_by_this_stage, 2: stop_generated, 3: no_command, 4: fail_latched_stop}
  kind 的用途: '**失效後自行產生的停止值不得冒稱原命令成功套用** ⇒ fail_latched_stop、derived = 0、source_seq = −1'

三_落盤:
  錄製器: evaluation/wgmpc_env_recorder.py（四段 JSONL，含 header／每筆／被拒筆數／summary）
  執行端: wb_run.json 新增 `cmd_env.events`（來源身分、recv_sim_t、first_apply_sim_t、kind、exec_mode、applied9、lam）
  時間分項: {recv_sim_t: 封裝抵達執行端, first_apply_sim_t: 第一次送進物理 API}
  時間的界線: '**API 套用時間 ≠ 機械響應完成時間** —— 設定點寫入後關節還要追（一階追蹤）'
  逐物理步套用值: 仍由 log 的 joint*_sp 與 /coman/applied_cmd 承載

四_全鏈測試（無 Isaac）:
  腳本: evaluation/test_wgmpc_cmd_env_chain.py（C0–C7，全部通過）
  鏈路: 'driver(solver) → **真實安全層** → **真實 adapter** → **真實 CmdChainE2** → 首次 API 套用'
  判定方式: '**只從保存的檔案重建關聯**，不看任何節點記憶體'
  items:
    - C1 四段都有落盤；錄製器 0 筆被拒
    - C2 同值不同序號 201/202 在四段都追得到，output_seq 不同（930 vs 935）
    - C3 **正常零命令**追到終點且 kind = normal（不被當成錯）
    - C4 越界命令被安全層標 modified_by_this_stage 並夾進低速框；仍追到終點
    - C5 每筆含接收／首次套用時間、種類、套用值；首次套用 >= 接收（差 p50 0.010 s）
    - C6 序號缺口可見（204 → 220），終點無未送出的序號
    - C6b **失效閂鎖**：產生停止事件、kind = fail_latched_stop、source_seq = −1
    - C7 三端互斥：adapter 與執行端**不建立**舊訂閱；安全層忽略舊 ~/cmd_in
  我自己踩到並修掉的:
    - evaluation 轉出口漏轉 K_* 常數 ⇒ 驅動器 AttributeError；改為全量轉出
    - 替身的低速界限寫成求解端 L1 框；應為**執行端 E2** 的 0.05/0.2/1.0（hypot、回傳 (bool, 原因)）
    - 替身未宣告 `joints` 參數 ⇒ adapter 的順序核對失敗、拒絕轉發
    - 啟動順序：替身要先於 adapter，否則 `check_order()` 查不到消費端
    - 失效後 `chain.receive` 不再接收，停止事件被「首次套用」去重擋掉 ⇒ 改為獨立回報一次
    - 暖機未完成時安全層輸出 derived = 0（正確行為），測試需送到可歸屬為止

五_runner:
  旗標: 'CMD_ENV（預設 1）⇒ 同時傳 --cmd-env（節點／adapter／執行端）與 cmd_env:=true（安全層）'
  落盤: 起 wgmpc_env_recorder 寫 $DIR/cmd_env.jsonl；run_config.json 記 cmd_env 狀態
  退回: CMD_ENV=0 可完整退回既有九維路徑
  驗證: bash -n 通過；兩個分支的變數都有定義（set -u 實測）

六_界線:
  - '**序號不保證穩定**：它只說明「執行了哪筆、被改成什麼」，**不能預先保證未來安全層不修改命令**'
  - D_cmd 仍未量到 —— 要等含序號的趟次才能逐筆算出發布 → 生效
  - 同口徑的誤差貢獻比較仍未完成
  - 替身沒有物理；執行端自己的主迴圈只有 Isaac 趟次才會走到
  - rec8 的改善保留；本輪不推倒 W-GMPC 重來

回歸: 自由空間管線核對、增廣核心 T1–T7、握手 H1–H12、封裝 E1–E7、入口核對 全部通過
