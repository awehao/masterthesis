id: WG2-TRACK-1
title: WG2 命令追蹤（逐筆序號）與兩處分析更正
date: 2026-10-02
status: 離線核對通過；**未開 Isaac、未重辨識、未調權重**。原參數、權重、N、限制全部保留。

一_兩處分析更正（Howard 指出，已核對屬實）:
  - id: 撤回「220–365 倍」
    原: '把 A（40–70 ms 後的設定點誤差，六軸取最大再 RMSE）除以 B（10 ms 一步，逐軸 RMSE）'
    問題: '**預測長度、比較對象與彙整方式都不同**，不能相除當成誤差來源的倍數證明'
    改為: >-
      **已發現**：命令／時間語意不一致（u_prev 的定義、D_state 與 D_cmd 混用）。
      **仍成立**：原模型在 rec8 實際設定點上的一步殘差仍小（最差軸 0.0842 mrad）。
      **尚未完成**：同口徑的誤差貢獻比較 —— 需先有逐筆序號才能做。
  - id: 撤回 applied 的負偏移推論
    原: '把每輪保存的最新 applied 當成完整 100 Hz 套用歷史，再扣一次 D_cmd'
    問題: >-
      (1) 那不是完整的逐物理步套用歷史；
      (2) 這些資料**已帶套用時刻**，不可再當發布歷史扣 D_cmd；
      (3) 設定點是「本步寫入後」的值，由 s_i 推到 s_{i+n} 應累加
      Σ_{k=i+1..i+n} u^applied_k，**不可把已含在 s_i 裡的 u_i 再加一次**。
    改為: >-
      改以全物理步做積分對帳：n = 1／5／7 步的殘差均為數值量級（≤ 2.1e-17 rad），
      只證明索引與累加式正確。**套用速率是由 joint*_sp 差分重建的
      ⇒ 這是自洽核對，不是獨立驗證**，已明載。
  - id: 移除 cmd_age 的下界說法
    原: '「D_cmd 的下界估計 ≈ cmd_age」'
    問題: 兩者沒有這個界限關係
    改為: 已移除；D_cmd 標為「量不到」
  - id: 不再用查表偏移最小值冒稱物理延遲
    說明: >-
      該最小值同時吸收了時間錯位與命令被改動，不是物理延遲，已從結論移除。

二_命令追蹤封裝:
  權威定義: src/ammr_wholebody_mpc/ammr_wholebody_mpc/cmd_envelope.py（evaluation 側只是轉出口，格式只有一份）
  欄位: '[schema, run_id, source_seq, stage_id, output_seq, src_seq, derived, stamp_sim_t, u0..u8] 共 17 欄'
  身分與值同訊息: '`(run_id, source_seq)` 與九維值在**同一份 payload**；不另發旁路資料、不靠數值或接收順序猜配對'
  run_id 數值化: sha256 取 48 bit ⇒ float64 可精確表示（< 2^53）
  段別與話題:
    solver: /wgmpc/cmd_env
    safety: /wholebody_safety/cmd_env_out
    adapter: /wb_vel_cmd_env
    endpoint: /coman/applied_env
  每段語意:
    output_seq: 本段自己的輸出計數；**同一來源可能被多次輸出**
    src_seq: 本筆由上游的哪個 output_seq 導出
    derived: '1 = 由來源導出（**可能已被修改**）；0 = 本段自行產生（停止、無命令、缺資料），此時 source_seq 與 src_seq 皆為 −1，不冒認來源'
  既有路徑: '原九維話題與限制**一字未改**；封裝是 WG2 明確啟用的額外路徑（節點 --cmd-env、安全層 cmd_env:=true、執行端 --cmd-env），預設全部關閉'
  時間分項:
    recv_sim_t: 封裝抵達執行端的模擬時間
    first_apply_sim_t: 本筆**第一次**送進物理 API 的模擬時間（= endpoint 段封裝的 stamp_sim_t）
    界線: '**API 套用時間 ≠ 機械響應完成時間** —— 設定點寫入後關節還要追（一階追蹤）'
    per_step_applied: 逐物理步套用值仍見 /coman/applied_cmd 與 log 的 joint*_sp

三_反例核對:
  腳本: evaluation/test_wgmpc_cmd_env.py（E1–E7，全部通過；真實安全層，無 Isaac）
  items:
    - E1 output_seq 嚴格遞增；九維值與身分同訊息
    - E2 **同值不同序號**：值相同但 source_seq 101/102 ⇒ 輸出 output_seq 162 vs 165，仍可分辨
    - E3 **同一請求多次輸出**：101 得 3 筆、102 得 4 筆，output_seq 互不相同
    - E4 **安全層修改**：送手臂 ±5.0（越低速框 0.9999）⇒ 輸出 ±0.21，source_seq 120 保留、看得出被改成什麼
    - E5 **停止／自行產生**：derived = 0 共 10 筆，source_seq 與 src_seq 皆 −1
    - E6 **延遲／遺失**：序號缺口可見（101,102 → 110,120），無輸出宣稱來自未送出的序號
    - E7 格式說明含「身分與值同訊息」「不保證安全層不修改命令」「既有路徑不變」
  我自己踩到並修掉的: >-
    (1) 安全層原本用相對路徑去找 evaluation 下的模組，**已安裝的套件路徑不同** ⇒ 收到 0 筆；
    改為把權威定義放進套件內。
    (2) E3 初版驅動器送出後 spin 太短，只抓到 1 筆 ⇒ 是空過，已加長。
    (3) E4 初版未送越界命令，「被修改」是 0/7 的**空過**，已補強制越界案例。

四_界線:
  - '**序號不保證穩定**：它讓我們知道「執行了哪筆、被改成什麼」，**不能預先保證未來安全層不修改命令**。它是修好延遲估計與預推的必要工具。'
  - D_cmd 仍未量到：要等含序號的趟次才能逐筆算出發布 → 生效
  - 同口徑的誤差貢獻比較仍未完成
  - rec8 的改善保留；本輪不推倒 W-GMPC 重來

回歸: 自由空間管線核對、增廣核心 T1–T7、握手 H1–H12、時槽 S1–S5 全部通過（封裝預設關閉，既有路徑不受影響）
