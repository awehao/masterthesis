id: WG2-DB-1
title: 近目標輸出整形（deadband／殘差比例限幅）的實作與對照實驗
date: 2026-10-02
status: >-
  已實作並跑完 5 對 5 的對照。**方向一致，但 n = 5 下沒有任何指標達到
  p < 0.05。** 最接近的是底盤角速度振盪（p = 0.063）。

設計:
  為什麼不是固定門檻的硬 deadband: >-
    量到的問題是**比值**：每週期命令的 TCP 位移對當下殘差，
    遠離目標 0.1–0.4×、5–20 mm 時 1.6×、2–5 mm 時 4.3×、**<2 mm 時 8.2×**。
    所以規則訂成「單週期命令的位移不超過 γ × max(殘差, 容差)」——
    它**自己在遠處不作用**，不需要另設「近目標區」的切換門檻。
  函式: ammr_wholebody_mpc.wgmpc_core_sp.shape_near_target（**節點與離線共用同一份**）
  位置: 求解之後、發布之前。**不改權重、視界或任何約束集合。**
  加速度框: 縮放後仍以 u_prev 為基準夾進 ±a_max·dt，維持原有的加速度保證
  硬 deadband: 保留為選項（預設關閉）；比例限幅已讓 u 隨殘差平滑趨零

實作時踩到並修掉的缺陷: >-
  第一版用 γ·殘差 當上限。**姿態目標就是起始姿態，所以 e_r 在起點恰好是 0**，
  規則直接把整個命令縮到零、機器人完全停住（替身實測 scale p50 = 0.0、
  240/240 輪全被歸零）。改成 γ·**max(殘差, 容差)**：進了容差本來就不需要
  比容差更精確。修正後替身實測 85/241 輪被縮放、scale min 0.49。
  **若未先用替身驗就開 Isaac，這趟會是整機不動。**

離線的限制: >-
  離線閉迴路在 γ 關閉時本來就收斂，**無法鑑別**整形的效果
  （各 γ 都到達保持）。離線只能確認「不破壞收斂」與飽和略降。
  判定必須在 Isaac 做。

對照實驗:
  設計: γ=1.0 五趟、γ=0 五趟（其中三趟為稍早的 rec10/11/12）；**交錯執行**以避免機器隨時間漂移
  到達保持: {γ0: '4/5', γ1: '5/5', Fisher_p: 1.0}
  指標:
    - {指標: '**底盤角速度命令翻號率（近目標）**', γ0中位: '19.0%', γ1中位: '**0.0%**', p: 0.063,
       γ0各趟: '0.0, 15.2, 19.0, 27.9, 21.9 %', γ1各趟: '0.0, 1.3, 4.2, 0.0, 0.0 %'}
    - {指標: 手臂命令飽和比例, γ0中位: 0.314, γ1中位: 0.169, p: 0.095}
    - {指標: 到達時間（進入 2 s 保持窗的起點）, γ0中位: '18.48 s', γ1中位: '**2.15 s**', p: 0.222,
       γ0各趟: '1.70, 14.50, 22.45, 22.45', γ1各趟: '1.70, 1.95, 2.15, 4.45, 11.20'}
    - {指標: 容差內的 TCP 速度, γ0中位: '41.2 mm/s', γ1中位: '26.6 mm/s', p: 0.548}
  判讀:
    可以說: >-
      四項指標的**方向一致**，都偏向 γ=1。其中底盤角速度振盪的分離最明顯：
      γ=1 有 4/5 趟接近零，γ=0 有 4/5 趟在 15–28%。
      這對應使用者看到的「整機震盪」裡**底盤來回轉動**的部分。
    不可以說:
      - '任何一項達到統計顯著（n = 5 時最小 p = 0.063）'
      - '到達時間縮短 8 倍 —— 兩組都有重疊（γ=0 有一趟 1.70 s、γ=1 有一趟 11.20 s）'
      - '手臂的振盪被消除 —— 手臂 j2 的翻號率兩組相同（29.5% 對 30.4%）'
    未解決: 手臂本身的高頻翻號**沒有改善**；整形主要作用在底盤

熱況:
  本輪七趟的峰值: [80.2, 85.9, 86.0, 87.0, 86.9, 87.4, 88.0]
  警示: >-
    **峰值隨趟次單調上升，最後一趟 88.0 °C 距上限 92 只有 4 °C。**
    起始溫度被 48 °C 的門檻卡住（實際都在 46–48），散熱追不上。
    要再擴樣本必須把起始門檻降到 42 °C 以下或拉長間隔，否則會觸發中止。

下一步（未執行）:
  - 擴樣本到每組 10 趟以把 p 壓下來 —— 但受熱況限制，需更長的間隔
  - 手臂的高頻翻號未解 —— 若要處理需另找機制，整形對它無效
