id: WG2-OSC-1
title: 「整機震盪」的量測診斷 —— 三個候選病因的驗證
date: 2026-10-02
依據: rec10（達成）、rec12（未達成）、rec13（消融）的實錄；**無新趟次**

震盪分兩段（先釐清觀察到的是哪一段）:
  接近段: >-
    **確實大幅震盪**。rec10 達標前 3 s：底盤路徑 32.7 mm、yaw 累積 9.53°、
    **TCP 路徑 265.1 mm**。這一段約持續 20 s 模擬時間。
  保持段_rec10: >-
    **幾乎靜止**。保持窗（sim 45.94–48.91，2.97 s）內：
    底盤路徑 **2.2 mm**（範圍 1.4 mm）、yaw 累積 **0.93°**、
    關節角度範圍 0.14–1.33°、TCP 路徑 **5.96 mm**、
    底盤速度 p50 **0.09 mm/s**、關節速率 p50 **0.00–0.09 °/s**。
  未達成的趟次: >-
    **末段仍在大幅運動**：rec12 關節速率 p50 **11.31 °/s**、TCP 路徑 472 mm／3 s；
    rec13 9.18 °/s、493 mm／3 s。對照 rec10 的 0.09 °/s。
  判讀: 成功的趟次會停下來；失敗的趟次從頭震到尾。兩者的區別是**是否停得下來**。

病因一_零空間對衝:
  主張: 底盤向左微移、手臂立刻向右補償，TCP 不動但兩大剛體高頻對衝
  驗證: 
    - key: 逐步增量相關
      值: 'base_yaw 與 joint1 的**增量**相關 r = +0.193；反號步數僅 37.9%（隨機約 50%）'
      判讀: '**沒有逐步對衝**。軌跡層級的 r = −0.975 是**慢速漂移的冗餘分配**，不是振盪。'
    - key: 底盤對 TCP 的速度貢獻
      值: '近目標時 |v_base→TCP| p50 0.0163 m/s 對 |v_arm→TCP| p50 0.2468 m/s'
      判讀: 底盤的貢獻比手臂小 **15 倍**，不是主導者
    - key: 「整機大動而 TCP 不動」
      值: 'rec10 達標前 3 s：TCP 路徑 265 mm 對底盤路徑 32.7 mm'
      判讀: '**TCP 動得比底盤還多**，與該主張相反'
  結論: '**不成立**（作為高頻機制）'

病因二_過衝與極限環:
  主張: 近目標時命令造成的位移過大，下一週期反向修正，形成極限環
  驗證:
    說明: 每週期命令的 TCP 位移（Jacobian 投影）對當下誤差的比值
    表:
      - {誤差區間: '>50 mm', 誤差p50_mm: 182.90, 命令位移_mm: 16.09, 比值: '0.1×'}
      - {誤差區間: '20–50 mm', 誤差p50_mm: 23.32, 命令位移_mm: 9.12, 比值: '0.4×'}
      - {誤差區間: '5–20 mm', 誤差p50_mm: 9.07, 命令位移_mm: 14.69, 比值: '1.6×'}
      - {誤差區間: '2–5 mm', 誤差p50_mm: 3.40, 命令位移_mm: 14.76, 比值: '4.3×'}
      - {誤差區間: '<2 mm', 誤差p50_mm: 0.70, 命令位移_mm: 5.75, 比值: '**8.2×**'}
    命令翻號率: '近目標 wz 18.1%、手臂 j2 31.6%；遠離目標皆 0.0%'
  結論: '**成立且已量化**。這是主導機制：越接近目標，單週期命令位移相對誤差越大。'

病因三_安全層修改在近目標被放大:
  主張: 近目標時連桿與碰撞 Capsule 距離近，Safety Shield 修改 38% 命令
  驗證:
    - key: 逐筆配對的修改率
      值: '遠離目標 **81.0%**、近目標 **31.6%**'
      判讀: '**方向相反** —— 近目標時修改率是下降的'
    - key: 機制描述與場景不符
      值: >-
        本場景 runner **未給 obstacles 參數** ⇒ 距離節點每連桿一列 STATUS_NODATA，
        且 freespace_confirmed:=true。**安全層的修改不可能來自避碰或碰撞 Capsule。**
        實際的修改來源是速度／加速度／輪級限制。
    - key: 但修改幅度確實變大
      值: '近目標 |diff| p95 0.958 對 遠離 0.370'
      判讀: 修改**次數**變少、**幅度**變大；這一點值得留意，但不是「被放大」的原意
  結論: '**不成立**（率沒有放大，機制描述也與自由空間場景不符）'

四個對策的現況:
  - {對策: 一 近目標底盤鎖定／阻尼, 狀態: 未做, 評估: '針對的不是主導機制 —— 保持窗內底盤速度已是 0.09 mm/s，近目標的 TCP 貢獻只有手臂的 1/15'}
  - {對策: 二 預測器用安全層投影後的實際指令, 狀態: '**已實作並已跑**（--use-applied-for-predict，rec10/11/12）', 評估: 它是 rec10 能達成的兩項改動之一}
  - {對策: 三 拆分非對稱延遲補償 1.6／1.0, 狀態: '**已實作並已跑**（rec10–rec13）', 評估: 消融顯示飽和由約 0.6 降到 0.2 主要來自它}
  - {對策: 四 近目標殘差平滑歸零（deadband）, 狀態: 未做, 評估: '**針對的正是已證實的機制**（<2 mm 時命令位移是誤差的 8.2 倍）'}

建議（未執行，待裁定）: >-
  優先做對策四那一類：讓近目標的命令幅度隨殘差縮小。
  但這會動到控制路徑（等同在 MPC 外加一層輸出整形），
  且目前 2/3 的重複性本身就在噪聲邊緣 —— 要能判斷改善，
  得先把同配置的成功率樣本做大，否則改完也分不出效果。
