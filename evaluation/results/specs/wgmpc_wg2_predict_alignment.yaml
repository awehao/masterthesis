id: WG2-ALIGN-1
title: 離線與線上的命令／時間語意對齊，以及預測誤差的來源拆分
date: 2026-10-02
status: 本輪只做對齊與量測；**未重辨識、未調參、未開 Isaac**。原參數、權重、N、限制全部保留。

Howard 指出的三處（已逐一核對屬實）:
  - key: 離線的 u_prev 與線上不是同一個量
    原: 'wgmpc_closed_loop_sim.py 用 `u_prev = u`（剛求解的 requested）'
    線上: '`self._applied[0]` —— E2 之後**實際套用**的命令'
    影響: >-
      有延遲時兩者本來就不同，直接改變下一輪的加速度約束與平滑成本。
      **先前的離線成功不是同一個控制迴路的成功**，據此做的排除也不成立。
  - key: 延遲補償混用兩種時間
    原: '`_predict_delay()` 用同一個 D 同時做「狀態前推」與「發布歷史倒查」'
    正確: '量測 ──D_pub──> 發布 ──D_cmd──> 生效；D_state = D_pub + D_cmd'
  - key: cmd_age 不是傳遞延遲
    value: >-
      執行端的 `cmd_age = t − snap.recv_sim_t`，是**套用當下的命令年齡**，
      不是發布→接收的傳遞延遲。故「0.60＋0.60＋一物理步」只能稱**工程估計**，
      不可稱已逐筆量到的端到端延遲。發布歷史也只是**請求命令**，
      不可假定每筆原樣通過安全層與 E2。

一_離線修正後的重測:
  u_prev 改為 applied（與線上同定義）後的延遲掃描:
    說明: 掃描仍重現 rec7，但最吻合的延遲由 1.5 降到**約 1.2 個週期**
    delay_1.0: {err_p_p50: 0.0390, err_r_p50: 0.1757, sat: 0.800}
    delay_1.5: {err_p_p50: 0.0550, err_r_p50: 0.2736, sat: 0.876}
    rec7_實跑: {err_p_p50: 0.0449, err_r_p50: 0.2130, sat: 0.868}
    影響: 我在 rec8 用的 1.4 是建立在**錯的 u_prev** 上得出的
  命令三態已分離: requested（發布歷史）／in_flight（延遲管線）／applied（E2 之後，u_prev 的唯一來源）

二_兩種時間分開的決定性反例:
  設定: D_pub = 0.6、D_cmd = 0.6 ⇒ D_state = 1.2（離線加入發布延遲才驗得出來）
  items:
    - {方案: 不補償, 到達保持: false, err_p_p50: 0.04644, 同時達標: 0}
    - {方案: '**混用單一 D=1.2（rec8 節點做法）**', 到達保持: false, err_p_p50: 0.00572, 同時達標: 105}
    - {方案: 混用單一 D=0.6, 到達保持: false, err_p_p50: 0.02187, 同時達標: 4}
    - {方案: '**分開 state 1.2 / cmd 0.6**', 到達保持: true, err_p_p50: 0.00017, 同時達標: 42}
  判讀: >-
    「混用單一 D」那一列正是 rec8 的簽名 —— 很接近（同時達標 105）但**從不保持**。
    rec8 實跑：同時達標 22、err_p p50 0.0162、最長保持 0.05 s。

三_預測誤差的來源拆分（rec8 實錄，未重辨識）:
  B_設定點到關節:
    方法: 用**原 free4 參數**與 rec8 的**實際設定點**，一步殘差；6351 個有效區間／軸
    rmse_mrad: {joint1: 0.0075, joint2: 0.0842, joint3: 0.0186, joint4: 0.0231, joint5: 0.0011, joint6: 0.0004}
    低速_rmse_mrad: {joint1: 0.0126, joint2: 0.1285, joint3: 0.0221, joint4: 0.0238, joint5: 0.0010, joint6: 0.0004}
    低速樣本數: {joint1: 1701, joint2: 1217, joint3: 1275, joint4: 1700, joint5: 1266, joint6: 1589}
    與 Howard 的核對: 範圍 0.0004–0.0842 mrad，最差 joint2 —— 與他報的 0.0004–0.0909、最差 joint2 一致
  A_命令預推:
    方法: 由命令歷史把設定點往前推 D_state = 0.80 週期，與實際設定點比較
    節點 rec8 用法（混用 D=1.4）: 30.77 mrad
    請求歷史最佳: {d_cmd_cycles: 0.90, rmse_mrad: 18.50}
    套用歷史最佳: {d_cmd_cycles: -0.40, rmse_mrad: 15.72}
  判讀:
    主導來源: '**命令預推**，是設定點→關節模型的 **220–365 倍**'
    結論: 先修「手臂接下來會收到什麼」；**重辨識摩擦的優先度在其後**
    但不是調一個 D 就能修好: >-
      請求歷史的最佳值仍有 18.5 mrad，而視界內總位移本來只有約 40 mrad。
      改用套用歷史只改善 1.2×，且最佳落在 **d_cmd = −0.40 週期** ——
      **負的傳遞延遲在物理上不可能**，表示我對 applied 序列的時間對齊不可靠
      （未逐筆配對的最新值）。此數字不作為結論依據。
    未逐筆配對的量不採信: >-
      |request − applied| 的 p50 恰為 0.9992（手臂上限），但那是各取各話題最新值，
      依 Howard 的提醒**不可當成逐筆衰減**，本檔不據以推論。

四_缺口:
  缺的是: >-
    **逐筆關聯**。節點的發布 → 安全層 → E2 → applied 回報，全程沒有共同序號
    （`recv_seq` 是執行端自己的計數）。因此：
    (1) D_cmd 只能估計，無法逐筆量到；
    (2) 預測器無法確知手臂真正會收到什麼。
  後果: 在補上序號之前，延遲補償的 D 與命令來源都只能是估計值

交付物:
  - evaluation/wgmpc_closed_loop_sim.py（命令三態分離、u_prev 與線上同義、D_pub/D_state/D_cmd 分開）
  - evaluation/wgmpc_predict_split.py（誤差來源拆分，可重跑）
  - evaluation/results/wgmpc_predict_split_rec8.json
未改動: 原參數、權重、N、速度與加速度限制、關節限位、停止保護 —— 全部保留
