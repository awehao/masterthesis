id: WG2-REP-1
title: 到達與保持的**重複性**與**歸因消融**
date: 2026-10-02
status: >-
  **2 / 3 趟達成，不是穩定可重現。** 歸因在目前樣本下**無法區分**。
  rec10 的單趟成功仍成立，但不可當成「已解決」。

趟次:
  - {id: rec8, run: wgmpc_wg2_rec8_013936, 補償: 單一 1.4, 預推來源: 請求值, 到達保持: false, in_tol: 22/1200, err_p_p50: 0.01619, err_r_p50: 0.07131, 飽和: 0.586, 最長保持_s: 0.05}
  - {id: rec9, run: wgmpc_wg2_rec9_100815, 補償: 單一 1.4, 預推來源: 請求值, 到達保持: false, in_tol: 35/1198, err_p_p50: 0.01662, err_r_p50: 0.08124, 飽和: 0.646, 最長保持_s: 0.10}
  - {id: rec13, run: wgmpc_wg2_rec13abl_104702, 補償: '**拆分 1.6/1.0**', 預推來源: '**請求值（消融）**', 到達保持: false, in_tol: 90/1200, err_p_p50: 0.01172, err_r_p50: 0.05118, 飽和: 0.215, 最長保持_s: 0.25}
  - {id: rec10, run: wgmpc_wg2_rec10_103450, 補償: 拆分 1.6/1.0, 預推來源: 實際套用值, 到達保持: true, in_tol: 206/489, err_p_p50: 0.00505, err_r_p50: 0.01908, 飽和: 0.172, 最長保持_s: 2.00}
  - {id: rec11, run: wgmpc_wg2_rec11_104130, 補償: 拆分 1.6/1.0, 預推來源: 實際套用值, 到達保持: true, in_tol: 45/487, err_p_p50: 0.01577, err_r_p50: 0.04920, 飽和: 0.318, 最長保持_s: 2.00}
  - {id: rec12, run: wgmpc_wg2_rec12_104319, 補償: 拆分 1.6/1.0, 預推來源: 實際套用值, 到達保持: false, in_tol: 71/1198, err_p_p50: 0.01326, err_r_p50: 0.05210, 飽和: 0.314, 最長保持_s: 0.30}

重複性:
  結果: '**2 / 3**（rec10、rec11 達成；rec12 未達成）'
  rec11 的性質: >-
    只有 45 輪 in_tol 就湊到 2 s 窗 —— 它是**抓到一個幸運的連續段**，
    不是穩定停在容差內。rec10 的 206 輪才是比較實在的。
  rec12: 誤差在 2.6–26 mm 之間徘徊，最長保持 0.30 s
  判讀: '**臨界，不是穩定。** 單趟成功不足以宣稱問題已解決。'

歸因消融:
  設計: 拆分補償不變、預推改回**請求值**（rec13）
  統計界線: >-
    拆分＋實際值 2/3 對 拆分＋請求值 0/1，**Fisher 精確檢定 p = 1.000**
    ⇒ 在目前樣本下**無法區分**，不可宣稱實際套用值是必要條件。
  誤差指標不可區分: >-
    同一配置內的趟間波動（err_p p50 0.00505–0.01577）
    **與配置之間的差距同量級**（rec13 的 0.01172 落在其中）。
    依既有的噪聲底規則，這種差距不可用來比較設定。
  可區分的一項: >-
    **飽和比例**在配置內波動小，且消融就看得出來：
    單一 D ／請求值 0.586、0.646 → **拆分**／請求值 **0.215**。
    ⇒ 飽和大幅下降主要來自**拆分延遲補償**，與預推來源無關。
  未定: 實際套用值預推是否為達成保持的必要條件 —— 需更多趟才能判

熱況: {rec10: 82.5, rec11: 82.1, rec12: 87.2, rec13: 85.4, 限: 92.0, 觸發: false}
熱況備註: >-
  rec12 起跑時只降到 49.5 °C，峰值 87.2 逼近上限。
  連跑時**必須**等降溫（本輪之後改為等到 < 48 °C 才起下一趟）。

結論:
  可以說: >-
    拆分延遲補償（依 rec9 逐筆量到的 D_state 1.6 / D_cmd 1.0）
    把手臂命令飽和由約 0.6 降到約 0.2，且在 3 趟中有 2 趟達成到達與保持。
  不可以說:
    - '「問題已解決」或「穩定到達並保持」—— 2/3 是臨界'
    - '「實際套用值預推是必要的」—— p = 1.000，樣本不足以區分'
    - 用 err_p／err_r 的 p50 比較設定 —— 趟間波動同量級
  下一步建議（未執行）: 同配置再跑數趟把成功率的信賴區間收緊；或先處理殘餘的徘徊機制
