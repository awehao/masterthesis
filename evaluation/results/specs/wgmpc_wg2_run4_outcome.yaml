      但那不是求解端的到達判定；節點的 in_tol 一次都沒成立。）

行為描述:
  - key: 不是高頻抖振
    value: >-
      底盤角速度命令相鄰週期翻號僅 4/1196（0.3%）、vx 3 次、vy 1 次。
      是持續徘徊，不是振盪。
  - key: 命令貼在上限
    value: >-
      送出命令範數 p50 2.105、p95 2.458，vmax 範數上界 2.456；
      34.2% 的週期在上界的 99% 以上。
  - key: 底盤偏航被主動使用
    value: >-
      wz 命令常落在 ±0.100 或 ±0.1999（上限 0.1999）；
      base_yaw 由 0.027 走到 0.284 rad。目標姿態為起始姿態（target_rot_deg = 0），
      故底盤轉動會直接注入姿態誤差。

已定位的模型—實機落差:
  量測方式: >-
    用本趟實錄離線核對，不重跑、不改參數：取 sim log 的實際 q
    （base_x／base_y／base_yaw ＋ joint1..6_act），以核心的 step(q, u, dt) 推一步，
    再與 0.05 s 後 sim 的實際 q 比較；e0／e_pred／e_act **都走同一個 K.fk**。
    q 組法先以 FK 對執行端記錄的 tcp 核對（200 取樣點 p50 1.24e-6 m、max 8.77e-5 m；
    該差距是 Isaac USD 位姿與 URDF 鏈的模型差，在比較中相消）。
  單步預測 vs 實際（n = 1197 週期）:
    位置: {預測變化_p50_m: -0.02330, 實際變化_p50_m: -0.00131, 同向比例: 0.772, 預測減實際_絕對值_p50_m: 0.01806, p95_m: 0.03839}
    姿態: {預測變化_p50_rad: -0.10201, 實際變化_p50_rad: 0.00019, 同向比例: 0.687, 預測減實際_絕對值_p50_rad: 0.09441, p95_rad: 0.17404}
  速度追隨（欄位：節點 applied 段的 qd 對 sim 的 joint*_rate_meas，1197 配對週期）:
    手臂: {迴歸斜率: [0.558, 0.571, 0.571, 0.557, 0.567, 0.555], 命令絕對值_p50: 1.00, 實測絕對值_p50: 0.63}
    底盤: {vx_追隨比: 0.96, vy_追隨比: 1.06}
  設定點落後:
    與命令速率的相關: [0.794, 0.802, 0.800, 0.794, 0.798, 0.793]
    迴歸斜率_s: [0.0632, 0.0649, 0.0644, 0.0631, 0.0640, 0.0629]
    等效時間常數_s: 0.0636        # > 控制週期 0.05 s
    低命令時的帶號落後_rad: [0.0317, 0.0338, -0.0136, -0.0399, 0.0403, 0.0000]
    判讀: >-
      落後與命令速率同號且相關約 0.8 ⇒ **以速率比例的滯後為主**，
      低命令時的帶號落後在 −0.040～+0.040 rad 間依關節而異，
      **沒有**單一方向的常駐偏差。
  勘誤: >-
    本趟分析中我曾報「每關節約 0.067 rad 的常駐設定點落後」。
    那是取**絕對值**、又用 np.gradient(joint*_sp) 當命令速率代理量所致
    （設定點以 20 Hz 更新、log 以 100 Hz 落盤，差分跨步會失真）。
    改用真正的命令速率欄位後結論如上：是速率比例滯後，不是常駐偏差。

成因判讀的界線:
  已量測: >-
    核心的 q_{k+1} = q_k + dt·B(θ)u 假設命令速度在 dt 內完全達成；
    實機手臂達成約 0.56–0.64，等效滯後時間常數 0.0636 s（> 週期 0.05 s）。
    核心的狀態向量裡**沒有**手臂設定點這個隱藏狀態。
  尚未建立: >-
    「此落差造成無法保持」是**單趟的一致性**，不是已證明的因果。
    本趟 n = 1；逐週期統計（1197 週期）支持落差本身存在且量級穩定，
    但不足以排除其他並存因素（例如姿態與位置目標在現行權重
    w_p = 50／w_r = 25、控制正規化 1e-3 下互相拉扯，
    以及 N = 5 僅 0.25 s 視界的短視）。
  可區辨的後續檢定（尚未執行、需核准）:
    - 在核心模型裡加入手臂設定點狀態（一階滯後），同配置重跑，看 in_tol 是否出現
    - 只改視界 N 而不動模型，區辨「短視」與「模型落差」
    - 只給位置目標（移除姿態項），區辨「兩目標拉扯」
    - 以上都會改動已核准配置 ⇒ **不自行執行**

勘誤_20261001:
  說明: >-
    本檔初版（sha 680c317741b3628f）於 Howard 核對原始資料後修正三處。
    原值保留於此，不就地抹除。
  items:
    - key: 設定點更新頻率
      原: '「設定點以 20 Hz 更新」'
      改: >-
        20 Hz 是上游控制頻率；設定點積分在 `_apply` 裡用的是**物理步長**，
        且每物理步呼叫一次 ⇒ **100 Hz**。free4 實測 99.8% 的 10 ms 區間設定點都在變。
    - key: 等效時間常數
      原: '0.0636 s（由「設定點落後對命令速率」迴歸得來）'
      改: >-
        **0.100 s**（由一步關係式 act_{i+1} = act_i + α(sp_i − act_i) + b 直接辨識，
        α ≈ 0.09501）。原值混了時序與動態響應，不採用。
    - key: 判準 5 的措辭
      原: '「到達後保持不住」'
      改: '「尚未建立持續到達與保持」—— 求解週期內 in_tol 始終為零'
    - key: E2 未介入的推論範圍
      原: '以 E2 未介入支持「命令被執行」且未註明安全層'
      改: >-
        E2 未介入只排除 E2。四段紀錄為 unpaired_latest_values_only，
        **不足以排除安全層的影響**。

