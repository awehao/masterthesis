判準逐項:
  - n: 1
    item: 執行端存活且狀態回授出現
    verdict: 成立
    evidence: >-
      /clock、/joint_states（含 finger_joint1/2）、/odom、/wb_sim/status、
      TF odom→base_footprint 皆發布；跑滿 102.34 s、10232 物理步。
  - n: 2
    item: W-GMPC 有發布命令
    verdict: 成立
    evidence: >-
      1197/1198 週期發布；u_prev_src = applied 1197 筆、u_prev_authoritative 全為 true。
      **這是第一／三趟不動的已定原因被消除的直接證據**（那兩趟 u_prev 恆為 0）。
      SQP 每週期收斂（converged_cost 1160、converged_step 37），
      殘差 p95 = 2.22e-16、n_sqp p50 = 3。
  - n: 3
    item: 命令是否真的被執行
    verdict: 成立
    evidence: >-
      exec_mode 全為 0（normal）、api_applied 全為 true、n_rejected = 0、
      cmd_age p50 0.030 s／p95 0.050 s（上限 0.2）。
      四段紀錄中 modified ≈ endpoint_requested ≈ applied 且皆非零。
      E2 **完全未介入**：lam 恆為 1.0、modified 旗標 0.0%、limit_mode 全為 normal。
