id: WG2-RUN5-PRE
title: WG2 增廣模型自由空間**錄影**驗證：事前登錄
date: 2026-10-02
status: >-
  第一次嘗試（wgmpc_wg2_rec5_001849）於起動前保護中止，任務未開始；
  原因已定位並修正，**未自動重跑**。等核准後再跑一趟。
第一次嘗試的中止:
  run_id: wgmpc_wg2_rec5_001849
  中止點: 第 [5/6] 步自由空間通路核對（exit 69）
  原因: >-
    核對腳本的等待迴圈只等 cloud／diag／clock，**不等 diag_fields**，
    後面卻要用它。負載較重時該 latched 樣本傳遞較慢 ⇒ 迴圈先跳出。
    確定性重現：舊條件 0.11 s 跳出且未收到；新條件等 5.11 s 後收到。
    修法是補齊等待，**不是放寬門檻**。
  traceback: 'sim/traceback.txt 的 context invalid 是 cleanup SIGTERM 的**結果**，非原因'
  更正: >-
    我曾由「/clock 只收到 12 則」推論錄影讓 Isaac 明顯變慢 —— **錯**。
    12 則少是因為等待迴圈 0.11 s 就跳出。由 210 張影格實測：
    模擬 20.9 s／牆鐘 33.2 s ⇒ sim:wall 0.630，相對 free4 的 0.997
    僅減速 **1.6×**。原訂時間預算夠用。
  取景: >-
    實拍確認底盤、手臂、目標都在框內；以像素間距反推實際 vFOV ≈ 26–27.6°，
    與光圈假設相符。距離由悲觀 20° 的 4.45 m 收緊為 **3.80 m**
    （對 24° 仍涵蓋，機器人高約 367/720 像素）。

目的: >-
  在已確認的自由空間中，用**增廣狀態模型**（手臂設定點納入狀態）
  跑一趟 W-GMPC，並以模擬器內相機錄影。
  判準仍是位置 5 mm／姿態 0.02 rad 且保持 2 s。

與 free4 的差異（只動模型選擇、錄影與時間預算基準）:
  - key: 手臂執行模型
    value: >-
      `--arm-model setpoint`（free4 是 ideal）。
      辨識檔 wgmpc_arm_sp_ident_free4.json（α p50 0.09501、phys_dt 0.01）。
      **節點預設仍是 ideal**，不傳就會跑成原核心 —— 這是 runner 原本的缺口，已補。
  - key: 錄影
    value: >-
      模擬器內相機 /World/rec_cam，**1280×720 @ 10 fps**
      （不用預設的 1920×1080／30 fps）。每 10 個物理步取 1 格。
      **非桌面錄製。**
  - key: 任務時間預算
    value: >-
      改以**模擬時間**對齊 free4：`--duration-sim-s 60`（free4 任務覆蓋模擬 59.61 s），
      牆鐘上限放寬到 400 s。理由：free4 無錄影時 sim:wall = 0.997，
      加 render 後會變慢，只靠牆鐘上限會讓任務拿到的模擬時間比 free4 少，
      而 free4 的最小位置誤差出現在 sim 98.95（接近末段）。
  - key: 封存判定
    value: >-
      原本用「`sim/` 內有任意 JSON」判定。加入錄影後，存在不等於結果已落盤。
      改為內容核對（wgmpc_wg2_archive_check.py）：wb_run.json 能解析、
      必要紀錄齊備、**錄影索引與磁碟影格數一致**、影格非空、索引時間單調、
      模型選擇吻合。已用 free4 做正負兩向核對（legacy exit 0／要求新模型 exit 71／
      要求錄影 exit 72）。

保留的兩個口徑:
  - key: RTF 0.630 的適用範圍
    value: >-
      **該值來自任務尚未開始的片段**（第一次嘗試在起動核對就中止，
      210 張影格涵蓋的是起動階段）。由它推得的「任務需牆鐘約 95 s、
      Isaac sim-limit 需約 191 s」**只是時間估計**，
      求解器運作後的 RTF 可能不同，不保證相同。
      故 **400 s 牆鐘上限維持不變**，不依這個估計調降。
  - key: 3.80 m 是**新**取景配置
    value: >-
      先前 4.45 m 的實拍只驗證了**那個**配置，
      **不能當成 3.80 m 已驗證**。3.80 m 尚未經實拍確認，
      下一趟取得影格後才算驗證。本趟的八角點涵蓋判定仍是幾何推算。

