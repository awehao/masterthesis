id: WG2-RUN5-PRE
title: WG2 增廣模型自由空間**錄影**驗證：事前登錄
date: 2026-10-02
status: 入口核對已通過；**Isaac 未啟動**，等使用者重新確認插電與在場後只跑一趟

目的: >-
  在已確認的自由空間中，用**增廣狀態模型**（手臂設定點納入狀態）
  跑一趟 W-GMPC，並以模擬器內相機錄影。
  判準仍是位置 5 mm／姿態 0.02 rad 且保持 2 s。

與 free4 的差異（只動模型選擇、錄影與時間預算基準）:
  - key: 手臂執行模型
    value: >-
      `--arm-model setpoint`（free4 是 ideal）。
      辨識檔 wgmpc_arm_sp_ident_free4.json（α p50 0.09501、phys_dt 0.01）。
      **節點預設仍是 ideal**，不傳就會跑成原核心 —— 這是 runner 原本的缺口，已補。
  - key: 錄影
    value: >-
      模擬器內相機 /World/rec_cam，**1280×720 @ 10 fps**
      （不用預設的 1920×1080／30 fps）。每 10 個物理步取 1 格。
      **非桌面錄製。**
  - key: 任務時間預算
    value: >-
      改以**模擬時間**對齊 free4：`--duration-sim-s 60`（free4 任務覆蓋模擬 59.61 s），
      牆鐘上限放寬到 400 s。理由：free4 無錄影時 sim:wall = 0.997，
      加 render 後會變慢，只靠牆鐘上限會讓任務拿到的模擬時間比 free4 少，
      而 free4 的最小位置誤差出現在 sim 98.95（接近末段）。
  - key: 封存判定
    value: >-
      原本用「`sim/` 內有任意 JSON」判定。加入錄影後，存在不等於結果已落盤。
      改為內容核對（wgmpc_wg2_archive_check.py）：wb_run.json 能解析、
      必要紀錄齊備、**錄影索引與磁碟影格數一致**、影格非空、索引時間單調、
      模型選擇吻合。已用 free4 做正負兩向核對（legacy exit 0／要求新模型 exit 71／
      要求錄影 exit 72）。

不變: >-
  N=5、dt=0.05、目標偏移 [0.25, 0.15, 0.05]、到達 0.005 m／0.02 rad、保持 2 s、
  w_p=50／w_r=25／正規化 1e-3、速度與加速度框、L1 低速框
  （0.035255／0.199900／0.999900）、輪級限制、兩組關節限位、等價正值列縮放、
  SQP 政策、r_tol 1e-6、accepted_status ('solved',)、
  freespace_confirmed:=true、缺資料／過期／溢位的停止規則、
  sim-limit 120、熱中止線 92 °C。

取景:
  涵蓋: URDF 連桿原點 ∪ free4 實際 TCP 與底盤軌跡 ∪ 目標，加 0.12 m 幾何加厚
  包絡: {lo: [-0.375, -0.375, 0.0], hi: [0.64, 0.375, 0.894]}
  at: '0.1322,0.0000,0.4468'
  eye: '2.4581,-3.4512,2.0224'
  距離_m: 4.45
  判定方式: >-
    八個角點投影進視錐（含 12% 邊框餘裕），**不用外接球**那種過保守判準。
    vFOV 20°／24°／27.6° 三種假設下都涵蓋
    （垂直佔可用框 100%／83%／72%）。
  光圈假設: >-
    FOV 由「水平光圈 20.955 mm、焦距 24 mm、16:9」推算，
    **光圈值未經驗證**（要開 Isaac 才讀得到）⇒ 距離以**悲觀 vFOV 20°**訂。
    趟後要用首幾格影像確認實際取景。
  目標標記: >-
    '0.44700,0.15000,0.44999'（名目 FK(q=0) ＋ 偏移）。
    與 free4 實錄目標差 0.0016 m，遠小於標記半徑 0.020 m。
    **權威目標是節點趟中算出並寫進 wg2_out.json 的那一個。**
    標記為純視覺（UsdGeom.Sphere ＋ 顯示屬性，無 CollisionAPI），
    且建立時機在 solver_freespace 場景檢查之後 ⇒ 不會觸發 return 8。

入口核對:
  腳本: evaluation/wgmpc_arm_setpoint_ident.py 之外另立 evaluation/wgmpc_wg2_entry_check.py
  結果: 全部通過（A–H 共 8 組），報告 evaluation/results/wgmpc_wg2_entry_check.json
  我自己踩到並修掉的核對缺陷:
    - shv() 用 `[;\s]` 當賦值前綴，把 run-label 裡的 `N=5（$ARM_MODEL 模型）` 讀成 N 的值
    - 危險樣式掃原文，把註解「不用 pkill」與訊息「不自動重跑」誤判成行為 ⇒ 改為只掃可執行碼
  資源: 可用磁碟 728 GB；最多 1200 格、估 ≤ 1.2 GB

趟後要分開報告的五項:
  items:
  - 1. 實際選用的模型（由 run_config.json 與 wg2_out.json 的 args.arm_model 兩處對帳）
  - 2. 握手與執行健康（啟動握手筆數、gate 狀態歷程、exec_mode、api_applied、cmd_age、步序不符次數）
  - 3. 是否達到位置 5 mm／姿態 0.02 rad **並保持 2 s**（in_tol 與 hold_elapsed，用實測 FK 不用核心預測）
  - 4. 時效與溫度（求解 p50/p95、超週期比例、sim:wall、CPU 峰值）
  - 5. 影片位置與影格數
  耗時比較的註明: >-
    **錄影增加了 render 負載**，所以與 free4 的耗時比較必須註明這項差異；
    sim:wall 與超週期比例不可直接當成「模型造成的變化」。

保護與約束:
  - 熱中止線 92 °C，**不得提高**
  - 中止後**不自動重跑**
  - 獨立趟次目錄（free4 原樣保留）、獨立 domain、只清理本趟記錄的 PID
  - 不用 pkill、不做廣泛字串比對、不殺共用 process group
  - 不調門檻、不放寬保護、不繞過起動前檢查
  - 封存不完整則標記並保留結果，不自動重跑
  - '**只跑一趟**'

可承諾與不可承諾:
  可承諾: 把這趟安排成有紀錄、有影片的驗證
  不可承諾: >-
    下一趟一定成功。若未達標，影片仍保留為**診斷實錄**，
    不包裝成成功展示。
