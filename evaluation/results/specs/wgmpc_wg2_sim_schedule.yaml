id: WG2-SCHED-1
title: WG2 控制時槽改以**模擬時鐘**驅動：時間與快照使用契約
date: 2026-10-02
status: 離線核對通過；**Isaac 未啟動**，等核准後再安排同配置含錄影的一趟

為什麼改: >-
  模型的 dt = 1/rate = 0.05 s 是**模擬時間**，但 `_reschedule()` 原本用
  `time.monotonic()` 排程，是**牆鐘**。RTF = 1 時兩者重合（free4，RTF 0.997），
  RTF < 1 就脫鉤：rec6 實測 RTF 0.579，以模擬時間計的控制率變成 34.7 Hz、
  相鄰發布間隔 p50 0.030 s，而核心仍假設 0.050 —— **時間契約不一致**。
  這不是錄影才有的問題，錄影只是把它暴露出來。

Howard 的兩處更正（已採納）:
  - key: 彈開不可歸因於重複快照
    value: >-
      三次進入容差到下一輪離開容差，快照間隔**都是 0.05 s**。
      修正排程是必要的一步，**不是成功保證**。我原本說「與重複快照一致」
      過度，已改為不下因果。
  - key: 1304 / 2081 不是丟失率
    value: >-
      前者是 E2 接收次數、後者是求解端發布次數，中間還有安全層的定時輸出，
      且**沒有逐筆配對**。**撤回「37% 命令未被取用」的說法**，兩個計數分開保留。

改動範圍（只動時間排程與快照使用契約）:
  - key: 時槽基準
    value: >-
      改由**同一個模擬時鐘**驅動，名目間隔維持 0.05 s 模擬時間。
      N=5、模型、辨識參數、權重、限制、錄影配置**全部不變**。
  - key: 重複／過舊快照閘門
    value: >-
      每輪只用**新的**完整同時刻快照。同一時間鍵不得重複求解，
      且 `snap.sim_t <= 上次已求解的 sim_t` 也擋下（較舊快照不得覆蓋
      較新的控制依據）。被擋的輪次記 `snapshot_duplicate` 或
      `snapshot_not_newer`，計入 `n_dup_skip`。
  - key: 等待期間
    value: >-
      仍服務回呼與失效訊息。模擬時間暫停時就一直等
      ⇒ 不持續求解；保持計時本來就以模擬時間算，故不會累積。
      **牆鐘監看與上限照舊**，在等待迴圈內檢查；另加
      `--sim-stall-wall-s`（預設 10 s）在時鐘停滯過久時中止並標明原因。
  - key: 錯過時槽
    value: >-
      跳到下一個**未來**時槽，不密集補發。跨過多個時槽時**丟棄暖啟動重建**
      （暖啟動序列假設只前進一步）。**不以臨時更動模型 dt 補救。**
  - key: 分項紀錄
    value: >-
      每輪記 `timing.snap_sim_t`／`solve_start_sim_t`／`solve_wall_ms`／
      `slot_target_sim_t` 與 `publish_sim_t`；統計含 `n_dup_skip`、
      `n_missed_slot`、`n_warm_discard`、`n_sim_stall`、`slot_basis`。

最小反例核對:
  腳本: evaluation/test_wgmpc_sim_schedule.py（S1–S5，全部通過，無 Isaac）
  替身: evaluation/wgmpc_sp_stub_endpoint.py 新增 --rtf／--pause-at／--drop-js-at
  S1_不同RTF:
    結果: {RTF_1.00: 20.0 Hz, RTF_0.50: 20.0 Hz, RTF_0.25: 20.0 Hz, 跨RTF極差: 0.00 Hz}
    對照: 'rec6 牆鐘排程、RTF 0.579 ⇒ 34.7 Hz、間隔 p50 0.030 s'
  S2_時鐘暫停與恢復: 暫停期間無新發布、保持計時未前進、恢復後續發、未誤判為停滯中止
  S3_缺測: /joint_states 停發後立即停止發布（最後 sim 5.00，缺測於 5.00）、無過期結果放行、被擋輪次留有理由
  S4_跨時槽: {missed_slot: 1318, warm_discard: 755, 最大間隔_s: 0.34, 最小間隔_s: 0.13, 重複求解: 0}
  S5_分項紀錄: 每輪四項時間欄位與五項統計齊備
  三項共同契約: 不重複求解、不追趕式發布、不放行過期結果 —— S1–S4 皆通過
  我自己踩到的測試缺陷: >-
    S4 初版用**低** RTF 想逼出長求解跨時槽，方向寫反了 ——
    求解耗的是牆鐘時間，RTF 低時同樣的牆鐘耗時佔掉**更少**模擬時間，
    反而更容易趕上。初版 missed_slot = 0，該項是**空過**。
    改用 RTF 4.0 後才真的走到跨時槽路徑。

回歸: 增廣核心 T1–T7、握手 H1–H12、介面 I1–I5、入口核對 全部通過；ideal 路徑間隔 p50 0.0500 s、dt=0 次數 0
未改動: wgmpc_core.py 與 wgmpc_core_sp.py 皆零改動（git diff 為空）

界線:
  - '**每 0.05 s 模擬時間更新一次，不等於已證明實機能達到 20 Hz。**'
  - 替身沒有物理 ⇒ 本輪不判到達與保持
  - 時間契約對齊是**必要條件**，不是到達保持會成功的保證
  - 下一趟才是在問：時間契約對齊後，增廣模型能不能到達並保持
