    最差關節改善倍數: {實錄設定點: 62.9, 命令遞推: 28.1}
  與 Howard 數字的差異: >-
    α（0.0950）、τ（0.100 s）、設定點追蹤最差關節 RMSE（0.442 mrad）三項**完全吻合**。
