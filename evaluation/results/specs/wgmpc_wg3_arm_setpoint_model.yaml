  50ms_預測_RMSE_mrad:
    說明: 兩個模型用**同一段實際套用的命令／設定點歷史**；後半驗證段
    逐物理步滑動_n2976:
      理想速度積分_現行核心: [27.829, 27.611, 27.926, 27.519, 27.606, 27.806]
      設定點追蹤_設定點取實錄: [0.010, 0.442, 0.034, 0.041, 0.003, 0.001]
      設定點追蹤_設定點由命令遞推: [0.825, 1.035, 0.832, 0.802, 0.794, 0.827]
    對齊控制週期_n598:
      理想速度積分_現行核心: [27.912, 27.671, 27.900, 27.591, 27.646, 27.860]
