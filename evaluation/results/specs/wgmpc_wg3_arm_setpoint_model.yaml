三、增廣狀態模型:
  檔案: src/ammr_wholebody_mpc/ammr_wholebody_mpc/wgmpc_core_sp.py（新檔）
  狀態: 'z = [q (9) ; s (6)] ∈ R^15，s = 手臂位置設定點'
  控制: 'u ∈ R^9 **維度不變**；s 只能由 u 的手臂分量驅動，**不是新增六個致動自由度**'
  控制步映射: >-
    把每物理步的關係式連乘 kp = dt_c/dt_p = 5 次，得閉式且**嚴格線性**的
    x_next = P⊙x + Q⊙s + G⊙u_a + h、s_next = s + u_a·dt_c，其中
    β = 1−α、P = β^kp、Q = 1−β^kp、G = α·dt_p·Σ_{j<kp} j·β^{kp−1−j}、h = b(1−β^kp)/α
  關鍵數值: {P: 0.607042, Q: 0.392958, G: 0.008640, dt_c: 0.05, G對dt_c比值: 5.79}
  為何不能把 α 當 50 ms 係數: >-
    **G ≈ 0.00864 ≠ dt_c = 0.05**（差 5.79 倍）。50 ms 內的位移主要來自
    Q⊙(s − x) 這一項，而不是 G⊙u —— 這正是設定點必須進狀態的原因。
  compose_的防護: dt_ctrl 非 phys_dt 整數倍時**拋錯拒絕近似**
  仿射模型: >-
    手臂與設定點區塊嚴格線性 ⇒ **無線性化誤差**（實測 ≤ 6.7e-16）；
    只有底盤三維仍是在 nominal 處的線性化，與原核心同源（實測 6.4e-6）。
  增廣狀態初始化: >-
    `make_z(q, s)` 在 s 含非有限值時**拋錯**，不以實測關節角代替。
    free4 實測設定點與實測關節角的落後與命令速率相關約 0.8，兩者不可互代。
  關節限位: >-
    拆成 `setpoint_position` 與 `measured_position` 兩組。
    執行端的硬失效（`_apply` 的 `_fail`）檢查的是**設定點**，
    故前者才是對應執行端的那一道；兩者都保留 joint_margin = 0.05（執行端不留餘量 ⇒ 保守方向）。
  SQP 政策: 逐字沿用原核心（暖啟動末步減速、nominal 可行性預檢、逐候選閘門、可行性恢復步、五種停止狀態、任一次 QP 失敗即 no_valid_solution、對實際回傳序列的最終殘差核對）

四、離線核對結果:
  腳本: evaluation/test_wgmpc_core_sp.py（T1–T7，全部通過）
  items:
    - T1 閉式連乘 == 顯式逐物理步連乘（200 組隨機輸入，最大差 3.25e-14）
    - T2 退化核對：α→1、b=0 時 G → (kp−1)·dt_p = 0.04，即「落後一個物理步的理想模型」
    - T3 手臂與設定點區塊仿射 == 非線性（≤ 6.7e-16）；底盤仍有線性化誤差（6.4e-6）
    - T4 輸入防護：非有限設定點、非整數倍 dt、α 不在 (0,1) 皆拒絕
    - T5 由 free4 實際狀態求解成功（converged_cost，殘差 1.39e-17）；控制仍 9 維
    - T6 設定點限位列形式正確（hi == 剩餘餘量、係數 == 前 k 步各 dt）；成功回傳的解一律遵守
    - T7 一控制步預測誤差：位置 p50 0.01338 → 0.00076 m（17.5×）、姿態 p50 0.07375 → 0.00229 rad（32.3×）

五、已知缺陷與未完成事項（物理對照前必須處理）:
  - id: D-SP-1
    item: 設定點逼近限位時 QP 打到 OSQP 迭代上限
    evidence: >-
      餘量 d ∈ {0.2, 0.02, 0.004} 時回 qp_failed（qp_status =
      maximum iterations reached, 20000 次）；原核心在同樣的 6 個餘量下
      **全部回傳有效解**。**這是本次增廣新引入的，不可歸為既有問題。**
    cause: >-
      `measured_position` 的複合增益 G ≈ 0.00864 遠小於其他區塊係數，
      正規化後整體 |係數| 跨度由 **28.4× 擴到 115.8×**。
      診斷：暫時移除該區塊後三個餘量全部恢復 converged_cost。
    candidate_fixes: >-
      (a) 移除 `measured_position` —— 可論證它被 `setpoint_position` 蘊含：
      α ∈ (0,1) ⇒ x⁺ 是 x 與 s 的凸組合，25 個物理步的最大累積偏置
      6.79e-3 rad（餘量 0.05 的 13.6%）；(b) 對該區塊的列做縮放；
      (c) 調整 QP 設定。**三者都改動已核准的約束集合或 QP 設定 ⇒ 未自行採用。**
  - id: D-SP-2
    item: 執行端**沒有發布**手臂設定點
    evidence: >-
      publisher 僅 /clock、/joint_states、/odom、/wb_sim/status、
      /coman/applied_cmd（帶 qd，非 sp）、/coman/applied_cmd_meta、/coman/applied_fail。
    impact: 節點**無法**依裁定第 3 點「取執行端真實設定點」初始化增廣狀態。
    note: >-
      由 /coman/applied_cmd 的 qd 積分回推在原理上可行（setpoint_init 時等於實測關節角），
      但掉一則訊息就漂移，且違反「不假設等於實測關節角」的意旨。
      最小改法是在執行端新增一個設定點回報話題 —— **未自行新增**。
  - id: D-SP-3
    item: 求解耗時上升
    evidence: >-
      free4 的 60 個實際狀態：增廣 p50 24.7／p95 37.2／max 111.0 ms，
      原核心 p50 16.2／p95 21.1／max 41.4 ms。超過 50 ms 週期的比例 3% 對 0%。
    note: 分項 p50 —— qp_iter 8.53、H 5.68、cost 2.52、rollout 1.05 ms

六、界線:
  - α 與 b 由**單趟**（free4，n=1）辨識，是候選參數；前半估／後半驗證只排除「同時擬合與驗證」，**不等於跨趟泛化**
  - 其他負載、姿態與接觸情境未涵蓋
  - 離線核對從**執行端設定點**起算，故與安全層、E2 分離；**但這不表示安全層未影響 free4 的閉迴路行為**
  - 預測改善**不等於**閉迴路會到達並保持 —— 需另行安排同目標的物理對照
