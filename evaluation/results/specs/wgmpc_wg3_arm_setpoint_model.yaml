id: WG3-ARM-SP-1
title: W-GMPC 手臂執行模型修訂：含設定點的增廣狀態（候選）
date: 2026-10-01
status: '**候選模型，未定版**。離線核對已完成；物理對照尚未安排。'
scope_ruling: >-
  Howard 2026-10-01 裁定：只做一項模型修訂，先不改 N、不移除姿態目標、
  不調權重。明確禁止「把手臂命令除以 0.56」這類固定增益補償捷徑
  —— 該比例混合了時序與動態響應，不可直接反轉。

