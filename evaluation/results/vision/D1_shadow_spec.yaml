# D1-shadow／V1-online：腕部 RGB-D 把手觀測線上化（shadow，不接控制）——規格 draft-2
# draft-2：依 Codex reviews/20261005_110649_reply.md 修搜尋帶、L2 端點定義、誤認計數、分母與時間、重播／線上負載分開
# 2026-10-05。依 Codex reviews（第六次後下一步）；不是計畫 §9.7 的 V2（V2 = 視覺預抓取，涉及控制）
schema: d1_shadow_spec/1
status: 'draft-2（門檻已定；演算法參數可在開發集調整，保留集評估前凍結）'

問題: '在現有 MotM 抽屜任務的接近軌跡上，腕部 RGB-D 能否在不改控制、不增加停車的前提下，自動產生可用的把手觀測？可用到什麼距離、什麼量？'
不做: '不發布任務目標、協同設定或速度命令；不改控制器、任務節點、凍結的 WG4 比較；不訓練 DL；不宣稱閉迴路視覺控制或 V2'

# ================================================================ 前置：觀測窗口（離線，已做）
觀測窗口: >
  evaluation/d1_observation_window.py（投影幾何上限，無遮擋、無算圖品質），對 c0b1_p3r_H5、wg4b_f02_P、mt_b1_02_P：
  ALIGN 之前（導航末段＋減速段＋展開初期）有約 10.3–10.5 s 整根橫桿＋中心都在畫面內且深度有效
  （相機–橫桿中心 3.0 → 0.5 m；橫桿影像長約 31 → 208 px、直徑約 4 → 27 px），之後展開初期再約 1 s（0.5 → 0.4 m）；
  ALIGN 起（< 0.2 m）中心始終在畫面外、只見局部；ENGAGE_WAIT 完全看不到。
  ⇒ 觀測放在**完整 MotM 任務的接近途中**（不加停車；不稱「全身接手後的移動中觀測」），ALIGN 段只做可見表面點（同 V1）。
  與 V1 核對：c0b1_p3r_H5 在 45.3–48.0 s 中心 v 591–600（畫面外），與 V1 記錄一致
  限制: '控制權與相位依**各趟實錄**標示（例：wg4b_f02_P 導航至 35.91 s、減速段至 37.28 s、之後全身展開；不套用到其他趟）；遮擋（夾爪／手指）與算圖未計入，需實際影格確認'

# ================================================================ 1 輸入與方法
輸入: 'RGB、深度、CameraInfo（讀回內參）、擷取時刻相機位姿（V0 的姿態歷史，按影格 rendering_time 匹配，容差 0.25·dt）'
方法（確定式，首版；定位＝已知類型與尺寸的深度幾何辨識）: >
  深度點雲 → RANSAC 擬合多個平面，**由觀測決定前板候選**（法向近水平、位於地面之上、其前方存在合格突出物；
  不指定真值前板，最大平面可能是地面或牆）→ 取該平面前方 **20–60 mm** 的點（幾何依據：前板外表面本地 y = −0.245 m、
  桿心 −0.285 m、半徑 13 mm ⇒ 橫桿表面距前板 27–53 mm，另各留 7 mm 預留量）→ 歐式分群 →
  對每群以 RANSAC 擬合圓柱（半徑固定為先驗 13 mm），**柱子等不符圓柱模型的點作為離群點分離**（資料驅動，不用真值刪除）→
  依軸線長度與水平方向篩選候選。RGB 只用於疊圖與人工檢視，不參與決策
禁止: '不得用把手真值（或其投影）生成 ROI、挑候選、補位置或決定拒絕；真值只在獨立評估端讀取'

# ================================================================ 2 輸出語意（只輸出實際可辨識的量）
輸出層級:
  L0_可見表面點: '圓柱擬合內點的三維點（世界座標，擷取時刻）'
  L1_橫桿軸線: '圓柱軸線方向（正負等價）＋軸上一點；需內點 ≥ N_min 且軸線長度方向覆蓋 ≥ 40 mm'
  L2_把手中心: >
    只在兩端都可辨識時輸出兩端中點。「端點可辨識」同時要求：(i) 端部邊界被觀測到——沿軸的內點分布在該端有明確截止，且截止處外側
    的同一射線上觀測到更遠的背景（前板或更遠），不是深度缺失或遮擋；(ii) 端點投影距影像邊界 > 5 px；(iii) 兩端距離與先驗長度
    200 mm 相差 ≤ 15%。**不得用已知長度補出未見端點**。任一條件不足 ⇒ 只輸出 L0／L1、拒絕 L2（center_unobservable）
  L3_抓取位姿: '本包不輸出'
話題: '/d1/handle_obs（獨立節點；含層級、時間戳、年齡、拒絕原因）；不發布 /drawer/tcp_target、/wgmpc/coord、任何速度命令'

# ================================================================ 3 有效與拒絕
分母: '逐層有效率＝該距離箱內**全部新影格**（含拒絕影格）為分母，不限真值判定為完整可見者'
丟失: '沒有新影格（no_frame）與傳輸丟失另計數，不從有效率中消失'
連續有效窗: '遇拒絕、或相鄰有效影格間隔 > 2 個取樣週期（5 Hz 下 0.4 s）即中斷'
距離定義: '有效深度判斷用**光軸深度**；距離分箱用**相機光心到真值橫桿中心的歐氏距離**（只供評估分箱）；兩者不混用'
拒絕原因: 'no_frame、time_match_fail、depth_insufficient（有效深度點 < 門檻）、no_plane、no_candidate、ambiguous（≥ 2 個合格候選）、degenerate_fit（擬合條件數或殘差過大）、center_unobservable（L2 專用）'
舊觀測: '不沿用；若下游保留，須帶年齡，不能冒充新結果'

# ================================================================ 4 誤差參考（獨立評估端）
參考: 'L0：同一射線與真值橫桿圓柱表面的第一交點（同 V1）；L1：與真值軸線的角度差（消除正負號歧義）與點到軸距離；L2：與真值中心的三維距離'
誤認: >
  L0 選到其他物件（射線未交到真值橫桿）記為**誤認**，不刪除後再算誤差；L1 軸線偏離真值軸 > 20 mm 或 > 15° 記誤認；
  L2 另報「接受但錯誤」（誤差 > 30 mm）的候選數
獨立評估要求: '中心在畫面外或端點被裁切的影格，L2 必須拒絕——由評估端以真值判定並計數違反；觀測器本身不讀真值'
報告: '誤差一律附有效覆蓋率、樣本數、連續有效窗與按距離分箱（0.4–1.0、1.0–2.0、2.0–3.0 m）；不只展示接受影格'

# ================================================================ 5 時間與負載
時間: '記擷取（rendering_time）、接收、估計完成（牆鐘與模擬時間分開）、輸出年齡'
負載: >
  S1–S3（重播、無控制器求解）只報估計耗時與影格丟棄，不判定控制週期。控制週期、漏時槽與感知負載只在 S4 核對；
  與歷史無相機趟次比較只作參考，不能量化相機造成的純開銷
頻率: '沿用 5 Hz 首版觀測；不宣稱足夠閉迴路'

# ================================================================ 6 控制隔離
隔離: '獨立節點、獨立觀測話題；控制繼續使用明示的真值目標來源；感知故障不得阻塞控制；共用 CPU／GPU 負載要量測'

# ================================================================ 事前品質門檻（draft，待 Codex 審後凍結；不沿用控制的 5 mm 容差）
門檻（首版工程目標，Codex 同意；通過不代表可抓取）:
  L2_中心: '0.4–1.0 m：有效率 ≥ 60%、誤差中位 ≤ 10 mm、p95 ≤ 20 mm；1.0–3.0 m 只報告不設門檻'
  L1_軸線: '角度差中位 ≤ 3°'
  拒絕正確性: '見「獨立評估要求」'
  附帶: '一律附樣本數、覆蓋率、連續有效窗與誤認數'

# ================================================================ 步驟與資料分割
步驟:
  S1_重播擷取: >
    Isaac 重播 wg4b_f02_P（P 完成趟）26–44 s，腕部 RGB-D 5 Hz（--wrist-v0 replay，沿用 V0 工具），只渲染、不控制；
    約 90 格。這是開發集。保留集（mt_b1_02_P 同類窗口，依該趟實錄的相位定窗）在開發定案後才擷取／評估
  S2_離線辨識: '在開發集上實作 L0–L2 與拒絕；人工檢視疊圖；門檻與參數只在開發集上定'
  S3_保留集一次評估: '凍結程式與參數後，保留集只評一次。只驗同場景不同軌跡的可轉移性，不是跨物件泛化；保留集失敗後若調整，須另標開發修訂，不再稱未見保留測試'
  決策點: '先做 S1＋S2；有自動辨識疊圖與逐影格結果後，再決定是否進 S3 與 S4；不直接接控制'
  S4_線上功能確認: '一趟 P（MOTM）實跑，shadow 節點同時運行；核話題隔離、負載、控制週期；不排整批'
時間成本: '觀測在既有接近途中進行，不增加停車；若之後需要額外觀測姿態，必須另列並報總時間'
MotM時間: '仍列未完成（mt_b1 快約 0.23 s，無明顯提速證據）；本包不改流程時間'
