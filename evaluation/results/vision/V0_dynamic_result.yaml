證據範圍: >
  模擬、無雜訊、重播既有位姿（相機速度很低）：支持「時間匹配與 5 Hz 取樣／發布在動態下成立」，以及有效深度的相位分布。
  不支持：感知性能、實機時間同步、快速運動下的對齊、閉迴路視覺控制
