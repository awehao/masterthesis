# V0：腕部 RGB-D 通路（規格草稿，待 Codex 審查；未實作、未開跑）
# 2026-10-05。依 Codex 排序（reviews/20261005_033049_reply.md、20261005_035127_reply.md）
schema: vision_v0/1
status: 'draft-2（依 Codex reviews/20261005_040006_reply.md 修三處；核准實作）'

目標: >
  第一份可見成果：**腕部影像＋對齊深度＋把手三維位置疊圖**。用人工選定的把手區域完成三維定位，
  只證明「相機資料、內參、深度單位、光學座標與擷取時刻 TF」整條鏈是對的。
不在 V0:
  - 接控制（不餵給 W-GMPC、不改任務流程）
  - 訓練 DL、自動偵測把手
  - 六維抓取位姿（只做三維位置）
  - 實體 RealSense（見相機來源）

# ---------------------------------------------------------------- 1 相機來源
相機來源: >
  **Isaac 模擬的腕部 RGB-D**。現況：URDF 有 D435 的連桿鏈（xarm_description d435i 描述，掛在 link_eef），
  但 Isaac 只有一台世界固定的錄影相機（/World/rec_cam），**腕部相機尚未存在、也未串流** ——
  URDF 相機模型不當成已串流。實體 RealSense 不在 V0（之後另立規格）。
掛載: >
  相機 prim 掛在機器人 USD 的 link_eef 下，固定變換取自 URDF：
  link_eef →[xyz 0.06746 −0.0175 0.0237, rpy π −π/2 0]→ camera_link →[0 0.015 0]→ camera_color_frame
  →[rpy −π/2 0 −π/2]→ camera_color_optical_frame（ROS 光學慣例：z 前、x 右、y 下）。
  若 URDF 匯入時空連桿被合併，以 link_eef 加上述合成變換建立 prim；USD 相機慣例（看向 −Z、+Y 上）
  與 ROS 光學座標相差繞 x 軸 180°，在建立時處理並以投影核對驗證（見驗收 A2）。

# ---------------------------------------------------------------- 2 資料與座標
影像: 'RGB 640×480（降低算圖負載與熱）；名目水平視角取 D435 彩色 69°，由此算 fx＝fy、主點在中心 —— 是模擬名目值，不是實機校正'
深度: >
  同一相機 prim 的 distance_to_image_plane（**光軸方向深度**，不是歐氏距離）⇒ 與彩色天然對齊（同光心；實機 D435
  的深度來自 IR 對、要另做對齊，報告中明寫差異）。話題比照 realsense-ros 的 aligned_depth_to_color：16UC1、mm、
  0 = 無效（量程外 0.1–3 m）；**另存原始浮點公尺深度**（npy），避免只剩量化資料
CameraInfo: '640×480、plumb_bob 畸變全 0（模擬無畸變）、K／P 由上述 fx、cx、cy 組成；frame_id camera_color_optical_frame'
影格: >
  保存**實際算圖影格編號與擷取時間**；同一次算圖的 RGB、深度與對應相機姿態一起保存。暖機後取 **20 個新影格**
  （影格編號必須遞增、不重複），不是同一緩衝區讀 20 次。不把「讀取當下的模擬時間」貼到舊影格上
時間戳: '用該影格的擷取時間；影像、深度、CameraInfo 同一個戳'
擷取時刻TF: >
  與影格同一次算圖讀 camera_color_optical_frame 的世界位姿並保存；ROS /tf 以同一戳發布。另核對相機 prim 的掛載變換與
  URDF 合成變換一致；**同名 optical frame 不得同時由兩個 TF 來源發布**（例如 robot_state_publisher 已發時不重發）
話題: '/wrist/color/image_raw、/wrist/aligned_depth_to_color/image_raw、/wrist/color/camera_info；另存檔（png＋npy＋json）供離線核對'
頻率: '5 Hz（V0 只求正確，不求即時）；記算圖耗時與熱'

# ---------------------------------------------------------------- 3 場景與流程（不接控制）
場景: >
  抽屜房，抽屜關閉；機器人以「瞬移」放在基準停位，不跑控制器。手臂在**經離線投影挑選的觀測姿態**：基準夾持姿態的
  TCP 沿 −y 退 0.20 m（離線 IK）。不代表原接觸前姿態已適合視覺。
  **修訂時序（照實）**：原寫「接觸前姿態（ALIGN standoff 30 mm）」。在 v0_wrist_1 之前，離線投影顯示該姿態下橫桿距相機約
  8–9 cm、投影在影像外，決定改用 0.20 m（模擬器 --wrist-q 的說明文字即寫 0.20 m）；但預設值誤填成 0.03 m 的解，
  v0_wrist_2 才因此失敗、隨後改正。本段規格文字是 v0_wrist_3 跑完後才補登；沒有版本紀錄可證明修訂早於所有量測，
  故**不宣稱**「完全不依任何量測」。0.1 m 是本批的有效深度規則，不拿來主張實體 D435 的工作能力
流程: >
  起模擬器（只物理＋算圖）→ 暖機後讀回實際構型（不宣稱控制器抵達該姿態）→ 擷取 20 個新影格（靜止）
  → 人在第一張影像上框選把手橫桿區域，**再選定一個可見橫桿表面像素**（框與像素先存檔，之後才顯示真值誤差；不能照真值調框或補深度）
  → 該像素小鄰域（例如 5×5）的有效深度中位數，沿**該像素射線**反投影得相機座標點 → 以同影格的相機姿態轉世界
  → 輸出「**把手可見表面三維點**」（不是把手中心）→ 與真值比較 → 疊圖：彩色、深度偽色、框、選點、真值投影點、數值

# ---------------------------------------------------------------- 4 驗收
acceptance:
  A1_資料完整: '三個話題與存檔都有；編碼（rgb8、16UC1）、frame_id、時間戳＝擷取物理步；CameraInfo 尺寸與 K 自洽'
  A2_選框核對: '真值把手中心以讀回內參與同影格相機姿態投影回影像，落在人工框內；與框中心像素差另報（≤ 15 px 只是人工框對準條件，不是內外參標定精度）'
  A3_深度核對: >
    選定像素射線與真值橫桿圓柱（半徑 13 mm、真值位姿）的第一個交點 = **表面參考**；量得的光軸方向深度 vs 該參考的
    光軸方向深度，差 ≤ 5 mm（模擬無雜訊，檢查單位、對齊與深度定義）
  A4_三維定位: '估計的可見表面三維點 vs 同一表面參考的世界座標距離，20 影格中位數與最大 ≤ 15 mm（**工程通路門檻**，不是感知性能主張）'
  證據範圍: '靜止資料只支持**靜態通路連通**；不是移動中的時間對齊驗收'
  A5_負載: '算圖耗時、熱（92 °C 中止照舊）'
  不可宣稱: '感知性能、實機可行、抓取位姿、閉迴路視覺控制'

# ---------------------------------------------------------------- 5 實作範圍與凍結
實作: >
