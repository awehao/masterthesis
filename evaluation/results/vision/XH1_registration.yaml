schema: xh1_registration/1
date: '2026-10-06'
status: 封存（Codex 核可，reviews/20261006_034921_reply.md；兩處必改已改）；test 資產在模型／門檻／後端規則凍結前不渲染
task_definition: 首版辨識類別＝「直線桿式把手」（R 圓桿的橫桿表面）；N 圓鈕為非目標干擾物（不代表圓鈕不是把手或不可抓取）
label_semantics:
  target: R 類橫桿圓柱可見像素（DL0 自動標註同法：真值圓柱射線 × 量測深度）
  posts: 支柱不屬目標，標背景（與 DL0 一致）
  distractor: N 圓鈕可見像素標背景（非目標），另存 distractor 遮罩供誤檢分析
  ignore: 沿用 DL0（外圈 1 px、無效深度、背面、近裁切）；**端蓋 ignore 只限 R 橫桿既有規則**；N 圓鈕可見正面／端面是背景並納入干擾物遮罩，不得整片忽略
  frame_kinds: positive：有效影格中有可評分目標；negative：有效影格中沒有目標（含只見 N、朝外影格）；excluded：有 R 但目標像素全被 ignore、無法評分者——不得把純 N／朝外影格因「無前景」排除
nominal_opening_screen:
  definition: 直徑 d 滿足 22.4 < d 且 (40.2 − d)/2 ≥ 2 ⇒ 22.4 < d ≤ 36.2 mm（同 GC1 名目條件）
  meaning: 只是名目開口篩選；完整相容性另受抓取深度、支柱、閉合方向與根部幾何影響；篩選外資產只做辨識，不生成抓取放行
geometry_backend: 只做 K 條件：明示使用型號目錄尺寸（半徑、長度）；RGB 分割模型不讀尺寸。這評估未見資產上的辨識，不是未知尺寸下的完整抓取泛化
pixel_contract: PC2 像素中心 +0.5（新管線一律使用）
asset_schema:
  R: drawer_unit/1 既有欄位即可（bar.radius、bar.length、posts 位置與尺寸隨長度與直徑調整）
  N: 需 drawer_unit/2（新增 distractors：y 向圓柱圓鈕；可無橫桿）——新增形狀另立版本，不覆寫 /1
post_rule: 支柱中心 x = ±(L/2 − 15 mm)、尺寸 16（x）×40（y）×(d − 2)（z） mm；橫桿中心與 bar26 相同（櫃體本地 (0, −0.285, 0.55)）
placement: 所有資產同一櫃體擺放（drawer-pose 0.0,1.45、yaw 0）、抽屜關閉；不在本版混入擺放變因
appearance: 所有資產使用 bar26 既有材質與場景（外觀變因本版不納入，避免與幾何混淆；另列後續）
