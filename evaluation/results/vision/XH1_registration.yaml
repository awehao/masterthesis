sequences:
  per_asset: 2
  templates:
    A_front: 正面接近：距離 3.0→0.4 m（12 s）再 0.4→0.2 m（4 s）；左右偏移 ±4 cm 正弦（相位由資產種子決定）；相機高於把手 3 cm；5 Hz
    B_oblique: 斜向接近：觀看方位 30°（由 +x 側），2.0→0.3 m（10 s）；相機高於把手 6 cm；前 2 s 朝外、1 s 轉向（負例影格）；5 Hz
  note: 所有資產使用同一組路徑模板（相對把手中心），故測試資產結果稱「未見資產的多視角表現」，不歸因於視角泛化；未見尺寸值與未見尺寸組合分開標示
reporting:
  unit: 資產為單位分報＋資產等權彙總；影格不是獨立樣本
  layers:
  - 遮罩辨識（先）
  - K 條件的中心／軸可得性（其次）
  - 抓取相容（GC 延伸，最後；不阻擋資料與模型工作）
splits_count:
  train:
    R: 6
    N: 1
  dev:
    R: 2
    N: 1
  test:
    R: 2
    N: 1
