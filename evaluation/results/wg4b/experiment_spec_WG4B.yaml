# WG4-B：獨立單步 QP 對照（B）vs 多步 W-GMPC（P = H5）——規格草稿（待 Codex 審查；未實作、未開跑）
# 2026-10-05。依據：第二階段計畫 §5.9 WG4、§6（方法 F／SEQ／A／B／P）、baseline_B_frozen_20260909.md、
#   H1_H5_resolved_config.yaml（D1–D6）、C0／C1a 結果
schema: wg4b_spec/1
status: 'draft-1'

問題: '同一 MotM 抽屜任務、同模型／輸入／限制下，整合式單步 QP（B）與多步 W-GMPC（P，N = 5）的任務成功、追蹤、平順、停頓與計算代價差異'
B與H1的區別（必須明寫）:
  H1: 'W-GMPC 自身 N = 1 的時域消融：同一增廣核心（手臂設定點模型、延遲補償、偏移補償、SQP、終端權重 ×5、協同項隨 N 縮放）'
  B: >
    獨立的整合式單步 QP（resolved-rate）：每週期以**目前狀態**的 9 欄全身 Jacobian 解一次 QP；沒有預測模型、沒有 SQP、
    沒有終端權重。凍結原型 = baseline_B_frozen_20260909（wholebody_pregrasp.py --solver qp，μ = 0.03）
  結論規則: 'H1 不能稱為 B；B 的結果也不能拿來推論「多步預測」的效果（兩者差在整個控制器結構，不只時域）'

# ---------------------------------------------------------------- 對齊（共用）
共用:
  任務: 'MotM 抽屜 200 mm 全流程（同 C0／mt_b1 的任務節點、相位機、判準）；起點、停位、資產、抓取幾何、手指 split'
  輸入: '同一任務節點發的 TCP 目標話題（/drawer/tcp_target）與協同設定（/wgmpc/coord：底盤參考速度、手臂名目姿態與權重）；狀態來自同一同步狀態包'
  模型: '同一 URDF 運動學（omni_bot_wholebody_expanded.urdf、link_tcp）'
  限制: '同一速度框（vmax，與 W-GMPC 相同的逐軸值）、同一加速度框（|u − u_prev| ≤ a·dt）、同一關節有效限位（硬限位 ± 0.05）、同一輪級限制與低速介面界限（執行層）'
  執行鏈: '同一輸出話題（/wgmpc/cmd_world）→ adapter → 雙來源執行層；同一控制率 20 Hz（模擬時鐘時槽）'
  紀錄與停止: '同一逐輪紀錄格式（solve_in：狀態、u_prev、目標、解、統計計數器）以便重播；同一 A0 停止語意（收到停止不再求解／發布、外部關閉寫統計）'
  判準: 'S1–S6（motm_physical_check，逐物理步真值）；重播驗收（B 為單步：重播只需目前狀態＋目標＋u_prev）'

# ---------------------------------------------------------------- B 的定義（候選，需裁定）
B_候選:
  B0_凍結原型直接接入:
    內容: '凍結 B 的目標函式與權重原樣，只接上任務目標話題；不吃協同設定'
    問題: 'MotM 靠協同設定讓底盤在夾持／拉開時持續移動；B0 不吃 ⇒ 任務策略不同，比較的是「任務策略＋控制器」而非控制器'
  B1_對齊協同（建議）:
    內容: >
      凍結 B 的目標函式加入與 W-GMPC 同義的兩項（同一 LS 中的加權項）：
      底盤參考速度項 w_vref·‖(v_base − v_ref)/vmax‖²、手臂名目姿態項以既有 μ 項的 q_pref 改用 coord 的 q_nom、權重採 coord 給的 w_qn；
      其餘權重沿用凍結值（base_weight 3.0、kp 1.0、damping 0.06、kp_post 1.2、k_limit 1.5、limit_margin 0.35）
    代價: '改動了凍結 B（新增項），須另立 B1 凍結版本並寫明與 baseline_B_frozen_20260909 的差異'
結構差異（B1 vs P，照實報、不假裝消除）:
  - '手臂設定點一階延遲（α = 0.095）：P 有模型；B 沒有（直接以速度命令，延遲由閉迴路吸收）'
  - '延遲補償（1.6／1.0 週期）與偏移補償：P 有；B 沒有'
  - '求解：P 為 SQP（非線性 rollout＋殘差檢查）；B 為單次 QP（局部線性化）'
  - '目標函式：P 為預測域上的追蹤＋變化率＋終端；B 為瞬時任務誤差＋正則；增益（kp）語意不同'
  - '近目標輸出整形：P 有；B 預設沒有（是否加入需裁定）'

# ---------------------------------------------------------------- 調參與凍結
調參預算: >
  B1 的新增項權重與 kp 先做**事前登錄的小預算**功能確認（例如至多 3 趟、只調 w_vref、w_qn 映射與 kp），以「完成 MotM 全流程且無
  不允許停頓」為唯一調參目標，之後凍結；不以與 P 的比較結果回頭調整。P 用既有 C0 凍結配置（H5）
排程: 'B1 與 P 各 3 趟、先後交替（B、P、P、B、B、P）；同版本、同環境；失敗與中止全部保留'
指標: '同 C0：任務成功（S1–S6）、整窗追蹤、相鄰反轉、命令變化、停頓、夾持品質、限位餘裕、計算時間；全程時間另列'
結論規則: '配對差三對全列；n = 3 不做顯著性；B 較差或較好都報；不據此推論「多步預測」本身的效果'

