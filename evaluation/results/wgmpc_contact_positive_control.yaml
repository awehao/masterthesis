# 接觸感測的正向對照（三段）
主題: 抽屜接觸力感測器在**已知接觸**下是否響應
狀態: 通過
診斷目錄: evaluation/runs/contact_positive_control_1003_144921
程式: evaluation/isaac_contact_positive_control.py
備註: 獨立診斷；**階段 A 的成果配置與影片未改動**

為什麼需要: >
  階段 A 四趟的抽屜淨接觸力都是 0 N。那只能說「可用證據未顯示接觸」——
  因為沒有任何證據顯示這個感測器在**有**接觸時會回報非零。本對照補那一塊。

獨立證據怎麼來:
  探針: 位姿由程式直接設定的**運動學**剛體（球，半徑 0.02 m），不是機器人
  判定接觸的依據: >
    探針球心到橫桿表面的距離，由兩者的**位姿與已知幾何**算出，
    與力訊號完全無關。力訊號只是被核對的對象，不參與判定何時接觸。
  第三條證據: 抽屜自身的位移（與力訊號、與探針位姿都無關）

分段有效性的判準:
  用的是: 實測間隙是否塌進**接觸範圍**（<= 1 mm）
  為什麼不用持續幾何重疊: >
    探針是運動學剛體，PhysX 會把重疊推給另一個物體化解 ——
    實測 press 段間隙由 −2.000 mm 回到 +0.654 mm，所以「重疊比例」
    必然接近 0。第一版用重疊比例當判準而誤判為「接觸未建立」。

三段結果:
  before:
    命令間隙_mm: 20.0
    實測間隙_mm: [20.000, 20.000]
    接觸範圍內比例: 0.0
    淨合力_p50_max_N: [0.000, 0.000]
    逐對合力_max_N: 0.000
    抽屜開度峰值_m: 0.0
  press:
    命令間隙_mm: -2.0
    實測間隙_mm: [-2.000, 0.654]
    接觸範圍內比例: 1.00
    淨合力_p50_max_N: [1607.590, 1843.259]
    逐對合力_max_N: 1843.259
    抽屜開度峰值_m: 2.654e-03
  after:
    命令間隙_mm: 20.0
    實測間隙_mm: [19.357, 20.007]
    接觸範圍內比例: 0.0
    淨合力_p50_max_N: [0.000, 0.000]
    逐對合力_max_N: 0.000
    抽屜開度峰值_m: 6.425e-04

判定:
  分段有效: true
  力訊號對已知接觸響應: true
  分離後恢復: true
  整體: pass
  逐接觸對資料: >
    get_contact_force_matrix 在建構時給了 contact_filter_prim_paths_expr
    之後**可用**（逐對 max 與淨合力一致）。先前它回傳 size 1
    正是因為沒給 filter。

量級的保留: >
  力的量級**不可當成真實接觸力**：探針是運動學剛體、被強制壓入 2.0 mm，
  而抽屜受滑動限位約束，所以 1843 N 反映的是求解器化解穿透的反作用，
  不是物理上合理的接觸力。本對照只問**訊號是否響應**，不問量級是否真實。

本對照能證明什麼:
  可以證明: 感測器對**這一組受測接觸**（探針 ↔ 抽屜）有反應
  不能證明:
    - 其他情形不會漏 —— 淨合力互相抵銷、極短暫的接觸、以及未覆蓋的接觸對，都仍可能漏掉
    - 不能回頭替階段 A 既有四趟補出當時沒有記錄的接觸證據；那四趟的淨合力為 0 仍只是「可用證據未顯示接觸」
  對下一階段的用處: >
    夾持與拉動時接觸是**預期**的，所以需要的是「有接觸時讀得到」。
    本對照支持那一點，並且確認逐接觸對的資料可取得 ——
    那是分辨「手指碰到橫桿」與「夾爪殼碰到面板」所必需的。
