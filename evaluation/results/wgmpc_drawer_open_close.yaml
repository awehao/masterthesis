    - {run: motm_175859, 設定: +斜坡 30 +靜態初值，退讓 60, ptp_mm: 12.1, flips: 4, stops: '1（底盤被拖到 1 mm/s 停 0.88 s）'}
    - {run: motm_181221, 設定: 同上但無軟啟動, ptp_mm: 37.4, flips: 28, stops: 2}
    - {run: motm_181645, 設定: 軟啟動、退讓 30、斜坡 30、靜態初值, ptp_mm: 47.6, flips: 26, stops: 0}
    - {run: motm_182255, 設定: 同上 + w_vref_pre 0.3, ptp_mm: 29.0, flips: 20, stops: 0}
    - {run: motm_182724, 設定: 同上但斜坡 10 mm/s, ptp_mm: 36.2, flips: 22, stops: 0}
  結論: >
    同設定趟間差 2 倍（172100 vs 170405），單趟比較不可靠。唯一明顯小的那趟是手臂幾乎沒動的那趟。
    擺盪大小與激發大小（斜坡 30 vs 10 mm/s）無明顯關係 ⇒ 較像手臂迴路本身阻尼不足的振盪，
    即 W-GMPC 記錄中「手臂高頻振盪未解」那一項。離線閉環模擬重現不出來 ⇒ 實跑迴路裡有模型沒有的東西
    （候選：實際端到端延遲／抖動與補償 1.6／1.0 不符），尚未驗證。
    所有試驗閉合前接觸 0 —— 擺盪在進場前結束（進場門檻：連續 0.5 s 在 5 mm 內）。
startup_swing_root_cause:
  date: 2026-10-04
  根因: >
    isaac_drawer_room_sim.py 主迴圈每個物理步只呼叫一次 rclpy.spin_once(timeout 0) ⇒ 每 10 ms 只處理一則
    訊息；/cmd_vel、/wb_vel_cmd、/gripper/cmd 等持續發布的話題在佇列（深 10）積壓，全身命令要排隊才生效。
  量測（求解輪的快照時刻 → 模擬器首次套用該命令的物理步）:
    motm_182255: {p50_ms: 90, 啟動4_5s_p50_ms: 150, max_ms: 390}
    grip_bar26_161806: {p50_ms: 180, 啟動4_5s_p50_ms: 210, max_ms: 330}
    求解端延遲補償假設: 1.6 週期 = 80 ms
  修正: 每物理步迴圈 spin_once 直到沒有新回呼（上限 64）；全身命令只取最新一筆。rec['ros_drain'] 記錄單步最多處理數（實測 3）
  結果:
    - {run: motm_185942, 延遲_ms: {p50: 70, max: 90}, 啟動擺盪峰對峰_mm: 1.4, 翻號: 1, DONE: true, 不允許停頓: 0}
    - {run: motm_190426, 延遲_ms: {p50: 70, max: 90}, 啟動擺盪峰對峰_mm: 1.5, 翻號: 1, DONE: true, 不允許停頓: 0}
  說明: >
    離線閉環模擬重現不出擺盪，因為它用的就是 80 ms。此根因只屬於抽屜房模擬器；自由空間的
    isaac_wholebody_sim_e2.py 以獨立執行緒 spin，WG2「手臂振盪未解」不因此解決。n = 2。
  另發現（未處理，判準凍結）: >
    關閉限位處開度量到 −2 µm（數值穿透），落在關閉帶 (0.000, 0.005) 外 ⇒ 保持計時反覆歸零；
    motm_185942 關閉保持 8.41 s（190426 為 2.10 s）。需決定量測定義，不得逕自放寬帶。
