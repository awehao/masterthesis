        實際套用逐位元相符；切換當步實測 21.17 mm/s（框 35.26/軸、滾動下界
        10.0），底盤**沒有停**。
      跳變: 由 48.76 mm/s 降到 7.071 mm/s（合量），逐軸 5.000 mm/s
