nav_handover_run_1003:
  status: "**前半段已實跑連通**：真 GMPC 導航 → 減速 → 滾動交棒"
  runner: evaluation/run_nav_handover.sh
  runs:
    - id: nav_handover_224543
      outcome: 交棒完成（rc=0），但**不是滾動** —— 承接基準為零，底盤已停住
      why: 計畫止於停位，GMPC 抵達目標時減速很陡（實測由 0.153 m/s 到 0 只走 6 mm），沒有任何時刻停在速度框內還在動
    - id: nav_handover_224928
      outcome: "**滾動交棒成立**"
      slow_zone_entered_m: 0.7954
      v_nominal_set_to: 0.030
      handover_requested_step: 3452
      handover_actual_step: 3454
      seed_base_baseline: [-0.016777, 0.026223, -0.004884]
      seed_base_speed_mps: 0.031131
      inside_box: true（框 0.035255）
      nonzero: true（切換前速度非零）
      retraction_1003: >-
        **先前寫的「交棒沒有停頓」必須撤回。** 該趟 room_run.json 記的命令鏈
        received=0 —— W-GMPC 尚未接上。dual_source_executor 在鏈沒有可套用
        命令時回傳的底盤速度就是 (0,0,0)，模擬器隨後把它寫進 API，底盤當場
        停住。所以非零的承接基準**只證明歷史有保存，沒有證明新控制器連續
        接手**。目前證據只支持「切換前速度非零」。
      step_labels_corrected: >-
        執行端完成切換是第 3452 步；3454 是**任務節點觀察到結果**的步數。
        兩者不是同一件事，已分成 switch_committed_step 與觀察值分開標示。
      park_dist_at_handover_m: 0.2803
      yaw_error_at_handover_deg: 15.78
  scope_stated:
    controller: "**真的 gmpc_node**，控制律未改"
    localisation: /odom 真值（本實驗的明示前提）
    plan: 由任務節點依已知靜態房間產生，**未用 nav2 planner／map_server／amcl**
    cbf: "**關閉** —— 沒有障礙物聚合器在發 /obstacles；房間靜態且路徑已用幾何核過淨空"
  additive_change_to_phase1_node:
    what: gmpc_node 加了 v_nominal 的執行期參數回呼
    why: >-
      原本只在初始化讀一次，最後接近要放慢就只能重啟節點 —— 那會在控制上
      留一個空窗。滾動交棒需要底盤在**仍在移動**時被接手，而本節點抵達目標
      時的減速是陡的，沒有任何時刻停在全身的速度框內還在動。
    control_law_unchanged: true
  defects_found_and_fixed:
    - symptom: 任務節點算出的速度出現**剛好 2 倍／0.5 倍**的假值（0.2775 與 0.5551 交替）
      cause: 用**節點時鐘**做位姿差分，它與訊息時間戳不同步，dt 時大時小
      fix: 一律用**訊息自己的時間戳**差分與比對，並以「看過的最大 sim_t」當現在
    - symptom: gmpc 一直報「/odometry/filtered is stale」，即使參數已設成 /odom
      cause: 沒設 use_sim_time —— 牆鐘對模擬時間戳，差 1.79e9 秒
      note: 那句警告把 /odometry/filtered **寫死在訊息字串裡**，即使參數已改仍照印，誤導了一次
      fix: 啟動時加 use_sim_time:=true
    - symptom: 計畫終點朝向用了路徑方向，與停位 yaw 差 14.8°
      fix: 最後一個位姿改用停位的 yaw（停位朝向是手臂可達性算出來的，不是走過去的方向）
  preflight_layer_1003:
    why: >-
      「收到新鮮命令」**不等於**「切換當步能成功套用」。先前的就緒檢查只核
      收到命令、快照年齡與既有失效狀態；低速介面界限、手臂速率、輪級限制與
      設定點積分的有效限位，**都在控制權切換之後**才執行。
    counterexample_1: >-
      首筆底盤命令 0.06 m/s —— 結構正確、時間新鮮、鏈未失效，就緒檢查通過；
      切換後 E2 才因超過 0.05 而閂鎖。控制權已經交出去了。
    counterexample_2: >-
      會讓設定點穿過有效限位的首筆命令。j3 的有效下限是 −0.011087，收攏姿態
      j3 = 0 只剩 0.011087 rad；j3 速率 −1.0 rad/s、dt 0.01 ⇒ 第一步到
      −0.010（還在裡面）、**第二步 −0.020 才穿出去**。
    design:
      - 取最新承接資料與待套用命令快照
      - 用**命令鏈自己的計算路徑**預核本步輸出（深拷一份鏈，不另寫判斷）
      - "**核整個有效期**（max_cmd_age_s / dt 步），不是只核一步 —— 否則會放過反例 2"
      - 預核**不寫入實際狀態**：拷貝丟掉，本體一個位元沒動
      - 預核成功才提交控制權，並**核對實際套用與預核逐位元相同**
      - 失敗則保留導航控制權，執行既定減速
    verified:
      counterexample_1: test_dual_source_integration X1–X5（切換被取消、真鏈未被承接、**真鏈未被閂鎖**）
      counterexample_2: X6–X9
      positive: X10–X11（合法命令正常切換、實際套用與預核一致）
      fake_chain: test_dual_source_executor H1–H8

  fixes_1003_after_review:
    - what: "**接手方必須先備妥有效的首筆命令，才提交切換**"
      why: >-
        否則切換當步新控制者沒有可套用的命令，執行層送 (0,0,0)，底盤當場
        停住 —— 那正是上面要撤回的那個宣稱的成因。
      how: >-
        排定的切換步到達時先查接手方就緒（命令鏈 n_recv > 0、有命令快照、
        年齡在 max_cmd_age_s 內、鏈未失效）。未就緒就**取消切換**，控制權
        留在現任、由它繼續負責減速。檢查必須在 auth.on_step 之前 ——
        on_step 一旦執行切換就會把排程清掉。
      tests: test_dual_source_executor G1–G12、test_dual_source_integration C4–C7
    - what: 導航命令的逾時檢查失效
      why: >-
        接收時間在主迴圈每個物理步都被刷新，只要曾收到過命令就永遠算新鮮，
        導航停止發布後舊命令會一直被沿用，逾時處置永遠不會觸發。
      how: 接收時間**只在回呼裡**更新
      verified: >-
        evaluation/nav_timeout_probe.py：送 2 s 非零命令（移動 0.710 m）後
        停發 ⇒ 模擬器記錄「導航命令逾時 1.01s > 1.0s ⇒ 歸零」，
        **最後 3 秒（模擬）只移動 0.09 mm**。
      claim_narrowed: >-
        能說的是：**已量到停止距離，逾時確實觸發**。停發後的 0.3204 m
        要把多少歸給「仍沿用舊命令」、多少歸給物理運動，**仍需逐步對帳**，
        目前沒有做，不得寫成「與設定一致」。
    - what: 執行端完成切換的物理步與任務節點觀察到的步數分開標示
      how: summary 新增 switch_committed_step 與說明欄位

  still_open:
    - "**連續接手尚未證明** —— 要等 W-GMPC 接上、在切換當步就有有效命令，才有依據"
    - 交棒當下 yaw 仍差 15.78°（全身接手後要自己修正；尚未驗證）
    - 展開與接觸前到達尚未接（需要把相位機與目標生成接到 W-GMPC）
    - >-
      展開要用**實際交棒位姿**起算，含那個 15.78° 朝向誤差 ——
      不能沿用標稱停位的路徑就認定可行
    - 新指定的夾持摩擦 μs=1.0／μd=0.8 是**待驗證配置**，真正夾持時再量它的效果

phase_machine:
  module: evaluation/drawer_task_policy.py
  tests: evaluation/test_drawer_task_policy.py（77/77）
  why_new_module: >-
    既有 coman_pull_policy.py 的 PULL 相位靠
    `sim_t - t_pull0 >= pull_duration_s` 推進 —— **模擬時間到期**，
    正是凍結判準明文禁止的；而且它沒有關閉相位。既有規格與測試不動。
  phases: [NAVIGATE, UNFOLD, ALIGN, ENGAGE_WAIT, OPEN, OPEN_HOLD, CLOSE,
           CLOSE_HOLD, RELEASE_WAIT, RETREAT, RESTOW, HANDBACK_WAIT,
           NAVIGATE_HOME, DONE]
  return_leg_added: >-
    2026-10-03 補上回程三段：RESTOW（先收攏再導航）、HANDBACK_WAIT
    （**反方向**的控制權轉移）、NAVIGATE_HOME（回起點，容差 0.20 m）。
    先前停在退出就 DONE，沒有回程。
  tests_now: evaluation/test_drawer_task_policy.py（95/95）
  advance_basis: >-
    開啟與關閉一律看**實測開度**落入帶內並**連續**保持 ≥ hold_s。
    命令值、參考軌跡 s、經過時間都不是依據；開度無讀值時不推進
    （缺值不等於達標）。保持計時一離開帶即歸零，不累計。
  hold_timer_definition: >-
    從「進帶那一刻」起算，首筆為 0 —— 與階段 A 的到達保持同義。
  safety_phase_labels:
    no_exception: [NAVIGATE, UNFOLD, RETREAT, RESTOW, HANDBACK_WAIT,
                   NAVIGATE_HOME, DONE]
    designed_contact: [ALIGN, ENGAGE_WAIT, OPEN, OPEN_HOLD, CLOSE, CLOSE_HOLD,
                       RELEASE_WAIT]
    unlisted_phase: 一律發 'unknown' ⇒ 濾波器端匹配不到例外（fail closed）
  handover_needs_all_three: 底盤到停位、手臂到夾持姿態、把手讀值有效 —— 缺一不離開 UNFOLD
  abort_conditions_latched:
    - emergency
    - grasp_slip（漂移超限、執行端回報未連接、或**漂移無讀值**）
    - undesignated_contact
    - limit_or_barrier
    - force_monitor_failed
    - cmd_stale_or_fail_latched
    - base_cmd_over_low_speed_bound
    - stall（只在需要移動的相位判；保持相位命令本來就近零）
  first_cause_preserved: true
  stale_state: 不推進、不完成、不中止，並留紀錄

target_generation:
  module: evaluation/drawer_target.py（新增）
  tests: evaluation/test_drawer_target.py（30/30）
  law: W_T_G_des = W_T_H_target · (G_T_H)^(-1)
  grasp_relation_measured_once: >-
    連接當下量一次 G_T_H（夾爪 → 把手）就固定，之後夾爪目標都由把手目標反推
    ⇒ 抓取關係整段不變。直接把抽屜參考點當夾爪目標會產生固定偏差。
  closed_on_measurement:
    reference_opening: d_ref 由**實測開度** d_meas 加上有界超前量推進
    target_handle_pose: 由**實測**把手位姿沿滑軌平移 (d_ref − d_meas)
    lead_max_m: 0.010
    rate_max_mps: 0.035255（與底盤速度框同值，不是另一個自由參數）
  why_not_the_old_module: >-
    既有 coman_pull_target.py 的 s(t) 是**時間的 smoothstep**（開迴路）：
    參考值按時間前進，不管抽屜實際到哪裡。抽屜卡住時參考值仍前進，夾爪就
    一路拉 —— 不是滑脫就是硬扯。凍結判準也明文禁止以時間到期代替實測。
    該模組**未改**，它屬於另一個已規格化的任務。
  bounded_lead_is_the_point:
    behaviour: 抽屜卡住時 d_meas 不動，d_ref 停在 d_meas + lead_max，不會愈拉愈遠
    verified: 測試 C1–C4：卡在 50 mm、推 20 s，參考值停在 60 mm（無界的話會跑到 200 mm）
  grasp_drift_for_phase_machine: >-
    drift_vs() 把連接當下的抓取關係套到現在的夾爪位姿，得到「把手應該在哪」，
    再與實測把手位姿比 —— 給相位機當滑脫判定用。

what_must_be_built:
  done_this_round:
    - 控制權轉移（control_authority.py，36/36）
