restow_lift_fix:
  使用者觀察: 關門後手臂有「上抬」動作
  原因: >
    收臂用「j3 最後動」：其他軸先收（j2 0.95→0，肩直立）、肘 j3 仍彎在 1.50 rad ⇒ 夾爪被舉高，
    TCP 550 → 989 mm（motm_170405，86–91 s），之後 j3 才收、再落回 550 mm。停車流程也有同一行為。
    「j3 最後」的原意：收攏值 j3 = 0 離有效下限只有 0.011 rad，防止往負方向自撞。
  修正: >
    drawer_task_node --restow-mode sync（預設仍為 j3_last）：整個速率向量同比例縮放 ⇒ 關節空間直線、
    各軸同時到達；j3 在 ≤ 收攏值時不放行負向命令。離線核對：TCP 高度 546–560 mm、夾爪對把手距離
    單調由 4 增到 270 mm。
  實跑: {run: motm_172100, DONE: true, 收臂期間TCP高度_mm: [547, 563], j3最低_rad: 0.0215, 收臂_s: 6.48（原 11.75）, 全程_s: 86.07, 不允許停頓: 0, 漂移_mm: 0.98, 閉合前接觸: 0}
