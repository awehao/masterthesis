    展開:
      趟次: nav_handover_cap_005455
      關節最大差_rad: 0.0140
      位置殘差_m: 0.0133
      偏航殘差_rad: -0.00084
      實測最小有效餘裕_rad: 0.9072
      起步位姿: [-0.3149, 0.4340, 1.5675]
      備註: 由**實際交棒位姿**起算，不是理想位姿

  已修正的缺陷:
    - 名稱: 計畫發布競態
      趟次: nav_handover_ctrl5_002805（已作廢，見該目錄 VOID.md）
      內容: >
        mission 以 TRANSIENT_LOCAL 發 /plan，gmpc 訂閱是預設 VOLATILE。
        兩者**相容**所以不報 QoS 不符，但 VOLATILE 收不到 latch 回放。
        計畫只發一次 ⇒ 發布端先就緒時整趟 state='no_plan'，底盤一步沒動。
      修法: 先等訂閱者（最多 10 s）再發、重發 5 次、記 plan_n_sub_at_publish
    - 名稱: 交棒時機用「指定單一未來步」
      內容: >
        任務節點看到的狀態落後執行端數十步（實測一次 402 步），而條件成立
        的窗口只有一個 GMPC 週期寬。三趟只中一趟，是運氣不是設計。
      修法: >
        改為**窗口預約**：執行端在窗口內每一步照原樣查就緒＋預核＋切換當步
        速度框與滾動下界，第一個成立的步才提交。**不放寬任何條件**
        （test_dual_source_executor.py J 組 12 項反例在釘這件事）。
        未備妥的每一步都記下理由，所以失敗有精確原因而不是靜默錯過。
    - 名稱: summary 的 seed_applied 名稱會誤導
      內容: 它是**排程當下**的准入證據，真正承接的是 seed_used；已改名 seed_requested
    - 名稱: 暖機底盤速度取自 /odom 位姿差分
      內容: >
        走 ROS 的取樣會被節點處理速率平均掉。實測交棒當步底盤真正在跑
        85.1 mm/s，差分估出來只讓暖機送 4.3 mm/s。改用執行端的套用回報。

  量化的阻塞點:
    名稱: 導航無法以 ≤35 mm/s 穿過交棒區
    可切窗口寬度:
      趟次: nav_handover_smooth_005749
      交棒區內_nav步: 18429
      同時框內且過滾動下界的步數: 2
      最長連續窗口: 2 步 = 0.02 s
      輪廓: d=0.250 → 258 mm/s；d=0.128 → 267 mm/s；d=0.127 → 0.00
    原因鏈（全部量測，非推測）:
      - 項: 控制週期與求解器假設不符
        證據: >
          gmpc 自己的 solver_in 診斷（nav_handover_diag_001835）量到
          dt_meas p50 0.1800、p90 0.1800、max 0.1900 s，而 cfg.dt = 0.05。
          命令每週期實際作用 3.6 倍長。
      - 項: v_nominal 本身是正確的，但不決定速度
        證據: >
          同一趟 xi_ref0 恆為 (+0.0240, -0.0180)＝0.0300 m/s（＝v_nominal），
          而實際命令 |u| 29–271 mm/s。速度由位置誤差回饋主導。
      - 項: 前視距離與 v_nom 成正比，降速會把參考點縮到機器人身上
        證據: >
          v_nom 0.03、dt 0.05、N 20 ⇒ 整個參考視窗只跨 30 mm；
          X_ref[0] 離機器人的範圍 -25.0 ~ +24.7 mm。
          001835 最後停在 d=0.202、橫向誤差 -103.6 mm、|e0| 106 mm，u = 0.0
          —— **停住是閉環的不動點**。
      - 項: 加固定前置量可解停死，但速度由前置量決定、不由 v_nom 決定
        證據: >
          離線閉環（真 GMPC＋真 build_reference_window，純運動學底盤）：
          lead 0 ⇒ 到不了交棒區；lead 0.10–0.30 且計畫延伸過停車點
          ⇒ 交棒區內 |u| p50 330–373 mm/s（373.5 ＝速度框角點 hypot(0.2775,0.25)，
          已飽和）。前置量就是位置誤差，MPC 以全速消它。
      - 項: 橫向誤差與偏航都不是主因
        證據: 慢速區橫向誤差 p50 8.6 mm、max 52.2 mm；偏航全程只變 0.0072 rad、wz≈0.001
    被排除的做法:
      - 做法: 把 cfg.dt 設成實測週期（control_frequency 5 Hz）
        結果: 不再振盪，但底盤**停死**在 d≈0.734（nav_handover_ctrl5b）
        離線預測: 探針預測停在 d≈0.797，實跑 0.734 —— 方向一致
      - 做法: 只加參考前置量
        結果: 解了停死，交棒區內變全速飽和
      - 做法: 讓全身端接受更高的進入速度
        結果: 不採用 —— 低速介面界限 0.05 m/s 是保護，不以放寬保護換過關

  下一步（結構性，不是調參）:
    做法: 在導航與全身之間插一個**減速交接段**，用既有的控制權機制當第三個擁有者
    理由: >
      導航的工作以「停在自己的目標」結束，所以靠等它剛好慢慢經過是結構上
      不可行的（窗口 0.02 s）。減速段不是 MPC：路徑已知為直線、定位是真值，
      它只做沿路徑的速率受限斜坡，降到約 30 mm/s 後**維持**，讓全身端在仍
      在移動時接手。
    不動的東西: 導航控制器與其成本函數、所有速度／加速度／輪級／關節限制
    待驗: 減速段自己的交接（導航 → 減速段）同樣要逐步連續，且全程在既有限制內

# =====================================================================
# 減速交接段（第三個控制權擁有者）—— 實跑成立（2026-10-04）
# =====================================================================
glide_transition_owner:
  date: 2026-10-04
  動機: >
    導航控制器的成本函數本質是「到達目標並煞停」，與「流暢滾過交棒點」在
    數學目標上衝突。實測 nav_handover_smooth_005749：交棒區內 18429 個物理
    步，同時「在全身速度框內」且「還在動」的只有 **2 步＝0.02 s**，導航是
    以 267 mm/s 衝到停車點再用自己的加速度上限剎到零。先前三趟交棒成功的
    兩趟是碰上那 2 步 —— 運氣，不是設計。

  架構: >
    nav（大範圍逼近）→ glide（沿路徑速率斜坡降速並維持）→ wholebody。
    三者共用同一個 ControlAuthority，每個物理步恰有一個擁有者。
    nav 與 glide 走**同一條直寫路徑**（不經命令鏈 —— 它們的速度是鏈上低速
    介面界限 0.05 m/s 的數倍），共用同一個逐軸變化率上限與同一個
    「上一步真正寫出去的那一筆」基準，所以 nav→glide 的連續性是**結構上
    保證**的，不靠兩邊各自算出接近的值。

  減速段輪廓:
    形式: 距離驅動的平方根減速，降到 v_roll 後維持
    算式: v(d) = clip(sqrt(v_roll² + 2·decel·max(0, d − d_hold)), v_roll, v_cap)
    為什麼距離驅動: 迴圈時序抖動不改變輪廓；同一個位置永遠得到同一個速度
    v_roll_mps: 0.030          # 在全身速度框 0.035255 內，且高於滾動下界 0.010
    decel_mps2: 0.50           # 不超過導航自己的 ax_max 1.5
    v_cap_mps: 0.35            # 沿用導航自己的 vx_max，不放寬
    d_hold_m: 0.25
    d_stop_m: 0.02             # 交棒沒成立時不得繼續往櫃子推
    只減速不加速: >
      上界在**備妥當下閂鎖一次**。不閂鎖會先加速到輪廓值再減速
      （實測 nav_glide_012356 由 175 加速到 350 mm/s）；
      每步重取套用速度則變成回授迴圈，速度被凍住
      （實測 nav_glide2_012605 全程 v_along == v_applied，153 mm/s 不降）；
      閂鎖區間寫錯會在 d=4.6075 就鎖成 v_roll
      （實測 nav_glide3_012738，窗口 949 步但那是 bug 的副作用）。
      現行：只在 d ≤ arm_at 內閂鎖，實測 v_latched = 0.07458 @ d = 0.5937。
    離線測試: evaluation/test_glide_profile.py 22/22（含上述三個反例）

  實跑結果:
    主趟: nav_glide_final_013132
    控制權: {nav: 3382, glide: 282, wholebody: 767}  # 總 4431，每步恰一個
    nav_to_glide:
      物理步: 3382
      逐軸線速度跳變_mmps: 13.147      # 上限 ax_max 1.5 × dt 0.01 = 15.000
      偏航跳變_radps: 0.02000          # = az_max 2.0 × dt
      當步實測_mmps: 132.75
    glide_to_wholebody:
      物理步: 3664
      逐軸線速度跳變_mmps: 5.000       # = a_base_lin 0.50 × dt
      偏航跳變_radps: 0.00688
      當步實測_mmps: 30.24             # 框 35.26/軸、滾動下界 10.0 ⇒ 都滿足
    兩次交接之間零命令步數: 0
    預核與實際套用相符: true
    窗口內等待步數: 4
    取消次數: 0
    展開:
      關節最大差_rad: 0.0083
      位置殘差_m: 0.0155
      偏航殘差_rad: -0.0002
      實測最小有效餘裕_rad: 0.9072
      起步位姿: [-0.2584, 0.4060, 1.4131]   # **實際交棒位姿**，非理想位姿
    維持段寬度的證據: >
      本趟 glide 一進框就交棒（等待 4 步），所以「框內連續步數」反映的是
      「它一有機會就切了」，不是上限。維持機制本身的證據在
      nav_glide3_012738：該趟 glide 以 30 mm/s 維持了 **949 個連續物理步
      （9.49 s）**、零命令 0 步。輪廓的設計值為
      (d_hold − d_stop)/v_roll = 7.67 s = 767 步。

  不動的東西: >
    導航控制器與它的成本函數、v_nominal 的語意、所有速度／加速度／輪級／
    關節限制。新增的兩個變化率上限都是**套用既有值**：直寫路徑用導航自己的
    ax/ay/az_max（1.5/1.0/2.0，gmpc_node.py 宣告值），命令鏈用求解器自己的
    a_base_lin/a_base_ang（0.50/2.00，wgmpc_core.py 標為「開發值，無已核准
    來源」—— 標籤照搬，不因被執行層採用而升格）。兩者都是**逐軸**，所以
    合速度的單步變化上限是 √2 倍，這一點在報告裡要寫明。

  尚未做到:
    - ALIGN（接觸前到達並保持）尚未接上相位機與目標產生
    - 夾爪通路與夾持建立／釋放判定
    - 20 mm 校正趟與正式 200 mm 開關＋返回
    - 展開軌跡的逐點自碰與限位檢查（從未做過）

# =====================================================================
# ALIGN（接觸前到達）：目標通路接通，誤差已量出（2026-10-04）
# =====================================================================
align_precontact:
  date: 2026-10-04
  已接通:
    求解器的執行期目標話題:
      檔案: evaluation/wgmpc_wg2_node.py
      改動: >
        加 `--target-topic`（預設 '' = 關閉，既有趟次行為一位元未改）與
        `--target-max-age-s`。原本只吃啟動參數的**固定**目標，抽屜實驗做
        不到：接觸前的退讓目標要由實測把手位姿算出，開啟／關閉段的目標會
        隨實測開度移動。
      關鍵設計: >
        **本輪的目標只解析一次**，求解與到達判定共用同一份。兩處各自取會
        變成「用一個目標求解、用另一個目標判到達」。
      失效處置: >
        不合格的目標（長度不符、非有限值、最後一列不是 (0,0,0,1)、旋轉塊
        非正交、行列式不是 +1）**記下理由**而不是靜默丟棄 —— 靜默丟棄會讓
        「求解器還在用舊目標」看起來像「目標沒變」。過期則**沿用上一筆已
        接受的**並記錄，不當成新鮮值。來源逐輪統計寫進 `runtime_target`。
      測試: evaluation/test_wgmpc_runtime_target.py 18/18（含鏡射矩陣等反例）
    把手實測位姿發布:
      話題: /drawer/handle_pose
      內容: "[sim_t, 開度] ＋ 列優先 4x4（USD 真值）"
      理由: >
        把手幾何不在第二個地方用硬編常數重算。同一個幾何在兩處各寫一次
        遲早會漂。
    ALIGN 目標產生:
      檔案: evaluation/drawer_align_node.py
      算式: "p_G_des = p_H_meas − (tcp_offset + standoff)·ŷ；R_G_des = R_grasp"
      只量位置的理由: >
        把手是沿世界 −y 的移動接頭，**朝向不變**，而且是沿軸的圓柱 —— 繞
        自身軸的轉角無意義。朝向沿用設計抓取姿態的 FK 結果。
      tcp_offset_mm: 14.700
      tcp_offset_來源: >
        由**求解器自己的 FK**（停車位姿 ＋ 設計抓取關節角）算出的 TCP 與
        **實測**把手中心在 y 上的差。沒有另外編數字；與規格既有的
        `tcp_offset_along_tool_z = 0.0147` 一致。
      standoff_mm: 30
      離線核對: >
        退讓 0 重現設計抓取 TCP 到 0.02 mm；退讓 30 mm 正好退 30.00 mm。

  實跑量測:
    趟次: nav_align_020631
    範圍限制: >
      本趟 ALIGN 節點**只發目標並獨立量測** —— 目標話題還沒有消費者
      （求解節點尚未接進本管線）。**不得**據此宣稱 ALIGN 已經在控制。
    判準: 沿用 WG2 既有值 ≤5 mm / 0.02 rad（1.15°）、保持 2.0 s
    展開結束時離接觸前目標:
      位置誤差_mm: 16.02
      姿態誤差_deg: 0.384
      到達並保持: false
    誤差來源（已對帳，不是追蹤失敗）: >
      展開的底盤容差是 `pos_tol = 0.02 m`（20 mm），它停在 **16.4 mm** ——
      在自己的容差內。ALIGN 的容差是 5 mm。所以 16.02 mm 的 TCP 位置誤差
      就是這兩個容差的差距。姿態誤差 0.384° **已經在容差內**。
    誤差軌跡: >
      由交棒當下的 384.91 mm / 90.43° 單調收到 16.02 mm / 0.384°，
      沒有反覆。姿態在 sim_t 48.26 進入容差並維持。

  下一步:
    - ALIGN 的控制要接上求解節點：把 /drawer/tcp_target 餵進
      `--target-topic`，由全身同動收掉最後 16 mm 並保持 2 s。
      這一段正是整機協調的主張所在（底盤與手臂分配）。
    - 兩套到達判定（本節點的獨立 FK 與求解節點的 task_error）要**並列報告**，
      一致才算站得住；不一致本身是個發現，不得挑好看的那個報。
    - 之後才是夾爪通路、20 mm 校正趟、正式 200 mm 開關與返回。

# =====================================================================
# ALIGN 的控制接上求解節點：穩定但停在 11.8 mm（2026-10-04）
# =====================================================================
align_solver_in_loop:
  date: 2026-10-04
  範圍限制（必須隨結果一起講）:
    - 安全層**不在**此管線內。抽屜管線本來就是直接發 /wb_vel_cmd；WG2 自由
      空間那條是以 `freespace_confirmed:=true` 放行的 —— 櫃體就在旁邊，那在
