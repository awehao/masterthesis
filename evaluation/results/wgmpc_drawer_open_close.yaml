    手指碰撞近似: >
      USD 中手指為 physics:approximation = convexHull。手指網格是 L 形：根部（z 0–8 mm）
      內面在 y≈0，指片（z 8–28 mm）內面在 y≈11.2 mm。包成凸包後，夾持面變成斜約 29°
      的 V 形楔面（內面 y 由 z=8 mm 的 0.78 mm 線性升到 z=26 mm 的 10.86 mm）。
    抓取深度下的間隙: >
      TCP 超過桿心 12.26 mm ⇒ 桿心在手指座標 z = 17.04 mm。手指閉到下限 q=0 時，
      凸包與桿面（r = 5 mm）最小距離 +0.09 mm（未接觸）。手指驅動力全部頂在關節下限，
      **擠不到桿子**。這解釋了「閉合 1.48 s 到底、力為 0」。
    真實網格的含意: >
      若改用非凸近似，指片內面在 q=0 時相距 22.4 mm，大於 10 mm 桿徑，根本夾不住。
      目前能夾，靠的是凸包把 L 形填成楔面 —— 這是模擬碰撞模型的性質，寫論文時要說明。
  之後力怎麼來的:
    TCP: FK 顯示等待期間 TCP 在 TCP 座標各軸位移 ≤ 0.11 mm（底盤動了約 2 mm，由手臂抵銷）
    抽屜: 同期間開度增加 1.20 mm（朝機器人＝朝手指根部，楔面變窄的方向）
    力與開度: {finger1_N_per_mm: 3.61, finger1_corr: 0.998, finger2_N_per_mm: 0.61, finger2_corr: 0.971}
    手指被撐開: q_finger 上升 0.44／0.38 mm（開度上升 0.84 mm 的區間）
    結論: >
      是**抽屜朝機器人蠕動、把桿子推進楔面**，力隨之線性上升；不是手臂拖把手
      （先前的推論錯了）。
    未查明: >
      什麼在把抽屜往外推。接觸視圖只過濾「手指↔抽屜」，其他連桿（夾爪殼、相機架、
      link6 等）對抽屜的接觸沒有量測。不能從現有資料判定。
  下一步（未實作）:
    - 補量測：所有機器人剛體對抽屜的接觸力，找出外推來源
    - 不採用「依凸包楔面調抓取深度」：那是利用碰撞近似。μs > tan 29° 也不能單獨
      保證動態抓取不滑出（依賴楔面、受力方向與接觸條件）
    - 順序：核實真實閉合幾何（離線）→ 逐物理步連續接觸判定 → 各部位對抽屜接觸配對量測
      （保留位置與方向、不取淨合力）→ 再決定局部幾何修正（多凸形組件保留真實指墊，
      或有實體依據的指墊／把手尺寸）
    - 不提高夾力、不降低 0.5 N／2 s 判準


# =====================================================================
# 夾爪真實閉合幾何核實（離線，2026-10-04）
# =====================================================================
gripper_geometry_check:
  結論: >
    模擬鏈沒有發現換算錯誤；22.4 mm 閉合間隙是上游官方網格本身的幾何。
    但它是否等於實體夾爪，現有資料無法判定（廠商規格只給行程）。
  逐項:
    URDF_對上游: >
      finger_joint1/2 原點 (0,0,0.0543)、軸 ±y、行程 0–0.0089 m、effort 5、mimic 1:1
      與 src/xarm_ros2 v1.18.1 的 uflite_gripper.urdf.xacro 完全一致
    網格檔: install 與 src 的 finger1/2.stl md5 相同；單位為公尺（範圍 20×15.6×29.5 mm）
    USD_碰撞形狀: >
      以 Isaac pxr 讀 omni_bot_manip_244（基線所用）的實例化碰撞網格，換到手指連桿座標後
      與 STL 範圍逐值相同；比例 1、無額外平移；近似 = convexHull
    關節零點: q=0 時兩手指連桿原點重合（USD 預設姿態）
    mimic: 基線逐步紀錄兩指位置同步（8.9 → 0.04 mm），mimic 有作用
    行程: 每指 8.9 mm ⇒ 總行程 17.8 mm；廠商規格 16 mm（差 11%，未解釋）
  非凸幾何（USD 網格逐帶統計，手指座標 z）:
    z_0_8mm: 根部塊，內面 y≈0（q=0 時兩指相接）
    z_8_28mm: 指片，內面 y = ±11.2 mm ⇒ 閉合間隙 22.4 mm、全開 40.2 mm
    基線桿位置: 桿心 z = 17.04 mm、桿面 z 12.0–22.0 mm，全落在指片段
  廠商規格: >
    UFACTORY Gripper Lite（LG1000）：行程 16 mm、夾力 5 N、「switchable fingers」。
    官方技術規格頁未給最小／最大夾持寬度或手指尺寸。
    來源: https://docs.lite6.ufactory.cc/9.technical_specifications.html ；
    https://www.generationrobots.com/en/404301-gripper-for-lite-6-robotic-arm.html
  待確認: >
    實體手指閉合時指片間距（量實物或廠商圖面）；「switchable fingers」是否代表另有
    手指型式／安裝位置。這決定 10 mm 桿在實體上能不能夾。

# =====================================================================
# 抽屜接觸配對量測（diag_pairs_152919，2026-10-04，診斷趟，非結果）
# =====================================================================
drawer_contact_pairs_diag:
  趟次: runs/diag_pairs_152919（同基線設定 OPEN_M 0.200、HEADING=1；SIM_LIMIT 130 s 截止）
  量測: >
    感測端 = 抽屜本體，過濾對象 = 機器人 107 個剛體各自一對；逐物理步記每對法向力向量、
    摩擦力向量、力加權接觸點、點數、最小間距（世界座標、作用在抽屜上）。另記抽屜未過濾
    總接觸力。讀取全程無失敗（None 列 0）。
  核對: 未過濾總力 = 各對法向力之和（例 t+10 s：y 0.58 = 0.48 + 0.10；z −0.68 = −0.86 + 0.18）⇒ 總力只含法向、不含摩擦；法向殘差 ≈ 0
  結果:
    有力的部位: 只有 uflite_finger1、uflite_finger2；其餘 105 個剛體 0–130 s 對抽屜無接觸
    閉合前: >
      sim 49.0–49.1 s 有 finger2 配對出現但力 = 0、間距 3.4–3.7 mm —— 是接觸偏移範圍內的
      候選配對，**不是碰觸**
    閉合: >
      手指閉到下限（+1.5 s，q ≈ 0.00/0.01 mm）時與桿間距約 0.1 mm，與離線凸包計算的
      0.09 mm 一致
    接觸位置: finger1 在桿上緣（z +4.4 mm），finger2 在桿下緣（z −4.5 mm），y 偏機器人側 2.6 mm
    finger1_法向方向: (0, 0.49, −0.87) ＝ 偏離鉛直 29°，就是凸包斜面的法向 ⇒ 楔面接觸直接證實
    y向分解_t+10s_finger1: {法向_N: +0.48（推進櫃內）, 摩擦_N: -0.69（拉向機器人）}
    把抽屜往外拉的來源: >
      finger1 對桿的**摩擦力** y 分量大於其法向力 y 分量。開度增加 ⇒ 桿更深入楔面 ⇒
      手指被撐開（q 0 → 1.9 mm @ +60 s）、法向力與摩擦一起變大，形成正回饋。
      抽屜關節無摩擦、阻尼 2 /s，0.015 N 量級即可推動（+1.2–1.5 s 開度 0.2 mm）
    兩指不對稱: finger1 法向 1–3 N 量級、finger2 約 0.2 N；成因未查明
  逐物理步判定實跑: contact_held_s 最大 0.39 s；任務節點未宣告夾持成立，停在 ENGAGE 至截止 —— 判定正確拒絕
  求解節點提早備妥實跑: ALIGN 後 0.69 s 上線（基線 5.1 s）
  溫度: CPU 最高 87 °C（中止線 92 °C）

# =====================================================================
# 移動中操作（MotM）實作與實跑（2026-10-04，進行中）
# =====================================================================
motm_implementation:
  夾持幾何（停車流程先驗證）:
    手指碰撞: --finger-collision split（finger_collision.py）：L 形網格拆根部／指片兩凸塊，指片內面 11.2 mm 保持平面
    把手: src/my_omnibot_description/config/drawer_unit_bar26.yaml（只改橫桿 Ø10 → Ø26；理由與「未經實物驗證」寫在檔頭）
    抓取深度: TCP 超過桿心 6.8 mm（桿心在手指座標 z = 22.5 mm）
    驗證趟: >
      grip_bar26_161806（停車流程）：閉合後兩指 5.28／4.49 N，逐物理步連續 2.23 s 成立；
      開 200 → 停 → 關 → 放 → 退 → 收臂 → 交還 → 回起點 DONE；抽屜上只有兩指有力
  求解器（wgmpc_core_sp，預設關閉）:
    底盤參考速度: w_vref·Σ((u_base − v_ref)/vmax)²，v_ref 本體座標
    手臂名目姿態: w_qn·Σ‖q_arm − q_nom‖²（手臂列嚴格線性，無線性化誤差）
    執行期切換: wgmpc_wg2_node --coord-topic（parse_coord 版面 v1，14 欄；過期 0.5 s 即退回啟動值）
    測試: test_wgmpc_coord.py（QP 二次式與非線性成本一致、權重 0 時逐位元相同等）
  離線權重篩選: >
    motm_offline.py（沿用已對照 Isaac 的 wgmpc_closed_loop_sim.run）。接近段 w_qn 必須為 0
    （底盤未到停位時姿態彈簧與 TCP 互相拉扯，誤差 2–20 mm）；開／關段 w_qn > 0 才有手臂分擔。
  時間軸:
    接近: 展開節點與任務節點共用 motm_coord.approach_vref（√ 剖面＋蠕行 4 mm/s，可越過停位至多 30 mm）
    夾持: 底盤蠕行中閉合；判準不變（逐物理步雙指 ≥ 0.5 N 連續 2 s）
    開／關: 底盤參考速度 = 拉速（末端 √ 減速）；手臂名目姿態隨實測開度由夾持姿態內插到收回 60 mm
    關閉後: 底盤即以 8 mm/s 倒退；放開、退開、收臂（回程計畫提早發）、交還導航全程不送零
    交還: dual_source_executor 交還直寫路徑時，變化率基準改取全身最後套用值（反例：跳 −8 → +15 mm/s；測試 L1–L4）
  量測修正:
    同步狀態: 模擬器發 /drawer/sync_state（同一物理步的開度、把手、底盤、手臂）；任務節點每週期清空回呼佇列
    原因: motm_163548 判「夾持滑脫」中止，但實體相對位移 0.00 mm —— 分開話題的時間差 × TCP 37 mm/s
  實跑:
    motm_163548: 夾持成立（5.36／4.31 N）後拉開 0.8 s 誤判滑脫中止（量測問題，已修）
    motm_164012: DONE；夾持期間底盤 9.27 mm／最低 2.92 mm/s；最長低速 0.40 s；手臂分擔 38 mm；
      但對準進場時上指壓桿頂（求解節點上線後手臂擺盪，單點門檻放行）
    motm_164904: DONE；夾持期間底盤 9.25 mm；最長低速 0.31 s；漂移 0.94 mm；手臂分擔 47.5／46.0 mm；
      **但求解節點上線 1 s 時指尖撞桿面 70 ms、峰值 92.7 N**（啟動擺盪，MotM 權重下垂直 −63…+48 mm）
    處置: 接觸前位姿須連續 0.5 s 在 5 mm 內才進場；接觸前位姿穩定前用已驗證權重（軟啟動）；MotM 退讓量 60 mm
