rolling_handover_findings:
  date: 2026-10-04
  scope: >
    真 gmpc_node 原樣使用；/odom 給真值；/plan 由任務節點依已知靜態房間產生
    （未用 nav2 planner）；CBF 關閉。以下全部是實跑量測，趟次編號可對帳。

  已完成並驗證:
    交棒逐步連續:
      趟次: nav_handover_cap_005455
      內容: >
