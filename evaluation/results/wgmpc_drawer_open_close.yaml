# =====================================================================
# 更正：底盤命令座標系錯誤（我造成的），修正後平台不變（2026-10-04）
# =====================================================================
align_frame_bug_and_correction:
  date: 2026-10-04
  缺陷: >
    `wgmpc_wg2_node._publish_u` 發的是**世界座標**九維命令（docstring 寫明
    「body → world 後發給安全鏈，adapter 之後會轉回 body」）。我把它直接接
    到 `/wb_vel_cmd`，而抽屜模擬器的命令鏈把那裡當**本體座標**（執行端自己
    做 wx = vx·cosθ − vy·sinθ）。底盤 x/y 因此被旋轉 θ ≈ 1.2973 rad（74.3°）。
  症狀: >
    錯誤管線下底盤走 Δx = −59.30 mm、Δy = +6.73 mm、Δθ = −9.71°，
    而離線精確解要的是 Δy = −25 mm、Δx = 0、Δθ = 0、手臂不動。
    手臂分量與 wz 不受影響（body_to_world 只旋轉前兩個分量），所以誤差仍由
    25.21 降到 11.8 mm —— 那是手臂做的，底盤在亂走。
  作廢的趟次: [nav_align_solve2_022109, nav_align_solve4_023417, nav_align_solve5_023901]
  作廢的結論:
    - 「11.8 mm 是求解器自願停留的代價權衡駐點」（當時管線有座標錯誤）
    - 「平台與起點無關」（solve4/solve5 的對照同樣帶著這個錯誤）
    - 對候補 A（w_bt）與候補 B（視野）的一切推論
  修法: >
    求解節點改發中性話題 `/wgmpc/cmd_world`，由 `arm_vel_adapter` 做世界→
    本體那一次旋轉（`--in-topic` 可指定，預設仍是安全層輸出）。轉換**只保留
    一份**，不在下游另寫。抽屜模擬器補宣告 `joints` 參數，讓 adapter 能核對
    關節順序 —— 順序錯置會讓每個關節拿到別人的速度而下游殘差看起來健康。

  修正後的實跑:
    趟次: nav_align_adapt_025036
    底盤位移: {dx_mm: -2.93, dy_mm: -16.67, dyaw_deg: -1.034}
    精確解需要: {dx_mm: 0, dy_mm: -25, dyaw_deg: 0, 手臂: 不動}
    評語: 方向正確了（原本 Δx = −59.3 mm／Δθ = −9.71°），但只走了需要的 2/3
    平台_mm: 12.19
    平台_deg: 1.577
    在容差內: 4/2400
    deadline_miss: 0/2400
    判定: >
      **平台在座標修正前後都是 ~12.2 mm** ⇒ 它不是那個座標缺陷造成的，
      是真的駐點。這一趟才是談求解器行為的有效證據。

  待辨別（更新）: >
    候補 A 的機制敘述要更正：`w_bt`/`w_br` **不是底盤位姿正則**，程式裡沒有
    任何「相對起點位移」的懲罰項。它們進的是 `R`（速度大小權重），且以各軸
    自己的上限正規化：`R = diag(w / vmax²)`，所以飽和代價就等於權重本身 ——
    底盤 1e-3、手臂 w_a = 0.05，**底盤是最便宜的軸，便宜 50 倍**。
    因此「正則把底盤拉回起點」站不住。
    剩下的候補：
    (1) 視野 N=5、dt=0.05 ⇒ 0.25 s 的遞迴視野駐點；
    (2) 位置／姿態權重的權衡（w_p=50、w_r=25，**非 CLI 參數**）：姿態誤差
        由 0.000° 長到 1.577°、位置同時停在 12.19 mm，像是停在一個折衷點，
        而精確解同時歸零兩者。
    下一步：**一次只動一個變數**，先單獨加長 N。

