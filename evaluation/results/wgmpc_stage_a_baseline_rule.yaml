# 基線趟次的取值規則 —— **執行前定版**
#
# 這份檔的用途是：在看到任何基線數字**之前**就把門檻怎麼算寫死。
# 寫在趟次之後的規則沒有約束力 —— 看過數字再定規則，等於挑一個剛好通過的門檻。
schema: wgmpc_stage_a_baseline_rule/2
狀態: >
  執行前定版的部分仍為 v1；v2 含**看過首趟資料後的修訂**（post-hoc），
  逐條標示性質並保留原值與理由。見「修訂史」。
定版時間_utc: '2026-10-03'

修訂史:
  說明: >
    事前定版的條款與**看過資料後**修訂的條款必須分得開。
    後者會削弱該條的事前約束力，所以逐條標示性質、保留原值與理由，
    不混在一起稱「規格修正」。
  v1:
    時間_utc: '2026-10-03'
    性質: 執行前定版（尚未跑任何基線）
    內容: 取值規則、可覆寫參數的約束、驗收條件、措辭限制、熱況條件
  v2:
    時間_utc: '2026-10-03'
    性質: 跑完首趟與第二趟之後的修訂
    逐條:
      - 條目: "可覆寫參數的約束／start_temp_c"
        變更: "整條解除（enforced: false）"
        性質: 授權變更（Howard 指示），非資料驅動
        授權: Howard「不需要管起跑溫度 跟插電和我在不在旁邊」
      - 條目: "驗收條件／時間戳涵蓋全窗／起點涵蓋"
        變更: 2 個物理步 → 5 個物理步
        性質: "**post-hoc**（看過首趟資料後放寬）"
      - 條目: "驗收條件／機器人確實未受命令驅動"
        變更: "|base_lin_meas| <= 1e-6 m/s → 全窗相對起點的最大位移 ＋ 停更簽章檢查"
        性質: "**post-hoc**（看過首趟資料後改判準）；門檻值未核准定版"
      - 條目: "驗收條件／關鍵讀值完整"
        變更: 未變
        性質: 事前定版，首趟與第二趟皆據此拒絕產生門檻
      - 條目: "取值規則（max_abs_plus_resolution）"
        變更: 未變
        性質: 事前定版
  尚未產生門檻的趟次:
    - run: "wgmpc_stage_a_baseline_011543"
      結果: 拒絕（接觸力 5999/5999 讀取失敗；當時紀錄未保存例外內容）
    - run: "wgmpc_stage_a_baseline_012545"
      結果: 拒絕（接觸力 5999/5999 讀取失敗；例外 'cannot reshape array of
        size 1 into shape (3)' ⇒ get_contact_force_matrix 需要 contact filter，
        已改用 get_net_contact_forces，**待下一趟實錄證明讀取成功**）

目的: >
  量出**這次模擬配置**下，抽屜在機器人靜止不發命令時自己會有多少開度漂移與
  接觸力讀數，據此產生階段 A 的工程偵測門檻。

基線趟次的條件（**與階段 A 對齊**）:
  場景: 同一個櫃體、抽屜與機器人；由 drawer_asset.build_usd 於 /World/drawer_unit 建出
  抽屜資產: src/my_omnibot_description/config/drawer_unit.yaml（**不改**）
  櫃體位姿: 與階段 A 相同（預設 0.0, 1.45）
  抽屜 drive: stiffness／damping／max_force 皆 0，**讀回核對**，非零即中止
  抽屜質量與阻尼: 資產檔定義（2.0 kg、線性阻尼 2.0、關節摩擦 0）
  機器人: 停在**階段 A 的起始姿態**（交棒後那一段的起點：j3 在有效限位中點、
          其餘五軸零位、底盤於原點），由 --init-arm-q 指定
  命令: "**不發任何移動命令**（命令鏈收不到命令，執行端回報 no_command）"
  物理步長: 與階段 A 相同（0.01 s）
  開度讀取: opening = DY0 − 抽屜剛體世界 y；DY0 取於設定增益之後、
            進入物理迴圈之前（與階段 A 及 isaac_drawer_sim 同式同時機）
  觀察時長: 與階段 A 的模擬時間預算相同（預設 60 s）
  場景守衛: 與階段 A 相同（放行機器人、地面與 /World/drawer_unit 子樹）

取值規則（**執行前定版，不得事後調整**）:
  規則名: max_abs_plus_resolution
  開度門檻:
    式子: tol_m = 基線**全窗**最大 |opening| ＋ 紀錄解析度預留量
    全窗而不是末值: 漂移不保證單調；取末值會低估
    解析度預留量_m: 1.0e-9        # 落盤用 round(x, 9) ⇒ 低於此值的差異讀不出來
  接觸力門檻:
    式子: tol_n = 基線**全窗**最大 |drawer_contact_fmag| ＋ 紀錄解析度預留量
    解析度預留量_n: 1.0e-9
    若基線無任何接觸: 門檻即為預留量本身（抽屜懸在滑動關節上，離下層板 2 mm）
  非有限值的處置: 計入並回報筆數；若全窗皆非有限值即拒絕產生門檻
  產生後: 寫成門檻檔並**固定**供階段 A 使用，不逐趟重算

可覆寫參數的約束:
  說明: >
    基線腳本的環境變數覆寫**必須受這份規則約束**。覆寫本身不是問題 ——
    問題是覆寫之後這趟就不再是「對齊階段 A 的靜止基線」，而門檻卻照樣產生。
    所以每一項都在這裡給出允許範圍，由腳本在啟動前核對，不符即不啟動。
  start_temp_c:
    enforced: false        # 已解除，見下方 2026-10-03 的第二筆修訂紀錄
    max: 43
    rule: （已解除）原為只能調低、不得調高
    why: 既有紀錄七趟峰值單調上升到 88 °C；起跑線放寬等於把熱中止線往上推
    修訂紀錄:
      - 日期: "'2026-10-03'"
        原值: 42
        新值: 43
        授權: Howard 指示「直接跑」
        量到的狀況: >
          連量三次 42.875 / 42.125 / 42.125 °C，看起來是這台機器的待機平衡點
          而不是仍在下降；原值 42 使單趟基線無法起跑。
        理由與範圍: >
          **最小幅度**的放寬，剛好容納實測到的峰值 42.875，沒有別的熱論據。
          原值 42 是為了**七趟批次**留散熱餘裕而定（峰值單調爬到 88 °C）；
          本趟是單趟 60 s 的靜止觀察，負載形態不同。
          這是**規則修訂**，不是環境覆寫 —— 環境覆寫只允許調低。
        未放寬的部分: >
          92 °C 熱中止線**不動**，且已確認在本支模擬裡讀得到溫度
          （hwmon:k10temp）、讀不到會當成監看失效。熱中止觸發時
          stop_reason 為 monitor_failure，驗收要求 sim_limit ⇒
          **熱中止的趟次不會產生門檻**。
      - 日期: "'2026-10-03'"
        變更: "起跑溫度門檻**整條解除**（enforced: false）"
        授權: Howard 指示「不需要管起跑溫度」
        連帶解除: 開 Isaac 前的插電確認與人在機旁確認（同一指示）
        起跑溫度仍要記錄: >
          不再作為啟動條件，但趟次紀錄仍寫入起跑溫度與全程峰值
          （cpu_temp_start_c／cpu_temp_max_c），供事後判讀熱況。
        "**未**解除的部分": >
          92 °C 執行中熱中止線**不動**。它與起跑線是兩回事：起跑線是事前的
          散熱餘裕，熱中止線是執行中的保護。已實測在本支模擬裡讀得到溫度
          （hwmon:k10temp，首趟峰值 69.0 °C），讀不到會當成監看失效；
          觸發時 stop_reason 為 monitor_failure，而驗收要求 sim_limit ⇒
          **熱中止的趟次不會產生門檻**。
        為什麼記在規則檔而不是用環境變數繞過: >
          環境覆寫只允許調低，本來就無法解除這條。把解除寫進事前規則並附
          授權與日期，趟次事後才看得出「這趟沒有起跑溫度條件」。
  observe_sim_s:
    min: 60
    rule: 只能加長，**不得縮短**
    why: 門檻取全窗最大值；觀察窗縮短會系統性低估漂移
  physics_dt_s:
    eq: 0.01
    rule: 必須與階段 A 相同
    why: 漂移量取決於積分步長；換步長的基線產生的門檻對階段 A 無效
  mode:
    eq: solver_drawer
  joint_margin:
    eq: 0.05
  drawer_pose_xy:
    source: src/ammr_wholebody_mpc/config/wgmpc_stage_a.yaml 的 scene.pose_xy
    rule: 必須與階段 A 的櫃體位姿相同
  drawer_asset:
    source: src/my_omnibot_description/config/drawer_unit.yaml
    rule: 必須與階段 A 同一份資產；以**內容雜湊**比對，不只比檔名

基線趟次的驗收條件（**門檻產生前必須全部成立**）:
  說明: >
    提早中止但已落盤的趟次會產生**偏低**的門檻，而偏低的門檻會讓階段 A 的
    任何微小數值都看起來超標。所以「有紀錄」不等於「可用來產生門檻」。
  完整觀察: sim_time_s >= observe_sim_s（扣一個物理步的容差）
  正常收尾: stop_reason 必須是 sim_limit
  關鍵讀值完整:
    - drawer_read_fail_steps == 0
    - drawer_contact_read_fail_steps == 0
    - drawer_opening 與 drawer_contact_fmag 全窗皆為有限值
    - 取樣筆數 >= observe_sim_s / physics_dt_s 的九成
  時間戳涵蓋全窗:
    說明: >
      只核筆數不夠。筆數可以達到九成，而資料卻集中在前段 —— 例如
      sim_time_s 寫 60、收尾正常，但 log 只到 53.99 s。那樣門檻仍然
      系統性偏低，而且看不出來。所以要核**時間戳本身**。
    起點涵蓋: 第一筆時間戳 <= 5 個物理步
    起點涵蓋的修訂紀錄:
      - 日期: "'2026-10-03'"
        修訂性質: "**看過首趟資料後的規則修訂（post-hoc）**"
        原判準: 第一筆時間戳 <= 2 個物理步（執行前定版）
        新判準: 第一筆時間戳 <= 5 個物理步
        原判準的理由（保留）: >
          訂 2 步是要求觀察窗從頭涵蓋，當時假設模擬迴圈第一筆就在 0.01–0.02 s。
          這個假設沒有先量過。
        觸發修訂的實測: 首趟第一筆時間戳 0.03 s = **3 個物理步**
        修訂的理由: >
          門檻取的是累積漂移的全窗最大值，而累積量的最大值出現在尾段；
          漏掉開頭 0.03 s（60 s 的 0.05%）對門檻沒有實質影響。
        明確不宣稱: >
          **不宣稱原判準未變，也不宣稱這是「只修規格不動判準」。**
          這是在看過資料之後放寬了一條驗收判準，會削弱該條的事前約束力。
          保留原值與理由於本紀錄，供事後判讀。
        同時未放寬的: >
          尾段涵蓋與中間缺口兩條**維持原值**（首趟分別是 60.01 >= 59.98 通過、
          最大相鄰間隔 1 個物理步）。那兩條才是會系統性壓低門檻的。
    終點涵蓋: 最後一筆時間戳 >= observe_sim_s − 2 個物理步
    中間最大缺口: 相鄰時間戳的最大間隔 <= max_gap_steps 個物理步
    max_gap_steps: 5
    單調性: 時間戳不得遞減
    全為有限值: 時間戳不得含非有限值
  機器人確實未受命令驅動:
    - cmd_chain.received == 0
    - 全窗 integrating == 0
    - 底盤**全窗相對起點的最大位移** <= 1.0 mm（**已核定**：Howard 2026-10-03
      「≤1 mm 是底盤靜止驗收門檻」）
    - twist 與位移的矛盾**必須被刻畫**：若 ∫|v| dt 與最大位移相差超過 10 倍，
      則必須同時出現「停更簽章」（速度與位置自同一步起皆完全相同），
      否則視為**未解釋的異常**而拒絕
  未受命令驅動的修訂紀錄:
    - 日期: "'2026-10-03'"
      修訂性質: "**看過首趟資料後的規則修訂（post-hoc）**"
      原判準: 全窗 |base_lin_meas| <= 1e-6 m/s（執行前定版）
      原判準的理由（保留）: >
        要求底盤靜止。1e-6 m/s 是憑假設訂的，既沒量過這台機器的靜止讀數，
        也沒核對該讀數與位置是否一致。
      新判準:
        - 全窗相對起點的最大位移 <= base_disp_limit_m（**值尚未核准定版**）
        - twist 與位移的矛盾必須被刻畫（停更簽章），**不得從驗收移除**
      量測結果（第二趟 wgmpc_stage_a_baseline_012545，5999 筆）: >
        phys_vx 全程為正、p50 = max = 1.658 mm/s；積分得位移 0.0994 m。
        實際 phys_x 位移 1.69e-4 m ⇒ 相差 **587.9 倍**。
        **位置與速度都在 t = 0.44 s 凍結**：之後 5957 筆完全相同。
        底盤在 0–0.44 s 的初始沉降中真的移動了 0.169 mm，然後停住；
        速度則 latch 在沉降末期的 1.658 mm/s 不再更新。
        base_x 與 phys_x 最大差 6e-6 m ⇒ **不是兩個不同的位置來源**。
      判讀: >
        若車體真以 1.658 mm/s 前進，位置必然改變；若真的靜止，應回報 0。
        兩者都不成立 ⇒ 該讀數是**停更後的殘值**，既不能當移動的證據，
        也不能當靜止的證據。
      機制（**假設，未證實**）: >
        簽章符合 PhysX 剛體進入睡眠後讀回未更新。**本輪未證實**，
        未做喚醒／睡眠閾值的對照實驗，也未查 Isaac view 的快取行為。
      為什麼改用「全窗相對起點的最大位移」而非首末差: >
        首末差排除不了中途移動與返回。本趟兩者恰好相同（0.169 mm，
        峰值在 t = 0.44 s），因為沉降是單向的；但判準不能依賴這個巧合。
      門檻值的狀態: >
        **已核定為 1.0 mm**（Howard 2026-10-03 釐清：「≤1 mm 是底盤靜止驗收門檻」）。
        先前一度標為不核准，是因為當時只有首末差可依據；改為全窗最大位移並
        查清 twist 停更之後才核定。供判讀的實測值為 0.1630 mm（三趟相同）。
        產生器自規則檔讀取；命令列仍可覆寫，覆寫會寫進門檻檔的證據。
      仍未放寬的部分: cmd_chain.received == 0 與 integrating == 0 **原樣保留**
  抽屜為被動件: drive_stiffness／damping／max_force 讀回皆為 0
  不成立的處置: "**拒絕產生門檻**，回傳非零碼；不以「數字看起來合理」通融"

開度與接觸力門檻的核定條件:
  狀態: "**已核定**（條件於 2026-10-03 達成，見下方「核定依據」）"
  核定依據:
    授權: Howard 2026-10-03
    條件: 兩趟 60 s 與一趟 120 s 都通過驗收且開度與接觸力全為零
    實際達成的趟次:
      - run: wgmpc_stage_a_baseline_015223
        觀察_s: 60.010
        驗收: pass
        開度峰值_m: 0.0
        接觸力峰值_n: 0.0
      - run: wgmpc_stage_a_baseline_rep1_015917
        觀察_s: 60.010
        驗收: pass
        開度峰值_m: 0.0
        接觸力峰值_n: 0.0
      - run: wgmpc_stage_a_baseline_rep2_020030
        觀察_s: 60.010
        驗收: pass
        開度峰值_m: 0.0
        接觸力峰值_n: 0.0
      - run: wgmpc_stage_a_baseline_long120_020143
        觀察_s: 120.010
        驗收: pass
        開度峰值_m: 0.0
        接觸力峰值_n: 0.0
        附帶: 後 60 秒的開度與接觸力峰值仍為 0 ⇒ 漂移未在更晚出現
    核定值:
      開度_tol_m: 1.0e-9
      接觸力_tol_n: 1.0e-9
    名稱: 這份配置的**紀錄變化偵測門檻**
    可重現性: >
      接觸力修好後的四趟，前 60 s 的關鍵欄位序列**位元相同**
      （sha256 前綴 953feeb4fb43；底盤最大位移皆 0.1630 mm）。
      修好前的兩趟（011543、012545）雜湊不同，差異**完全來自**
      drawer_contact_fmag 當時為 NaN。
      依措辭限制：這只能說「同配置下所測趟次可重現」。
  原狀態（保留）: 待這批完整結果核定（Howard 2026-10-03）
  核定條件: >
    兩趟 60 s 與一趟 120 s **都通過驗收且開度與接觸力全為零**時，
    按既定公式（max_abs_plus_resolution）把 1e-9 定為**這份配置的
    紀錄變化偵測門檻**。
  名稱限定: >
    它是「紀錄變化偵測門檻」—— 量的是**紀錄解析度**，不是物理漂移上界。
    基線全窗峰值為 0，所以門檻就等於解析度預留量本身。
  超標只能說: 讀值超過靜止基線
  超標不能說的:
    - 確定有接觸
    - 確定抽屜被推動
  階段 A 要用的門檻檔: >
    evaluation/runs/wgmpc_stage_a_baseline_long120_020143/drawer_threshold.json
    （取 120 s 那趟：觀察窗最長、證據最多；四趟的門檻值相同）。
    階段 A 以 DRAWER_BASELINE 指向它；判定器會重算配置指紋並逐項比對。

門檻的範圍（措辭限制）:
  成立: 這是**這次模擬配置的工程偵測門檻**
  不成立:
    - 不是所有情況的漂移上界
    - 單趟基線不提供統計區間；沒有重複趟次就沒有離散度
    - 更換物理步長、求解器設定、抽屜質量或阻尼後必須重新量

判定措辭（**本輪明確收準**）:
  超過開度門檻只能說: 抽屜位移超過靜止基線
  由開度不能推論的事: 夾爪碰到抽屜、或機器人推了抽屜（**都不行**）
  接觸的依據: 獨立證據 —— PhysX 接觸力合力（drawer_contact_fmag），
              以及（若有）真值最短距離
  兩軸獨立: 位移與接觸分開報告，不把其中一個當成另一個的證據
  缺資料: NaN 表示**沒有量到**，不是「沒有發生」；缺接觸紀錄時接觸與否不判定
  接觸力讀取的能力與限制:
    已證明: 接觸力 API **能成功讀取**（第三趟 0 步失敗，5999 筆全有限）
    不成立的宣稱:
      - "淨合力為零**不證明沒有接觸**（合力可相互抵銷；也未取得接觸點與法向）"
      - "淨合力為零**不證明有接觸時感測器一定會回報**"
    還需要什麼: >
      **已知接觸的正向對照** —— 刻意讓機器人（或任意剛體）接觸抽屜並確認
      讀數非零。沒有這個對照，接觸偵測只能說「讀得到數字」，
      不能說「有接觸就會被偵測到」。
  可重現性的措辭:
    可以說: 同配置下**所測趟次可重現**（位元相同）
    不能說:
      - 模擬在所有條件下都是決定性的
      - 位移不是隨機變數
    理由: >
      只測了同一份配置、同一台機器、同一個 Isaac 版本的數趟。
      換版本、換步長、換初始狀態都未測。

基線趟次**不**驗證什麼:
  - 不驗證交棒流程（前置調姿 → W-GMPC）—— 那段尚未實跑
  - 不驗證協同接近、到達或保持
  - 不驗證屏障在運動中的行為（機器人靜止）
  - 不提供抽屜被真正推動時的動力學依據

熱況條件:
  起跑溫度門檻_c: 42          # 既有紀錄：48 °C 太高、散熱追不上
  熱中止線_c: 92              # **不得提高**
  保護觸發的處置: 保留結果並停止，**不自動重跑**
  到場條件: 開 Isaac 前確認插電與人在機旁
