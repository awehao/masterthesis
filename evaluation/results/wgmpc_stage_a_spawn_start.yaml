  sim_time_s: 23.0

comparison_with_move_runs:
  basis: >-
    五趟以**同一組明確定義**重算（到達時間相對各自起始閘門；餘裕只取閘門
    之後的窗口）。先前表格的「手臂變號比例 29.3–48.3%」用的是另一種基準，
    與本表的「保持窗變號 1.4%」**不是同一個量**，不可併讀。
  margin_correction:
    what_I_nearly_reported: spawn 的最小有效餘裕 +0.1043 比 move 的 +0.0100 大十倍
    why_wrong: >-
      move 四趟的 +0.009973 全部出現在**交棒之前的前置調姿段**
      （r1 @25.07s／交棒 42.56s、r2 @27.04/42.57、r3 @24.92/39.54、
      rec @12.87/23.42），那是調姿時 j3 貼著限位的數字，不是階段 A 的餘裕
    corrected: >-
      只取閘門之後：move 設定點最小餘裕 +0.100693…+0.105815，
      spawn +0.104257 ⇒ 階段 A 的餘裕**沒有變**
  table_post_gate:
    - [趟次, 到達-起算 s, 保持 s, 誤差 p50 mm, p95, max, 同動 %, 保持 TCPv p95 mm/s, max, 總模擬 s]
    - [move r1, 16.10, 4.58, 1.413, 1.455, 4.788, 63.0, 5.70, 32.64, 63.2]
    - [move r2, 15.63, 3.67, 1.433, 1.625, 4.748, 67.0, 10.67, 29.40, 61.9]
    - [move r3, 14.12, 3.76, 1.442, 1.784, 4.731, 72.1, 8.65, 28.99, 57.4]
    - [move rec, 13.37, 2.49, 1.442, 2.277, 4.841, 81.1, 16.32, 28.49, 39.3]
    - [spawn, 12.77, 2.36, 1.451, 2.220, 4.868, 84.6, 16.25, 34.64, 23.0]
  what_can_be_claimed:
    - >-
      **總模擬時間明確下降**（23.0 s vs move 39.3–63.2 s）：整段前置調姿
      不再存在。這一條不靠統計，是結構差異。
    - 成功判準全部達成：5 mm／0.02 rad、連續保持 2.36 s ≥ 2 s
    - 階段 A 的有效限位餘裕與 move 路徑相當（見 margin_correction）
  what_cannot_be_claimed:
    - >-
      「spawn 比較快」—— 到達 12.77 s 只比最快的 move 趟次少 0.60 s，
      而 move 自己四趟的散佈就有 2.73 s；單趟分不出來
    - >-
      「同動比例提高」—— 84.6% 只比最高的 move 趟次高 3.5 個百分點，
      move 自身散佈 18 個百分點
    - >-
      「振動變好或變壞」—— 保持窗 TCP 速度 p95 16.25 落在 move 區間內；
      峰值 34.64 比 move 區間上緣高 2.0 mm/s，單趟不足以判
  still_open:
    - 位置誤差峰值 4.868 mm 距 5 mm 容差只剩 0.132 mm（move 路徑也在同一邊緣）
    - 保持期間的殘餘振動未解
    - Isaac 間歇性啟動卡死的根因仍未確立

tests:
  - evaluation/test_wgmpc_start_posture.py（38/38；正常值取自實測趟次的閘門觀測）
  - evaluation/test_wgmpc_u_prev_no_command.py（14/14；修改前 9/14 紅）
  - evaluation/test_wgmpc_stage_a_runner.py（74/74；兩條起始路徑分開核）
  - evaluation/test_wgmpc_handover.py（59/59；交棒路徑判準未改動）

preserved:
  move_path: 原四趟結果與影片未改動（rec 影片 md5 前綴 272953756ebfcc6f 不變，四趟判定仍 pass）
  frozen_specs: 既有規格未覆寫；本檔為新增
