title: 階段 A 的生成式起始構型 —— 起始位置不調 j3
status: 已實跑一趟並通過；僅一趟，重複性未測

request:
  from_user: 希望在起始位置一開始不要去調 j3
  interpretation: 取消階段 A 開頭那段 j3 前置調姿，讓機器人一開始就在可用構型

why_j3_had_to_be_adjusted:
  symptom: 零位起步跑不到正式預抓取（求解失敗 1171/1201、卡在 853.8 mm）
  cause: >-
    零位時 j3 向下只剩 0.0099 rad 的有效餘裕，而套用命令落後兩週期，
    QP 的限位列因此不可滿足
  not_the_cause: 目標不可達
  enough_to_fix: 只要 j3 離開限位即足夠
  source: evaluation/results/wgmpc_wg2_zero_start_block.yaml

change:
  switch: START_MODE（運行器環境變數），預設 spawn
  spawn: 機器人**直接生成**在起始構型（Isaac 的 --init-arm-q），不做任何 j3 調姿
  move: 保留原路徑（從實際零位閉迴路調姿到起始構型，再交棒；已實測四趟）
  start_posture_source: 由運行器自 URDF 硬限位算出，只動 j3（取有效限位中點），其餘五軸留零位
  computed_value: "0,0,1.437278401,0,0,0"
  identical_to_baseline: 與基線長趟 --init-arm-q 的值逐位元相同
  run_label_split: >-
    Isaac 的 run-label 也依路徑分開；沿用 move 的標籤會讓 wb_run.json
    描述一件沒發生的事

cost_of_spawn:
  not_demonstrated:
    - 機器人能自己從實際零位移動到這個起始構型
    - 該移動段的逐步限位與避碰（move 路徑才會實跑）
  status_of_that_claim: 明列的**起始條件假設**，不是本趟展示的結果

start_gate:
  name: 起始構型核對
  script: evaluation/wgmpc_stage_a_start_check.py
  rule: ammr_wholebody_mpc.wgmpc_handover.check_start_posture
  not_a_handover: >-
    判準組成與交棒判定不同，兩者不可混用。交棒判定核「前置來源已宣告完成、
    已解除、安靜夠久」；這條路徑沒有前置來源，那三條不適用。
  checks:
    - 實測關節角有效、新鮮、在有效限位內
    - 實測角與要求的起始構型相符（容差 0.02 rad）
    - 設定點有效、在有效限位內、與實測角相符（容差 0.01 rad）
    - u_prev 取自**實際套用回報**（與交棒判定相同）
    - 實際套用回報顯示手臂**確實靜止**（上限 1e-3；交棒判定不核這條）
  cannot_check: >-
    「沒有別的手臂命令來源」—— 運行器在此模式下不啟動前置節點，那是
    **結構性質**（由 test_wgmpc_stage_a_runner.py 的不變量把住），
    不是這個閘門量到的
  measured_1003_152137:
    start_max_dev_rad: 0.004696
    setpoint_meas_max_dev_rad: 0.002367
    arm_rest_max_abs_u: 0.0
    n_recv: 20
    n_rejected: 0
    exec_mode: 0
    u_prev_source: applied
    min_effective_slack_rad: 1.44555

revision_history:
  - what: 初版假設此路徑下手臂「從未被命令過」，以初始靜止假設的零值當 u_prev
    refuted_by: >-
      實跑 wgmpc_stage_a_spawn_151022 以碼 26 攔下：n_recv=289、exec_mode=0、
      設定點已建立。adapter 一上線就持續送零命令，所以該前提不成立。
    outcome: >-
      既然取得到實際套用回報就不需要那個假設；閘門因此改**強**（改取實際
      套用回報，並新增「手臂確實靜止」）。碼 26 作廢但保留在碼表裡，
      讓那一趟的 handover.json 仍讀得懂。
  - what: 順帶修掉 wgmpc_wg2_node.py 的 u_prev **標籤**缺陷
    detail: >-
      執行端在設定點還沒建立時每一步也發一筆 /coman/applied_cmd
      （exec_mode=4、欄位零值、api_applied=False）。節點不分模式一律把它
      設成 self._applied，於是 strict 政策的首輪會把 u_prev 標成 applied
      ——「量到的套用值」——而其實什麼都沒套用過。
    numeric_impact: 無（兩者都是零）
    why_it_still_matters: strict 政策的全部意義在標籤；標錯就等於驗證條件失效
    test: evaluation/test_wgmpc_u_prev_no_command.py（修改前 9/14，修改後 14/14）

voided_run:
  id: wgmpc_stage_a_spawn_151801
  why: >-
    趟次還在等場景建立時我編輯了運行器，插入點在當時執行位置之前。
    bash 按位元組偏移遞增讀取腳本，在執行點之前插入會讓後續讀取錯位。
  state: 於場景仍未建起時依既定清理規則終止，無殘留程序，未產生任何結果判定
  marker: evaluation/runs/wgmpc_stage_a_spawn_151801/VOID.md
  lesson: 趟次在飛時不改腳本

