# 自由空間 WG2：實際延遲 vs 求解端延遲補償（離線核對，2026-10-04）
問題: >
  抽屜房的手臂啟動擺盪根因是模擬器 ROS 佇列積壓（狀態→生效 p50 150–210、最大 390 ms，補償假設 80 ms；
  見 wgmpc_drawer_open_close.yaml 的 startup_swing_root_cause）。自由空間的手臂甩動／極限環
  （wgmpc_wg2_arm_thrash_fix.yaml）是否也是同一類原因？
方法: >
  cmd_env.jsonl 的 solver 段（發布時刻、source_seq）與 endpoint 段（首次 API 套用）以 source_seq 逐筆配對；
  wg2_out.json 每輪的 snap_sim_t_exact 以發布時刻對應。全部為模擬時間（adapter 段為牆鐘，不使用）。
  補償假設：狀態→生效 1.6 週期 = 80 ms，其中發布→生效 1.0 週期 = 50 ms。
結果_ms:
  - {run: wgmpc_wg2_farB_171109, 註: 舊權重（手臂甩動）, n: 309, 狀態到發布_p50: 30, 發布到生效_p50: 50, 狀態到生效: {p50: 80, p90: 90, max: 140}, 啟動4s_p50: 90}
  - {run: wgmpc_wg2_farB_v2_181023, n: 366, 狀態到發布_p50: 30, 發布到生效_p50: 40, 狀態到生效: {p50: 60, p90: 70, max: 120}, 啟動4s_p50: 70}
  - {run: wgmpc_wg2_near_v2_181333, n: 68, 狀態到發布_p50: 20, 發布到生效_p50: 40, 狀態到生效: {p50: 60, p90: 110, max: 110}, 啟動4s_p50: 60}
  - {run: wgmpc_wg2_farB_c1_194119, n: 381, 狀態到發布_p50: 30, 發布到生效_p50: 40, 狀態到生效: {p50: 70, p90: 100, max: 120}, 啟動4s_p50: 70}
  - {run: wgmpc_wg2_near_c1_194342, n: 72, 狀態到發布_p50: 15, 發布到生效_p50: 50, 狀態到生效: {p50: 70, p90: 70, max: 70}, 啟動4s_p50: 70}
結論: >
  自由空間延遲與 80 ms 補償吻合（p50 60–80 ms），啟動期間也未變長；isaac_wholebody_sim_e2.py 以獨立執行緒 spin，
  沒有抽屜房的佇列積壓。甩動那趟（舊權重）延遲同為 80 ms ⇒ 自由空間甩動與延遲無關，
  支持原診斷（變化率權重以 vmax² 正規化後手臂只剩 0.001）。兩種振盪是不同機制。
  WG2「5 Hz 極限環未再出現、不說已解決」的措辭不變；本核對只排除延遲這個候選。
  抽屜房修正後（p50 70、最大 90 ms）與此一致。
