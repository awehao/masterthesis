# 接近命令下的屏障餘量核算（離線，正式預抓取目標）
主題: 抽屜階段 A 的屏障列核算與終點可行性
狀態: >
  已核算。退讓 0.100 m 的終點**不通過**（屏障餘量 −0.014687 m/s）；
  退讓 0.120 m 的接近段**全程通過**（最小 +0.02479 m/s，安全層 0/209 次修改）。
  夾持點本身必然不通過，須靠相位例外。

列的生成:
  說明: 沿用生產端 arm_link_distance._rows_links 的同一條路徑，不另寫一套
  管線: >
    drawer_asset.shapes_world → 障礙物設定字串 → parse_obstacles
    → arm_link_geometry.obstacle_distance_matrix → 帶選列 d <= d_min + rho
    → 22 欄 → wholebody_safety_filter.detection_point_from_row
    → filter_velocity
  幾何交叉核對:
    方法: 3000 個隨機點，生產端 SDF 對 drawer_asset 自己的 SDF
    最大差_m: 2.22e-16
    判定: 障礙物設定與資產檔**同一個幾何**
  具名障礙物: 14
  清單: [cabinet/side_left, cabinet/side_right, cabinet/back, cabinet/top,
         cabinet/shelf_below, cabinet/shelf_above, drawer/front_panel,
         drawer/bottom, drawer/side_l, drawer/side_r, drawer/back,
         handle/post_l, handle/post_r, handle/bar]
  列集合比較:
    最近障礙物帶選列: 170–201 列／週期
    加上 pair_rows_全障礙物強制列: 1938–2853 列／週期
    判定: >
      **兩者的最小餘量、綁定列與安全層修改週期數完全相同**
      ⇒ 補齊全部具名障礙物的列**沒有**揭露更緊的列；綁定者一律是
      uflite_finger2 | handle/bar

