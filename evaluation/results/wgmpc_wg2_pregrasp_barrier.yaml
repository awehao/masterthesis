    階段 A 不含夾持，所以本輪不啟用任何例外。

尚未成立:
  - 本核算為**開迴路**：把趟次錄到的候選 u 逐步餵給安全層，安全層的修改
    **沒有**回饋到下一步狀態。因此不能宣稱閉迴路接上安全層後的實際行為，
    只能宣稱「這些命令在這些狀態下不被接受」
  - 主核算全部列以 occluded=false 計。**這一點後來已由來源補上**：
    階段 A 採用明確標記的模擬場景真值遮蔽來源，占 occ=0 的依據不再是假設
    （見 evaluation/results/wgmpc_wg2_scene_truth_source.yaml，
     以及 src/ammr_wholebody_mpc/config/wgmpc_stage_a.yaml 的 occlusion_source）。
    那份重核同時實跑了回退路徑：抽屜位姿過期 0.9 s 時 33636 列退回保守處置，
    最小餘量由 +0.02479 掉到 −0.74743 m/s。
    成果**必須標明使用場景真值**
  - 本核算只在 Isaac 之外進行；離線通過不等於 Isaac 通過
  - 「約 60–90 mm/s 會吃光」只能作量級估算，**不是通行速度界限**

遮蔽分支的影響:
  說明: >
    生產端在沒有相機外參（T_rl is None）時把所有列標為 occ=1.0。那會為每一列
    **額外**加一條 row·u <= blind_approach_cap = 0.03 m/s 的列。
    這條列在距離大的地方比模型列**緊得多**，所以整個移動段都由它綁定。
  對照（同一組候選 u，同一組狀態）:
    週期_0:   {occ0: +1.51566, occ1: -0.37921, occ0_綁定: "base_link|handle/bar", occ1_綁定: "uflite_finger2|drawer/front_panel", occ0_改量: 0.0, occ1_改量: 0.23370}
    週期_20:  {occ0: +0.72288, occ1: -0.43486, occ1_綁定: "uflite_finger1|handle/bar", occ1_改量: 0.31548}
    週期_60:  {occ0: +0.54719, occ1: -0.02731, occ1_綁定: "base_link|handle/bar",      occ1_改量: 0.04806}
    週期_100: {occ0: +0.29135, occ1: -0.02354, occ1_綁定: "base_link|handle/bar",      occ1_改量: 0.04249}
    週期_140: {occ0: +0.09148, occ1: -0.01417, occ1_綁定: "link2|handle/bar",           occ1_改量: 0.02340}
    週期_180: {occ0: -0.01031, occ1: -0.01031, 說明: 兩者相同 —— 模型列已比 cap 列緊}
    週期_219: {occ0: -0.01469, occ1: -0.01469, 說明: 同上}
  判定: >
    在無相機的設定下，接近段**全程**被 blind_approach_cap 節流，安全層的修改量
    最大到 0.315。終點附近兩個分支一致，因為模型列的 b 已降到 cap 以下。
    ⇒ 上面「43/220 週期為負」是 occ=0 的數字；occ=1 下幾乎全程為負。
    階段 A 要跑實機／Isaac 前必須先決定遮蔽來源，否則量到的會是 cap 的行為。

配置選項（屏障擋住終點之後）:
  問題: 退讓 0.100 m 的終點不通過。先確認是否只是挑錯 IK 分支。
  方法: 對每個退讓值取 150 起點 IK，取關節餘裕前 60 名，改**按零命令屏障餘量**排序
  結果:
    退讓_0.100: {可行解: 116, 最佳屏障餘量: -0.01469, 非負分支: 0/60,  綁定列d: 0.08405, 安全層對零命令改量: 0.02306}
    退讓_0.110: {可行解: 116, 最佳屏障餘量: +0.00506, 非負分支: 42/60, 綁定列d: 0.09392, 安全層對零命令改量: 0.0}
    退讓_0.120: {可行解: 118, 最佳屏障餘量: +0.02486, 非負分支: 47/60, 綁定列d: 0.10382, 安全層對零命令改量: 0.0}
    退讓_0.130: {可行解: 123, 最佳屏障餘量: +0.04468, 非負分支: 47/60, 綁定列d: 0.11373, 安全層對零命令改量: 0.0}
  判定:
    - 退讓 0.100 時**沒有任何 IK 分支**的屏障餘量非負（0/60）⇒ 不是分支選擇的問題
    - 餘量對退讓近乎線性：每 +10 mm 退讓得 +0.0198 m/s，與 α=2.0 乘上
      1:1 的距離增益（d 每 10 mm 退讓增 9.87 mm）一致
    - 非負所需的最小退讓約 0.1074 m（由 d 需 >= 0.09139 反推）
  建議: >
    退讓改為 0.120 m：屏障餘量 +0.0249 m/s（約 12.4 mm 的距離餘量），
    118 個可行 IK 解中 47/60 的分支非負，且**不放寬任何保護參數**
    （d0、eps、joint_margin、contact_pairs 全部維持原值）。
    0.110 只有 2.5 mm 距離餘量，太薄。
  連帶影響: >
    預抓取靜態間距改為 120 mm ⇒ 後續夾持相位要收的距離也變成 120 mm。
    夾持點本身必然在屏障之內（見下），那一段只能靠 contact_pairs 相位例外，
    不能靠調退讓解決。
