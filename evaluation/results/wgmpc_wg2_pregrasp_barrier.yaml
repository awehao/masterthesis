  b_m_s: -0.014687
  A·u_m_s: 0.000000
  屏障餘量_m_s: -0.014687

判定:
  結論: >
    正式預抓取終點**本身**落在屏障的零速靜態間距之內。缺口完全在右式 b
    （α(d_eff − d_stop) = 2.0 × (0.072656 − 0.080000) = −0.014688），
    而 A·u = 0.000000 —— 也就是說**不是命令過快，是位姿不合**。
  推論: 任何命令都無法滿足該列，除了沿該方向以 ≥ 14.7 mm/s **後退**的命令
  零命令的行為: >
    輸入 u = 0 時安全層仍**輸出非零命令**：Δu 最大 0.024418 落在 v_y^B
    （底盤後退 24.4 mm/s），並同時改動 omega 與六個關節速度。
    ⇒ 在預設屏障設定下，「對準正式預抓取位姿並保持」**無法達成**，
       安全層會主動把機器人推離該位姿。
  各連桿的靜態缺口（終點，需要 d ≥ d0 + eps + rho）:
    uflite_finger1:      {d: 0.08574, rho: 0.01164, 需要: 0.09164, 缺: +0.00590}
    uflite_finger2:      {d: 0.08405, rho: 0.01139, 需要: 0.09139, 缺: +0.00734}
    uflite_gripper_link: "{d: 0.10759, rho: 0.01494, 需要: 0.09494, 缺: -0.01265}  # 通過"
    link6: "{d: 0.16400, rho: 0.01486, 需要: 0.09486, 缺: -0.06913}  # 通過"

修正先前的敘述:
  先前說法: 「手指−橫桿零命令餘量 +0.0146 m，0/10 負餘量，無配對例外啟用」
  問題: 那是**幾何距離**（且 rho 用假設值 0.015），不是屏障餘量
  實際: 屏障餘量 −0.014687 m/s；受核的四個手部連桿中 2 個為負

