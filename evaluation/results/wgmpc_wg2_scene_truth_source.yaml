# 遮蔽來源：明確標記的模擬場景真值
主題: 階段 A 的遮蔽證據來源，以及接通後的屏障重核
狀態: 已接通並重核；回退路徑已實跑驗證

為什麼需要:
  問題: >
    距離節點在沒有相機外參（T_rl is None）時把每一列標為 occluded = 1.0，
    於是每一列**額外**多一條 row·u <= blind_approach_cap = 0.03 m/s 的列。
    這條列在距離大的地方遠比模型列緊，接近段**全程**由它綁定。
  實測影響（退讓 0.120、同一組候選 u）:
    真值停用: {最小屏障餘量: -0.74743, 負餘量週期: "152/209", 安全層改命令週期: "152/209"}
    真值啟用: {最小屏障餘量: +0.02479, 負餘量週期: "0/209",   安全層改命令週期: "0/209"}
  結論: 沒有這個來源，該趟量到的是退化上限的行為，不是 W-GMPC 的接近行為

為什麼不是 freespace_confirmed:
  理由:
    - freespace_confirmed 的語意是「範圍內沒有東西」。抽屜場景裡**明明有**櫃體與抽屜，
      設真等於宣稱一件不成立的事
    - 它關掉的是 nodata_speed_cap（「沒有距離資料」的退化保護），與遮蔽是不同的事
    - 錄影相機的外參**不充當**機器人感知的遮蔽證據：那是機器人感知之外的另一個視角，
      與 LiDAR 在該方向上看不看得到無關
  驗證: 距離節點全檔以 AST 核對，沒有任何一處去設或讀 freespace_confirmed

實作:
  共用函式: ammr_wholebody_mpc.arm_link_distance
  新增:
    - scene_truth_occ(obstacle, approved, now, stamp, pose_timeout, enabled)
      回傳 (occ, code)；occ 為 None 表示**不給真值**，呼叫端退回原本的保守處置
    - parse_scene_truth(specs)         # 'name:model' → {名稱: 期望模型}
    - validate_scene_truth(...)        # 啟動前提，與離線核對共用同一份
  節點參數:
    scene_truth: false                 # 預設關閉 ⇒ 行為完全不變
    scene_truth_approved: ['']         # 'name:model'，model 空 = 宣告靜態
  成立條件（**全部**都要）:
    1: 模式已啟用
    2: 名稱在場景守衛核准的具名幾何清單內
    3: 模型身分與核准清單記載的相符
    4: 位姿存在且新鮮（動態物件用 pose_timeout；宣告靜態者由設定給定但仍要求位姿已填入）
  範圍: >
    真值**只**回答遮蔽旗標，不碰 status、不碰距離、不碰 rho。
    它不宣稱場景裡沒有別的東西 —— 那由場景守衛（放行子樹以外 0 個碰撞體）負責，
    兩者缺一不可。
  啟動前提的拒絕條件（任一成立即拋出，**不半啟用**）:
    - 核准清單為空
    - 設定裡有障礙物不在核准清單內（名單不足以描述這個場景 ⇒ 整個模式停用）
    - 核准清單列了設定裡不存在的障礙物（核准的是另一個場景）
    - 模型身分不符
    - geometry 不是 links
  診斷: >
    DIAG_FIELDS_BASE 由 10 欄擴為 13 欄，新增 n_truth、n_truth_fallback、
    scene_truth_on。**旗標要發**：只看 n_truth 無法區分「模式關閉」與
    「模式開著但全部回退」，兩者意思完全不同。
  必要配對列: >
    forced_pair_rows 以 (p_w, vk) 兩個參數呼叫，所以障礙物名稱必須綁進閉包。
    用預設參數會讓它永遠拿到 None、配對列一律回退 —— 真值看起來接上了、實際沒有。
    已改為 _occ_of_for(_obn) 並由測試 H3 固定。

