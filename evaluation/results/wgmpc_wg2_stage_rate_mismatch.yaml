# 段間速率不匹配：結案
# 問題：求解段的 source_seq 有一部分在安全層／adapter／執行端沒有對應列
#       （farB_c1 8.8%、rec13abl 19.3%）。先前只確認「不是拒收」，未定性。
主題: 命令封裝段間落差的來源
資料來源:
  - evaluation/runs/wgmpc_wg2_farB_c1_194119/cmd_env.jsonl
  - evaluation/runs/wgmpc_wg2_rec13abl_104702/cmd_env.jsonl
量測:
  farB_c1_194119:
    求解段列數: 420
    安全層列數: 504
    安全層 derived 列: 426
    安全層相異 source_seq: 384
    未出現在下游的求解命令: 37      # 8.8%
    被安全層重複輸出的 source_seq: 37
    求解段 output_seq 斷點: 0
    安全層 output_seq 斷點: 0
  rec13abl_104702:
    求解段列數: 1194
    未出現在下游的求解命令: 230     # 19.3%
    被安全層重複輸出的 source_seq: 230
時基:
  求解段間隔_p50_ms: 50.0
  求解段間隔_min_max_ms: "[0.0, 210.0]      # 事件驅動，有抖動"
  安全層間隔_p50_ms: 50.0
  安全層間隔_min_max_ms: "[50.0, 50.0]      # 到顯示精度為止等間隔"
判定:
  結論: 兩個各自 20 Hz 的時基做最新值保持與重採樣所產生的拍頻，**不是訊息遺失**
  支持證據:
    - 被略過與被重複輸出的筆數**完全相符**（37/37、230/230）
    - 被略過者的後繼命令到達間隔 p50 40 ms，其中 81.1%（rec13abl 97.8%）小於
      安全層週期 ⇒ 兩筆求解命令落在同一個安全層週期內，舊的那筆被覆蓋
    - 被重複輸出者的後繼到達間隔 p50 60 ms，其中 80.6%（rec13abl 97.4%）大於
      安全層週期 ⇒ 該週期沒有新命令，沿用最新值再輸出一次
    - 兩段的 output_seq 都沒有斷點 ⇒ 錄影端沒有在這兩個話題上漏錄
    - 被略過者的 kind 全為 normal ⇒ 沒有任何停止命令或失效латch 被略過
  這份封裝的既有說明已載明此行為: "output_seq：本段自己的輸出計數；同一來源可能被**多次輸出**"
另一項發現:
  安全層引用但求解段無紀錄的 source_seq:
    farB_c1: 1 筆 [2]
    rec13abl: 17 筆
  判定: 這是**錄影端在求解話題上的漏錄**（趟次開頭），與段間落差是不同的事；
        rec13abl 早於錄影端的執行器修補，farB_c1 在修補後只剩 1 筆
尚未成立:
  - 本結論說明落差的**來源**，不等於宣稱重採樣對控制品質無影響；
    舊命令被覆蓋時實際套用的是較新的命令，延遲量測已另行處理
  - 「等間隔」只到顯示精度（50.0 ms）；未逐筆核對奈秒級抖動
