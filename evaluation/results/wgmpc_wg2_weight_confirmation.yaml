# 新權重的可重現性確認 ＋ 錄製器缺口調查
_note: 新權重的可重現性確認（近、遠目標各一趟）＋ 錄製器缺口調查。這兩趟是可重現性檢查，不追求 p 值。γ 維持 1.0 未動（不同時改兩個因素）。
config_under_test:
  status: 探索性配置（非已定版參數）
  w_s_base: 0.001
  w_s_arm: 0.05
  w_a: 0.05
  gamma: 1.0
  gamma_note: 與先前一致，本輪未動
  delay_comp:
    d_state: 1.6
    d_cmd: 1.0
recorder_investigation:
  question: 1.5% 掉封裝是否集中在振盪或高負載時段
  answer: 集中在高負載，與振盪無關
  evidence:
    cycle_wall_ms_ratio_missing_over_present:
    - 2.18
    - 1.53
    solve_ms_ratio:
    - 1.14
    - 1.24
    arm_cmd_Linf_ratio:
    - 0.95
    - 0.86
    arm_cmd_note: 缺的命令反而較小 ⇒ 非振盪時段
    adjacent_within_0p11s_frac:
    - 0.36
    - 0.55
  solver_side_gap:
    cause: 錄製器主迴圈是 spin_once(0.05)，每次只處理一個回呼；四話題合計約 80 msg/s，高負載時主迴圈被餓到、佇列（深度 100）溢位
    fix: 改成在獨立執行緒以 SingleThreadedExecutor 持續 spin，主執行緒只等停止訊號；佇列深度 100 → 2000。受控結束與 summary 寫出不變。
    result: 遠目標 solver 漏錄 15 → 2 筆；近目標 7 → 6
    note: 漏的那些全是開頭連號 1,2,3…，即握手的全零命令發布在錄製器完成訂閱之前 —— 啟動競態，與負載無關
  downstream_gap:
    observation: 修正後幾乎不變（12.2% → 8.8%、9.1% → 10.0%）
    cause: 不是錄製器。安全層以自己的節拍轉送：遠目標 solver 420 筆、安全層可歸屬輸出 426 筆（數量相當），但只對應 384 個獨立 source_seq —— 有的序號重送兩次、有的被跳過。是速率錯配，不是遺失。
    control_path_intact:
      recv_seq_increments:
        1: 491
        2: 1
      n_rejected: 0
      api_applied_false_cycles: 0
    verdict: 依既定規則：物理步紀錄完整就記下缺口、不拖住控制驗證
    remaining_work: 若要逐筆鏈路 100% 可重建，需讓安全層逐筆轉送，或在其輸出標明本筆對應哪些上游序號。本輪未做。
