claim_wording: 先前診斷出的 5 Hz（週期 4）極限環，在新設定的四趟中都未再出現（近目標兩趟、遠目標兩趟，週期皆為 2 且振幅小兩個數量級）。措辭維持「未再出現」，不說「已解決」—— 樣本仍少，且機制未以反例證明。
what_this_supports:
- 新權重在近、遠兩種目標下都能到達並保持，移動段路徑接近直線，保持窗為單向沉降。可作為進入抽屜接觸測試前的自由空間控制基線。
- 目前的影片可展示改善，但須標明是單趟結果。
not_supported:
- 統計穩定性（每個目標兩趟）
- 接觸式操作
- γ 是否可關閉（本輪刻意未動，待依實際縮放紀錄另行決定）
