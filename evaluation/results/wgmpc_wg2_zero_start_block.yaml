# 零位起步無法走到正式預抓取位姿：病因定位
主題: 抽屜階段 A 的起步構型前置條件
狀態: 病因已定位，前置條件已量化

目標: 正式預抓取 TCP (0.0000, 1.0797, 0.5500)，姿態 R_DES
櫃體位姿: "[0.0, 1.45]；退讓 0.100 m"
求解設定: w_s=1e-3, w_s_arm=0.05, w_a=0.05；N/dt/tcp 沿用 farB 趟次參數
延遲模型: delay_cycles=1.0, d_pub=0.6, comp_state=1.6, comp_cmd=1.0, gamma=1.0
有效限位: 硬限位 ± joint_margin 0.05（**未放寬**）

趟次比較:
  零位起步:
    起始_q: [-0.0002, 0.0001, 0.0007, -0.0006, 0.0026, -0.0012, 0.0003, 0.0, 0.0]
    求解失敗: 1171/1201        # 97.5%
    到達保持: false
    位置誤差: 1107.4 → 853.8 mm；自週期 101 起不再改善
    底盤位移_m: 0.0783
    j3_有效餘裕最小值_rad: -0.02215   # 穿過有效限位
  起步_A_手臂置於預抓取解構型:
    起始手臂_q: [1.9050, -0.0246, 1.1073, 1.8307, 0.4034, -0.8886]
    求解失敗: 0/220
    到達保持: true
    t_reach_s: 8.95
    位置誤差: 1305.9 → 0.0 mm
    底盤位移_m: 0.3947；路徑 0.4298
    關節有效餘裕最小值_rad: [1.62086, 0.77709, 0.10292, 2.35577, 0.94760, 1.03585]
  起步_B_只把_j3_移到有效限位中點:
    起始手臂_q: "[0.0, 0.0, 1.4373, 0.0, 0.0, 0.0]   # 其餘五軸仍為零位"
    求解失敗: 0/220
    到達保持: true
    t_reach_s: 8.95
    位置誤差: 1214.2 → 0.0 mm
    底盤位移_m: 0.3937；路徑 0.4287
    關節有效餘裕最小值_rad: [1.64508, 0.77652, 0.10234, 2.06852, 1.14544, 1.08695]

判定:
  結論: >
    阻塞的原因是**起步構型**，不是目標不可達。j3 的硬限位為
    [-0.061087, +2.935644]，零位時向下只剩 0.0099 rad 的有效空間，而實際套用的
    命令永遠落後兩個週期 ⇒ 關節限位列不可滿足 ⇒ QP 失敗並維持原命令。
  前置條件: >
    只要 j3 離開限位即足夠。起步 B 僅動 j3 一軸（其餘五軸維持零位），
    求解失敗即降為 0，且全程 j3 有效餘裕維持 +0.102 rad。
    因此階段 A 的任務紀錄中必須載明一個**單軸姿態調整**作為前置動作。
  目標可達性: 正式預抓取位姿在有效限位內可達（347/400 可行，最佳關節餘裕 +1.0511 rad）

尚未成立:
  - 本比較為離線閉迴路（求解器 + 延遲模型），**未接安全層**；
    屏障的影響見 wgmpc_wg2_pregrasp_barrier.yaml，該處顯示終點被屏障擋住
  - 「單軸 j3 調整即足夠」只在上述設定與這一個目標下成立，未掃其他目標
  - 離線通過不等於 Isaac 通過
  - 未說明機器人在實機上**如何進入**該起步構型；那段動作本身也要受同一套
    限位與屏障保護，尚未核算
