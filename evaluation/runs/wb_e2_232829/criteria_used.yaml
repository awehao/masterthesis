# 執行版本 E2（輪級限制）的**接入驗收**判準 v1
#
# **事前固定**：本檔與 evaluation/wb_e2_check.py 在任何 E2 趟次執行之前定版。
# 數值由檢查器實際載入。門檻不得因為某趟未通過而下修。
schema: wb_e2_criteria/1
version: v1
status: provisional_engineering
created: 2026-09-13
execution_version: E2
policy: evaluation/results/specs/wb_wheel_limit_policy_v2.md
prospective: true
not_retroactive: >
  本判準只適用於本規格建立之後的 E2 趟次。E1 的既有結果不受影響，
  也不因 E2 通過而追認任何 E1 趟次。
scope_limit: >
  僅驗證**限制器在執行端確實生效且合規**。
  **不**宣稱上游全身安全性在命令被修改後仍成立；
  **不**宣稱停止掃掠範圍的避碰保證；pregrasp 仍由獨立條件禁止。

profile:
  source: evaluation/wb_trigger_cmd.py     # 階躍＋反向
  base_vx_mps: 0.045                       # ≤ 低速介面界限 0.05
  base_wz_rps: 0.18                        # ≤ 低速介面界限 0.2
  arm_rate_rps: 0.05
  bounds_unchanged: true                   # **不得為觸發限制而提高界限**
  why_step_not_ramp: >
    斜坡剖面每個物理步的命令變化約 0.0003 m/s，遠低於單步預算 0.0625 m/s，
    λ 恆為 1，驗不到限制器。改的是剖面形狀，不是幅度上限。

# ---- T 限制器**確實被觸發**（不得只跑 λ 全為 1 的剖面）----
T_triggered:
  T1_min_modified_steps: 1                 # λ<1 的物理步數
  T2_min_lam_below: 0.999                  # 最小 λ 必須明顯小於 1
  T3_reason_recorded: true                 # 每個被限制的步都要有限制原因

# ---- L 限制**確實生效**（輸出序列合規）----
L_compliance:
  L1_wheel_speed_max_mps: 0.2775           # r·ω_max = 0.05 × 5.55
  L2_wheel_accel_max_mps2: 6.25            # r·α_max = 0.05 × 125.0
  L3_tolerance: 1.0e-6
  L4_check_every_step: true                # 逐步檢查，不看平均

# ---- B 界限未被放寬 ----
B_bounds:
  B1_lin_mps_max: 0.05
  B2_ang_rps_max: 0.2
  B3_no_bound_widening: true

# ---- S 手臂與 E1 語意一致 ----
S_arm:
  S1_arm_rate_max: 1.0                     # 整筆拒收門檻不變
  S2_rejected_eq: 0
  S3_fail_is_none: true

# ---- D 保護 ----
D_protections:
  pregrasp_forbidden_by_separate_condition: true   # 不由 wheel flag 解鎖
  thermal_abort_c: 92.0
  independent_domain_required: true
  independent_run_dir: true

on_pass: stop_and_report
on_fail:
  - 標記結果，不下修門檻
  - 不宣告限制器驗收完成
