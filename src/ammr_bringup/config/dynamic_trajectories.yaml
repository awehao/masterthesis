# Dynamic obstacle trajectories for the GMPC-CBF benchmark.
#
# Convention
#   start, end : world-frame [x, y] in metres (driver pings between these)
#   speed      : ping-pong speed [m/s]
#   radius     : cylinder radius [m]  — also fed to obstacle_aggregator -> CBF
#   height     : visual cylinder height [m]
#
# Placement (revised 2026-06-02)
#   All 6 obstacles sit on the (0,0) → (17,17) diagonal at 2.5 m intervals,
#   so the controller must zig-zag through them.
#   For STATIC testing  use `gazebo_dynamic.launch.py dynamic:=false`
#   For DYNAMIC testing use `gazebo_dynamic.launch.py`     (default)

dynamic_obstacles:

  - name:   dyn_obs_1
    start:  [2.5,  2.5]
    end:    [2.5,  4.0]                   # 1.5 m sweep when driver is ON
    speed:  0.4
    radius: 0.25
    height: 1.0

  - name:   dyn_obs_2
    start:  [5.0,  5.0]
    end:    [5.0,  6.5]
    speed:  0.4
    radius: 0.25
    height: 1.0

  - name:   dyn_obs_3
    start:  [7.5,  7.5]
    end:    [7.5,  9.0]
    speed:  0.4
    radius: 0.25
    height: 1.0

  - name:   dyn_obs_4
    start:  [10.0, 10.0]
    end:    [10.0, 11.5]
    speed:  0.4
    radius: 0.25
    height: 1.0

  - name:   dyn_obs_5
    start:  [12.5, 12.5]
    end:    [12.5, 14.0]
    speed:  0.4
    radius: 0.25
    height: 1.0

  - name:   dyn_obs_0
    start:  [15.0, 15.0]
    end:    [15.0, 16.5]
    speed:  0.4
    radius: 0.25
    height: 1.0
