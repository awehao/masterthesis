# Dynamic obstacles for the GMPC + horizon-CBF benchmark.
# Three cylinders, original layout:
#   dyn_obs_1  : vertical sweeper near spawn column   (x=0,    y 1.05 .. 5.55)
#   dyn_obs_2  : diagonal sweeper middle of path
#   dyn_obs_0  : horizontal sweeper near goal corridor

dynamic_obstacles:

  # Slowest sweeper, and the first one the robot meets leaving the spawn column.
  # FLOOR: scan_obstacle_tracker only forwards a track to the dynamic CBF once
  # its estimated speed exceeds min_track_speed = 0.10 m/s. Below roughly 0.12
  # the KF estimate dips under that gate on some frames and this obstacle stops
  # being seen as dynamic at all, so do not slow it further without also
  # lowering min_track_speed.
  - name:   dyn_obs_1
    start:  [0.0, 5.55]
    end:    [0.0, 3.0]
    speed:  0.15
    radius: 0.25
    height: 1.0

  # end pulled in from [12.3,7.1] (which sat INSIDE a wall -> obstacle drove in,
  # got stuck and froze) to [11.9,7.5] (0.43 m clearance) so it actually sweeps.
  - name:   dyn_obs_2
    start:  [10.3, 8.4]
    end:    [11.9, 7.5]
    speed:  0.3
    radius: 0.25
    height: 1.0

  - name:   dyn_obs_0
    start:  [14.1, 7.1]
    end:    [17.1, 7.1]
    speed:  0.3
    radius: 0.25
    height: 1.0



  - name:   dyn_obs_5
    start:  [5.0, 8.2]
    end:    [5.0, 9.8]
    speed:  0.3
    radius: 0.25
    height: 1.0
