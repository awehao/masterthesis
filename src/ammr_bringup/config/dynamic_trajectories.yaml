# Dynamic obstacles for the GMPC + horizon-CBF benchmark.
# Three cylinders, original layout:
#   dyn_obs_1  : vertical sweeper near spawn column   (x=0,    y 1.05 .. 5.55)
#   dyn_obs_2  : diagonal sweeper middle of path
#   dyn_obs_0  : horizontal sweeper near goal corridor

dynamic_obstacles:

  # Moved x=0.0 -> +0.3 (documented scenario refinement). At x=0 the robot
  # squeezed RIGHT against the east wall (2.5 cm gap) -- an unwinnable chokepoint
  # for every reactive method. The map's OPEN lane (~1.0 m clearance) is on the
  # WEST (x~-0.3). Placing dyn_obs_1 in the robot's goal-ward (right) path forces
  # it to go AROUND on the open west side -> a FAIR "obstacle ahead, open left"
  # dynamic-avoidance encounter (room to dodge), not a death-squeeze.
  - name:   dyn_obs_1
    start:  [0.3, 5.55]
    end:    [0.3, 3.0]
    speed:  0.3
    radius: 0.25
    height: 1.0

  - name:   dyn_obs_2
    start:  [10.3, 9.1]
    end:    [12.3, 7.1]
    speed:  0.3
    radius: 0.25
    height: 1.0

  - name:   dyn_obs_0
    start:  [14.1, 7.1]
    end:    [17.1, 7.1]
    speed:  0.3
    radius: 0.25
    height: 1.0
