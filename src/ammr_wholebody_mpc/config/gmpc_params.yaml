# Default parameters for the SE(2) GMPC controller node.
# Matches the offline_prototype/run.py setup so the ROS2 behaviour reproduces
# the validated benchmark numbers.

gmpc_controller:
  ros__parameters:
    use_sim_time:        true

    # ---- Sample timing ----------------------------------------------------
    control_frequency:   20.0          # Hz  -> dt = 0.05s
    horizon:             20            # steps -> 1.0s lookahead
    v_nominal:           0.22          # m/s — slightly faster than 0.18, still under obstacle 0.30

    # ---- Chassis limits (must match Baseline B / nav2_params_mppi.yaml) ---
    vx_min:             -0.35
    vx_max:              0.35
    vy_min:             -0.25
    vy_max:              0.25
    wz_min:             -0.80
    wz_max:              0.80
    # Tightened (v2 → v3): heavier acceleration penalty to reduce jerk
    ax_max:              1.5
    ay_max:              1.0
    az_max:              2.0

    # ---- MPC weights (v3: stronger input penalty to damp the controller) -
    # Q stays at the same magnitude as the offline prototype.
    # R bumped 6x to make the QP value control smoothness over tight tracking.
    # Balanced Q/R: enough Q to motivate progress, enough R to damp chatter
    # caused by KF estimate jitter on dynamic obstacle velocity.
    Q_xy:               15.0     # was 25 — less aggressive tracking
    Q_y:                 0.0     # 0 = isotropic (reverted, experiment didn't help wiggle)
    R_vx:                2.0     # was 1.0 — more input damping
    R_vy:                2.0
    R_w:                 1.0
    Qf_mult:             5.0
    # Input-increment (Δu) smoothness cost: Σ Δu_k^T S Δu_k. Soft penalty on
    # control jerk -> smooth cruising; CBF can still burst when in danger.
    S_vx:               15.0
    S_vy:               15.0
    S_w:                 8.0

    # ---- Frames / topics --------------------------------------------------
    global_frame:        map
    robot_base_frame:    base_footprint
    plan_topic:          /plan
    cmd_vel_topic:       /cmd_vel
    goal_tolerance_xy:   0.30
    pose_lpf_alpha:      0.0     # off (filtering added lag -> worse)
    tf_timeout:          0.10
