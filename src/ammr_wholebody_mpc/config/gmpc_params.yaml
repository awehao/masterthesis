# Default parameters for the SE(2) GMPC controller node.
# Matches the offline_prototype/run.py setup so the ROS2 behaviour reproduces
# the validated benchmark numbers.

gmpc_controller:
  ros__parameters:
    use_sim_time:        true

    # ---- Sample timing ----------------------------------------------------
    control_frequency:   20.0          # Hz  -> dt = 0.05s
    horizon:             20            # steps -> 1.0s lookahead
    v_nominal:           0.18          # m/s, moderate cruise — balances safety vs progress

    # ---- Chassis limits (must match Baseline B / nav2_params_mppi.yaml) ---
    vx_min:             -0.20
    vx_max:              0.35
    vy_min:             -0.25
    vy_max:              0.25
    wz_min:             -0.80
    wz_max:              0.80
    # Tightened (v2 → v3): heavier acceleration penalty to reduce jerk
    ax_max:              0.8
    ay_max:              0.6
    az_max:              1.2

    # ---- MPC weights (v3: stronger input penalty to damp the controller) -
    # Q stays at the same magnitude as the offline prototype.
    # R bumped 6x to make the QP value control smoothness over tight tracking.
    Q_xy:               10.0
    Q_yaw:               5.0
    R_vx:                3.0     # v2 was 0.5
    R_vy:                3.0     # v2 was 0.5
    R_w:                 1.5     # v2 was 0.2
    Qf_mult:             5.0

    # ---- Frames / topics --------------------------------------------------
    global_frame:        map
    robot_base_frame:    base_footprint
    plan_topic:          /plan
    cmd_vel_topic:       /cmd_vel
    goal_tolerance_xy:   0.20
    tf_timeout:          0.10
