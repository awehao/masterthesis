# The arm's initial joint angles. THE only place these six numbers live.
#
# Read by lite6_ros2_control_gz.xacro (what Gazebo spawns at) and by
# omni_bot_wholebody.launch.py (what the kinematic visualisation shows). They
# used to be written out separately in both, with no link between them, so a
# change in one silently left the other behind -- and the arm on screen was not
# the arm being checked.
#
# All zeros, chosen after the previous tuck pose was found to be in actual
# self-collision. Exact triangle tests put link1 against the gripper shell and
# against finger2 at 0.000 m, with finger1 at 1.6 mm; sampled point clouds had
# reported 1 to 3 mm because they never landed on the crossing triangles.
#
# All zeros clears every non-excluded pair, tightest being link_base to link5
# at 8.79 mm. That margin is small and it is not symmetric: joint3 moving
# NEGATIVE from here intersects within 0.05 rad, while positive opens to 20 mm
# by +0.05 and 88 mm by +0.45. Any motion starting here has to have its
# direction checked, not just its endpoints.
joint1: 0.0
joint2: 0.0
joint3: 0.0
joint4: 0.0
joint5: 0.0
joint6: 0.0

# ---------------------------------------------------------------------------
# Named poses used by the evaluation scripts. Neither xacro nor the launch
# reads these -- both index joint1..joint6 above by name -- but they live here
# so that all of the arm's fixed configurations are in ONE file. They were
# hard-coded separately in run_wholebody_demo.sh, pregrasp_demo.py and
# wholebody_pregrasp.py, which is the exact failure this file was created to
# stop: the same number written out in several places with nothing linking them.

# Where a RUN starts. Set to all zeros on 2026-09-08 at the user's instruction,
# so that it matches the spawn pose above rather than differing from it.
#
# What that costs, measured rather than argued, so the next person reading a
# failed run knows where to look first.
#
# Clearance: all zeros clears every non-excluded pair, but it stands on a slope.
# Sampled self-clearance is 9.09 mm at joint3 = 0, 4.28 mm at -0.02 and 3.11 mm
# at -0.05; from +0.05 upward it flattens at 19.66 mm, because past that the
# closest pair becomes link4/link6, which does not depend on joint3 at all.
#
# Limit headroom: joint3's safe range is [-0.0611, +2.9356] -- one-sided. All
# zeros sits 0.0611 rad above the bottom, and a run's own guard aborts at
# bottom + 0.05 = -0.0111. That leaves 0.011 rad. A solver that dips joint3
# slightly negative aborts the run before it has gone anywhere, which is what
# happened twice to the whole-body attempts from other start poses. The
# whole-body solver's limit potential activates within 0.35 rad of a bound, so
# from here it is pushing joint3 up from the first cycle.
#
# If a run aborts with "關節接近安全限位" and joint3 near -0.011, this is why.
test_start:
  joint1: 0.0
  joint2: 0.0
  joint3: 0.0
  joint4: 0.0
  joint5: 0.0
  joint6: 0.0

# Preferred arm configuration for the whole-body solver's posture term. This is
# an OUTPUT, not a choice: it is the IK solution for the pre-grasp pose 0.24 m
# in front of the box face, whose path was checked in section 10.14. Recorded
# here rather than retyped, but it belongs to that target -- change the target
# and this has to be recomputed, not edited.
pregrasp_reference:
  joint1: 0.0
  joint2: 0.6518
  joint3: 0.5886
  joint4: 0.0
  joint5: -1.634
  joint6: 0.0
