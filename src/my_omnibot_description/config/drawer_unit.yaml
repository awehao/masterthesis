# 被動抽屜櫃：接觸操作最小案例的物件模型。
#
# 為什麼另開一個資產，而不是沿用 known_obs_12
# --------------------------------------------
# known_obs_12 是一個**實心靜態方塊**，沒有把手、沒有活動自由度。把它當成
# 「已有的操作機構」會讓「開抽屜」變成一個沒有機構的宣稱。本檔定義一個真的
# 有滑動自由度與可夾持把手的物件。
#
# 為什麼不寫進 bigarena.sdf
# --------------------------
# bigarena.sdf 是已凍結的導航實驗場景。動它就等於動已完成的導航資料的前提。
# 本檔是**獨立資產**，只有操作模擬會載入；導航跑批看不到它。
#
# 座標系：本地框，原點在櫃體底面中心。
#     +x 橫向（沿把手橫桿）   +y 指向櫃體內部   +z 向上
#     抽屜沿 **−y** 拉出
# 放到世界時只做平移（yaw = 0），所以本地軸 = 世界軸。
#
# 尺寸怎麼來的（每一個都由夾爪幾何或行程需求反推，不是挑好看的）
# ---------------------------------------------------------------
#   把手橫桿直徑 0.010  夾爪全開內距 0.0178（finger_joint 0→0.0089，兩指反向）
#                       取 10 mm：全開時每側留 3.9 mm 包覆餘裕，接觸發生在
#                       finger_joint = 0.005（仍在 [0, 0.0089] 之內）。
#                       12 mm 只剩 2.9 mm，接近取樣點雲的解析度，量不準。
#   把手站距 0.040      量自 URDF：夾爪殼前緣在 tool z = −0.0269，指尖在 −0.0025，
#                       中間只有 24.4 mm 可用。12 mm 的桿置中後兩側各 6.2 mm。
#                       站距要讓指尖不撞面板：指尖比 TCP 退 2.5 mm，
#                       面板到桿心 40 mm ⇒ 指尖離面板 27.8 mm。
#   把手高 0.550        由兩個條件夾出來，不是挑的：
#                       近端 —— 手臂的**可達近端界**隨高度變差。joint3 的安全下限是
#                          −0.0611（很不對稱的肘關節範圍），它決定了 TCP 能收多近。
#                          掃描（10 種子 IK ＋ 逐點自碰，限位餘裕 ≥0.15 rad 且自碰
#                          ≥5 mm）：z=0.40 近端界 0.480、z=0.50 為 0.400、
#                          z=0.55 與 0.60 同為 0.380。
#                       底盤 —— 抽屜拉到底時面板不得橫過底盤上方（底盤頂 z = 0.33）。
#                          z=0.55 時面板底 0.420，且機器人站得夠遠，面板在底盤前方
#                          0.165 m，兩個方向都不重疊。
#                       取 0.550，與已凍結的預抓取 TCP 高度相同，少一個變動項。
#   開口高 0.240        面板 0.575 x 0.260，比開口（0.560 x 0.240）四邊各多 7.5/10 mm，
#                       是抽屜面板本來就該有的覆蓋；面板整片在櫃體前方（y ≤ −0.227），
#                       與櫃體不重疊，所以覆蓋不會變成碰撞
#   開度上限 0.220      目標開度 0.200 之外再留 20 mm，讓目標不落在硬限位上
#
# schema 版本：新增欄位請升版，不要就地改語意。
schema: drawer_unit/1
name: drawer_unit_a

# ---- 櫃體：靜態碰撞體，五片板圍出一個抽屜開口 ----
# [名稱, 中心 (x,y,z), 尺寸 (x,y,z)]
cabinet:
  - [side_left,   [-0.290,  0.000, 0.450], [0.020, 0.450, 0.900]]
  - [side_right,  [ 0.290,  0.000, 0.450], [0.020, 0.450, 0.900]]
  - [back,        [ 0.000,  0.215, 0.450], [0.600, 0.020, 0.900]]
  - [top,         [ 0.000,  0.000, 0.890], [0.600, 0.450, 0.020]]
  - [shelf_below, [ 0.000,  0.000, 0.420], [0.560, 0.450, 0.020]]
  - [shelf_above, [ 0.000,  0.000, 0.680], [0.560, 0.450, 0.020]]
# 開口（由上列推得，寫出來供核對）：x ∈ [−0.280, 0.280]，z ∈ [0.430, 0.670]

# ---- 抽屜：單一剛體，沿 −y 滑動 ----
# 抽屜**不接觸**下層板（底面 z = 0.432，板面 z = 0.430，留 2 mm）：
# 重量由滑動關節承擔，不靠與櫃體的接觸支撐，避免接觸與關節重複約束而抖動。
drawer:
  body:
    - [front_panel, [ 0.000, -0.236, 0.550], [0.575, 0.018, 0.260]]
    - [bottom,      [ 0.000, -0.018, 0.4395],[0.545, 0.400, 0.015]]
    - [side_l,      [-0.265, -0.018, 0.542], [0.015, 0.400, 0.190]]
    - [side_r,      [ 0.265, -0.018, 0.542], [0.015, 0.400, 0.190]]
    - [back,        [ 0.000,  0.1745,0.542], [0.545, 0.015, 0.190]]
  # 把手：兩根支柱 + 一根橫桿。橫桿是**唯一**設計為被夾持的面。
  handle:
    posts:
      - [post_l, [-0.085, -0.265, 0.550], [0.016, 0.040, 0.024]]
      - [post_r, [ 0.085, -0.265, 0.550], [0.016, 0.040, 0.024]]
    bar:
      shape: cylinder
      axis: x
      radius: 0.005
      length: 0.200
      center: [0.000, -0.285, 0.550]
  # 滑動自由度
  joint:
    type: prismatic
    axis: [0.0, -1.0, 0.0]      # 本地 −y：朝機器人拉出
    lower: 0.000
    upper: 0.220
  # 物理參數 —— **執行前選定並記錄**，不是事後配合結果調出來的
  physics:
    mass_kg: 2.0                # 抽屜總質量（含面板與把手）
    linear_damping: 2.0         # 剛體線性阻尼 1/s
    joint_friction: 0.0         # PhysX 關節庫倫摩擦，第一版設 0
    drive_stiffness: 0.0        # **必須為 0**：抽屜不接受位置命令
    drive_damping: 0.0          # **必須為 0**：抽屜不接受速度命令
    # 上面兩項為 0 是本案例的硬性條件，執行時會讀回實際值並記錄；
    # 讀回不為 0 即中止，不以「數值很小」通融。

# ---- 夾持面：供抓取模型使用 ----
grasp_surface:
  link: drawer_handle_bar
  # TCP 相對橫桿中心的偏移，沿工具 z（接近軸）。
  # 由 URDF 量得：可用窗口 tool z ∈ [−0.0269, −0.0025]（24.4 mm），
  # 12 mm 的桿置中 ⇒ 桿心在 tool z = −0.0147，兩側各餘 6.2 mm。
  tcp_offset_along_tool_z: 0.0147
  finger_joint_open: 0.0089     # 進入／退出時的手指位置（全開）
  finger_gap_open_m: 0.0178     # 全開內距，對 0.010 的桿每側餘 0.0039
  enclosure_margin_min_m: 0.002 # 包覆餘裕的判準：手指全開時對橫桿每側至少這麼多。
                                # 手指與橫桿是**設計接觸對**，不套用一般環境的
                                # 5 mm 門檻 —— 那個門檻是給「不該碰到的東西」用的。
