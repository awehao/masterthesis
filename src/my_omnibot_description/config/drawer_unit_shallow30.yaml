# =====================================================================
# drawer_unit_shallow30：drawer_unit_bar26 的淺版（Howard 2026-11-18「也可以重新設計抽屜不用那麼深」）。
# 改深度（櫃深 0.45→0.30 m、抽屜體深 0.40→0.26 m）與抽屜高度（托盤式：面板 z 0.425–0.600、把手高 0.5125、上層板降到 0.62）；
# 寬度、把手形式（26 mm 橫桿、站距 40 mm）、底板高度、滑動自由度與物理參數沿用 bar26（原檔不改）。
# 為什麼：拉開 0.20 m 後筆在櫃口外，手腕從正上方夾。離線可行性（IK＋全身淨空 clear_door_fast，含本抽屜方盒；底盤淨空只計底緣 < 0.33 m 的物體）：
#   面板頂 0.68（原高）⇒ 0 個夾筆底盤位（前臂要越過面板）；面板頂 0.60、筆在面板內面後 9 cm ⇒ 把手 33／正上方夾筆 69 個底盤位（偏航 180°）。
# 座標系同 bar26：本地原點在櫃底中心，+x 沿把手橫桿，+y 指向櫃內，抽屜沿 −y 拉出。
# 未經實物驗證；拉動（偏航版）只在本專案模擬內。
# =====================================================================
schema: drawer_unit/1
name: drawer_unit_shallow30

cabinet:
  - [side_left,   [-0.290,  0.000, 0.450], [0.020, 0.300, 0.900]]
  - [side_right,  [ 0.290,  0.000, 0.450], [0.020, 0.300, 0.900]]
  - [back,        [ 0.000,  0.140, 0.450], [0.600, 0.020, 0.900]]
  - [top,         [ 0.000,  0.000, 0.890], [0.600, 0.300, 0.020]]
  - [shelf_below, [ 0.000,  0.000, 0.420], [0.560, 0.300, 0.020]]
  - [shelf_above, [ 0.000,  0.000, 0.620], [0.560, 0.300, 0.020]]
# 開口：x ∈ [−0.280, 0.280]，z ∈ [0.430, 0.610]；櫃前緣 y＝−0.150，櫃背內面 y＝0.130

drawer:
  body:
    - [front_panel, [ 0.000, -0.161, 0.5125],[0.575, 0.018, 0.175]]   # y ∈ [−0.170, −0.152]（離櫃前緣 2 mm，同 bar26）
    - [bottom,      [ 0.000, -0.022, 0.4395],[0.545, 0.260, 0.015]]   # y ∈ [−0.152, 0.108]
    - [side_l,      [-0.265, -0.022, 0.5185],[0.015, 0.260, 0.143]]   # z 0.447–0.590
    - [side_r,      [ 0.265, -0.022, 0.5185],[0.015, 0.260, 0.143]]
    - [back,        [ 0.000,  0.1005,0.5185],[0.545, 0.015, 0.143]]   # y ∈ [0.093, 0.108]；關閉時離櫃背內面 22 mm
  handle:
    posts:
      - [post_l, [-0.085, -0.190, 0.5125],[0.016, 0.040, 0.024]]
      - [post_r, [ 0.085, -0.190, 0.5125],[0.016, 0.040, 0.024]]
    bar:
      shape: cylinder
      axis: x
      radius: 0.013
      length: 0.200
      center: [0.000, -0.210, 0.5125]                                   # 面板前緣外 40 mm（同 bar26）
  joint:
    type: prismatic
    axis: [0.0, -1.0, 0.0]
    lower: 0.000
    upper: 0.220                                                       # 拉到 0.22 時抽屜後板仍在櫃內 38 mm
  physics:
    mass_kg: 2.0
    linear_damping: 2.0
    joint_friction: 0.0
    drive_stiffness: 0.0
    drive_damping: 0.0

grasp_surface:
  link: drawer_handle_bar
  tcp_offset_along_tool_z: 0.0068                                     # bar26 檔頭：桿心在手指座標 z 22.5 mm ⇒ TCP 越過桿心 6.8 mm
  finger_joint_open: 0.0089
  enclosure_margin_min_m: 0.002

target_open_m: 0.200
marker_placement:
  frame: drawer
  center: [0.000, -0.062, 0.461]                                       # 面板內面（y −0.152）後 9 cm；底板頂 z 0.447 ＋ 半對邊 0.013 ＋ 1 mm
  yaw_deg: 0.0                                                         # 平躺沿抽屜 x（把手橫桿方向）
interior:
  bottom_top_z: 0.447
  y: [-0.152, 0.093]
  z_top: 0.590
  x: [-0.2575, 0.2575]
