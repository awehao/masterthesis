# Global EKF (robot_localization): fuse smooth /odom + absolute /amcl_pose into
# a stable map->odom transform, so AMCL jumps (from unmapped obstacles) get
# rejected/smoothed instead of teleporting the robot.
#
# Chain:  /odom (velocity, smooth) ── predict ──┐
#         /amcl_pose (x,y,yaw, jumps) ─ correct ─┴─► fused map->base ─► map->odom TF
#
# AMCL must NOT publish map->odom (tf_broadcast:=false); this EKF owns it.
# Real-world valid: with a real (drifting) /odom the EKF still works — AMCL
# slowly corrects the drift while odom keeps it smooth between corrections.

ekf_global:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true                 # planar robot
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map                 # GLOBAL EKF -> publishes map->odom

    # /odom: fuse VELOCITY (vx, vy, vyaw) for smooth dead-reckoning prediction.
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # /amcl_pose: fuse ABSOLUTE x, y, yaw for map-frame correction.
    # rejection_threshold (Mahalanobis) drops AMCL outlier jumps -> stable.
    pose0: /amcl_pose
    pose0_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose0_differential: false
    pose0_relative: false
    pose0_queue_size: 5
    # Mahalanobis gate on /amcl_pose, effectively OFF.
    #
    # At 2.5 the filter locks itself out of its own corrections: once its
    # estimate drifts, every correct AMCL pose looks like an outlier and is
    # discarded, so it drifts further. Caught on a watched run -- the EKF
    # reached 2.49 m while AMCL stayed within 0.07 m and kept publishing 13-20
    # poses per 10 s. Across 175 trials the EKF exceeded 0.5 m in 25 of them
    # (14%), worst 8.35 m, while AMCL's worst over the same trials was 0.31 m.
    #
    # The gate was there to reject AMCL jumps near unknown obstacles. Those
    # jumps do not occur in the measurements, so it was trading a risk that
    # never materialised for a failure that does.
    #
    # 10 trials each at 2.5 / 10.0 / off: medians identical (0.039-0.041),
    # off had the best p99 (0.108 vs 0.128) and the best max (0.200 vs 0.296).
    # None of the three diverged, so this shows off is not WORSE; at a 14% base
    # rate, 9 trials cannot show that it is better. EKF_REJECT overrides.
    pose0_rejection_threshold: 1.0e9
