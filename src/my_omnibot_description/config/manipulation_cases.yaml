# 操作案例：導航終點與手臂可達範圍綁在一起的停放規格。
#
# **獨立於 bigarena_poses.csv**。那份是導航實驗用的隨機起終點，與手臂可達
# 範圍無關；已凍結的導航實驗不因本檔改變。
#
# 幾何怎麼來的（可重算，不是抄的）
# --------------------------------
# 用 evaluation/models/omni_bot_manip.urdf 對 arm_initial_pose.yaml 的
# pregrasp_reference 做 FK，得到底盤座標下的 TCP：
#
#     link_tcp = (+0.4500, 0.0000, +0.5500)   工具 z 軸 = (+1, 0, 0)（朝前）
#     link_eef = (+0.3664, 0.0000, +0.5500)
#     （對照 test_start：link_tcp = (+0.1970, 0, +0.4000)，工具朝下）
#
# 因此本案例的 TCP 目標以**底盤座標**定義，而不是抄原案例的世界座標。
# pregrasp_reference 的六個關節角之所以可以沿用，是因為它算出來的底盤相對
# 目標與本案例的目標相同 —— 這是**核對過的等價**，不是直接照搬。
#
# 停放點的推導：
#     面中心      = 箱心 ± 半邊長
#     TCP 目標    = 面中心 + 站距 0.24 m（沿面法線向外）
#     底盤停放點  = TCP 目標 + 0.450 m（TCP 在底盤前方的距離）
#     車頭朝向    = 面法線的反向（朝著箱子）
#
# 候選是把 18 個 known_obs × 4 個面全部算過、依淨距排序選出來的，不是挑順眼的。

schema: manipulation_case/1

default_case: box12_south

cases:
  box12_south:
    world: bigarena
    # ---- 操作對象（bigarena 的靜態障礙，已在地圖與 costmap 內）----
    object:
      name: known_obs_12
      pose: [5.00, 7.91, 0.50]        # 箱心，z 為中心；箱高 1.00 m（0 到 1.00）
      size: [0.84, 1.10, 1.00]
      approach_face: '-y'             # 由南側接近
      face_center: [5.00, 7.36]
    # ---- 底盤停放（導航要送到這裡，不是任意終點）----
    parking:
      x: 5.003
      y: 6.671
      yaw_deg: 90.0                   # 車頭朝 +y，正對箱面
      # 停放點的真值淨距（面對面，機器人以半徑 0.30 m 圓盤近似）
      clearance_to_object_m: 0.390
      clearance_to_other_static_m: 2.328
    # ---- 預抓取目標（底盤座標，不是世界座標）----
    pregrasp:
      frame: base_footprint
      tcp_xyz: [0.450, 0.000, 0.550]
      tcp_forward_axis: [1.0, 0.0, 0.0]   # 工具 z 軸方向
      standoff_from_face_m: 0.24
      arm_config: pregrasp_reference       # 見 arm_initial_pose.yaml
      start_config: test_start
    # ---- 容差 ----
    #
    # 這些是**操作端的需求**，不是現況能力。底盤停放誤差會 1:1 轉成 TCP 誤差：
    # 停偏 0.30 m，TCP 就偏 0.30 m。目前導航的到達容差是 0.30 m（而且量到的是
    # 停在 0.29–0.31 m），**無法滿足下列停放需求**，所以接上導航時必須另外有
    # 一段停放對準行為。本檔只寫需求，不假設現有導航做得到。
    tolerance:
      parking_xy_m: 0.05
      parking_yaw_deg: 3.0
      stop_speed_mps: 0.01            # 以 Isaac 的物理速度判定，不用 /odom
      stop_hold_s: 0.5                # 需連續低於上限這麼久
      tcp_pos_m: 0.005
      tcp_rot_deg: 2.0            # 這是**工具軸方向**的夾角，不是完整三維姿態
      # 到位時間容差 —— **在重跑之前定義**，不是照著已量到的數字配合出來的。
      # 依據：軌跡標稱 4.525 s；命令週期 20 ms；上一趟量到進回呼相對預定時刻
      # 中位 +150 ms。0.50 s（約標稱時長的 11 %）足以涵蓋起步與傳遞延遲，
      # 又不至於寬到蓋掉真正的運動變慢。**此值待審，可改。**
      arrival_time_s: 0.50
      # 到位的判定同時要求「誤差進入容差」與「持續這麼久」
      arrival_hold_s: 1.0
    # ---- 手臂軌跡限制（位置介面，但必須平滑且有速度上限）----
    trajectory:
      joint_vel_max_rps: 0.35         # rad/s，每關節
      joint_acc_max_rps2: 0.7         # rad/s²
      rate_hz: 50.0
      settle_s: 1.0

  # ===================================================================
  # 接觸操作：固定底盤 ＋ 單一被動抽屜
  #
  # 與 box12_south 的關係：那個案例停在預抓取，**沒有接觸**。本案例才有接觸，
  # 用的是 drawer_unit.yaml 定義的新資產（有把手、有滑動關節），不是把
  # known_obs_12 當成已有的操作機構。
  #
  # 抓取模型分兩版，**不混稱**：
  #   drawer_open_a_fixed     理想固定連接 —— 夾爪與把手之間直接加一個固定關節。
  #                           測的是「手臂能不能沿這條路徑把抽屜帶開」，
  #                           與夾持力無關。同時量出所需拉力。
  #   drawer_open_a_friction  摩擦夾持 —— 只有接觸與摩擦，沒有任何額外約束。
  #                           測的是「這個夾爪的握力夠不夠維持這個關係」。
  # 兩版各自獨立記錄，結果不得互相代表。
  # ===================================================================
  drawer_open_a_fixed: &drawer_open_a
    world: bigarena
    grasp_model: fixed_attachment   # 見上；friction 版另有條目
    object:
      spec: drawer_unit.yaml
      name: drawer_unit_a
      # 櫃體底面中心的世界位置。**不寫進 bigarena.sdf**：那份是已凍結的導航
      # 場景，動它等於動已完成資料的前提。只有操作模擬載入這個資產。
      pose: [10.500, 9.000]
      yaw_deg: 0.0                  # 本地 +y 指向櫃內（世界 +y），抽屜沿 −y 拉出
      # 選址：對 **18 個 known_obs 與 16 面 wall 全部**做網格搜尋後選的。
      # 第一次只比對 known_obs，選到 (12.5, 7.5)，那裡正好壓在 wall_12
      # （x = 12.5, y ∈ [5.50, 7.40]）上 —— 內牆必須一起算。
      # 本點位於中央帶（wall_5/6 的 y = 5.5 與 wall_8 的 y = 11.5 之間）。
      # 淨距以「抽屜全開時的資產佔地 0.600 x 0.715」計，不是只算櫃體。
      clearance_to_static_m: 1.643
    parking:
      x: 10.500
      y: 8.0897                     # 由把手幾何反推，使夾持 TCP 落在底盤 x = 0.6400
      yaw_deg: 90.0                 # 車頭朝 +y，正對櫃體
      # 同樣含內牆；底盤以 0.60 x 0.60 方框計（量自 URDF，不是半徑 0.30 的圓）
      clearance_to_static_m: 1.647
    # ---- 手臂姿態 ----
    pregrasp:
      frame: base_footprint
      # 接近軸沿底盤 +x；joint6 = −π/2 讓手指改為**垂直**閉合，
      # 因此把手是常規的水平橫桿。joint6 在此分支的限位餘裕 1.365 rad。
      tcp_forward_axis: [1.0, 0.0, 0.0]
      finger_closing_axis_world: [0.0, 0.0, 1.0]
      start_config: test_start
    drawer:
      target_opening_m: 0.200       # 硬限位 0.220，目標不落在限位上
      approach_backoff_m: 0.100     # 夾持前退在夾持位後方這麼遠（沿工具 z）
      retreat_backoff_m: 0.040      # 夾持後退開這麼遠；清開橫桿最少需 0.0233 m
      # 可達性依據 —— 以 10 組 IK 種子逐點取最佳解，再逐點算自碰，
      # 條件為「限位餘裕 ≥ 0.15 rad 且自碰餘裕 ≥ 5 mm」。
      # z = 0.55 的連續可用區間 TCP x ∈ [0.380, 0.680]，長 0.300 m。
      # 近端界由 joint3 的安全下限 −0.0611 決定（肘關節範圍很不對稱），
      # 不是由臂展決定；把手放低反而更差（z=0.40 近端界 0.480）。
      #
      # 需求 = 行程 0.200 ＋ 退出 0.040 = 0.240 m，餘 0.060 m：
      #   夾持（關閉） x = 0.640   全開 x = 0.440   退出後 x = 0.400
      # 接近起點 x = 0.540 落在中間，不額外佔用窗口。
      # 該區間內的限位餘裕：0.640 → 1.095、0.440 → 0.537、0.400 → 0.337 rad，
      # 最小值仍是停止門檻 0.050 rad 的 6.7 倍。
      reachable_span_m: 0.300
      reachable_x_range_m: [0.380, 0.680]
      grasp_x_closed_m: 0.640
      # 拉開段：笛卡兒直線，時間參數化後任一關節不超過下列上限
      # （與已凍結的預抓取軌跡同一組限制，不因接觸而放寬）
      vel_max_rps: 0.35
      acc_max_rps2: 0.7
      rate_hz: 50.0
    # ---- 容差與判定 ----
    # 這些是**操作端的需求**，不是現況能力的描述，也不是照已量到的數字配出來的。
    tolerance:
      opening_m: 0.010              # 目標開度 ±10 mm（行程的 5 %）
      opening_hold_s: 2.0           # 需連續落在容差內這麼久才算到位
      tcp_pos_m: 0.010              # TCP 對預定夾持點的位置誤差
      tcp_rot_deg: 3.0              # 工具軸方向夾角，不是完整三維姿態
      grasp_slip_m: 0.020           # TCP 對把手中心的相對位移超過此值 = 夾持關係失效
      base_drift_m: 0.010
      base_yaw_drift_deg: 1.0
      joint_track_err_rad: 0.20
      joint_limit_margin_rad: 0.050
    # ---- 階段順序：釋放在退出**之前** ----
    # 固定連接若還在，手臂「退出 40 mm」只會繼續把抽屜拉出來，不是退開。
    # 正常釋放與異常停止時的「不緊急鬆開」是兩種不同流程，不衝突：
    # 前者是任務完成的一步，後者是避免在失控狀態下丟開負載。
    # align 相位（只在對準版出現）：engage 之後把命令從舊的（帶偏移）設定點
    # 平順帶到以實際抓取關係反推的對準首點。笛卡兒參考連續不代表關節命令連續，
    # 所以要有這一段，而不是直接切換；也不能在固定連接後繼續追逐舊設定點。
    phases: [approach, engage, align, pull, hold, release, retreat]
    # ---- 逾時（模擬時間）----
    timeout_s:
      approach: 30.0
      engage: 10.0
      align: 10.0
      pull: 60.0
      hold: 10.0
      release: 10.0
      retreat: 30.0
      total_wall_s: 900.0
    # ---- 停止處置：發生下列任一項即停，**不自動重試** ----
    # 處置分兩種，**不是一律凍結設定點**：
    #
    #   default = freeze_setpoint
    #     把手臂命令凍結在最後一次已套用的設定點並持續發布，停掉軌跡播放，
    #     寫出 stop_reason 與當下所有量測。適用於追蹤誤差、限位餘裕、底盤漂移、
    #     逾時這類「運動異常」。抽屜由滑動關節承重，不會掉落，不做緊急鬆開。
    #
    #   contact_force = release_coupling_then_freeze
    #     **凍結設定點不保證力會下降** —— 位置驅動會持續施力，凍結只是不再前進。
    #     所以超力有自己的處置，順序固定：
    #       1. 先解除耦合（fixed 版拆掉固定關節；friction 版手指張開到 finger_cmd_open）
    #       2. 再凍結設定點
    #       3. 停止並寫出紀錄
    #     解除耦合會移除力的傳遞路徑，這才是真正卸力；抽屜仍由滑動關節承重。
    stop_handling:
      default: freeze_setpoint
      contact_force: release_coupling_then_freeze
      # 監看失效（溫度或力讀不到）**不是**「沒有超限」。讀不到就代表我們不知道
      # 現在的力或溫度，所以走保守處置，與「量到超限」分開記錄。
      # 啟動前會先確認每一個監看量都讀得到，讀不到就不開始跑；暖機階段也納入監看。
      monitor_failure: release_coupling_then_freeze
    stop_on:
      - base_drift                  # 底盤位移或轉角超過容差（底盤必須固定）
      - joint_limit_margin          # 任一關節離安全限位小於 0.050 rad
      - joint_track_err             # 追蹤誤差超過 0.20 rad
      - grasp_lost                  # 夾持關係失效（見 grasp_slip_m）
      - drawer_limit                # 開度進入硬限位 0.005 m 內
      - contact_force               # 把手接觸力超過 contact_force_max_n
      - phase_timeout
      - wall_timeout
      - cpu_temp                    # 92 °C，沿用既有中止線，不上調
    # ---- 力的量測與中止：必須說清楚監看哪一個力 ----
    force:
      # **不能**把任一手臂關節的 get_measured_joint_forces() 數值直接稱為把手拉力。
      # 該函式回傳的是「該連桿上游關節」的反作用力與力矩，且表示在**該關節的子
      # 連桿座標系**裡。所以本案例定義的算法是：
      #   1. 取 link6 上游關節（joint6）的反作用力 F_j（6 維：力 3 ＋ 力矩 3）
      #   2. 以 FK 取該子座標系到世界的旋轉 R，得 F_world = R · F_j[:3]
      #   3. 沿抽屜軸投影：F_pull = â^T · F_world
      # 抽屜軸是水平的、夾爪自重沿 −z，投影後夾爪重量一階上不進入 F_pull；
      # 但**夾爪的慣性項沒有扣除**，所以 F_pull 是「手腕沿抽屜軸傳遞的力」，
      # 不等於純把手拉力。報告必須這樣寫。
      measure_link: link6
      measure_joint: joint6
      drawer_axis_world: [0.0, -1.0, 0.0]
      # 交叉核對：由抽屜自身運動推得的拉力 F_drawer = m·a + m·d·v + F_friction。
      # 兩者相符是旁證，**不等於逐筆對應**；不相符就兩個都報並說明各是什麼。
      # **依抽屜動力學重建的軸向外力估計**，不是拉力的直接量測。
      # 依賴線性阻尼模型、速度差分，以及「軸向無其他作用力」的假設。
      cross_check: drawer_dynamics_reconstruction
      # 接觸力查詢必須明確帶 dt = physics_dt。預設 dt = 1.0 回傳的是**衝量**，
      # 不是力（已由 isaac_drawer_probe.py 用已知質量的方塊實測核對）。
      contact_dt: physics_dt
      # 中止門檻監看的量：**手腕傳遞力的世界座標模長** |R · F_j[:3]|。
      # 不是 F_pull 那個投影（投影會漏掉側向過載），也不是手指接觸力
      # （fixed 版根本沒有手指接觸，用它監看等於沒監看）。
      # 手腕傳遞力兩版都存在，而且是會造成損壞的那個量。
      abort_on: wrist_transmitted_force_norm
      abort_threshold_n: 30.0
      # 中止判準有**兩個版本**，不是同一個判準的兩種判讀：
      #   v1_instantaneous  單一樣本超過 30 N 即停          （第 1 趟用）
      #   v2_sustained      需連續超過 30 N 達 0.05 s 才停  （第 2 趟起用）
      #
      # **v2 相對 v1 是放寬中止規則**，這一點要講清楚，不能說成「只是改判讀」。
      # 加它的理由：2026-09-12 第 1 趟在建立固定關節的那一個物理步量到 65.4 N，
      # 前後樣本都在 3.7–8.7 N，1331 個樣本裡只有 1 個超過 30 N。
      # 但「只出現一次」**不等於無害** —— 65.4 N 遠高於門檻，那個峰值本身仍是
      # 需要解釋的現象，只是 v2 選擇不因單步暫態中止。
      # 不同判準版本的趟次不可直接相提並論；輸出 JSON 會記下該趟用的版本。
      # 0.05 s 的依據：足以濾掉單步暫態，而真正的過載會在 1/20 秒內停住，
      # 這段時間手臂最多再走 0.35 rad/s × 0.05 s = 0.0175 rad。
      # 瞬時峰值一律記錄（f_norm_peak），不因為不中止就不寫。
      abort_sustained_s: 0.05
      # 已用已知外力校正過（見 §量測）：夾爪施世界 (0,0,−20) N 時，
      # joint_indices['joint6']+1 那一列的 Δ|F| = 20.109 N，誤差 0.5 %。
      # 但靜止無接觸時該列約 5.2 N，而 joint6 以下重量只有 4.05 N —— 有約 1.1 N
      # 的常數偏置未解釋。所以這個量只作**安全監看**，不是把手拉力。
      # 拉力看 f_drawer（抽屜側動力學，不依賴列號對應）。
      pull_force_primary: f_drawer_reconstructed
      pull_force_cross_check: f_pull
    cpu_limit_c: 92.0
    # ---- 必錄項目 ----
    # 少錄任何一項就不是完整驗收資料；缺項在紀錄裡寫「未錄製」，不寫 0。
    record:
      - /arm/joint_position_cmd     # 手臂命令（含 seq 與預定時刻）
      - /joint_states               # 手臂回授
      - /manip/tcp_pose             # TCP 實際位姿
      - /manip/drawer_state         # 抽屜實際開度與速度（讀自模擬器關節）
      - /manip/grasp_state          # 夾持關係：TCP 對把手中心的相對位移
      - /manip/contact              # 可取得的接觸資料（把手上的接觸力）
      - /manip/status
      - /clock

  drawer_open_a_friction:
    <<: *drawer_open_a
    grasp_model: friction
    # 摩擦夾持版**只**改抓取關係，幾何、行程、容差、停止處置全部沿用上一版。
    # 這樣兩版的差異就只有抓取模型本身。
    grip:
      finger_cmd_closed: 0.000      # 命令全閉；橫桿 12 mm ⇒ 接觸在 0.006
      finger_cmd_open: 0.0089       # 進入／退出時全開，內距 17.8 mm
      finger_max_force_n: 5.0       # URDF finger_joint effort 上限，不上調
      friction_coefficient: 0.8     # 指墊／把手的物理材質，執行前選定
      # 由上列推得的上限：2 指 × 5 N × 0.8 = 8 N 可傳遞的拉力。
      # 抽屜 2.0 kg、線性阻尼 2.0 /s，在 0.05 m/s 下阻尼力約 0.2 N。
      # **這是設計餘裕，不是量測結果**；實際所需拉力由 fixed 版量出來。
      expected_pull_force_n: 8.0
      # friction 版**額外**監看手指對把手的接觸力（get_contact_force_matrix，
