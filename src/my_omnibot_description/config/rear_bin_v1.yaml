# 車尾收納盒 v1（Howard 2026-11-19「在車子後面放一個盒子 放夾取物」）
# 座標＝base_footprint（底盤中心、地面；+x 前）。底盤頂板 z 0.33（chassis_body.xacro 碰撞圓柱 z 0.05–0.33）。
# 尺寸為工程設計值：四角離底盤中心 0.282 m（底盤半徑 0.300 內）；離手臂座（x 0.11）最近 0.18 m。
# 離線核對（2026-11-19）：第二十五趟全程手臂軌跡離盒 ≥ 98 mm（link_base）；新收臂姿勢 98 mm；
#   夾爪朝下放置 TCP (−0.16, 0, 0.45–0.55) 有 IK 解（j1≈−2.7），自身淨空 ≥ 12 mm、離盒 ≥ 27 mm。
outer:
  center: [-0.16, 0.0, 0.37]      # 外形中心
  half: [0.09, 0.13, 0.04]        # x 0.18 × y 0.26 × 高 0.08（z 0.33–0.41）
wall: 0.006
bottom: 0.006
mass_kg: 0.4
place:
  tcp_xy: [-0.16, 0.0]            # 放置時 TCP 在盒中心正上方
  tcp_z: 0.50                     # 盒頂 0.41 上 9 cm（夾爪殼與手指不入盒）
  tool_x_along: base_y            # 物體軸（工具 x）沿底盤 y 躺下（盒內長 0.248 > 圓柱 0.20、筆 0.14）
  drop_wait_s: 0.6                # 解除連接＋張爪後等物體落定
note: 物體放入後不再綁定：盒內靠摩擦與盒壁擋（底盤加速度 ≤ 1 m/s²）；淨空模型含盒體（底盤附著方盒），不含盒內物體。
