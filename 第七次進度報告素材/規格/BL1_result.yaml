前板深度誤差對距離: '**分析期間新增的探索性診斷，非事前登錄驗收**：在前述篩選規則（前板外面、排除橫桿／支柱附近與邊緣 10 mm）下，85 格的每格中位沿射線有號差 ≈ −0.23 + 0.81·距離(m) mm，相關係數 0.996；只描述這 85 格、此篩選規則下的結果。'
獲支持的解釋:
- 接近軸方向的工具目標生成誤差主要表現在擬合軸線偏移（e_F）；沿軸中心（e_C）與目標轉換（e_T）中位約 0。
- 在目前內參、位姿與解析幾何參考下，量測深度反投影點相對參考幾何偏深（前板平面與橫桿可見面皆是，橫桿較多）；這是反投影差異，不直接認定渲染深度本身有尺度錯誤。
- 在本開發資料中，內點偏向真值表面內側；固定候選點集的真值表面替換後，擬合軸線偏移明顯縮小（0.4–3 m 合併中位約 −0.09 mm），支持輸入點幾何偏差與軸線偏移有關，但尚未區分深度、投影、位姿及擬合因素的貢獻。
仍未確認:
- 深度偏深的成因：深度尺度、內參讀回與渲染實際投影的差、相機位姿（姿態）誤差、渲染細分等皆為候選；前板誤差隨距離線性只縮小候選範圍，未區分。
- 橫桿比前板多出的 0.3–0.9 mm（圓柱渲染細分、邊緣像素、可見面篩選）未區分。
- 替換診斷同時改變點位與採樣幾何，不能單獨證明擬合演算法無偏；0.1–0.4 m 只有 2 格（替換後 −0.86 mm），近距不作結論。
- 同一場景、同一把手、模擬深度；不代表實機深度相機的誤差特性。
不能宣稱: 偏差成因已確認、可用距離線性模型補償、近距重觀測必然改善、實機適用
審查: Codex 核可封存為描述性離線分析（reviews/20261006_032210_reply.md），三處收尾已改
