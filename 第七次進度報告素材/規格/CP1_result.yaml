分層_整數約定: 依像素到主點距離：0–100 px 0.39、100–200 px 0.07、200–400 px 0.02 mm（逐格中位的中位）；左右／上下差異較小；半像素約定下各層皆約 0
座標一致性檢查: 偵測中心投影相對真值中心投影的像素差中位 (−0.84, −0.74) px（85 格；整數約定投影）——只作座標一致性檢查，不是像素中心校準證據
觀察:
- 在同一批像素與深度值下，以整數像素索引反投影時前板沿射線差隨距離增加（合併 −0.19 + 0.78 mm/m，殘差 sd 0.057 mm）；改以像素中心 +0.5 反投影時，殘差中位約 −2e-5 mm、斜率約 −3e-5 mm/m、殘差 sd 約 6e-5 mm。
- 平面法向（相機座標）：整數約定中位角差 0.013°，像素中心 +0.5 約 3e-6°。**法向擬合的「與該格中位差 ≤ 2 mm」篩選是看到初版結果後新增的探索性處理**（初版 +0.5 下 0.037°，因斜視時前方橫桿／支柱等較近物體的像素混入）；逐格記錄的是「疑似遮擋／較近異常像素數」，不是真值遮擋標註；主要深度中位統計未使用此篩選。
- 深度值本身（distance_to_image_plane，float32）在前板上與「像素中心在 +0.5」的射線約定與記錄位姿高度一致；BL1 的反投影差異與 D1 以整數索引反投影的約定相容。
解讀限制:
- 只表示像素中心 +0.5 的約定與資料較相容，不排除其他內參／位姿差異；+0.5 下的小殘差是目前參考下的統計殘差（逐格中位最大絕對值約 3.0e-04 mm），不能用來限制各個未識別因素的影響。
- 平面法向與徑向／方向分層不能各自唯一判定原因；整數約定曲線在約 0.5 m 有跳階（前板像素在影像中的分佈隨距離改變），線性擬合只作描述。
- 只核前板平面；橫桿可見面在 BL1 多出的部分是否也由此解釋，本包未核。
證據狀態:
  深度定義: 已確認（程式：add_distance_to_image_plane_to_frame）
  近遠裁切: 已記錄 0.05–10 m
  float32 儲存: 單純儲存捨入不足以解釋毫米級差異（不代表整個深度渲染精度）
  內參: 讀回 K 與設定一致
  渲染投影矩陣: 未保存（缺項）
  像素中心約定的官方定義: 未保存／未查（缺項；本包只有資料相容性證據）
  渲染端深度精度: 未記錄（缺項）
