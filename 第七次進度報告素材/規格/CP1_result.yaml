schema: cp1_result/1
狀態: 既有前板資料的像素射線約定離線核對完成（不是整個相機契約已驗證）。在兩個開發序列的前板評估區內，固定影格、像素與深度值後，像素中心加半的射線約定與記錄位姿及解析平面高度一致。這支持反投影約定差異是值得檢驗的候選解釋，尚未證實渲染器約定，也未解釋橫桿與工具目標的全部偏差。
程式: evaluation/cp1_camera_contract.py → results/vision/CP1_camera_contract.json（試跑與正式逐值相同）；圖 15
範圍: 既有資料（BL1 同兩開發群組 186 格）；前板平面；同一批像素與原始深度值，只換射線約定；評估端用真值；不改偵測器、不補償、不調半像素量
分母: 186 格中 151 格有 ≥ 200 前板像素（兩約定皆在評估區）；35 格不足排除
