主要觀察:
- 在五趟真值目標實錄中，閉爪前窗的追蹤偏差（−1.40～+0.14 mm，末步 −0.07～+0.05）小於預抓取窗（−3.6～+2.0 mm）；因此固定搬移預抓取位姿前進 30 mm，不等同於繼續閉迴路接近的結果。視覺目標下尚未驗證。
- 五趟真值目標實錄閉爪前實測 TCP 位姿的靜態模型餘裕：根部 2.65–2.77 mm、淺側 4.23–4.35 mm（d1s4b_M 用腕部逐格真值；B 層四趟為資產名目中心參考，非逐時刻真值）。
- dl3v_M 工具目標生成誤差（沿接近軸）+2.25 mm，不受追蹤修正。以名目根部餘裕 2.7 mm 減生成誤差、再減真值實錄閉爪前追蹤偏差：用五趟末步樣本（未捨入值）得約 0.40–0.53 mm；用整窗範圍（−1.40～+0.14）得約 0.31–1.85 mm。此為跨趟假設的簡化軸向算式、未含姿態影響，視覺目標下的接近尚未驗證。
- 本開發資料的已接受樣本，工具目標生成誤差沿接近軸呈正向偏差：G0 各距離箱中位 +1.09～+2.39 mm（0.4–3 m）、已觀察最大 +3.41 mm（2–3 m，n 12）；L1 中位 +1.21～+1.67 mm、最大 +3.07 mm。成因（深度反投影、圓柱中心擬合、法向、目標轉換）尚未定位。
情境_非最壞界限: 已觀察範圍下的深側組合情境：工具目標生成誤差最大 +3.41 ＋閉爪前追蹤最大 +0.14 ≈ +3.55 mm ＞ 名目根部餘裕 2.7 mm；淺側：最小 −1.20 −1.40 ≈ −2.60 mm，在淺側名目 4.3 mm 內。各分量來自不同資料，非實測聯合、非可靠最壞界限。
放行條件尚缺的證據:
- 估計（工具目標生成）誤差界尚未建立：兩個同把手開發序列、正向偏差、成因未定位；散佈不能當誤差界
- 視覺目標下的接近段追蹤從未量測
- 因此無法提出可支持的 X_deep（需 生成誤差界 ＋ X_deep ≤ 根部餘裕）
- 較近距離重新觀測能否縮小生成誤差無直接資料，不能由近距統計推論
- 停止後運動（DL3 0.95 mm）未入「不中斷接續接近」的假設預算
封存用語候選: EB1 接近方向誤差與幾何餘裕：既有資料離線分析完成。結果顯示預抓取到位不等同於後續抓取放行；視覺接近的可支持誤差界尚未建立。
不能宣稱: 抓取成功或失敗機率、可靠最壞界限、偏差已確認成因、可放行接續接近
審查: r1 未封存（時間配對、情境定義）；r2 Codex 核可封存（reviews/20261006_031237_reply.md），兩處文字收尾已改
凍結: results/vision/freeze_eb1.sha256
真值來源更正: JSON 內 dl3v_M／d1s4b_M 的 c_src 寫「wrist_live 逐格真值（取最後一格…）」措辭不準：實際是**最後一格腕部真值作靜態參考**（分析窗內抽屜開度為零），並非按分析時刻逐格匹配；B 層四趟為資產名目中心參考。JSON 不改寫，以本欄為準。
