觀察:
- 新版在共同集合上使工具目標生成誤差（沿接近軸）有號中位 +1.36 → +0.60 mm、絕對中位 1.36 → 0.97 mm；已觀察最大 +3.41 → +2.62 mm。
- 但不是全面改善：82 格中 22 格絕對誤差變大、18 格號變翻（新版最小 −1.87 mm，偏淺側）；正向偏差仍殘留（與 BL1 中橫桿面比前板多出的反投影差異相容，未證實）。
- 固定真值物體的 GC1 靜態模型相容性：根部餘裕中位 1.34 → 2.10 mm、最小 −0.71 → +0.08 mm；淺側中位 5.66 → 4.90 mm、最小 3.10 → 2.43 mm；整體通過 46 → 76／82。
- 接受集合幾乎不變：G0 有中心 85 → 85（各 2 格獨有）、DL2 候選 84 → 83（舊版獨有 2、新版獨有 1）。
解讀限制:
- 兩個同把手開發序列、模擬深度；新版只改像素座標契約，契約本身只有資料相容性證據（渲染器約定未證實）。
- 靜態模型相容性不代表可實際抓取；固定真值物體只用於評估。
- 估計（工具目標生成）誤差界仍未建立；殘留偏差成因未定位。
不能宣稱: 抓取問題已解決、新版可線上替換、偏差已消除、跨物件或實機適用
審查: Codex 核可封存（reviews/20261006_033715_reply.md）；視覺偏差診斷支線到此結束
凍結: results/vision/freeze_pc2.sha256（含新版程式，標為**未來線上替換候選**；舊版與全部結果保留）
補充說明:
- 沒有提高整體候選率：工具目標接受數舊版 84、新版 83；誤差改善與 GC1 通過數增加都是共同接受集合上的結果。
- GC1 通過不等於抓取成功：新版仍有 6 格不通過，原因為 opening_incompatible:finger1:never；opening_incompatible:finger2:never——不是根部餘裕不足；不把全部通過數增加歸因於根部改善。
- 新版最小根部餘裕只有 0.083 mm：尚未加入控制追蹤、運動與其他不確定性，不能據此放行接近或閉爪。
新版狀態: 未來線上替換候選（本包不核可線上替換、重新鎖定、接近或閉爪）
