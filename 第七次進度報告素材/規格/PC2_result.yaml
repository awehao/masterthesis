schema: pc2_result/1
狀態: 在兩個同把手開發序列的 82 格共同工具目標上，候選像素中心契約版本降低了接近軸絕對誤差，並提高靜態模型相容數；但部分影格變差、整體候選數未增加，抓取放行所需的誤差界仍未建立。
程式: evaluation/d1_handle_detect_v2.py、dl2_obs_to_target_v2.py（凍結版複本，只改像素座標契約）；evaluation/pc2_compare.py → results/vision/PC2_compare.json（試跑與正式逐值相同）；圖 16
測試: evaluation/test_pc2_contract.py 9/9（索引→反投影→正投影→floor 往返、斜平面合成深度新版無偏／舊版有偏、負座標 floor 與取樣前判界外、DL2 新版接新版反投影、diff 只限契約處、開發影格前板一致性檢查）
全部去向: 兩群組 186 格全部列於 rows（群組＋影格編號為鍵）；舊版缺列標 missing_old_row（本次 0）
