<text x="120" y="686" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">TCP 目標、底盤位姿</text>
<text x="120" y="727" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">關節姿態與障礙距離</text>
<rect x="514" y="595" width="636" height="184" rx="16" fill="#F3F7FB" stroke="#DCE5EE" stroke-width="2"/>
<rect x="514" y="595" width="6" height="184" rx="0" fill="#148579" stroke="none" stroke-width="2"/>
<text x="538" y="640" font-family="Noto Sans CJK TC, sans-serif" font-size="29" font-weight="700" fill="#148579" text-anchor="start">單一步全身 QP</text>
<text x="538" y="686" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">共同考慮任務誤差、構形偏好</text>
<text x="538" y="727" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">連桿安全與底盤／關節運動限制</text>
<text x="538" y="768" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">在可行速度集合內分配動作</text>
<rect x="1215" y="595" width="285" height="157" rx="16" fill="#F3F7FB" stroke="#DCE5EE" stroke-width="2"/>
<rect x="1215" y="595" width="6" height="157" rx="0" fill="#148579" stroke="none" stroke-width="2"/>
