<text x="1429" y="341" font-family="Noto Sans CJK TC, sans-serif" font-size="28" font-weight="700" fill="#2879B9" text-anchor="start">執行與回授</text>
<text x="1429" y="387" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">底盤＋手臂</text>
