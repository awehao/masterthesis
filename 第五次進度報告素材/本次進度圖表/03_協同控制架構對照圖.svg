<rect x="1565" y="595" width="6" height="157" rx="0" fill="#148579" stroke="none" stroke-width="2"/>
<text x="1589" y="640" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="700" fill="#148579" text-anchor="start">執行與回授</text>
<text x="1589" y="686" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">底盤＋手臂</text>
<text x="1589" y="727" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">9 自由度速度</text>
<polyline points="457,673 502,673" fill="none" stroke="#148579" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a148579)"/>
<polyline points="1158,673 1203,673" fill="none" stroke="#148579" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a148579)"/>
<polyline points="1508,673 1553,673" fill="none" stroke="#148579" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a148579)"/>
<text x="96" y="836" font-family="Noto Sans CJK TC, sans-serif" font-size="28" font-weight="600" fill="#148579" text-anchor="start">主要設定：構形正則權重 μ = 0.03；同一有障礙案例重複 3 次皆完成預抓取。</text>
<rect x="64" y="932" width="1792" height="98" rx="16" fill="#163451" stroke="none" stroke-width="2"/>
<text x="88" y="973" font-family="Noto Sans CJK TC, sans-serif" font-size="29" font-weight="600" fill="white" text-anchor="start">研究發現：安全可行集合內的任務最佳化，有助於重新分配底盤與手臂動作。</text>
<text x="88" y="1009" font-family="Noto Sans CJK TC, sans-serif" font-size="22" font-weight="400" fill="#D3E1EE" text-anchor="start">到達結果同時涉及架構整合與構形權重調整；目前為單步 QP，全身多步 W-GMPC 尚待開發。</text>
<text x="1856" y="1060" font-family="Noto Sans CJK TC, sans-serif" font-size="18" font-weight="400" fill="#607387" text-anchor="end">資料截至 2026-09-10</text>
