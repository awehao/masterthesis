<text x="64" y="122" font-family="Noto Sans CJK TC, sans-serif" font-size="47" font-weight="700" fill="#163451" text-anchor="start">協同控制：在安全可行範圍內共同完成末端任務</text>
<text x="64" y="174" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#607387" text-anchor="start">有障礙案例揭露「安全停住，但末端未到達」；建立整合約束的單步全身 QP 基線。</text>
<rect x="64" y="216" width="1792" height="277" rx="16" fill="#F3F7FB" stroke="none" stroke-width="2"/>
<text x="94" y="262" font-family="Noto Sans CJK TC, sans-serif" font-size="31" font-weight="700" fill="#163451" text-anchor="start">原架構｜先求任務速度，再由安全層修正</text>
