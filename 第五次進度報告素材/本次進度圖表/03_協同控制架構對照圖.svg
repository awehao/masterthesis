<text x="96" y="464" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="600" fill="#CB6B27" text-anchor="start">觀察：底盤受阻後，手臂未接手；末端停在距目標 225.9 mm 處。</text>
<rect x="64" y="518" width="1792" height="357" rx="16" fill="#EDF7F4" stroke="none" stroke-width="2"/>
<text x="94" y="565" font-family="Noto Sans CJK TC, sans-serif" font-size="31" font-weight="700" fill="#148579" text-anchor="start">本期基線｜任務與安全約束整合求解</text>
