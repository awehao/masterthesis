<text x="1239" y="686" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">保留於閉迴路</text>
<text x="1239" y="727" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">屬於基線的一部分</text>
