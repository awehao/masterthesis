<rect x="96" y="546" width="6" height="190" rx="0" fill="#2879B9" stroke="none" stroke-width="2"/>
<text x="120" y="591" font-family="Noto Sans CJK TC, sans-serif" font-size="30" font-weight="700" fill="#2879B9" text-anchor="start">控制迴圈排程修正</text>
<text x="120" y="637" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">原：等待完整 50 ms 後才運算</text>
