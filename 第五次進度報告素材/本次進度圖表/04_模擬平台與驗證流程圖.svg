<text x="64" y="174" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#607387" text-anchor="start">Gazebo 驗證全身預抓取；Isaac Sim 建立導航與影像介面，並修正模擬時間基準。</text>
<rect x="64" y="216" width="871" height="668" rx="16" fill="#F3F7FB" stroke="none" stroke-width="2"/>
