<text x="120" y="396" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">底盤＋手臂同動，追蹤 TCP 位置與姿態</text>
<text x="120" y="437" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">凍結單步 QP、下游濾波器與任務設定</text>
<polyline points="499,490 499,530" fill="none" stroke="#2879B9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a2879B9)"/>
