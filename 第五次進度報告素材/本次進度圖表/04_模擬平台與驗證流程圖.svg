<rect x="997" y="546" width="6" height="190" rx="0" fill="#148579" stroke="none" stroke-width="2"/>
<text x="1021" y="591" font-family="Noto Sans CJK TC, sans-serif" font-size="30" font-weight="700" fill="#148579" text-anchor="start">物理時間與 ROS 時鐘對齊</text>
<text x="1021" y="637" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">統一 physics_dt 與 rendering_dt</text>
<text x="1021" y="678" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">由物理世界時間發布 /clock</text>
<text x="1021" y="719" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">依模擬時間安排感測與渲染更新</text>
<text x="1027" y="806" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#607387" text-anchor="start">修正後重跑</text>
<text x="1027" y="851" font-family="Noto Sans CJK TC, sans-serif" font-size="35" font-weight="700" fill="#148579" text-anchor="start">前方／左側／後方：皆到達</text>
<rect x="64" y="932" width="1792" height="98" rx="16" fill="#163451" stroke="none" stroke-width="2"/>
<text x="88" y="973" font-family="Noto Sans CJK TC, sans-serif" font-size="29" font-weight="600" fill="white" text-anchor="start">本期進度：全身控制基線已凍結；Isaac 初步導航與時間基準驗證完成。</text>
<text x="88" y="1009" font-family="Noto Sans CJK TC, sans-serif" font-size="22" font-weight="400" fill="#D3E1EE" text-anchor="start">Isaac 三方向為靜態場景、手臂保持固定姿態；全身預抓取移植與動態案例重跑仍待完成。</text>
<text x="1856" y="1060" font-family="Noto Sans CJK TC, sans-serif" font-size="18" font-weight="400" fill="#607387" text-anchor="end">資料截至 2026-09-10</text>
