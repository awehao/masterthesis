<text x="120" y="719" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">加速度限制使用實測發布間隔</text>
<text x="126" y="806" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#607387" text-anchor="start">發布間隔中位</text>
<text x="126" y="851" font-family="Noto Sans CJK TC, sans-serif" font-size="40" font-weight="700" fill="#2879B9" text-anchor="start">61.19 ms → 50.0 ms</text>
<rect x="997" y="305" width="827" height="175" rx="16" fill="white" stroke="#DCE5EE" stroke-width="2"/>
<rect x="997" y="305" width="6" height="175" rx="0" fill="#148579" stroke="none" stroke-width="2"/>
<text x="1021" y="350" font-family="Noto Sans CJK TC, sans-serif" font-size="30" font-weight="700" fill="#148579" text-anchor="start">介面接通</text>
<text x="1021" y="396" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">模型、scan、odom、TF、速度命令</text>
<text x="1021" y="437" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">底盤 RGB 影像供觀看與記錄</text>
