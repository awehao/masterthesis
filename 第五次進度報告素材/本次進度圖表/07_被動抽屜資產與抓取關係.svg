<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>被動抽屜資產與兩種抓取關係</title>
<desc>預抓取之後要真的動一個東西；抓取關係分兩版驗證，不混稱。</desc>
<defs>
<marker id="a2879B9" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2879B9"/></marker>
<marker id="a148579" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#148579"/></marker>
<marker id="aCB6B27" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#CB6B27"/></marker>
<marker id="a607387" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#607387"/></marker>
</defs>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="white" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="14" height="1080" rx="0" fill="#163451" stroke="none" stroke-width="2"/>
<text x="64" y="55" font-family="Noto Sans CJK TC, sans-serif" font-size="22" font-weight="400" fill="#607387" text-anchor="start">第五次進度報告  /  本次進度與成果</text>
<text x="1856" y="55" font-family="Noto Sans CJK TC, sans-serif" font-size="24" font-weight="700" fill="#148579" text-anchor="end">07 / 模型</text>
<text x="64" y="122" font-family="Noto Sans CJK TC, sans-serif" font-size="47" font-weight="700" fill="#163451" text-anchor="start">被動抽屜資產與兩種抓取關係</text>
<text x="64" y="174" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#607387" text-anchor="start">預抓取之後要真的動一個東西；抓取關係分兩版驗證，不混稱。</text>
<rect x="64" y="224" width="872" height="268" rx="16" fill="#F3F7FB" stroke="#DCE5EE" stroke-width="2"/>
<rect x="64" y="224" width="6" height="268" rx="0" fill="#CB6B27" stroke="none" stroke-width="2"/>
<text x="88" y="269" font-family="Noto Sans CJK TC, sans-serif" font-size="31" font-weight="700" fill="#CB6B27" text-anchor="start">為什麼另建資產</text>
<text x="88" y="315" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">場景既有 known_obs_12 是實心靜態方塊，</text>
<text x="88" y="356" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">沒有把手、沒有活動自由度。拿它當操作機構，</text>
<text x="88" y="397" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">「開抽屜」就成了沒有機構的宣稱。</text>
<rect x="984" y="224" width="872" height="268" rx="16" fill="#F3F7FB" stroke="#DCE5EE" stroke-width="2"/>
<rect x="984" y="224" width="6" height="268" rx="0" fill="#2879B9" stroke="none" stroke-width="2"/>
<text x="1008" y="269" font-family="Noto Sans CJK TC, sans-serif" font-size="31" font-weight="700" fill="#2879B9" text-anchor="start">抽屜是被動的（讀回驗證）</text>
<text x="1008" y="315" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">滑動關節 drive 的 stiffness / damping /</text>
<text x="1008" y="356" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">maxForce / target 全部為 0；</text>
<text x="1008" y="397" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">抽屜不接收任何位置或速度命令。</text>
<rect x="64" y="530" width="1792" height="66" rx="0" fill="#163451" stroke="none" stroke-width="2"/>
<text x="86" y="574" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="600" fill="white" text-anchor="start">抓取關係</text>
<text x="506" y="574" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="600" fill="white" text-anchor="start">模型意義</text>
<text x="1206" y="574" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="600" fill="white" text-anchor="start">目前狀態</text>
<rect x="64" y="596" width="1792" height="150" rx="0" fill="#F0F7F6" stroke="none" stroke-width="2"/>
<polyline points="64,746 1856,746" fill="none" stroke="#DCE5EE" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="86" y="681.5" font-family="Noto Sans CJK TC, sans-serif" font-size="30" font-weight="400" fill="#23394D" text-anchor="start">理想固定連接</text>
<text x="506" y="662.45" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="600" fill="#148579" text-anchor="start">夾持時刻建立夾爪—抽屜固定關節，</text>
<text x="506" y="698.45" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="600" fill="#148579" text-anchor="start">代表「抓握不會失效」的理想上限</text>
<text x="1206" y="680.8" font-family="Noto Sans CJK TC, sans-serif" font-size="28" font-weight="400" fill="#23394D" text-anchor="start">200 mm 完整操作完成</text>
<rect x="64" y="746" width="1792" height="150" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<polyline points="64,896 1856,896" fill="none" stroke="#DCE5EE" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="86" y="831.5" font-family="Noto Sans CJK TC, sans-serif" font-size="30" font-weight="400" fill="#23394D" text-anchor="start">摩擦夾持</text>
<text x="506" y="812.45" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="600" fill="#148579" text-anchor="start">只有接觸與摩擦，兩指閉合夾住把手；</text>
<text x="506" y="848.45" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="600" fill="#148579" text-anchor="start">抓握能力由實際接觸決定</text>
<text x="1206" y="812.8" font-family="Noto Sans CJK TC, sans-serif" font-size="28" font-weight="400" fill="#23394D" text-anchor="start">靜態雙側夾持通過；</text>
<text x="1206" y="848.8" font-family="Noto Sans CJK TC, sans-serif" font-size="28" font-weight="400" fill="#23394D" text-anchor="start">受控拉動約 17 mm，未達 20 mm</text>
<text x="86" y="895" font-family="Noto Sans CJK TC, sans-serif" font-size="23" font-weight="400" fill="#607387" text-anchor="start">把手 ⌀10 mm 橫桿，尺寸由夾爪幾何與行程需求反推；開度上限 220 mm，讓 200 mm 目標不落在硬限位上。</text>
<rect x="64" y="932" width="1792" height="98" rx="16" fill="#163451" stroke="none" stroke-width="2"/>
<text x="88" y="973" font-family="Noto Sans CJK TC, sans-serif" font-size="29" font-weight="600" fill="white" text-anchor="start">兩種抓取模型分版驗證，結果不互相代替。</text>
<text x="88" y="1009" font-family="Noto Sans CJK TC, sans-serif" font-size="22" font-weight="400" fill="#D3E1EE" text-anchor="start">底盤在本階段由外部固定支撐；不代表輪子靠地面摩擦能承受相同負載。</text>
<text x="1856" y="1060" font-family="Noto Sans CJK TC, sans-serif" font-size="18" font-weight="400" fill="#607387" text-anchor="end">資料截至 2026-09-13</text>
</svg>