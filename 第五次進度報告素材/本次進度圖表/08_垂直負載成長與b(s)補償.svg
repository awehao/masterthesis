<text x="86" y="908" font-family="Noto Sans CJK TC, sans-serif" font-size="23" font-weight="400" fill="#607387" text-anchor="start">資料：drawer_234512_offset200（未補償）與 drawer_065343_ffattach200（補償）的拉開段，每 10 mm 取中位數。</text>
<rect x="64" y="932" width="1792" height="98" rx="16" fill="#163451" stroke="none" stroke-width="2"/>
<text x="88" y="973" font-family="Noto Sans CJK TC, sans-serif" font-size="29" font-weight="600" fill="white" text-anchor="start">修法：路徑相依的前饋致動補償，完全由已量到的偏離反解，不加力回授。</text>
