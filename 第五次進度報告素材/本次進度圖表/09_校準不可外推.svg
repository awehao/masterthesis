<text x="1324" y="657" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">外推到 198 mm 會多補約 1.08 mm ——</text>
<text x="1324" y="698" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">與要消除的偏離本身同量級，</text>
<text x="1324" y="739" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">等於反向製造一個新的偏離。</text>
<text x="86" y="908" font-family="Noto Sans CJK TC, sans-serif" font-size="23" font-weight="400" fill="#607387" text-anchor="start">兩趟獨立無連接校準在重疊區（0–76 mm）的 e⊥z 差異最大 0.0043 mm，校準本身可重現。</text>
<rect x="64" y="932" width="1792" height="98" rx="16" fill="#163451" stroke="none" stroke-width="2"/>
<text x="88" y="973" font-family="Noto Sans CJK TC, sans-serif" font-size="29" font-weight="600" fill="white" text-anchor="start">實測偏離不是線性、會飽和；外推值是實測的 1.96 倍。</text>
<text x="88" y="1009" font-family="Noto Sans CJK TC, sans-serif" font-size="22" font-weight="400" fill="#D3E1EE" text-anchor="start">此結論來自本案例的兩趟校準，不外推到其他路徑或配時。</text>
<text x="1856" y="1060" font-family="Noto Sans CJK TC, sans-serif" font-size="18" font-weight="400" fill="#607387" text-anchor="end">資料截至 2026-09-13</text>
