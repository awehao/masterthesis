<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>摩擦夾持：先補實模型，再對中，才閉合</title>
<desc>只改抓取關係；幾何、行程、容差與停止處置沿用。</desc>
<defs>
<marker id="a2879B9" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#2879B9"/></marker>
<marker id="a148579" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#148579"/></marker>
<marker id="aCB6B27" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#CB6B27"/></marker>
<marker id="a607387" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#607387"/></marker>
</defs>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="white" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="14" height="1080" rx="0" fill="#163451" stroke="none" stroke-width="2"/>
<text x="64" y="55" font-family="Noto Sans CJK TC, sans-serif" font-size="22" font-weight="400" fill="#607387" text-anchor="start">第五次進度報告  /  本次進度與成果</text>
<text x="1856" y="55" font-family="Noto Sans CJK TC, sans-serif" font-size="24" font-weight="700" fill="#148579" text-anchor="end">11 / 進行中</text>
<text x="64" y="122" font-family="Noto Sans CJK TC, sans-serif" font-size="47" font-weight="700" fill="#163451" text-anchor="start">摩擦夾持：先補實模型，再對中，才閉合</text>
<text x="64" y="174" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#607387" text-anchor="start">只改抓取關係；幾何、行程、容差與停止處置沿用。</text>
<rect x="64" y="224" width="872" height="250" rx="16" fill="#F3F7FB" stroke="#DCE5EE" stroke-width="2"/>
<rect x="64" y="224" width="6" height="250" rx="0" fill="#CB6B27" stroke="none" stroke-width="2"/>
<text x="88" y="269" font-family="Noto Sans CJK TC, sans-serif" font-size="30" font-weight="700" fill="#CB6B27" text-anchor="start">查核發現：規格「有寫、沒接」</text>
<text x="88" y="315" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">全場沒有任何接觸摩擦材質（URDF 唯一的 μ</text>
<text x="88" y="356" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">是刻意設為 0 的無摩擦球輪）；</text>
<text x="88" y="397" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">12 N 手指接觸中止也不存在。</text>
<rect x="984" y="224" width="872" height="250" rx="16" fill="#F3F7FB" stroke="#DCE5EE" stroke-width="2"/>
<rect x="984" y="224" width="6" height="250" rx="0" fill="#148579" stroke="none" stroke-width="2"/>
<text x="1008" y="269" font-family="Noto Sans CJK TC, sans-serif" font-size="30" font-weight="700" fill="#148579" text-anchor="start">補上後逐一讀回驗證</text>
<text x="1008" y="315" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">靜／動摩擦分開明訂各 0.8（建模假設）、</text>
<text x="1008" y="356" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">混合規則 min、綁到 3 個碰撞形狀；</text>
<text x="1008" y="397" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">手指出力上限執行期讀回 5.0 N／指。</text>
<rect x="64" y="512" width="1778" height="66" rx="0" fill="#163451" stroke="none" stroke-width="2"/>
<text x="86" y="556" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="600" fill="white" text-anchor="start">對中量（閉合前保持）</text>
<text x="556" y="556" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="600" fill="white" text-anchor="start">修正前</text>
<text x="986" y="556" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="600" fill="white" text-anchor="start">修正後</text>
<text x="1416" y="556" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="600" fill="white" text-anchor="start">判定</text>
<rect x="64" y="578" width="1778" height="104" rx="0" fill="#F0F7F6" stroke="none" stroke-width="2"/>
<polyline points="64,682 1842,682" fill="none" stroke="#DCE5EE" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="86" y="639.8" font-family="Noto Sans CJK TC, sans-serif" font-size="28" font-weight="400" fill="#23394D" text-anchor="start">兩指中心沿閉合軸偏移</text>
<text x="556" y="640.5" font-family="Noto Sans CJK TC, sans-serif" font-size="30" font-weight="600" fill="#148579" text-anchor="start">−1.4376 mm</text>
<text x="986" y="640.5" font-family="Noto Sans CJK TC, sans-serif" font-size="30" font-weight="400" fill="#23394D" text-anchor="start">−0.0021 mm</text>
<text x="1416" y="639.45" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">≤ 0.30 mm 通過</text>
<rect x="64" y="682" width="1778" height="104" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/>
<polyline points="64,786 1842,786" fill="none" stroke="#DCE5EE" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="86" y="743.8" font-family="Noto Sans CJK TC, sans-serif" font-size="28" font-weight="400" fill="#23394D" text-anchor="start">兩側指墊間隙差</text>
<text x="556" y="744.5" font-family="Noto Sans CJK TC, sans-serif" font-size="30" font-weight="600" fill="#148579" text-anchor="start">−2.1408 mm</text>
<text x="986" y="744.5" font-family="Noto Sans CJK TC, sans-serif" font-size="30" font-weight="400" fill="#23394D" text-anchor="start">−0.0031 mm</text>
<text x="1416" y="743.45" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">≤ 0.60 mm 通過</text>
<rect x="64" y="786" width="1778" height="104" rx="0" fill="#F3F7FB" stroke="none" stroke-width="2"/>
<polyline points="64,890 1842,890" fill="none" stroke="#DCE5EE" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="86" y="847.8" font-family="Noto Sans CJK TC, sans-serif" font-size="28" font-weight="400" fill="#23394D" text-anchor="start">工具姿態 vs 設計</text>
<text x="556" y="848.5" font-family="Noto Sans CJK TC, sans-serif" font-size="30" font-weight="600" fill="#148579" text-anchor="start">0.20283°</text>
<text x="986" y="848.5" font-family="Noto Sans CJK TC, sans-serif" font-size="30" font-weight="400" fill="#23394D" text-anchor="start">0.00033°</text>
<text x="1416" y="847.45" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">—</text>
<text x="86" y="862" font-family="Noto Sans CJK TC, sans-serif" font-size="24" font-weight="600" fill="#23394D" text-anchor="start">三層核對定位出偏差層級：設計位姿對中 0.0000 mm、命令對中 +0.0011 mm、實際保持姿態偏 1.4376 mm</text>
<text x="86" y="898" font-family="Noto Sans CJK TC, sans-serif" font-size="23" font-weight="400" fill="#607387" text-anchor="start">⇒ 是穩態關節追蹤誤差（0.002150 rad，幾乎全在 joint2），以命令層修正一次補上；目標幾何未動。</text>
<rect x="64" y="932" width="1792" height="98" rx="16" fill="#163451" stroke="none" stroke-width="2"/>
<text x="88" y="973" font-family="Noto Sans CJK TC, sans-serif" font-size="29" font-weight="600" fill="white" text-anchor="start">靜態雙側夾持通過：連續 2.0 s、兩指接觸率 100 %、把手相對夾爪位移 0.0450 mm。</text>
<text x="88" y="1009" font-family="Noto Sans CJK TC, sans-serif" font-size="22" font-weight="400" fill="#D3E1EE" text-anchor="start">修正是該工作點的經驗估計，不是已辨識的重力補償；換姿態或配時不保證有效。</text>
<text x="1856" y="1060" font-family="Noto Sans CJK TC, sans-serif" font-size="18" font-weight="400" fill="#607387" text-anchor="end">資料截至 2026-09-13</text>
</svg>