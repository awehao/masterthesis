<text x="1274" y="565" font-family="Noto Sans CJK TC, sans-serif" font-size="28" font-weight="700" fill="#CB6B27" text-anchor="start">放慢配時的效果</text>
<text x="1274" y="611" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">共同開度區間上端滑脫 −31.2 %，</text>
<text x="1274" y="652" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">但單位滑脫率反而略升</text>
<text x="1274" y="693" font-family="Noto Sans CJK TC, sans-serif" font-size="27" font-weight="400" fill="#23394D" text-anchor="start">（0.06128 → 0.07213 mm/mm）。</text>
<text x="86" y="872" font-family="Noto Sans CJK TC, sans-serif" font-size="24" font-weight="600" fill="#23394D" text-anchor="start">不是橫向跑偏、也不是伴隨轉動失去包覆 —— 是純粹沿拉動方向的相對滑動（相對轉角峰值 0.199°，門檻 2.0°）。</text>
<text x="86" y="906" font-family="Noto Sans CJK TC, sans-serif" font-size="23" font-weight="400" fill="#607387" text-anchor="start">力與溫度保護未觸發（手指 11.4/12.0、手腕 15.0/30.0、溫度 81.9/92.0）；滑脫保護已觸發。</text>
<rect x="64" y="932" width="1792" height="98" rx="16" fill="#163451" stroke="none" stroke-width="2"/>
<text x="88" y="973" font-family="Noto Sans CJK TC, sans-serif" font-size="29" font-weight="600" fill="white" text-anchor="start">摩擦夾持在無固定連接下受控帶動抽屜 17.117 mm；20 mm 未完成。</text>
<text x="88" y="1009" font-family="Noto Sans CJK TC, sans-serif" font-size="22" font-weight="400" fill="#D3E1EE" text-anchor="start">依裁決在此設停止點，不再降速；下一步轉向底盤—手臂協同，再回接摩擦。</text>
<text x="1856" y="1060" font-family="Noto Sans CJK TC, sans-serif" font-size="18" font-weight="400" fill="#607387" text-anchor="end">資料截至 2026-09-13</text>
