/wheel_limit_guard:
  ros__parameters:
    assume_stopped_at_start: true
    cmd_in_topic: /cmd_vel_smoothed
    cmd_out_topic: /cmd_vel
    dt_max: 0.5
    input_timeout: 0.25
    odom_topic: /odom
    publish_rate: 20.0
    start_type_description_service: true
    stopped_count: 10
    stopped_speed: 0.02
    use_sim_time: true
    wheel_a_max: 125.0
    wheel_base_L: 0.245
    wheel_radius: 0.05
    wheel_w_max: 5.55

