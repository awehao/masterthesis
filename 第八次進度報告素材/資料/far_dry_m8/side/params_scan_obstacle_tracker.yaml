/scan_obstacle_tracker:
  ros__parameters:
    assoc_chi2: 9.21
    assoc_gate: 0.8
    assoc_gate_max: 1.2
    assoc_maha: false
    assoc_predict: false
    cluster_gap: 0.3
    coast_publish_s: 0.0
    coast_radius_growth: 0.0
    default_radius: 0.25
    fragment_gate: 1.0
    fragment_merge: false
    global_frame: map
    kf_init_vel_var: 1.0
    kf_sigma_meas: 0.05
    kf_sigma_pos: 0.01
    kf_sigma_vel: 0.4
    map_topic: /map
    max_cluster_radius: 1.2
    min_cluster_pts: 2
    min_net_speed: 0.05
    min_track_age: 3
    min_track_speed: 0.1
    output_topic: /gmpc/obstacles
    publish_frame: map
    publish_markers: true
    release_track_speed: 0.1
    scan_topic: /scan
    start_type_description_service: true
    static_cbf_enable: true
    static_cbf_max: 4
    static_cbf_radius: 0.05
    static_cbf_range: 1.2
    static_cbf_topic: /gmpc/static_obstacles
    static_inflation: 0.5
    static_keep_velocity: false
    static_window_s: 2.0
    surf_pts_max: 4
    surf_pts_min_sep: 0.2
    surf_pts_range: 2.5
    track_release_frames: 0
    track_timeout: 0.6
    use_map_subtraction: true
    use_sim_time: true
    young_track_range: 2.5

