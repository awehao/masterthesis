/goal_to_plan_relay:
  ros__parameters:
    action_name: compute_path_to_pose
    global_frame: map
    goal_topic: /goal_pose
    plan_topic: /plan
    planner_id: GridBased
    replan_goal_tolerance: 0.3
    replan_period: 1.0
    robot_base_frame: base_footprint
    server_timeout: 5.0
    start_type_description_service: true
    use_sim_time: true

