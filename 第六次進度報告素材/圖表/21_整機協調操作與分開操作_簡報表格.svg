<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="630" viewBox="0 0 1600 630">
<title>整機協調操作與分開操作比較</title>
<rect width="1600" height="630" fill="white"/>
<g font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif">
<text x="55" y="65" font-size="39" font-weight="700" fill="#293440">整機協調操作與分開操作：完整任務比較</text>
<text x="55" y="112" font-size="24" fill="#647486">任務：抽屜開啟 200 mm → 關閉 → 返回起點；每組 3 趟，先後交錯配對</text>
<rect x="55" y="145" width="1490" height="68" fill="#edf3f9"/>
<rect x="705" y="145" width="420" height="68" fill="#dcefe9"/>
<g font-size="29" font-weight="700" text-anchor="middle"><text x="370" y="189" fill="#293440">比較項目</text><text x="915" y="189" fill="#00877b">整機協調操作</text><text x="1335" y="189" fill="#526678">分開操作</text></g>
<g fill="#f6f9fc"><rect x="55" y="283" width="1490" height="70"/><rect x="55" y="423" width="1490" height="70"/></g>
<g stroke="#d9e3ec"><path d="M55 213H1545M55 283H1545M55 353H1545M55 423H1545M55 493H1545"/><path d="M705 145V493M1125 145V493"/></g>
<g font-size="26" fill="#293440">
<text x="77" y="257">操作策略</text><text x="77" y="327">任務判準通過</text><text x="77" y="397">平均完整任務時間（s）</text><text x="77" y="467">各趟最大夾持漂移的範圍（mm）</text>
</g>
<g text-anchor="middle" font-size="28" fill="#293440">
<text x="915" y="257" font-size="23">移動中夾持、整機協同開關</text><text x="1335" y="257" font-size="23">先停車、手臂完成開關</text>
<text x="915" y="327">3/3</text><text x="1335" y="327">3/3</text>
<text x="915" y="397" font-weight="700" fill="#00877b">80.72</text><text x="1335" y="397">93.62</text>
<text x="915" y="467">0.057–1.583</text><text x="1335" y="467">0.092–0.131</text>
</g>
<text x="55" y="541" font-size="27" font-weight="700" fill="#00877b">本批三對均縮短 12.51–13.19 s，相對分開操作縮短 13.38–14.05%。</text>
<text x="55" y="580" font-size="20" fill="#647486">計時包含入場、等待、操作與返回；分開操作三趟均符合全窗停車判準。</text>
<text x="55" y="609" font-size="20" fill="#647486">兩套完整策略比較；主要收益來自入場與交接。停車收斂仍有改善空間；漂移配對方向不一致，不主張全面品質優勢。</text>
</g></svg>
