<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="639" viewBox="0 0 1600 639">
<title>單步預測與多步預測比較</title>
<rect width="1600" height="639" fill="white"/>
<g font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif">
<text x="55" y="65" font-size="39" font-weight="700" fill="#293440">單步預測與多步預測：追蹤與命令平順性</text>
<text x="55" y="112" font-size="24" fill="#647486">同一整機協調操作任務、增廣模型與求解核心；控制週期 50 ms，每組 3 趟</text>
<rect x="55" y="145" width="1490" height="82" fill="#edf3f9"/>
<rect x="1125" y="145" width="420" height="82" fill="#e4edf9"/>
<g font-size="29" font-weight="700" text-anchor="middle"><text x="370" y="192" fill="#293440">比較項目</text><text x="915" y="180" fill="#526678">單步預測</text><text x="1335" y="180" fill="#2277b4">多步預測</text></g>
<g font-size="20" text-anchor="middle" fill="#647486"><text x="915" y="212">1 步／預測窗 0.05 s</text><text x="1335" y="212">5 步／預測窗 0.25 s</text></g>
<g fill="#f6f9fc"><rect x="55" y="289" width="1490" height="62"/><rect x="55" y="413" width="1490" height="62"/></g>
<g stroke="#d9e3ec"><path d="M55 227H1545M55 289H1545M55 351H1545M55 413H1545M55 475H1545"/><path d="M705 145V475M1125 145V475"/></g>
<g font-size="25" fill="#293440"><text x="77" y="267">任務判準通過</text><text x="77" y="329">求解節點控制窗（s）</text><text x="77" y="391">整控制窗 TCP 位置誤差 p95（mm）</text><text x="77" y="453">手臂命令相鄰反轉率（次/s）</text></g>
<g text-anchor="middle" font-size="28" fill="#293440"><text x="915" y="267">3/3</text><text x="1335" y="267">3/3</text><text x="915" y="329">37.41–59.43</text><text x="1335" y="329">30.10–35.58</text><text x="915" y="391">10.78–16.64</text><text x="1335" y="391">7.27–9.75</text><text x="915" y="453">26.01–28.42</text><text x="1335" y="453">1.12–2.33</text></g>
<text x="55" y="525" font-size="26" font-weight="700" fill="#2277b4">本批三對中，多步預測的控制窗較短、整體位置誤差與手臂命令反轉率較低。</text>
<text x="55" y="565" font-size="20" fill="#647486">數值為各組三趟的最小–最大範圍；控制窗不是完整任務時間，整體優勢不代表每個相位都較佳。</text>
<text x="55" y="595" font-size="20" fill="#647486">步數也改變終端加權與累計成本；固定先後順序及主機環境干擾未排除，不做純前瞻或統計顯著性宣稱。</text>
</g></svg>
