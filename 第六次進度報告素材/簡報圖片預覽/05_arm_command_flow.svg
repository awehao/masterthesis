<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="320" viewBox="0 0 1600 320">
  <title>手臂命令執行流程</title>
  <desc>手臂速率命令經積分成位置設定點，再由位置控制器追蹤，實際關節角經正向運動學得到TCP位姿。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#217bb3" stroke-width="1.8"/></marker></defs>
  <g font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif">
    <g stroke-width="2">
      <rect x="28" y="85" width="330" height="155" rx="16" fill="#f0f6ff" stroke="#a6c8e8"/>
      <rect x="432" y="85" width="330" height="155" rx="16" fill="#f0f6ff" stroke="#a6c8e8"/>
      <rect x="836" y="85" width="330" height="155" rx="16" fill="#f0f6ff" stroke="#a6c8e8"/>
      <rect x="1240" y="85" width="330" height="155" rx="16" fill="#edf8f5" stroke="#9acfc5"/>
    </g>
    <g fill="#263744" font-size="34" font-weight="600" text-anchor="middle">
      <text x="193" y="150">手臂速率命令</text>
      <text x="597" y="150">位置設定點</text>
      <text x="1001" y="150">實際關節角</text>
      <text x="1405" y="150">TCP 位姿</text>
    </g>
    <g fill="#217bb3" font-size="29" text-anchor="middle">
      <text x="193" y="203">uₐ</text>
      <text x="597" y="203">s</text>
      <text x="1001" y="203">qₐ</text>
      <text x="1405" y="203" fill="#008d80">T<tspan font-size="20" dy="6">TCP</tspan></text>
    </g>
    <g fill="none" stroke="#217bb3" stroke-width="3" marker-end="url(#arrow)">
      <path d="M368 163H416"/><path d="M772 163H820"/><path d="M1176 163H1224"/>
    </g>
    <g fill="#52687a" font-size="24" text-anchor="middle">
      <text x="395" y="62">積分</text>
      <text x="799" y="62">位置控制器追蹤</text>
      <text x="1203" y="62">正向運動學</text>
    </g>
  </g>
</svg>
