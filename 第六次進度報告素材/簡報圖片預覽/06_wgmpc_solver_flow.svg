<rect x="480" y="577" width="760" height="40" fill="white"/>
<text x="860" y="605" text-anchor="middle" font-size="25" fill="#008f82">狀態回授：新量測 q、s 與實際套用命令</text>
<text x="800" y="652" text-anchor="middle" font-size="19" fill="#74828f">每輪預測窗內使用同一 TCP 目標；此圖不表示接觸力預測或全環境避碰保證。</text>
</g></svg>
