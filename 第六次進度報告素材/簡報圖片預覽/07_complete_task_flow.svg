<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="470" viewBox="0 0 1600 470">
<title>完整移動中抽屜操作任務流程</title><desc>導航減速交棒、展開對準夾持、開啟與關閉抽屜、放開退開收臂並交還導航返回。</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#247fb8" stroke-width="1.6"/></marker></defs>
<g font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif">
<g stroke-width="2"><rect x="25" y="58" width="330" height="250" rx="18" fill="#f1f7ff" stroke="#abcde7"/><rect x="425" y="58" width="330" height="250" rx="18" fill="#f7f0f9" stroke="#c7a1cf"/><rect x="825" y="58" width="330" height="250" rx="18" fill="#eef8f5" stroke="#9ccfc4"/><rect x="1225" y="58" width="350" height="250" rx="18" fill="#f1f7ff" stroke="#abcde7"/></g>
<g text-anchor="middle" font-size="32" font-weight="700"><text x="190" y="113" fill="#227fb9">① 前往與接手</text><text x="590" y="113" fill="#823391">② 展開與抓取</text><text x="990" y="113" fill="#008e81">③ 抽屜開關</text><text x="1400" y="113" fill="#227fb9">④ 退出與返回</text></g>
<g text-anchor="middle" font-size="27" fill="#2b3d4c"><text x="190" y="170">導航接近操作區</text><text x="190" y="218">減速至全身速度框</text><text x="190" y="266">滾動交棒給全身</text><text x="590" y="170">展開手臂</text><text x="590" y="218">對準／接近把手</text><text x="590" y="266">閉合手指、確認夾持</text><text x="990" y="170">拉開 200 mm → 保持</text><text x="990" y="218">推回關閉帶 → 保持</text><text x="990" y="266">底盤與手臂協同分擔</text><text x="1400" y="162">放開把手、退開</text><text x="1400" y="203">收臂、交還導航</text><text x="1400" y="244">返回起點</text></g>
<g fill="none" stroke="#247fb8" stroke-width="3.5" marker-end="url(#arr)"><path d="M365 225H410"/><path d="M765 225H810"/><path d="M1165 225H1210"/></g>
<rect x="25" y="342" width="1550" height="64" rx="10" fill="#f1f7f6"/>
<text x="800" y="383" text-anchor="middle" fill="#008b7f" font-size="26">MotM 重點：移動中接近與夾持，再以底盤＋手臂共同完成開關。</text>
<text x="800" y="443" text-anchor="middle" fill="#75818c" font-size="20">定位與把手目標使用模擬真值；保持與反向時允許近零速度，不表示「全程永不停車」。</text>
</g></svg>
