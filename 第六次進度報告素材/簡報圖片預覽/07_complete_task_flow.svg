<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="510" viewBox="0 0 1600 510">
<title>完整移動中抽屜操作任務流程</title><desc>導航減速交棒、展開對準夾持、開啟與關閉抽屜、放開退開收臂並交還導航返回。導航與返回由GMPC；對準、接近與抽屜操作由W-GMPC。</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#247fb8" stroke-width="1.6"/></marker></defs>
<g font-family="Noto Sans CJK TC, Noto Sans CJK JP, sans-serif">
<g stroke-width="2"><rect x="30" y="58" width="340" height="290" rx="18" fill="#f1f7ff" stroke="#abcde7"/><rect x="430" y="58" width="340" height="290" rx="18" fill="#f7f0f9" stroke="#c7a1cf"/><rect x="830" y="58" width="340" height="290" rx="18" fill="#eef8f5" stroke="#9ccfc4"/><rect x="1230" y="58" width="340" height="290" rx="18" fill="#f1f7ff" stroke="#abcde7"/></g>
<g text-anchor="middle" font-size="28" font-weight="700"><text x="200" y="113" fill="#227fb9">① 導航與控制權交接</text><text x="600" y="113" fill="#823391">② 預抓取與夾持建立</text><text x="1000" y="113" fill="#008e81">③ 協同開啟與關閉</text><text x="1400" y="113" fill="#227fb9">④ 操作退出與導航返回</text></g>
<g text-anchor="middle" font-size="26" fill="#2b3d4c"><text x="200" y="170">路徑追蹤至操作區</text><text x="200" y="218">接近減速與速度匹配</text><text x="200" y="266">導航—全身控制權轉移</text><text x="600" y="170">手臂展開與位姿調整</text><text x="600" y="218">TCP 位姿追蹤與接近</text><text x="600" y="266">夾爪閉合與夾持確認</text><text x="1000" y="170">開啟至 200 mm 並保持</text><text x="1000" y="218">關閉至判定區間並保持</text><text x="1000" y="266">底盤—手臂聯合控制</text><text x="1400" y="170">夾持解除與末端退離</text><text x="1400" y="218">手臂收攏與控制權交還</text><text x="1400" y="266">回程路徑追蹤至起點</text></g>
<g fill="none" stroke="#247fb8" stroke-width="3.5" marker-end="url(#arr)"><path d="M379 218H420"/><path d="M779 218H820"/><path d="M1179 218H1220"/></g>
<g text-anchor="middle" font-size="23" font-weight="600"><text x="200" y="319" fill="#227fb9">導航控制：GMPC</text><text x="600" y="319" fill="#823391">位姿追蹤：W-GMPC</text><text x="1000" y="319" fill="#008e81">操作控制：W-GMPC</text><text x="1400" y="319" fill="#227fb9">返回控制：GMPC</text></g>
<rect x="25" y="382" width="1550" height="64" rx="10" fill="#f1f7f6"/>
<text x="800" y="423" text-anchor="middle" fill="#008b7f" font-size="26">整合策略：滾動控制權交接、移動中夾持與底盤—手臂協同操作。</text>
<text x="800" y="483" text-anchor="middle" fill="#75818c" font-size="20">定位與把手目標採模擬真值；保持及運動反向階段允許近零速度。</text>
</g></svg>
