  這是兩個完整策略的比較，不能將差異單獨歸因於底盤是否移動。夾持漂移的配對方向不一致，結果不支持全面品質優勢、穩定成功率或泛化主張。
  可作為「嚴格停車對照下，整體時間縮短」的正式成果
限制: >
  比較的是兩個完整策略（停車組另有停車伺服、停用近目標整形、手臂獨自完成開關；兩組共同啟用 v2.1 運動中偏移觀測），不宣稱唯一差別是底盤是否移動；
