# MotM 整體流程時間改善：計畫草稿（待 Codex 審查；未實作、未開跑）
# 2026-10-05。起因：Howard 指示「要解決 MotM 整體流程執行時間應該要比較短的問題」
schema: motm_speed_plan/1
現況（b6 公平對照，各 3 趟，全程＝開始移動 → DONE）: '停車 77.7 ± 1.2 s；MotM 80.2 ± 1.7 s（MotM 慢 2.5 s）'
時間拆解（b6 各 3 趟平均）:
  開始移動_到_ALIGN: '停車 24.24、MotM 21.96 s（MotM 快 2.3 s：底盤不停直接接進對位）'
  ALIGN_起點不同: '進 ALIGN 時底盤離停位：MotM 約 96 mm（仍在接近）、停車約 9 mm ⇒ ALIGN 時長不能直接比'
  開始移動_到_ENGAGE: '停車 27.6、MotM 28.4 s（MotM 慢 0.8 s：末段 √ 剖面＋4 mm/s 蠕行＋軟啟動／前置穩定）'
  RETREAT: '停車 0.53、MotM 1.89 s（+1.36 s：倒退 8 mm/s＋退開量斜坡）'
  RESTOW: '停車 6.23、MotM 6.98 s（+0.76 s）'
  NAVIGATE_HOME: 'MotM 少 0.45 s'
  OPEN／CLOSE／保持: '幾乎相同（受拉速與保持 2 s 判準限制，兩者共用）'
目標: '在不放寬任何限制與判準下，MotM 全程短於停車（事前定：配對差 MotM − 停車 < 0，三對同向）'

候選改動（依預期收益與風險排序；每項分開驗證，不一次全改）:
  T1_收臂與回程重疊:
    內容: 'RESTOW 不再等底盤：退開完成後即交還導航回程，手臂同時以關節空間收臂（MotM 的「不停」延伸到收尾）'
    預期: '最多省約 6–7 s（RESTOW 幾乎整段與回程重疊）'
    需要: '執行層同時接受「底盤來自導航、手臂來自收臂」的雙來源（dual_source_executor 目前是整機切換）；收臂軌跡在底盤移動時的淨空核對'
    風險: '底盤以導航速度移動時手臂仍在外伸；需離線核對收臂掃掠不碰櫃體與房間物件；第一版限制底盤速度至既有低速界限內'
  T2_退開加速:
    內容: '倒退速度 8 mm/s → 在既有低速介面界限（0.035 m/s）內提高，退開量斜坡縮短'
    預期: '約 1 s'
    風險: '放開後立即倒退的手指刮把手；以接觸配對量測核對'
  T3_接近末段:
    內容: '蠕行 4 mm/s、前置穩定 0.5 s、軟啟動 w_vref_pre 0.3 的必要性重估（啟動擺盪根因＝sim ROS 佇列積壓已修）'
    預期: '約 0.5–1 s'
    風險: '當初加軟啟動是為了啟動擺盪與碰撞（92.7 N）；改動前後都量啟動 4 s 的 TCP 擺盪與接觸力'
固定（不改）: 'W-GMPC 權重、速度／加速度／輪級／關節限制、抓取幾何、夾持與開關判準（S1–S6）、熱中止 92 °C'
驗證方式:
  開發: '每項先 1–2 趟功能確認（不計入），看是否破壞 S1–S6、停頓、接觸力'
  正式: '凍結後 MotM（新配置）與停車各 3 趟、交錯執行（M、P、M、P…），全程時間配對差；同時報 S1–S6、不允許停頓、非預期接觸、啟動擺盪、最大接觸力'
  不混入: 'C0／C1a 的 H1／H5 結果是舊配置，保留不動；新配置另建批次與凍結'
與先前排程的關係: 'Codex 上輪排定下一步為 WG4-B 規格；Howard 現在指示 MotM 時間優先 ⇒ 本計畫先行，WG4-B 規格順延'
