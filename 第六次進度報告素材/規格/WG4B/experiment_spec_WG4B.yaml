# ================================================================ 1 B1 完整成本式
決策變數: 'u ∈ R⁹，**本體座標**（與 P 相同：u = [vx_b, vy_b, ω, q̇₁..q̇₆]）；輸出時 body→world 與 P 同一函式'
Jacobian: 'J_b = J_w · diag(R(θ), 1, I₆)：運動學模組對世界座標底盤欄的 Jacobian 轉成本體座標（R(θ) 為底盤航向旋轉）'
成本: >
  min_u  ‖J_b u − e‖²                                   （任務項；e = [kp_p·e_p ; kp_r·e_r]，e_p、e_r 依凍結 B 的 v_task／w_task 截斷）
       + μ²‖u_arm − v_post‖²                            （凍結 B 的姿態回復項；v_post = kp_post(q_pref − q_arm) + k_limit·push）
       + λ²‖u ⊘ w‖²                                     （凍結 B 的阻尼；w_base = base_weight、w_arm = 1）
       + w_vref‖(u_base − v_ref) ⊘ vmax_base‖²          （協同：與 P 的 coord_cost 同一式子、同一逐軸正規化、本體座標）
       + w_qn‖q_arm + dt·u_arm − q_nom‖²                （協同：P 罰預測關節角與 q_nom；B1 用單步運動學形式）
μ項處理: >
  協同設定有效、含 q_nom 且 w_qn > 0 的相位：**整個 μ 項關閉**（姿態回復與限位勢能 push 都不用），避免同時拉向兩個姿態；
  關節界只由硬限制（§2）與執行端保護處理。其他情形（無 q_nom、協同關閉或過期）：μ 項照凍結原型（μ = 0.03、kp_post 1.2、
  k_limit 1.5、limit_margin 0.35、push 以 LITE6_SAFE 界計算），q_pref 改用**抽屜任務的展開完成參考構型** Q_GRASP =
  [-0.0321, 0.9177, 1.4853, -0.3580, -1.0325, -1.3813]（來源 evaluation/drawer_wholebody_node.py:199；mt_b1 各趟 wholebody.json
  的 q_grasp 同值）。**不用** named_pose('pregrasp_reference')（舊箱體案例，與特定目標幾何綁定）；不改 arm_initial_pose.yaml。
  每輪記錄 μ 開關與原因（qnom_active／no_qnom／coord_off／coord_stale）
協同欄位對照:
  w_vref_v_ref: '使用（同一式子）'
  w_qn_q_nom: '映射（單步運動學形式；有 q_nom 時關閉 μ 項）'
  w_a: '不適用（P 的命令變化率權重；B1 由加速度框與阻尼處理）'
  w_p: '不適用（P 的位置追蹤權重；B1 的任務增益是 kp_p，語意不同）'
  過期處理: '與 P 相同的協同設定年齡上限 coord_max_age_s 0.5；過期 ⇒ 協同兩項歸零、μ 項回到無 q_nom 的狀態'

# ================================================================ 2 限制與輸出處理
限制（由目前狀態建立；數值同 P 的 WGMPCConfig，但不搬增廣模型的限制建構）:
  速度框: '|u_i| ≤ vmax_i（vmax() 同 P）'
  加速度框: '|u − u_prev| ≤ amax·dt（amax() 同 P；u_prev = 實際套用的上一筆，與 P 同一來源）'
  關節_實測: 'q_arm + dt·u_arm ∈ [LITE6_SAFE.lower + joint_margin, LITE6_SAFE.upper − joint_margin]（同 P 的界集合與 joint_margin 0.05）'
  關節_設定點: 's_meas + dt·u_arm ∈ 同一有效限位（執行端積分的是設定點）。s_meas 取同時刻配對快照；缺失或非有限 ⇒ 本輪不求解、不發布（不以實測角代替）。不涵蓋延遲期間的在途風險；執行端拒寫保護照常'
  輪級: '單步輪速與輪加速度限制（wheel_radius、wheel_a_max 同 P；由 u_base 的輪逆運動學）'
  執行端: '下游低速介面界限、輪級 λ、命令鏈保護同一執行層（兩組相同）'
近目標整形: '兩組共用 wgmpc_core_sp.shape_near_target（γ = 1.0、tol_p = reach_pos_m 0.005、tol_r = reach_rot_rad 0.02、deadband 0，皆取自 mt_b1 實錄 align_solver.json；同實際套用 u_prev）；分別記錄原始 QP 解、整形後、實際套用'
延遲: 'B1 不做延遲補償（P 的結構特性）；以量測狀態直接求解'
求解器: '每輪冷啟動（無暖啟動狀態）；OSQP eps_abs = eps_rel = 1e-7、max_iter 50000、polish；只接受 solved，並以未縮放原始限制核對殘差 ≤ 1e-6（同 P 的接受規則）。與凍結原型的 eps 1e-6、接受 solved_inaccurate 不同 —— 取較嚴者；失敗 ⇒ 本輪不發布、計入 n_no_sol'

# ================================================================ 3 任務版本
任務: >
  B1、P 都用目前 **mt_b1 的共同任務配置**（MotM：--standoff-m 0.03 --pre-ramp-mps 0.03 --pre-settle-s 0.5 --restow-mode sync
  --approach-rate 0.02 --motm-w-qn 0.8 --motm-w-vref-pre 0.3 --motm-retreat-rate 0.05、MOTM_A_REF 0.004；已對 runs/mt_b1_01_M 的 task.json 核對）；P 保留既有 H5 核心設定。
  兩組同版 A0、任務與執行程式；另立凍結 freeze_wg4b，不動 C0／C1a／mt_b1 封存

# ================================================================ 4 調參預算與選擇規則（事前登錄）
預算: '**最多 3 趟，包含第一趟功能確認**；不另加'
可調: '只有 kp（kp_p = kp_r 同值）；其餘全部固定在凍結原型值（μ 0.03、λ = damping 0.06、base_weight 3.0、kp_post 1.2、k_limit 1.5、limit_margin 0.35、v_task／w_task 截斷）與上式的協同項定義'
候選順序: 'kp = 1.0（凍結值）→ 2.0 → 0.5'
選擇規則: >
  依序試；第一個「完成全流程（S1–S6 全部 PASS）且無不允許停頓」的候選即選定、停止調參。三個都不符 ⇒ 依
  「S1–S6 PASS 數（NA 不算 PASS）多者 → 不允許停頓數少者」排序；仍同分 ⇒ 按**事前候選順序**（1.0 → 2.0 → 0.5）取前者。
  **不以全程時間決勝**（失敗越早時間越短，會獎勵提早中止）。仍照正式排程比較並報告失敗／停頓，不延長預算。
  選擇只看 B1 自身結果，不看 P
調參趟: '不計入正式比較，結果全部保留'

# ================================================================ 正式比較
排程: 'B1、P 各 3 趟，順序 B、P、P、B、B、P；同版本、同環境、交替先後'
指標: '同 C0：S1–S6、整窗追蹤、相鄰反轉、命令變化（原始 QP 解與整形後分列）、停頓、夾持品質（S4 主表）、限位餘裕、計算時間；全程時間另列'
結論規則: '配對差三對全列；失敗趟納入結果（不只畫成功配對）；n = 3 只支持本任務、本配置下的探索性架構比較，不支持成功率、顯著性或跨任務泛化；B1 較差或較好都報；不推論多步預測本身的效果'

# ================================================================ 實作範圍
實作: >
  求解式放在新模組 `evaluation/wg4b_b1_core.py`（純函式，可離線測）；節點沿用 wgmpc_wg2_node，加 `--solver-kind {wgmpc,b1}`
  （預設 wgmpc ⇒ P 一位元不變）。b1 時：不做延遲預測、不用增廣模型與偏移估計，其餘介面話題、時槽、到達保持、A0 停止語意、
  shape_near_target、紀錄格式全部共用。運行器以 SOLVER=B 傳入。不改 W-GMPC 控制律、任務節點、相位機、執行層
重播輸入:
  每輪: 'q_meas、s_meas、u_prev（與來源）、實際使用的 dt、目標 T 與來源／年齡、協同設定（解析後）與來源／年齡、μ 開關與原因、原始 QP 解、整形係數與原因、發布命令、OSQP 狀態／迭代、各限制區塊殘差'
  每趟一次: '完整 B1 參數（kp、μ、λ、base_weight、kp_post、k_limit、limit_margin、v_task、w_task、q_pref 與來源）、限制數值（vmax、amax、joint_margin、輪級）、整形參數（γ、tol、deadband）、完整 OSQP 設定'
離線測試: '同狀態下：所有限制區塊滿足（未縮放）；指定靜止合法案例（u_prev = 0、關節在界內）時 u = 0 可行；協同兩項的梯度方向；μ 開關邏輯（四種原因）；本體／世界座標轉換（J_b u 與 J_w B u 一致）；s_meas 缺失 ⇒ 拒絕；重播逐位元；P 預設路徑不受影響'
