實作:
  時間匹配: >
    每物理步後記（模擬時間、相機世界位姿、把手真值位置）；新影格以 rendering_time 找同一時刻的姿態歷史，
    找不到即拒絕（不以讀取當下的時間／姿態補戳）。ROS 戳＝擷取時間、/tf 姿態＝擷取時刻姿態
  取樣: 'Camera frequency = 5 Hz（模擬時間）；存檔與發布都依此'
  重播: '--wrist-replay：逐步套用實錄的底盤、手臂、手指與抽屜開度（與既有重播模式同一做法），每步算圖'
結果:
  影格: '64 個新影格（rendering_time 嚴格遞增、不重複）；拒絕 1（暖機期影格，擷取時刻不在姿態歷史 ⇒ 正確拒絕）'
  取樣: '設定 5 Hz、實測 4.82 Hz（間隔 0.20–0.21 s）；0.21 s 間隔的機制**尚未核實**（0.20／0.01 本是整數，不歸因於取整）'
  讀取延遲: '讀取 − 擷取 = 20 ms（兩個物理步），64 格一致 ⇒ 若照舊用讀取當下的姿態，就是 20 ms 錯配'
  姿態時刻: '|姿態歷史時刻 − rendering_time| 最大 3.1e-7 s（float32 時間精度）'
  ROS: '三話題同節點回讀各 64 則'
  負載: 'world.step(render=True)（**含物理與算圖**）每步牆鐘 p50 17.3、p95 23.7、max 312 ms（1322 步）；不是純算圖成本，也不能據此主張與控制器同跑後的即時性；CPU 峰值 82 °C、無熱中止'
時間匹配驗證（離線，抽屜前板平面）:
  程式: 'evaluation/v0_time_match_check.py（逐格表 runs/v0_wrist_dyn_1/wrist_v0/time_match_check.csv、摘要 .json）'
  方法: >
    兩組姿態預測前板平面（y = 1.45 + 中心偏移 − 厚度/2 − 開度）在 40 px 格點像素的光軸深度，比對實測。
    matched＝存檔的擷取時刻姿態；lag20＝原實錄在擷取時刻 + 20 ms 那一步的構型以 URDF FK 重算（紀錄值、不插值；**不是實際讀取姿態**）。
    像素篩選：matched 姿態下落在前板範圍、避開把手與支柱、實測深度 0.1–3 m（篩選用 matched 幾何，屬一種偏向，已列為限制）
  結果: 'matched 誤差中位數 0.0004 mm、lag20 0.651 mm；35／35 個有前板像素的影格 matched 較準；相機速度 3–25 mm/s'
  限制: >
    兩組姿態來源不同且像素篩選偏向 matched ⇒ 這個比較**不能單獨量化 20 ms 時間錯配的效應**。
    時間匹配成立的直接證據是：影格 rendering_time 與姿態歷史時刻對齊（≤ 3.1e-7 s），缺姿態即拒絕
  說法: '在本次低速、無雜訊的模擬重播中，影格時間與歷史姿態成功匹配；有效前板影格的深度核對支持這項修正。不擴寫成所有動態情況均已驗收，不回改舊靜態趟'
  另: '原實錄 FK 重算的相機位置 vs 重播存檔最大差 1.43 mm（推測為重播每步的下垂，未驗證）'
設計觀察（依相位的有效深度比例中位數）:
  ALIGN: '0.86（36 格）'
  ENGAGE_WAIT: '0.00（19 格；最近深度落在 0.05 m 裁切面）'
  OPEN: '0.00（9 格）'
  意義: >
    在本次掛載、重播姿態與 0.1–3 m 有效深度規則下，ENGAGE_WAIT／OPEN 的深度不可用。
    這不等於 RGB 看不到把手，也不證明所有姿態下視覺只能用於接近段
證據範圍: >
  模擬、無雜訊、重播既有位姿（相機速度很低）：支持「時間匹配與 5 Hz 取樣／發布在動態下成立」，以及有效深度的相位分布。
  不支持：感知性能、實機時間同步、快速運動下的對齊、閉迴路視覺控制
